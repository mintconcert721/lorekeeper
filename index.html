<title>로어키퍼</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F7468'/%3E%3Cpath d='M20 14h24v36l-12-8-12 8z' fill='%23F3F7F5'/%3E%3C/svg%3E">

<style>
/* 레이아웃: 상단 세계관 바 · 가운데 작업 영역 · 하단 탭. 설정집은 기록 보관소의 색인 카드처럼 분류번호(C-001)로 정리한다. */
:root {
  --bg: #EEF0EC;
  --surface: #F8F9F6;
  --surface-2: #E2E7E1;
  --ink: #1D2A2E;
  --muted: #5B6A6A;
  --line: #CAD2CB;
  --accent: #2F7468;
  --accent-ink: #F3F7F5;
  --accent-soft: #D5E7E1;
  --danger: #A33A2F;
  --danger-soft: #F3DEDA;
  --user-bubble: #DCE5EC;
  --backdrop: rgba(12, 20, 22, .45);
  --shadow: 0 6px 24px rgba(20, 32, 34, .14);
  --t-character: #8B4A7E;
  --t-place: #33689A;
  --t-faction: #A24E2A;
  --t-species: #557A2E;
  --t-event: #8E6D12;
  --t-item: #5B57A8;
  --t-concept: #2F7468;
  --t-other: #66706F;
  --t-c1: #A8475A;
  --t-c2: #2C7A8A;
  --t-c3: #76691C;
  --t-c4: #6A4E9E;
  --t-c5: #B05F2B;
  --t-c6: #3B7A4D;
  --t-c7: #9C4379;
  --t-c8: #4A6278;
  --font-display: "Hahmlet", "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
/* 테마: 기본은 기기 설정을 따르고, 설정에서 라이트/다크를 고르면 html[data-theme]로 고정한다. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111719;
    --surface: #182023;
    --surface-2: #222C2F;
    --ink: #E2E8E4;
    --muted: #93A19F;
    --line: #2F3B3D;
    --accent: #6DBCAD;
    --accent-ink: #0D1917;
    --accent-soft: #1D3833;
    --danger: #E58374;
    --danger-soft: #3A2220;
    --user-bubble: #22313B;
    --backdrop: rgba(0, 0, 0, .6);
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    --t-character: #D493C6;
    --t-place: #86B6E3;
    --t-faction: #E79A72;
    --t-species: #A6CB7A;
    --t-event: #D9B85A;
    --t-item: #A9A5EE;
    --t-concept: #6DBCAD;
    --t-other: #A5AFAE;
    --t-c1: #E8919F;
    --t-c2: #7CC4D2;
    --t-c3: #D0C26A;
    --t-c4: #B9A2EA;
    --t-c5: #EBA470;
    --t-c6: #8CCB9C;
    --t-c7: #E39BC8;
    --t-c8: #9DB3C8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111719;
  --surface: #182023;
  --surface-2: #222C2F;
  --ink: #E2E8E4;
  --muted: #93A19F;
  --line: #2F3B3D;
  --accent: #6DBCAD;
  --accent-ink: #0D1917;
  --accent-soft: #1D3833;
  --danger: #E58374;
  --danger-soft: #3A2220;
  --user-bubble: #22313B;
  --backdrop: rgba(0, 0, 0, .6);
  --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  --t-character: #D493C6;
  --t-place: #86B6E3;
  --t-faction: #E79A72;
  --t-species: #A6CB7A;
  --t-event: #D9B85A;
  --t-item: #A9A5EE;
  --t-concept: #6DBCAD;
  --t-other: #A5AFAE;
  --t-c1: #E8919F;
  --t-c2: #7CC4D2;
  --t-c3: #D0C26A;
  --t-c4: #B9A2EA;
  --t-c5: #EBA470;
  --t-c6: #8CCB9C;
  --t-c7: #E39BC8;
  --t-c8: #9DB3C8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 var(--font-body);
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

#app {
  position: fixed;
  left: 0; right: 0;
  top: var(--app-top, 0px);
  height: var(--app-h, 100dvh);
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-columns: minmax(0, 1fr);
  background: var(--bg);
}

/* 상단 바 */
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) var(--gutter-r) 8px var(--gutter-l);
  border-bottom: 1px solid var(--line);
}
.world-switch {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: flex-start;
  background: none; border: 0; padding: 2px 0; text-align: left;
}
.eyebrow { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.world-switch .name {
  font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1.3;
  max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.world-switch .name::after { content: " ▾"; font-size: 12px; color: var(--muted); }
.theme-btn {
  flex: none; display: grid; place-items: center; width: 36px; height: 36px;
  border: 0; border-radius: 999px; background: var(--surface-2); color: var(--ink);
}
.theme-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sync-btn.running svg { animation: spin 1s linear infinite; }
.sync-btn.error { background: var(--danger-soft); color: var(--danger); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .sync-btn.running svg { animation: none; } }
.sync-status { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
.sync-err { color: var(--danger); }
.steps { margin: 0; padding-left: 1.3em; font-size: 13.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.cost-badge {
  border: 0; border-radius: 999px; padding: 4px 10px;
  background: var(--surface-2); color: var(--muted);
  font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums;
}

/* 본문 / 뷰 */
main { min-height: 0; min-width: 0; position: relative; }
.view { height: 100%; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; min-width: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pad { padding: 16px var(--gutter-r) 32px var(--gutter-l); }

/* 하단 탭 */
.tabbar {
  display: grid; grid-template-columns: repeat(5, 1fr);
  border-top: 1px solid var(--line); background: var(--surface);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar button {
  background: none; border: 0; padding: 8px 0 10px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 12px; color: var(--muted);
}
.tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 600; }
@media (pointer: coarse) { body.kb-open .tabbar { display: none; } }

/* 공통 버튼 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 14px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); font-size: 14px; font-weight: 500;
}
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-danger { color: var(--danger); }
.btn-danger-solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn-ghost { background: none; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn-small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }

/* 대화 */
.thread-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 6px var(--gutter-r) 6px var(--gutter-l);
  border-bottom: 1px solid var(--line);
  font-size: 13px; color: var(--muted);
}
.thread-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctx-meter { font: 12px var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ctx-meter.warn { color: var(--danger); }
.chat-log {
  display: flex; flex-direction: column; gap: 18px;
  padding: 16px var(--gutter-r) 24px var(--gutter-l);
}
.msg-user {
  align-self: flex-end; max-width: 86%;
  background: var(--user-bubble);
  padding: 10px 14px; border-radius: 16px 16px 4px 16px;
  display: flex; flex-direction: column; gap: 8px;
}
.msg-text { white-space: pre-wrap; }
.msg-files { display: flex; flex-wrap: wrap; gap: 6px; }
.msg-thumb { padding: 0; border: 0; background: none; border-radius: 10px; overflow: hidden; width: 96px; height: 96px; }
.msg-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.file-chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0;
  padding: 4px 10px 4px 6px; border-radius: 8px; background: var(--surface); font-size: 13px;
}
.file-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ftype {
  flex: none; font: 600 10px var(--font-mono); letter-spacing: .04em;
  color: var(--accent-ink); background: var(--accent); border-radius: 4px; padding: 2px 4px;
}
.preview-img { width: 100%; border-radius: 12px; display: block; }
.msg-assistant { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.msg-meta { font: 11px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.status-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.status-line::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .status-line::before { animation: none; } }
.thinking { border-left: 2px solid var(--line); padding-left: 10px; color: var(--muted); font-size: 13px; }
.thinking summary { cursor: pointer; list-style: none; font-size: 12px; letter-spacing: .04em; }
.thinking summary::-webkit-details-marker { display: none; }
.thinking summary::before { content: "▸ "; }
.thinking[open] summary::before { content: "▾ "; }
.thinking-body { margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.action-chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); padding: 3px 10px 3px 8px;
  font-size: 12.5px; text-align: left;
}
.action-chip .glyph { font: 600 12px var(--font-mono); color: var(--accent); }
.action-chip.read { background: none; color: var(--muted); }
.action-chip.read .glyph { color: var(--muted); }
.action-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note { margin: 0; font-size: 13px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); }
.note-error { background: var(--danger-soft); color: var(--danger); }
.retry-row { display: flex; justify-content: center; }
.quick-replies { display: flex; flex-direction: column; gap: 8px; }
.qr-row { display: flex; gap: 6px; align-items: stretch; }
.qr {
  flex: 1; min-width: 0; text-align: left;
  border: 1px solid var(--accent); border-radius: 12px;
  background: var(--accent-soft); color: var(--ink);
  padding: 10px 14px; font-size: 14.5px; line-height: 1.45;
}
.qr:active { transform: translateY(1px); }
.qr-toggle { display: flex; align-items: flex-start; gap: 10px; background: var(--surface); border-color: var(--line); }
.qr-toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.qr-box { flex: none; width: 18px; height: 18px; margin-top: 2px; border: 1.5px solid var(--muted); border-radius: 5px; }
.qr-toggle[aria-pressed="true"] .qr-box { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--accent-soft); }
@media (prefers-reduced-motion: reduce) { .qr:active { transform: none; } }
.composer-wrap { border-top: 1px solid var(--line); background: var(--surface); }
.banner {
  margin: 8px var(--gutter-r) 0 var(--gutter-l);
  padding: 8px 12px; border-radius: 10px;
  background: var(--accent-soft); font-size: 13px;
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
}
.composer {
  display: flex; gap: 8px; align-items: flex-end;
  padding: 8px var(--gutter-r) 8px var(--gutter-l);
}
.composer textarea {
  flex: 1; min-width: 0; resize: none; max-height: 200px;
  border: 1px solid var(--line); border-radius: 14px;
  padding: 9px 12px; background: var(--bg);
  font-size: 16px; line-height: 1.45;
}
.composer .btn { min-height: 42px; border-radius: 14px; }
.composer textarea::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attach-btn { flex: none; display: grid; place-items: center; width: 42px; min-height: 42px; border-radius: 14px; }
.attach-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.attach-tray { display: flex; gap: 8px; overflow-x: auto; padding: 8px var(--gutter-r) 0 var(--gutter-l); scrollbar-width: none; }
.attach-tray::-webkit-scrollbar { display: none; }
.att {
  flex: none; display: flex; align-items: center; gap: 8px; max-width: 250px;
  padding: 6px 2px 6px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
}
.att img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex: none; }
.att .ftype { width: 40px; height: 40px; display: grid; place-items: center; font-size: 11px; padding: 0; border-radius: 8px; }
.att-meta { display: flex; flex-direction: column; min-width: 0; }
.att-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-sub { font: 11px var(--font-mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.att-x { flex: none; border: 0; background: none; color: var(--muted); width: 34px; height: 34px; font-size: 18px; }
.attach-note { margin: 6px var(--gutter-r) 0 var(--gutter-l); font-size: 12px; color: var(--danger); }
#view-chat.dragging .composer-wrap { outline: 2px dashed var(--accent); outline-offset: -4px; }
.empty-chat { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.empty-chat h2 { margin: 0; font: 700 22px/1.35 var(--font-display); text-wrap: balance; }
.empty-chat p { margin: 0; color: var(--muted); }
.suggestions { display: flex; flex-direction: column; gap: 8px; }
.suggestion {
  text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: 12px; padding: 10px 14px; font-size: 14px;
}

/* 마크다운 */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 .7em; }
.md h3, .md h4, .md h5, .md h6 { font-family: var(--font-display); margin: 1em 0 .4em; line-height: 1.35; text-wrap: balance; }
.md h3 { font-size: 18px; } .md h4 { font-size: 16px; } .md h5, .md h6 { font-size: 15px; }
.md ul, .md ol { margin: 0 0 .7em; padding-left: 1.3em; }
.md li { margin: .15em 0; }
.md blockquote { margin: 0 0 .7em; padding: 4px 12px; border-left: 3px solid var(--accent); color: var(--muted); }
.md code { font: 13px var(--font-mono); background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.md pre { overflow-x: auto; background: var(--surface-2); padding: 10px 12px; border-radius: 10px; }
.md pre code { background: none; padding: 0; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
.ref {
  border: 0; background: var(--accent-soft); color: var(--accent);
  font: 600 12px var(--font-mono); padding: 1px 6px; border-radius: 6px; vertical-align: 1px;
}

/* 설정집 */
.world-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;
}
.world-card h2 { margin: 0; font: 700 20px/1.35 var(--font-display); text-wrap: balance; }
.world-card .label { font-size: 11px; letter-spacing: .08em; color: var(--muted); margin-top: 4px; }
.world-card p { margin: 0; }
.codex-tools { display: flex; gap: 8px; margin: 16px 0 10px; }
.codex-tools input {
  flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); padding: 8px 12px; font-size: 16px;
}
.type-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.type-chips::-webkit-scrollbar { display: none; }
.type-chip {
  flex: none; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 4px 12px; font-size: 13px;
}
.type-chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.type-chip .n { font: 11px var(--font-mono); opacity: .7; margin-left: 4px; }
.group-title {
  margin: 20px 0 8px; font-size: 12px; letter-spacing: .08em; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.group-title::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.entry-list { display: flex; flex-direction: column; gap: 8px; }
.entry-card {
  width: 100%; text-align: left;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 14px;
}
.catno { font: 600 12px var(--font-mono); color: var(--tc, var(--muted)); font-variant-numeric: tabular-nums; padding-top: 3px; }
.entry-card .ename { font-weight: 600; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-card .esum { grid-column: 2; color: var(--muted); font-size: 13.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.entry-card .etags { grid-column: 2; font-size: 12px; color: var(--muted); }
.empty-state { text-align: center; color: var(--muted); padding: 32px 8px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty-state h3 { margin: 0; font: 700 18px var(--font-display); color: var(--ink); }

/* 시트 */
.sheet { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--backdrop); }
.sheet-panel {
  position: relative; width: 100%; max-width: 760px; margin: 0 auto;
  max-height: 92%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 6px var(--gutter-r) calc(20px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
}
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 6px auto 14px; }
.sheet-title { margin: 0 0 12px; font: 700 20px/1.35 var(--font-display); }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.entry-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.entry-head .catno { padding: 0; }
.entry-name { margin: 4px 0 2px; font: 700 24px/1.3 var(--font-display); text-wrap: balance; }
.aliases { margin: 0; color: var(--muted); font-size: 13px; }
.summary { margin: 10px 0; font-size: 15px; }
.fields { margin: 12px 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.fields > div { display: grid; grid-template-columns: minmax(70px, 30%) minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.fields dt { color: var(--muted); font-size: 13px; }
.fields dd { margin: 0; }
.section-label { margin: 18px 0 6px; font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.rel-list { display: flex; flex-direction: column; gap: 6px; }
.rel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; }
.rel .lbl { color: var(--muted); font-size: 13px; }
.tag { font-size: 13px; color: var(--accent); margin-right: 8px; }
.meta { margin: 14px 0 0; font-size: 12px; color: var(--muted); }
.pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); }
.pill-danger { background: var(--danger-soft); color: var(--danger); }
.list-plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.list-item {
  width: 100%; text-align: left; display: flex; flex-direction: column; gap: 2px;
  border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 14px;
}
.list-item.current { border-color: var(--accent); }
.list-item .t { font-weight: 600; }
.list-item .s { font-size: 13px; color: var(--muted); }
.list-row { display: flex; gap: 8px; align-items: stretch; }
.list-row .list-item { flex: 1; min-width: 0; }

/* 폼 */
.form { display: flex; flex-direction: column; gap: 12px; }
.form label, .form fieldset { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.form fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0; }
.form legend { padding: 0 4px; }
.form small { font-size: 12px; }
.form input, .form textarea, .form select {
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  padding: 8px 10px; font-size: 16px; color: var(--ink); width: 100%; min-width: 0;
}
.form textarea { resize: vertical; line-height: 1.5; }
.kv-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) auto; gap: 6px; margin-bottom: 6px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 40px; min-height: 40px; color: var(--muted); }

/* 관계도 */
.graph-tools { display: flex; gap: 8px; align-items: center; padding: 10px var(--gutter-r) 8px var(--gutter-l); }
.graph-tools input {
  flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); padding: 7px 12px; font-size: 16px;
}
.graph-types { padding: 0 var(--gutter-r) 8px var(--gutter-l); }
.graph-types .type-chip { display: inline-flex; align-items: center; gap: 6px; }
.graph-types .type-chip[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--line); }
.graph-types .type-chip[aria-pressed="false"] { opacity: .5; text-decoration: line-through; }
.tdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.type-chip.isolated { border-style: dashed; }
.graph-stage {
  position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none;
  border-top: 1px solid var(--line);
  background-color: var(--bg);
  background-image: radial-gradient(var(--line) 1px, transparent 1.2px);
  background-size: 22px 22px;
}
.graph-stage svg { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.g-edge { stroke: var(--muted); stroke-width: 1.4; opacity: .6; fill: none; }
.g-edge.hl { stroke: var(--accent); stroke-width: 2.4; opacity: 1; }
.g-edge.dim { opacity: .12; }
.g-arrow { fill: var(--muted); }
.g-arrow-hl { fill: var(--accent); }
.g-elabel {
  display: none; pointer-events: none;
  font: 600 11px var(--font-body); fill: var(--accent); text-anchor: middle;
  stroke: var(--bg); stroke-width: 4px; paint-order: stroke; stroke-linejoin: round;
}
.g-elabel.show { display: inline; }
.g-node { cursor: pointer; }
.g-node .dot { stroke: var(--bg); stroke-width: 2.5; }
.g-node .halo { fill: none; stroke: var(--accent); stroke-width: 3; display: none; }
.g-node.sel .halo, .g-node.link-src .halo { display: inline; }
.g-node.link-src .halo { stroke-dasharray: 4 3; }
.g-node text {
  pointer-events: none; font: 500 12px var(--font-body); fill: var(--ink); text-anchor: middle;
  stroke: var(--bg); stroke-width: 4px; paint-order: stroke; stroke-linejoin: round;
}
.g-node.sel text { font-weight: 700; }
.g-node.dim { opacity: .18; }
.zoom-ctrl { position: absolute; top: 10px; right: var(--gutter-r); display: flex; flex-direction: column; gap: 6px; }
.zoom-ctrl .icon-btn { width: 38px; min-height: 38px; font-size: 18px; background: var(--surface); box-shadow: var(--shadow); }
.graph-hint {
  position: absolute; top: 10px; left: var(--gutter-l); right: calc(var(--gutter-r) + 48px);
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 10px; font-size: 13px; box-shadow: var(--shadow);
}
.graph-hint span { flex: 1; min-width: 140px; }
.graph-empty {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  padding: 24px; color: var(--muted); pointer-events: none;
}
.graph-empty strong { display: block; color: var(--ink); font: 700 18px var(--font-display); margin-bottom: 6px; }
.graph-card {
  position: absolute; left: var(--gutter-l); right: var(--gutter-r); bottom: 12px;
  display: flex; flex-direction: column; gap: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px; box-shadow: var(--shadow);
}
.graph-card .gc-name { font: 700 18px/1.3 var(--font-display); }
.graph-card .gc-sum { margin: 0 0 6px; font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.label-chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* 연표 */
.tl-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tl-cal { margin: 0; font-size: 14px; }
.tl-head .btn { flex: none; white-space: nowrap; }
.tl { position: relative; display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.tl-row { display: grid; grid-template-columns: 52px 18px minmax(0, 1fr); gap: 0 8px; align-items: start; }
.tl-year { text-align: right; padding-top: 10px; font: 600 13px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--tc, var(--muted)); overflow-wrap: normal; }
.tl-axis { position: relative; align-self: stretch; display: flex; justify-content: center; }
.tl-axis::before { content: ""; position: absolute; top: -10px; bottom: -10px; left: 50%; width: 2px; margin-left: -1px; background: var(--line); }
.tl-dot { position: relative; margin-top: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--tc, var(--muted)); box-shadow: 0 0 0 3px var(--bg); }
.tl-dot.span { height: 30px; border-radius: 6px; }
.tl-card {
  width: 100%; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 2px;
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--tc, var(--line));
  border-radius: 10px; padding: 8px 12px;
}
.tl-row.hl .tl-card { outline: 2px solid var(--accent); outline-offset: 1px; }
.tl-meta { font-size: 12px; color: var(--muted); }
.tl-meta .catno { padding: 0; font-size: 11.5px; }
.tl-name { font-weight: 600; font-size: 15px; }
.tl-when { font-size: 13px; color: var(--ink); }
.tl-sum { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tl-era {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  margin: 10px 0 2px; padding: 6px 12px; border-radius: 10px; background: var(--surface-2);
}
.tl-era strong { font: 700 15px var(--font-display); }
.tl-era span { font: 12px var(--font-mono); color: var(--muted); }
.tl-gap, .tl-now { display: grid; grid-template-columns: 52px 18px minmax(0, 1fr); gap: 0 8px; font-size: 12px; color: var(--muted); }
.tl-gap span { grid-column: 3; font-style: italic; }
.tl-gap::before, .tl-now::before { content: ""; grid-column: 2; justify-self: center; width: 2px; background: repeating-linear-gradient(var(--line) 0 3px, transparent 3px 6px); }
.tl-now { color: var(--danger); font-weight: 600; }
.tl-now::before { background: var(--danger); width: 2px; }
.tl-now span { grid-column: 3; border-top: 2px solid var(--danger); padding-top: 2px; }
.tl-missing { margin-top: 20px; border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; }
.tl-missing summary { cursor: pointer; font-weight: 600; }
.tl-missing .entry-list { margin: 10px 0; }
.time-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.era-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px; margin-bottom: 6px; }
.when-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 6px 0; font-size: 14px; }
.when-line .lbl { font-size: 11px; letter-spacing: .08em; color: var(--muted); }

/* 상태 */
.st-badge { display: inline-block; font: 600 11px var(--font-body); padding: 1px 7px; border-radius: 999px; vertical-align: 1px; }
.st-draft { background: var(--accent-soft); color: var(--accent); border: 1px dashed var(--accent); }
.st-discarded { background: var(--surface-2); color: var(--muted); }
.entry-card.discarded { opacity: .6; }
.entry-card.discarded .ename { text-decoration: line-through; }
.st-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; padding: 8px 12px; border-radius: 12px; background: var(--surface-2); font-size: 13.5px; }
.st-actions span { flex: 1; min-width: 160px; }
.status-chips { margin-top: 6px; }
.seg { display: flex; gap: 6px; }
.seg label { flex: 1; display: flex; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg span { flex: 1; text-align: center; padding: 7px 0; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: var(--bg); font-size: 14px; }
.seg input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.g-node.draft .dot { stroke: var(--muted); stroke-dasharray: 3 2; fill-opacity: .55; }
.tl-row.draft .tl-card { border-style: dashed; }
.check-group { margin-top: 14px; }
.check-group h3 { margin: 0 0 6px; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.check-group h3 .n { font: 12px var(--font-mono); color: var(--muted); }
.check-item { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.check-item .txt { flex: 1 1 100%; }
.sev-warn { color: var(--danger); }

/* 분류와 템플릿 */
.tpl-status { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-size: 13.5px; }
.tpl-status.done { background: var(--surface-2); color: var(--muted); }
.tpl-note { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0; padding: 4px 4px 4px 10px; border-radius: 10px; background: var(--accent-soft); font-size: 13px; color: var(--ink); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { position: relative; display: inline-flex; }
.swatch input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.swatch span { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.swatch input:checked + span { box-shadow: 0 0 0 2px var(--ink); }
.swatch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.type-dot { display: inline-block; margin-right: 6px; vertical-align: 1px; }
.list-item .catno { font-size: 11px; margin-left: 4px; }
.help-box { margin-top: 16px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.help-box summary { cursor: pointer; font-weight: 600; }
.help-box .md { margin-top: 8px; }
.imp { display: flex; flex-direction: column; gap: 8px; }
.imp legend { font-weight: 600; color: var(--ink); }
.form label.switch { flex-direction: row; align-items: center; justify-content: space-between; color: var(--ink); font-size: 14px; }
.form label.switch input { width: 20px; height: 20px; flex: none; }
.fields dd.blank { color: var(--muted); font-size: 13px; }

/* 설정 화면 */
.settings { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card h2 { margin: 0; font: 700 17px var(--font-display); }
.card p { margin: 0; font-size: 13.5px; color: var(--muted); }
.card .form input, .card .form select { background: var(--bg); }
.radio-list { display: flex; flex-direction: column; gap: 6px; }
.radio {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: center;
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg);
}
.radio input { margin: 0; accent-color: var(--accent); grid-row: span 2; }
.radio .t { font-weight: 600; font-size: 14px; }
.radio .s { font-size: 12px; color: var(--muted); grid-column: 2; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.stat .v { font: 600 16px var(--font-mono); font-variant-numeric: tabular-nums; }
.stat .k { font-size: 11px; color: var(--muted); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }

/* 대화 상자 · 알림 */
.dialog { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; }
.dialog-backdrop { position: absolute; inset: 0; background: var(--backdrop); }
.dialog-panel {
  position: relative; width: 100%; max-width: 360px;
  background: var(--surface); border-radius: 16px; padding: 18px;
  display: flex; flex-direction: column; gap: 14px;
}
.dialog-panel p { margin: 0; white-space: pre-wrap; }
.toast {
  position: fixed; z-index: 70; left: 50%; transform: translateX(-50%);
  top: calc(var(--app-top, 0px) + env(safe-area-inset-top, 0px) + 64px);
  width: max-content; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 10px; font-size: 13.5px;
}

/* 설정집 구역 탭 */
.seg-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 0 12px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
.seg-tabs::-webkit-scrollbar { display: none; }
.seg-tabs button { flex: 1 0 auto; padding: 7px 8px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: 600 13px var(--font-body); white-space: nowrap; }
@media (max-width: 370px) { .seg-tabs { gap: 2px; } .seg-tabs button { padding: 6px 5px; font-size: 12px; letter-spacing: -.02em; } }
.seg-tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.seg-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ms-card .catno { font-family: var(--font-body); }
.ms-body { margin-top: 8px; font-size: 15.5px; line-height: 1.75; }
.sense-card { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--tc, var(--line)); border-radius: 12px; padding: 10px 12px; }
.sense-head { display: flex; align-items: center; gap: 8px; }
.sense-head strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sense-head .catno { padding: 0; }
.sense-list { margin: 0; display: grid; gap: 4px; }
.sense-list > div { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.sense-list dt { color: var(--muted); font-size: 12.5px; padding-top: 1px; }
.sense-list dd { margin: 0; }
.sense-card .md { font-size: 14px; }
.q-cards { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.q-card { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.q-card .eyebrow { font-size: 11px; letter-spacing: .08em; color: var(--accent); }
.q-text { margin: 0; font: 600 17px/1.5 var(--font-display); text-wrap: pretty; }
.gen-results { margin-top: 12px; }
.gen-item { display: flex; align-items: center; gap: 4px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.gen-item > span { flex: 1; min-width: 0; }
.gen-item .meta { margin: 0; font-size: 13px; }
/* 항목 그림 */
.entry-card.has-img { grid-template-columns: 52px auto minmax(0, 1fr); }
.entry-card.has-img .esum, .entry-card.has-img .etags { grid-column: 3; }
.ecard-img { grid-row: span 3; width: 52px; height: 52px; object-fit: cover; border-radius: 9px; background: var(--surface-2); }
.entry-img-btn { display: block; width: 100%; margin: 0 0 12px; padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: var(--surface-2); }
.entry-img { display: block; width: 100%; max-height: 240px; object-fit: cover; }
.entry-img-btn.full .entry-img { max-height: none; object-fit: contain; }
.img-edit { display: flex; flex-direction: column; gap: 8px; }
.img-edit img { width: 120px; height: 120px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); }
/* 감각·관점 */
.sense-fields > div { grid-template-columns: 52px minmax(0, 1fr); }
.persp-list { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 12px; }
.persp { margin: 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 10px 10px 0; }
.persp-by { display: block; font-size: 12.5px; color: var(--muted); }
.persp p { margin: 4px 0 0; font-size: 14.5px; }
.persp-row { display: flex; flex-direction: column; gap: 4px; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.persp-row textarea { width: 100%; }
.inline-label { display: grid !important; grid-template-columns: 44px minmax(0, 1fr); align-items: center; gap: 8px; }
.inline-label > span { font-size: 13px; color: var(--muted); }
/* 창작 도구 · 모드 */
.ct { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: var(--bg); }
.ct summary { cursor: pointer; font-weight: 700; font-size: 15px; }
.ct .meta { margin: 6px 0 8px; }
.mode-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 8px var(--gutter-r) 0 var(--gutter-l); padding: 6px 6px 6px 12px; border-radius: 12px; background: var(--accent-soft); font-size: 13px; }
.mode-bar > span { flex: 1 1 180px; min-width: 0; }

/* 관계·지도 탭의 보기 모드 */
.view-modes { margin: 10px var(--gutter-r) 0 var(--gutter-l); flex: none; }
.gm-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.gm-pane .scroll { flex: 1; }
.graph-tools select { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 7px 10px; font-size: 15px; color: var(--ink); }
.map-name { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.graph-empty.interactive { pointer-events: auto; background: var(--bg); }
.graph-empty .row { display: flex; gap: 8px; }
/* 계보 */
.t-node { cursor: pointer; }
.t-node:focus { outline: none; }
.t-node:focus-visible .t-box { stroke: var(--accent); stroke-width: 2.5; }
.t-box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }

- 삭제는 사용자가 분명히 요청했을 때만 한다.
- [앱 알림]으로 사용자가 직접 수정한 내용이 전달되면 그것을 최신 설정으로 받아들인다.

## 분류와 템플릿
- 분류(인물, 장소, 국가 등)는 사용자가 세계관마다 정한다. 목록은 [설정집 현황]에 있고, 바뀌면 [앱 알림]으로 알려 준다. 그때는 list_types로 다시 확인한다.
- 도구의 type에는 분류 이름이나 키를 넣는다. 알맞은 분류가 없으면 가장 가까운 분류를 쓰고, 새 분류가 필요해 보이면 사용자에게 설정 화면에서 추가하도록 제안한다.
- 템플릿이 있는 분류의 항목을 만들거나 크게 고칠 때는 먼저 get_template로 템플릿을 읽고 그 구조를 따른다.
  - 템플릿의 "- 이름:" 줄은 fields의 키다. 키 이름을 그대로 쓰고, 아직 정해지지 않은 값은 "(미정)"으로 둔다.
  - 템플릿의 ## 소제목은 body에 같은 이름, 같은 순서의 ## 소제목으로 쓴다. 템플릿에 없는 중요한 내용은 마지막에 "## 기타"로 둔다.
  - ">"로 시작하는 줄이나 괄호 속 설명은 쓰는 방법에 대한 안내다. 본문에 옮기지 않는다.
- 사용자가 "템플릿에 맞게 정리해 줘"라고 하면 기존 내용을 지우지 말고 템플릿 구조로 옮겨 담는다.

## 일관성
- 새 설정이 기존 설정이나 세계 규칙과 충돌하면, 저장하기 전에 어느 항목의 어떤 내용과 부딪히는지 짚고 해결 방법을 2~3가지 제안한다.
- 연표, 나이, 거리, 인물 관계처럼 숫자와 사실이 얽힌 부분은 특히 꼼꼼히 맞춘다.

## 창작 태도
- 뻔한 클리셰보다 이 세계에만 있을 법한 구체적인 디테일(관습, 은어, 물건, 모순, 비밀)을 제안한다.
- 적절할 때 답의 끝에 이야기를 넓힐 거리(갈등의 씨앗, 아직 정해지지 않은 질문)를 1~3개 짧게 덧붙인다. 매번 붙일 필요는 없다.
- 이 세계관의 주인은 사용자다. 사용자의 결정을 존중하고, 네 취향으로 방향을 바꾸지 않는다.

## 답변 형식
- 한국어로 답한다. 휴대폰 화면에서 읽으므로 짧은 문단과 목록을 쓰고, 표는 쓰지 않는다.
- 항목을 언급할 때 이름 옆에 id를 붙이면(예: 서리(C-001)) 사용자가 눌러서 바로 볼 수 있다.
- 설정집을 바꿨다면 답의 마지막에 무엇을 바꿨는지 한두 줄로 알린다. 앱이 변경 내역을 따로 표시하므로 길게 반복하지 않는다.

## 대답 추천
- 답을 마칠 때마다 맨 마지막에 suggest_replies를 단독으로 호출해, 사용자가 눌러서 바로 보낼 다음 대답 2~4개를 띄운다.
- 선택지를 제시했다면 각 선택지를 고르는 대답을, 질문을 했다면 그럴듯한 답들을 넣는다. 필요하면 "알아서 정해 줘"처럼 맡기는 대답도 하나 넣는다.
- 여러 개를 함께 골라도 되는 목록(받아들일 아이디어, 추가할 특징 등)이면 multiple을 true로 한다.
- 선택지의 자세한 내용은 본문에 쓰고, 추천 대답은 사용자 입장의 짧은 문장으로 쓴다.

## 첨부 파일
- 사용자는 이미지, PDF, 텍스트 파일을 첨부할 수 있다. 텍스트 파일은 [첨부 파일: 이름] 머리말과 함께 들어온다.
- 첨부 자료에서 설정을 뽑아 달라고 하면, 먼저 설정집과 비교해 새로 만들 항목과 고칠 항목을 짧게 정리해 보여 주고, 사용자가 동의하면 저장한다. 사용자가 바로 저장하라고 했으면 바로 저장한다.
- 이미지는 외모, 복장, 분위기, 지형, 건축 같은 시각 정보를 구체적인 글로 옮겨 설정에 반영한다. 이미지 자체는 설정집에 저장되지 않으므로 필요한 정보는 글로 남긴다.`;

function partialJsonString(src, key) {
  const m = new RegExp(`"${key}"\\s*:\\s*"`).exec(src);
  if (!m) return "";
  let i = m.index + m[0].length;
  let out = "";
  const ESC = { n: "\n", t: "\t", r: "\r", b: "\b", f: "\f", '"': '"', "\\": "\\", "/": "/" };
  while (i < src.length) {
    const ch = src[i];
    if (ch === '"') break;
    if (ch === "\\") {
      const nx = src[i + 1];
      if (nx === undefined) break;
      if (nx === "u") {
        const hex = src.slice(i + 2, i + 6);
        if (hex.length < 4) break;
        out += String.fromCharCode(parseInt(hex, 16));
        i += 6;
        continue;
      }
      out += ESC[nx] ?? nx;
      i += 2;
      continue;
    }
    out += ch;
    i++;
  }
  return out;
}

    return { content: `호칭 ${remove ? "삭제" : "저장"}: ${fmt(a, b)}${reverse_call !== undefined || reverse_speech !== undefined ? ` / ${fmt(b, a)}` : ""}`, action: { kind: "relation", text: `호칭 ${a.name} → ${b.name}` }, changed: true };
  },
  set_perspective({ id, by, text, remove }) {
    const e = findEntry(id);
    if (!e || e.deleted) throw new Error(`${id} 항목이 없습니다.`);
    const who = findEntry(by);
    const key = who ? who.id : String(by).trim();
    if (!key) throw new Error("by가 필요합니다.");
    const list = (e.perspectives || []).filter((x) => x.by !== key);
    if (!remove) {
      if (!String(text || "").trim()) throw new Error("text가 필요합니다.");
      list.push({ by: key, text: String(text).trim() });
    }
    updateEntry(e, { perspectives: list }, "claude", remove ? "관점 삭제" : "관점 기록");
    return { content: `${remove ? "관점 삭제" : "관점 기록"}: ${e.id} ${e.name} ← ${perspectiveName(key)}`, action: { kind: "update", text: `${e.name} · ${perspectiveName(key)}의 관점`, ref: e.id }, changed: true };
  },
  save_manuscript({ id, title, kind, body, refs }) {
    const ms = saveManuscript({ id, title, kind, body, refs }, "claude");
    return { content: `원고함 저장: ${ms.id} (${ms.kind} · ${ms.title})`, action: { kind: "create", text: `원고 ${ms.title}`, ms: ms.id }, changed: true };
  },
  get_manuscripts({ id, query }) {
    if (id) {
      const m = state.manuscripts.find((x) => x.id === id);
      if (!m) throw new Error(`${id} 원고가 없습니다.`);
      return { content: `# ${m.title} (${m.kind}, ${m.id})\n관련 항목: ${(m.refs || []).join(", ") || "없음"}\n\n${m.body}`, action: { kind: "read", text: `원고 · ${m.title}` } };
    }
    let list = state.manuscripts.slice().sort((a, b) => b.updatedAt - a.updatedAt);
    const q = String(query || "").trim().toLowerCase();
    if (q) list = list.filter((m) => `${m.title} ${m.body}`.toLowerCase().includes(q));
    return { content: list.length ? list.slice(0, 50).map((m) => `- ${m.id} [${m.kind}] ${m.title}${m.refs?.length ? ` · ${m.refs.join(", ")}` : ""}`).join("\n") : "원고가 없습니다.", action: { kind: "read", text: "원고함 확인" } };
  },
  set_naming_rule({ name, applies_to, rules, examples, remove }) {
    const w = currentWorld();
    const prev = worldNaming(w).find((r) => r.name === String(name).trim());
    if (remove && !prev) throw new Error(`'${name}' 이름 규칙이 없습니다.`);
    const list = worldNaming(w).filter((r) => r !== prev);
    if (!remove) list.push({ id: prev?.id || uid(), name: String(name).trim(), applies: applies_to || [], rules: String(rules || "").trim(), examples: examples || [] });
    w.naming = list;
    w.updatedAt = Date.now();
    logChange("claude", "naming", null, `이름 규칙: ${name}`);
    return { content: `${remove ? "이름 규칙 삭제" : "이름 규칙 저장"}: ${name}`, action: { kind: "world", text: `이름 규칙 ${name}` }, changed: true };
  },
  list_types() {
    return { content: `분류 ${worldTypes().length}개:\n${typeListText()}`, action: { kind: "read", text: "분류 목록 확인" } };
  },
  get_template({ type }) {
    const t = findType(type);
    if (!t) throw new Error(`분류 '${type}'가 없습니다. 쓸 수 있는 분류: ${worldTypes().map((x) => x.label).join(", ")}`);
    if (!t.template.trim()) return { content: `'${t.label}' 분류에는 템플릿이 없다. 자유 형식으로 쓴다.`, action: { kind: "read", text: `템플릿 · ${t.label}` } };
    const { fields, sections } = parseTemplate(t.template);
    return {
      content: [
        `# ${t.label} 템플릿`,
        `속성(fields) 키: ${fields.length ? fields.map((f) => f.key).join(", ") : "(없음)"}`,
        `본문 소제목: ${sections.length ? sections.join(", ") : "(없음)"}`,
        "",
        "--- 템플릿 원문 ---",
        t.template,
      ].join("\n"),
      action: { kind: "read", text: `템플릿 · ${t.label}` },
    };
  },
  set_relation({ from_id, to_id, label, reverse_label, remove }) {
    const a = findEntry(from_id);
    const b = findEntry(to_id);
    if (!a || a.deleted) throw new Error(`${from_id} 항목이 없습니다.`);
    if (!b || b.deleted) throw new Error(`${to_id} 항목이 없습니다.`);
    if (a === b) throw new Error("자기 자신과는 관계를 맺을 수 없습니다.");
    if (remove) {
      const n = removeRelation(a, b.id, label?.trim(), "claude");
      return {
        content: n ? `관계 삭제: ${a.id} → ${b.id}` : "지울 관계가 없습니다.",
        action: n ? { kind: "relation", text: `${a.name} ⇢ ${b.name} 관계 삭제`, ref: a.id } : null,
        changed: !!n,
      };
    }
    if (!label || !label.trim()) throw new Error("label이 필요합니다.");
    addRelation(a, b.id, label.trim(), "claude");
    if (reverse_label && reverse_label.trim()) addRelation(b, a.id, reverse_label.trim(), "claude");
    return {
      content: `관계 저장: ${a.id} -[${label.trim()}]-> ${b.id}${reverse_label ? `, ${b.id} -[${reverse_label.trim()}]-> ${a.id}` : ""}`,
      action: { kind: "relation", text: `${a.name} → ${label.trim()} → ${b.name}`, ref: a.id },
      changed: true,
    };
  },
  delete_entry({ id, reason }) {
    const e = findEntry(id);
    if (!e || e.deleted) throw new Error(`${id} 항목이 없습니다.`);
    trashEntry(e, "claude", reason);
    return { content: `휴지통으로 옮김: ${e.id} (${e.name})`, action: { kind: "delete", text: `${typeInfo(e.type).label} ${e.name}`, ref: e.id }, changed: true };
  },
  respond() {
    return { content: "표시하지 않았다: 다른 도구와 같은 차례에 호출됐다. 다른 작업을 모두 마친 뒤 맨 마지막에 respond만 단독으로 호출할 것.", is_error: true };
  },
  suggest_replies() {
    // 다른 도구와 섞여 호출된 경우에만 여기로 온다. 단독 호출은 runAgent에서 처리한다.
    return { content: "표시하지 않았다: 다른 도구와 같은 차례에 호출됐다. 모든 작업과 답변을 마친 뒤 맨 마지막에 suggest_replies만 단독으로 호출할 것.", is_error: true };
  },
  update_world(input) {
    const w = currentWorld();
    for (const k of ["name", "premise", "tone", "rules"]) if (input[k] !== undefined) w[k] = input[k];
    w.updatedAt = Date.now();
    logChange("claude", "world", null, "세계관 개요 수정");
    return { content: "세계관 개요를 고쳤습니다.\n" + worldOverviewText(w), action: { kind: "world", text: "세계관 개요" }, changed: true };
  },
};

function runTool(name, input, tools) {
  const tool = tools.find((t) => t.name === name);
  if (!tool) return { content: `알 수 없는 도구: ${name}`, is_error: true };
  const problem = validateInput(tool.input_schema, input);
  if (problem) return { content: JSON.stringify({ error: problem, INVALID_JSON: JSON.stringify(input) }), is_error: true };
  try {
    return TOOL_IMPL[name](input);
  } catch (err) {
    return { content: String(err?.message || err), is_error: true };
  }
}

   7. Claude 호출
   ============================================================ */
function calcCost(u, modelId) {
  const p = PRICES[modelId] || PRICES[settings.model];
  const inTok = u?.input_tokens || 0;
  const cw = u?.cache_creation_input_tokens || 0;
  const cr = u?.cache_read_input_tokens || 0;
  const out = u?.output_tokens || 0;
  let pin = p.in, pout = p.out, pcr = p.cacheRead;
  if (modelId === "claude-haiku-5-5" && inTok + cw + cr > 100000) { pin = 0.5; pout = 2.5; pcr = 0.05; }
  return (inTok * pin + cw * pin * 1.25 + cr * pcr + out * pout) / 1e6;
}
function addCost(v) {
  cost.total += v;
  cost.months[monthKey()] = (cost.months[monthKey()] || 0) + v;
  cost.requests += 1;
  saveCost();
  updateCostBadge();
}

// 대화의 프롬프트 버전. 새 대화는 최신 버전으로 시작하고, 끝까지 그 버전을 쓴다.
function threadVersion(thread) {
  if (thread.promptVersion) return thread.promptVersion;
  let v = 1;
  for (const r of PROMPT_RELEASES) if ((thread.createdAt || 0) >= r.at) v = r.v;
  const usedSuggest = state.conv.api.some((m) => Array.isArray(m.content) && m.content.some((b) => b.type === "tool_use" && b.name === SUGGEST));
  if (v < 2 && usedSuggest) v = 2;
  thread.promptVersion = v; // 한 번 정하면 고정한다
  return v;
}
function promptSetFor(thread) {
  return PROMPT_SETS[thread ? threadVersion(thread) : PROMPT_CURRENT] || PROMPT_SETS[PROMPT_CURRENT];
}

function buildParams(thread) {
  const m = PRICES[settings.model];
  const set = promptSetFor(thread);
  const params = {
    model: settings.model,
    max_tokens: 64000,
    system: [{ type: "text", text: set.system, cache_control: { type: "ephemeral" } }],
    tools: set.tools,
    messages: state.conv.api.slice(),
    thinking: {
      type: "adaptive",
      display: settings.showThinking ? "summarized" : "omitted",
      // 기록이 어긋나더라도 오류 대신 해당 thinking 블록만 버리고 계속한다(안전장치).
      block_binding: { prefix_mismatch_behavior: "drop_block" },
    },
    output_config: { effort: settings.effort },
    cache_control: { type: "ephemeral" },
    betas: ["thinking-binding-controls-2026-08-01"],
  };
  if (m?.fallback) {
    // 안전 정책 오판으로 거절되면 서버가 권장 모델로 자동 재시도한다.
    params.betas.push("server-side-fallback-2026-07-01");
    params.fallbacks = "default";
  }
  return params;
}

function contextNoteFor(thread) {
  const w = currentWorld();
  const v = threadVersion(thread);
  if (!thread.contextSent) {
    const list = v >= 6 ? liveEntries() : activeEntries();
    const shown = list.slice(0, 400);
    const discardedCount = activeEntries().length - list.length;
    const lines = [
      "[설정집 현황 · 앱이 자동으로 첨부함]",
      worldOverviewText(w),
      "",
    ];
    if (v >= 5) lines.push(calendarText(), "");
    if (v >= 7) {
      const rules = worldNaming();
      lines.push(rules.length ? `이름 규칙:\n${rules.map((r) => `- ${r.name}${r.applies?.length ? ` (적용: ${r.applies.join(", ")})` : ""}: ${cut(r.rules, 160)}${r.examples?.length ? ` · 예: ${r.examples.slice(0, 6).join(", ")}` : ""}`).join("\n")}` : "이름 규칙: 없음", `원고함: ${state.manuscripts.length}편${state.manuscripts.length ? " (get_manuscripts로 읽는다)" : ""}`, "");
      const pinned = state.maps.filter((m) => m.pins.length);
      if (pinned.length) lines.push(`지도(핀의 대략적인 위치):\n${pinned.map((m) => `- ${m.name}: ${mapPinsText(m)}`).join("\n")}`, "");
      if (v >= 9) {
        const t = worldTravel(w);
        const routes = worldRoutes(w);
        lines.push(`이동: 거리 단위 ${t.unit}, ${t.modes.map((m) => `${m.name} 하루 ${m.speed}${t.unit}`).join(", ")}. 길 ${routes.length}개${routes.length ? "(get_travel로 계산한다)" : ""}`);
        const regions = state.maps.flatMap((m) => (m.regions || []).map((r) => ({ m, r }))).filter(({ r }) => findEntry(r.ref));
        if (regions.length) lines.push(`지도 영역:\n${regions.map(({ m, r }) => `- ${m.name}: ${refName(r.ref)} ${regionDir(r)} 일대${r.from != null || r.to != null ? ` (${r.from != null ? fmtYearNum(r.from) : ""}~${r.to != null ? fmtYearNum(r.to) : ""})` : ""}`).join("\n")}`);
        lines.push("");
      }
      if (thread.mode?.type === "interview") {
        const who = findEntry(thread.mode.ref);
        if (who) lines.push(`[인물 인터뷰] 대상: ${who.id} ${who.name}. 이 대화에서 너는 ${who.name}이(가) 되어 1인칭으로 답한다. (( )) 안의 말은 작가로서 받는다. "인터뷰 정리"를 부탁받으면 새로 드러난 사실을 정리해 제안하고 요약을 원고함에 저장한다.`, "");
      }
    }
    if (v >= 4) lines.push("분류 목록 (항목을 만들 때 이 중 하나를 쓴다. 템플릿이 있는 분류는 get_template로 구조를 확인한다):", typeListText(), "");
    lines.push(
      `항목 ${list.length}개${list.length > shown.length ? ` (앞의 ${shown.length}개만 표시, 나머지는 search_entries로 찾을 것)` : ""}${discardedCount ? ` · 폐기된 항목 ${discardedCount}개는 뺐다(search_entries의 include_discarded로 찾을 수 있다)` : ""}:`,
      ...(shown.length ? shown.map(indexLine) : ["(아직 없음)"]),
    );
    return lines.join("\n");
  }
  // 분류·템플릿 변경 알림은 그 도구를 가진 대화(버전 4 이상)에만 보낸다.
  const changes = state.log.filter((c) => c.by === "user" && c.at > (thread.syncedAt || 0) && (c.action !== "types" || v >= 4) && (c.action !== "calendar" || v >= 5) && ((c.action !== "naming" && c.action !== "manuscript") || v >= 7));
  if (!changes.length) return null;
  const label = { create: "추가", update: "수정", delete: "삭제", restore: "복구", purge: "완전 삭제", relation: "관계 변경", world: "세계관 개요 수정", types: "분류·템플릿 변경", calendar: "달력·시대 변경", naming: "이름 규칙 변경", manuscript: "원고함 변경" };
  const seen = new Set();
  const lines = [];
  for (const c of changes.slice().reverse()) {
    const key = (c.id || "world") + c.action + (["types", "naming", "manuscript"].includes(c.action) ? c.note : "");
    if (seen.has(key)) continue;
    seen.add(key);
    if (c.id) lines.push(`- ${c.id} ${c.name}: ${label[c.action] || c.action}`);
    else if (c.action === "types") lines.push(`- ${label.types}: ${c.note}`);
    else if (c.action === "calendar") lines.push(`- ${label.calendar}:\n${calendarText()}`);
    else if (c.action === "naming" || c.action === "manuscript") lines.push(`- ${label[c.action]}: ${c.note}`);
    else lines.push(`- ${label[c.action] || c.action}`);
  }
  const typesChanged = changes.some((c) => c.action === "types");
  const head = typesChanged
    ? "[앱 알림: 사용자가 대화 밖에서 직접 바꾼 내용. 필요하면 get_entries로 최신 내용을 읽고, 분류나 템플릿이 바뀌었으면 list_types와 get_template로 다시 확인할 것]"
    : "[앱 알림: 사용자가 대화 밖에서 직접 바꾼 내용. 필요하면 get_entries로 최신 내용을 읽을 것]";
  return [head, ...lines.reverse()].join("\n");
}

function apiMessage(err) {
  return err?.error?.error?.message || err?.message || String(err);
}
function describeError(err) {
  if (err instanceof Anthropic.AuthenticationError) return "API 키가 올바르지 않습니다. 설정에서 키를 확인하세요.";
  if (err instanceof Anthropic.PermissionDeniedError) return "이 API 키로는 이 모델을 쓸 권한이 없습니다. 설정에서 다른 모델을 고르거나 Console 권한을 확인하세요.";
  if (err instanceof Anthropic.NotFoundError) return "모델을 찾을 수 없습니다. 설정에서 모델을 확인하세요.";
  if (err instanceof Anthropic.RateLimitError) return "요청 한도에 걸렸습니다. 잠시 후 다시 시도하세요.";
  if (err instanceof Anthropic.BadRequestError) {
    const m = apiMessage(err);
    return /credit/i.test(m) ? `크레딧이 부족합니다. Console의 Billing에서 잔액을 확인하세요. (${m})` : `요청이 거부되었습니다: ${m}`;
  }
  if (err instanceof Anthropic.InternalServerError) return `Anthropic 서버가 일시적으로 응답하지 않습니다(${err.status}). 잠시 후 다시 시도하세요.`;
  if (err instanceof Anthropic.APIConnectionError) return "네트워크에 연결할 수 없습니다. 인터넷 연결을 확인하세요.";
  if (err instanceof Anthropic.APIError && err.status === 413) return "요청이 너무 큽니다(최대 32MB). 첨부가 많은 대화라면 새 대화에서 다시 시도하세요.";
  if (err instanceof Anthropic.APIError) return `API 오류 ${err.status ?? ""}: ${apiMessage(err)}`;
  return `오류: ${err?.message || err}`;
}

// 대답 추천 도구의 결과는 사용자의 다음 메시지 맨 앞에 붙여 보낸다(추가 API 호출 없이 차례를 끝내기 위해).
function pendingResults(picked) {
  const pending = state.conv.pending;
  if (!pending?.length) return [];
  return pending.map(({ id, ok }) => (ok
    ? { type: "tool_result", tool_use_id: id, content: picked ? "사용자가 추천한 대답 중에서 골랐다. 대답은 이어지는 메시지에 있다." : "사용자가 추천 대신 직접 입력했다. 대답은 이어지는 메시지에 있다." }
    : { type: "tool_result", tool_use_id: id, content: "입력이 올바르지 않아 표시하지 못했다. message는 문자열, options는 문자열 배열이어야 한다.", is_error: true }));
}
function currentSuggest() {
  if (!state.conv.pending?.length) return null;
  const last = state.conv.display[state.conv.display.length - 1];
  return last && last.role === "assistant" && last.suggest ? last.suggest : null;
}

function canSend() {
  if (state.busy) return false;
  if (!settings.apiKey) { toast("설정에서 API 키를 먼저 넣으세요"); switchView("settings"); return false; }
  if (!currentWorld()) { toast("먼저 세계관을 만드세요"); openWorldSheet(); return false; }
  if (attachments.some((a) => a.status !== "ready")) { toast("첨부 파일을 준비하는 중입니다. 잠시 후 보내세요"); return false; }
  return true;
}

async function sendMessage(typed, picked = false) {
  if (!canSend()) return;
  const atts = attachments.slice();
  const text = typed || (atts.length ? "첨부한 파일을 봐 줘." : "");
  if (!text) return;
  attachments = [];
  renderAttachTray();
  let thread = currentThread();
  if (!thread) thread = await createThread(typed || (atts[0] ? `첨부: ${atts[0].name}` : text));
  const blocks = pendingResults(picked);
  state.conv.pending = null;
  qrSelected.clear();
  const note = contextNoteFor(thread);
  if (note) blocks.push({ type: "text", text: note });
  for (const a of atts) blocks.push(attachmentBlock(a));
  blocks.push({ type: "text", text });
  state.conv.api.push({ role: "user", content: blocks });
  state.conv.display.push({
    role: "user", text, at: Date.now(),
    ...(atts.length ? { files: atts.map((a) => ({ name: a.name, kind: a.kind, size: a.size, thumb: a.thumb || null })) } : {}),
  });
  thread.contextSent = true;
  thread.syncedAt = Date.now();
  thread.updatedAt = Date.now();
  await Promise.all([persist.conv(), persist.threads()]);
  renderChat();
  await runAgent();
}

function handleEvent(ev, item, blockParts) {
  if (ev.type === "content_block_start") {
    const b = ev.content_block;
    if (b.type === "thinking" || b.type === "redacted_thinking") {
      const p = { kind: "thinking", text: "", streaming: true };
      item.parts.push(p);
      blockParts.set(ev.index, p);
      live.status = "생각하는 중…";
    } else if (b.type === "text") {
      const p = { kind: "text", text: "" };
      item.parts.push(p);
      blockParts.set(ev.index, p);
      live.status = "";
    } else if (b.type === "tool_use") {
      if (b.name === RESPOND) {
        const p = { kind: "text", text: "", respondId: b.id, _json: "" };
        item.parts.push(p);
        blockParts.set(ev.index, p);
        live.status = "";
      } else {
        // 예전 대화(v2~v5): 대답 추천 바로 앞의 진행 메모(요약된 thinking)는 답의 일부이므로 본문으로 보여 준다
        if (b.name === SUGGEST) {
          const prev = blockParts.get(ev.index - 1);
          if (prev && prev.kind === "thinking" && prev.text.trim()) { prev.kind = "text"; prev.fromProgress = true; delete prev.streaming; }
        }
        live.status = TOOL_STATUS[b.name] || "설정집 작업 중…";
      }
    } else if (b.type === "fallback") {
      item.parts.push({ kind: "note", tone: "info", text: `안전 정책 판단으로 ${b.to?.model || "다른 모델"}이 이어서 답합니다.` });
    }
  } else if (ev.type === "content_block_delta") {
    const p = blockParts.get(ev.index);
    if (!p) return;
    if (ev.delta.type === "thinking_delta") p.text += ev.delta.thinking;
    else if (ev.delta.type === "text_delta") p.text += ev.delta.text;
    else if (ev.delta.type === "input_json_delta" && p.respondId) { p._json += ev.delta.partial_json; p.text = partialJsonString(p._json, "message"); }
  } else if (ev.type === "content_block_stop") {
    const p = blockParts.get(ev.index);
    if (p && p.kind === "thinking") { p.streaming = false; live.status = "정리하는 중…"; }
  }
  scheduleLive();
}

// Opus 5.5·Sonnet 5.5는 도구 호출 바로 앞에 쓴 긴 글을 '진행 메모' thinking 블록으로 돌려주고, 앱에는 요약만 온다.
// 답(respond)이나 대답 추천 앞에 그런 메모가 있고 본문이 비었거나 짧으면, 사용자는 답의 알맹이를 못 본 것이다.
const RESEND_RESPOND = "방금 respond 앞에 쓴 글은 사용자 화면에 보이지 않았다. 도구 호출 앞에 쓴 긴 글은 요약된 생각 블록으로만 전달되고, 사용자는 respond의 message만 본다. 앞에 쓴 내용까지 모두 포함해 사용자에게 할 답 전체를 message에 다시 써서 respond를 한 번 더 호출하라. 이번에는 respond 앞에 아무 글도 쓰지 마라.";
const RESEND_SUGGEST = "방금 suggest_replies 앞에 쓴 답은 사용자 화면에 요약으로만 보였다(도구 호출 앞의 긴 글은 요약된 생각 블록으로 전달된다). 이번에는 도구를 부르지 말고, 사용자에게 할 답 전체를 글로만 다시 써라.";
function replyBodyLost(message, tu) {
  const idx = message.content.indexOf(tu);
  const prev = message.content[idx - 1];
  const prev2 = message.content[idx - 2];
  const hasText = message.content.some((b) => b.type === "text" && b.text.trim());
  if (tu.name === RESPOND) {
    const msg = String(tu.input?.message || "").trim();
    if (!msg && !hasText) return true;
    // 생각 블록 두 개가 연달아 붙어 있으면 뒤의 것이 도구 앞에 쓴 글(진행 메모)이다
    return prev?.type === "thinking" && prev2?.type === "thinking" && msg.length < 400;
  }
  return prev?.type === "thinking" && !hasText; // 예전 대화: 대답 추천 앞에 본문 글이 있어야 한다
}

async function runAgent() {
  const thread = currentThread();
  state.busy = true;
  const item = { role: "assistant", parts: [], at: Date.now(), cost: 0, model: settings.model };
  state.conv.display.push(item);
  live = { item, el: null, status: "생각하는 중…", stream: null, stopped: false };
  renderChat();
  updateComposer();
  const client = new Anthropic({ apiKey: settings.apiKey, dangerouslyAllowBrowser: true });
  let jsonRetries = 0;
  let bodyRetries = 0;
  let dataChanged = false;
  try {
    let finished = false;
    for (let round = 0; round < MAX_ROUNDS && !finished; round++) {
      const before = item.parts.length;
      const blockParts = new Map();
      let message;
      try {
        const stream = client.beta.messages.stream(buildParams(thread));
        live.stream = stream;
        for await (const ev of stream) handleEvent(ev, item, blockParts);
        message = await stream.finalMessage();
        jsonRetries = 0;
      } catch (err) {
        if (err instanceof Anthropic.APIUserAbortError || live.stopped) {
          item.parts.push({ kind: "note", tone: "info", text: "응답을 멈췄습니다. 멈춘 부분은 대화 기록에 남지 않습니다." });
          return;
        }
        if (err instanceof Anthropic.APIError) throw err;
        if (jsonRetries++ >= 2) throw err;
        item.parts.length = before;
        continue;
      }

      const dropped = (message.input_transformations || []).filter((x) => x.reason === "prefix_binding_mismatch");
      if (dropped.length) console.warn("대화 기록이 어긋나 이전 추론 일부를 버렸습니다", dropped);
      const turnCost = calcCost(message.usage, message.model);
      item.cost += turnCost;
      item.model = message.model;
      addCost(turnCost);
      if (thread) {
        const u = message.usage || {};
        thread.lastCtx = (u.input_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0);
      }

      if (message.stop_reason === "refusal") {
        const cat = message.stop_details?.category;
        item.parts.push({ kind: "note", tone: "error", text: `안전 정책에 따라 이 요청에는 답할 수 없습니다${cat ? ` (분류: ${cat})` : ""}. 표현을 바꿔 다시 요청해 보세요.` });
        return;
      }
      const toolUses = message.content.filter((b) => b.type === "tool_use");
      if (message.stop_reason === "max_tokens" && toolUses.length) {
        item.parts.push({ kind: "note", tone: "error", text: "응답이 너무 길어 중간에 끊겼습니다. 요청을 나눠서 다시 보내 주세요." });
        return;
      }
      state.conv.api.push({ role: "assistant", content: clone(message.content) });
      if (message.stop_reason === "pause_turn") { await persist.conv(); continue; }
      if (toolUses.length && toolUses.every((b) => REPLY_TOOLS.has(b.name)) && toolUses.some((tu) => replyBodyLost(message, tu))) {
        if (bodyRetries < 1) {
          // 답의 알맹이가 요약 속에 묻혔다: 같은 차례 안에서 본문 전체를 다시 받는다(대화 기록은 덧붙이기만 한다).
          bodyRetries++;
          const ids = new Set(toolUses.map((tu) => tu.id));
          item.parts = item.parts.filter((p) => !ids.has(p.respondId));
          for (const p of item.parts) if (p.fromProgress) { p.kind = "thinking"; delete p.fromProgress; }
          state.conv.api.push({ role: "user", content: toolUses.map((tu) => ({ type: "tool_result", tool_use_id: tu.id, is_error: true, content: tu.name === RESPOND ? RESEND_RESPOND : RESEND_SUGGEST })) });
          live.status = "답을 다시 받는 중…";
          await persist.conv();
          scheduleLive();
          continue;
        }
        // 다시 받아도 그렇다면, 요약이라도 본문으로 보여 준다
        for (const tu of toolUses) {
          const p = blockParts.get(message.content.indexOf(tu) - 1);
          if (p && p.kind === "thinking" && p.text.trim()) p.kind = "text";
        }
      }
      if (toolUses.length && toolUses.every((b) => REPLY_TOOLS.has(b.name))) {
        // 답(respond)이나 대답 추천만 부른 차례: 여기서 끝내고, 도구 결과는 사용자의 다음 메시지와 함께 보낸다.
        let shown = null;
        const okIds = new Set();
        for (const tu of toolUses) {
          const schema = tu.name === RESPOND ? RESPOND_TOOL.input_schema : SUGGEST_TOOL.input_schema;
          const problem = validateInput(schema, tu.input);
          if (tu.name === RESPOND) {
            const part = item.parts.find((p) => p.respondId === tu.id);
            if (!problem) {
              okIds.add(tu.id);
              if (part) part.text = tu.input.message; else item.parts.push({ kind: "text", text: tu.input.message, respondId: tu.id });
            } else if (part) item.parts.splice(item.parts.indexOf(part), 1);
          } else if (!problem) okIds.add(tu.id);
          const options = problem ? [] : [...new Set((tu.input.options || []).map((o) => cut(o, 160)).filter(Boolean))].slice(0, 6);
          if (!shown && options.length) shown = { id: tu.id, options, multiple: !!tu.input.multiple };
        }
        state.conv.pending = toolUses.map((tu) => ({ id: tu.id, ok: okIds.has(tu.id) }));
        if (shown) item.suggest = { options: shown.options, multiple: shown.multiple };
        qrSelected.clear();
        finished = true;
        break;
      }
      if (!toolUses.length) {
        if (message.stop_reason === "max_tokens") item.parts.push({ kind: "note", tone: "info", text: "답변이 길이 제한에 걸려 끝까지 나오지 않았습니다. '계속'이라고 보내면 이어서 씁니다." });
        finished = true;
        break;
      }
      const mixedRespond = new Set(toolUses.filter((b) => b.name === RESPOND).map((b) => b.id));
      if (mixedRespond.size) item.parts = item.parts.filter((p) => !mixedRespond.has(p.respondId));
      const results = [];
      for (const tu of toolUses) {
        const r = runTool(tu.name, tu.input, promptSetFor(thread).tools);
        results.push({ type: "tool_result", tool_use_id: tu.id, content: r.content, ...(r.is_error ? { is_error: true } : {}) });
        if (r.action) item.parts.push({ kind: "action", action: r.action });
        if (r.changed) dataChanged = true;
      }
      state.conv.api.push({ role: "user", content: results });
      live.status = "이어서 생각하는 중…";
      if (dataChanged) { await persist.world(); renderCodex(); renderWorldName(); }
      await persist.conv();
      scheduleLive();
      if (round === MAX_ROUNDS - 1) {
        item.parts.push({ kind: "note", tone: "info", text: "작업 단계가 많아 여기서 멈췄습니다. '계속'이라고 보내면 이어서 진행합니다." });
      }
    }
  } catch (err) {
    console.error(err);
    item.parts.push({ kind: "note", tone: "error", text: describeError(err) });
  } finally {
    item.parts = item.parts.filter((p) => !(p.kind === "thinking" && !p.text.trim()));
    for (const p of item.parts) { delete p.streaming; delete p._json; delete p.fromProgress; }
    live = null;
    state.busy = false;
    if (thread) thread.updatedAt = Date.now();
    await Promise.all([persist.conv(), persist.threads(), persist.world(), persist.worlds()]);
    renderChat();
    renderCodex();
    renderWorldName();
    updateComposer();
  }
}

function stopAgent() {
  if (!live) return;
  live.stopped = true;
  try { live.stream?.abort(); } catch { /* 이미 끝남 */ }
}

/* ============================================================
   7-1. 첨부 파일
   ============================================================ */
const ATT_LIMITS = {
  count: 10,                       // 한 메시지에 붙일 수 있는 파일 수
  pdfBytes: 20 * 1024 * 1024,      // PDF 한 개 (base64로 늘어나도 요청 한도 32MB 안에 들도록)
  textChars: 300000,               // 텍스트 파일 글자 수
  threadB64: 24 * 1024 * 1024,     // 한 대화에 쌓이는 첨부 총량(매 요청마다 다시 보내므로)
  imageEdge: 1568,                 // 이미지 긴 변. 더 크면 토큰이 크게 늘어 줄여서 보낸다.
  countB64: 8 * 1024 * 1024,       // 이보다 큰 파일은 토큰 미리 계산을 건너뛴다(데이터 절약)
};
const OK_IMAGE_TYPES = ["image/jpeg", "image/png", "image/gif", "image/webp"];
let attachments = []; // 입력창에 올려 둔 파일

const fmtSize = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + "MB" : Math.max(1, Math.round(n / 1024)) + "KB");
function kindOf(file) {
  const t = (file.type || "").toLowerCase();
  const n = (file.name || "").toLowerCase();
  if (t.startsWith("image/") || /\.(heic|heif)$/.test(n)) return "image";
  if (t === "application/pdf" || n.endsWith(".pdf")) return "pdf";
  if (t.startsWith("text/") || t === "application/json" || /\.(txt|md|markdown|csv|tsv|json|log)$/.test(n)) return "text";
  return null;
}
function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error || new Error("파일을 읽을 수 없습니다"));
    r.readAsDataURL(blob);
  });
}
async function blobToBase64(blob) {
  const url = await blobToDataURL(blob);
  return url.slice(url.indexOf(",") + 1);
}
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이 브라우저에서 열 수 없는 이미지입니다")); };
    img.src = url;
  });
}
function drawScaled(img, maxEdge, type, quality) {
  const scale = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const g = canvas.getContext("2d");
  if (type === "image/jpeg") { g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h); }
  g.drawImage(img, 0, 0, w, h);
  return new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("이미지 변환에 실패했습니다"))), type, quality));
}
async function prepareImage(file) {
  const { img, url } = await loadImage(file);
  try {
    let blob = file;
    let type = (file.type || "").toLowerCase();
    const tooBig = Math.max(img.naturalWidth, img.naturalHeight) > ATT_LIMITS.imageEdge;
    if (!OK_IMAGE_TYPES.includes(type) || tooBig || file.size > 3.5 * 1024 * 1024) {
      blob = await drawScaled(img, ATT_LIMITS.imageEdge, "image/jpeg", 0.86);
      type = "image/jpeg";
    }
    const thumb = await blobToDataURL(await drawScaled(img, 480, "image/jpeg", 0.8));
    return { mediaType: type, data: await blobToBase64(blob), size: blob.size, thumb };
  } finally {
    URL.revokeObjectURL(url);
  }
}
async function preparePdf(file) {
  if (file.size > ATT_LIMITS.pdfBytes) throw new Error(`PDF는 ${fmtSize(ATT_LIMITS.pdfBytes)}까지 첨부할 수 있습니다`);
  return { mediaType: "application/pdf", data: await blobToBase64(file), size: file.size };
}
async function prepareText(file) {
  const buf = await file.arrayBuffer();
  let text = new TextDecoder("utf-8").decode(buf);
  const broken = (text.match(/�/g) || []).length;
  if (broken > Math.max(3, text.length * 0.002)) {
    // 윈도우 메모장 등에서 저장한 한글 파일(EUC-KR)
    try { text = new TextDecoder("euc-kr").decode(buf); } catch { /* 디코더 미지원 */ }
  }
  text = text.replace(/^﻿/, "");
  if (!text.trim()) throw new Error("빈 파일입니다");
  if (text.length > ATT_LIMITS.textChars) throw new Error(`텍스트가 너무 깁니다(${ATT_LIMITS.textChars.toLocaleString("ko-KR")}자까지)`);
  return { mediaType: "text/plain", data: text, size: file.size };
}
function attachmentBlock(a) {
  if (a.kind === "image") return { type: "image", source: { type: "base64", media_type: a.mediaType, data: a.data } };
  if (a.kind === "pdf") return { type: "document", source: { type: "base64", media_type: "application/pdf", data: a.data }, title: a.name };
  return { type: "text", text: `[첨부 파일: ${a.name}]\n${a.data}` };
}
function threadAttachBytes() {
  let n = 0;
  for (const m of state.conv.api) {
    if (!Array.isArray(m.content)) continue;
    for (const b of m.content) if ((b.type === "image" || b.type === "document") && b.source?.type === "base64") n += b.source.data.length;
  }
  return n;
}
const trayBytes = () => attachments.reduce((s, a) => s + (a.kind === "text" ? 0 : a.data?.length || 0), 0);

async function addFiles(fileList) {
  const files = [...(fileList || [])];
  if (!files.length) return;
  if (!currentWorld()) { toast("먼저 세계관을 만드세요"); return; }
  for (const file of files) {
    if (attachments.length >= ATT_LIMITS.count) { toast(`한 번에 ${ATT_LIMITS.count}개까지 첨부할 수 있습니다`); break; }
    const kind = kindOf(file);
    if (!kind) { toast(`${file.name}: 이미지, PDF, 텍스트 파일만 첨부할 수 있습니다`); continue; }
    const a = { id: uid(), name: file.name || "사진.jpg", kind, status: "processing", size: file.size, tokens: null };
    attachments.push(a);
    renderAttachTray();
    try {
      Object.assign(a, kind === "image" ? await prepareImage(file) : kind === "pdf" ? await preparePdf(file) : await prepareText(file));
      if (threadAttachBytes() + trayBytes() > ATT_LIMITS.threadB64) throw new Error("이 대화에 첨부가 너무 많습니다. 새 대화에서 첨부하세요");
      a.status = "ready";
      countAttachment(a);
    } catch (err) {
      attachments = attachments.filter((x) => x !== a);
      toast(`${a.name}: ${err?.message || err}`);
    }
    renderAttachTray();
  }
}
async function countAttachment(a) {
  // 토큰 수 확인(count_tokens)은 응답을 만들지 않으며 무료입니다(분당 횟수 제한 있음).
  if (!settings.apiKey || (a.data?.length || 0) > ATT_LIMITS.countB64) return;
  try {
    const client = new Anthropic({ apiKey: settings.apiKey, dangerouslyAllowBrowser: true });
    const r = await client.messages.countTokens({
      model: settings.model,
      messages: [{ role: "user", content: [attachmentBlock(a), { type: "text", text: "." }] }],
    });
    a.tokens = r.input_tokens;
  } catch (err) {
    console.warn("첨부 토큰 계산 실패", err);
    a.tokens = -1;
  }
  if (attachments.includes(a)) renderAttachTray();
}
function attSub(a) {
  if (a.status === "processing") return "준비 중…";
  const parts = [fmtSize(a.size)];
  if (a.tokens > 0) parts.push(`약 ${fmtTok(a.tokens)} 토큰`, fmtUSD((a.tokens * (PRICES[settings.model]?.in || 4)) / 1e6));
  else if (a.tokens === null && settings.apiKey) parts.push("토큰 계산 중…");
  return parts.join(" · ");
}
function renderAttachTray() {
  const tray = $("#attachTray");
  tray.hidden = !attachments.length;
  tray.innerHTML = attachments.map((a) => `<div class="att">${a.thumb ? `<img src="${a.thumb}" alt="">` : `<span class="ftype">${a.kind === "pdf" ? "PDF" : "TXT"}</span>`}<span class="att-meta"><span class="att-name">${esc(a.name)}</span><span class="att-sub">${esc(attSub(a))}</span></span><button type="button" class="att-x" data-att-remove="${a.id}" aria-label="${esc(a.name)} 첨부 빼기">×</button></div>`).join("");
  const total = attachments.reduce((s, a) => s + (a.tokens > 0 ? a.tokens : 0), 0);
  const note = $("#attachNote");
  note.hidden = total < 50000;
  note.textContent = total >= 50000
    ? `첨부가 약 ${fmtTok(total)} 토큰입니다. 이 대화에서는 이후 요청마다 함께 보내지므로(캐시되면 훨씬 저렴), 큰 자료는 새 대화에서 쓰는 편이 비용이 적습니다.`
    : "";
}

/* ============================================================
   8. 마크다운
   ============================================================ */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*(?!\s)([^*\n]+?)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/\b([A-Z][A-Z0-9]{0,2}-\d{3,})\b/g, (m, id) => (findEntry(id) ? `<button type="button" class="ref" data-ref="${id}">${id}</button>` : m));
}
function md(src) {
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  let html = "";
  let para = [];
  let list = null;
  let quote = [];
  let code = null;
  const flushPara = () => { if (para.length) { html += `<p>${para.map(inline).join("<br>")}</p>`; para = []; } };
  const flushList = () => { if (list) { html += `<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`; list = null; } };
  const flushQuote = () => { if (quote.length) { html += `<blockquote>${quote.map(inline).join("<br>")}</blockquote>`; quote = []; } };
  const flushAll = () => { flushPara(); flushList(); flushQuote(); };
  for (const line of lines) {
    if (code) {
      if (/^\s*```/.test(line)) { html += `<pre><code>${esc(code.join("\n"))}</code></pre>`; code = null; } else code.push(line);
      continue;
    }
    if (/^\s*```/.test(line)) { flushAll(); code = []; continue; }
    if (!line.trim()) { flushAll(); continue; }
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { flushAll(); const lv = Math.min(m[1].length + 2, 6); html += `<h${lv}>${inline(m[2])}</h${lv}>`; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushAll(); html += "<hr>"; continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) {
      flushPara(); flushQuote();
      if (!list || list.tag !== "ul") { flushList(); list = { tag: "ul", items: [] }; }
      list.items.push(m[1]);
      continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      flushPara(); flushQuote();
      if (!list || list.tag !== "ol") { flushList(); list = { tag: "ol", items: [] }; }
      list.items.push(m[1]);
      continue;
    }
    if ((m = line.match(/^>\s?(.*)$/))) { flushPara(); flushList(); quote.push(m[1]); continue; }
    if (list && /^\s{2,}\S/.test(line)) { list.items[list.items.length - 1] += " " + line.trim(); continue; }
    flushList(); flushQuote();
    para.push(line);
  }
  if (code) html += `<pre><code>${esc(code.join("\n"))}</code></pre>`;
  flushAll();
  return html;
}

function actionChip(a) {
  const glyph = { create: "+", update: "✎", relation: "↔", delete: "×", world: "◎", read: "·" }[a.kind] || "·";
  const verb = { create: "추가", update: "수정", relation: "", delete: "휴지통", world: "수정", read: "" }[a.kind] || "";
  const label = `${a.text}${verb ? " " + verb : ""}`;
  const attr = a.ref ? ` data-ref="${esc(a.ref)}"` : "";
  return `<button type="button" class="action-chip ${a.kind === "read" ? "read" : ""}"${attr}><span class="glyph">${glyph}</span><span>${esc(label)}</span></button>`;
}
function assistantInner(item, isLive) {
  let html = "";
  let chips = [];
  const flushChips = () => { if (chips.length) { html += `<div class="chips">${chips.join("")}</div>`; chips = []; } };
  for (const p of item.parts) {
    if (p.kind === "action") { chips.push(actionChip(p.action)); continue; }
    flushChips();
    if (p.kind === "thinking") {
      if (!p.text.trim()) continue;
      html += `<details class="thinking"${isLive && p.streaming ? " open" : ""}><summary>생각 요약</summary><div class="thinking-body md">${md(p.text)}</div></details>`;
    } else if (p.kind === "text") {
      if (p.text) html += `<div class="md">${md(p.text)}</div>`;
    } else if (p.kind === "note") {
      html += `<p class="note ${p.tone === "error" ? "note-error" : ""}">${esc(p.text)}</p>`;
    }
  }
  flushChips();
  if (isLive && live?.status) html += `<div class="status-line">${esc(live.status)}</div>`;
  if (!isLive && item.cost) html += `<div class="msg-meta">${esc(PRICES[item.model]?.label || item.model)} · ${fmtUSD(item.cost)}</div>`;
  return html;
}

function composeMulti(s) {

function fillInput(text) {

  input.value = text;

  input.focus();
