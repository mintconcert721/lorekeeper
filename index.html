function onQuickReply(e) {
  const s = currentSuggest();
  if (!s || state.busy) return;
  const one = e.target.closest("[data-qr]");
  if (one) { sendMessage(s.options[Number(one.dataset.qr)], true); return; }
  const edit = e.target.closest("[data-qr-edit]");
  if (edit) { fillInput(s.options[Number(edit.dataset.qrEdit)]); return; }
  const toggle = e.target.closest("[data-qr-toggle]");
  if (toggle) {
    const k = Number(toggle.dataset.qrToggle);
    if (qrSelected.has(k)) qrSelected.delete(k); else qrSelected.add(k);
    const box = $("#quickReplies");
    if (box) box.outerHTML = quickRepliesHTML(s);
    return;
  }
  if (e.target.closest("[data-qr-send]") && qrSelected.size) { sendMessage(composeMulti(s), true); return; }
  if (e.target.closest("[data-qr-compose]") && qrSelected.size) fillInput(composeMulti(s));
}

let liveFrame = 0;
function scheduleLive() {
  if (liveFrame) return;
  liveFrame = requestAnimationFrame(() => {
    liveFrame = 0;

    if (!live.el || !live.el.isConnected) {

  if (state.pendingMode?.type === "interview") { const who = findEntry(state.pendingMode.ref); if (who) t.title = `${who.name} 인터뷰`; }

function openThreadsSheet() {
  if (state.busy) { toast("응답이 끝난 뒤에 바꿀 수 있습니다"); return; }
  const list = state.threads.slice().sort((a, b) => b.updatedAt - a.updatedAt);
  openSheet(`<h2 class="sheet-title">대화 목록</h2>

    <div class="sheet-actions"><button class="btn btn-primary" type="button" data-act="new-thread">새 대화</button></div>
    <p class="meta">대화를 지워도 설정집은 그대로 남습니다. 대화가 길어지면 새 대화를 시작하는 편이 저렴합니다.</p>`, (root) => {
    root.onclick = async (e) => {

      } else if (e.target.closest('[data-act="new-thread"]')) { closeSheet(); newThread(); }
    };
  });

      : `<div class="empty-state"><h3>${q || state.codexType !== "all" ? "조건에 맞는 항목이 없습니다" : "설정집이 비어 있습니다"}</h3><p>대화 탭에서 Claude와 이야기하면 항목이 여기에 쌓입니다.</p></div>`}

// 설정 점검: 앱이 바로 계산할 수 있는 구멍과 모순을 모은다(비용 없음).
function computeChecks() {
  const list = liveEntries();
  const byId = new Map(state.entries.map((e) => [e.id, e]));
  const issues = [];
  const add = (group, sev, text, refs) => issues.push({ group, sev, text, refs });
  // 연표: 인물이 태어나기 전에 끝났거나 죽은 뒤에 일어난 일과 이어져 있다
  for (const c of list.filter((e) => isCharacterType(e.type) && e.when)) {
    const links = new Set([...(c.relations || []).map((r) => r.to), ...incoming(c.id).map((x) => x.from.id)]);
    for (const id of links) {
      const ev = byId.get(id);
      if (!ev || ev.deleted || statusOf(ev) === "discarded" || !ev.when || isCharacterType(ev.type)) continue;
      const evEnd = ev.when.end ?? ev.when.start;
      if (evEnd < c.when.start) add("연표 확인", "warn", `${c.name}은(는) ${fmtYear(c.when.start)}에 태어났는데, 그 전에 끝난 ${ev.name}(${rangeText(ev.when)})과 이어져 있습니다.`, [c.id, ev.id]);
      if (c.when.end != null && ev.when.start > c.when.end) add("연표 확인", "warn", `${c.name}은(는) ${fmtYear(c.when.end)}에 죽었는데, 그 뒤의 ${ev.name}(${rangeText(ev.when)})과 이어져 있습니다.`, [c.id, ev.id]);
    }
  }
  // 폐기된 항목이나 휴지통 항목과 연결
  for (const e of list) {
    for (const r of e.relations || []) {
      const t = byId.get(r.to);
      if (t && (t.deleted || statusOf(t) === "discarded")) add("버린 항목과 연결", "warn", `${e.name} → ${r.label} → ${t.name}(${t.deleted ? "휴지통" : "폐기"})`, [e.id, t.id]);
    }
  }
  // 같은 이름을 여러 항목이 쓴다
  const names = new Map();
  for (const e of list) for (const n of [e.name, ...(e.aliases || [])]) {
    const k = String(n).trim().toLowerCase();
    if (!k) continue;
    if (!names.has(k)) names.set(k, new Set());
    names.get(k).add(e);
  }
  for (const [n, set] of names) if (set.size > 1) add("이름 겹침", "warn", `'${n}'을(를) ${[...set].map((e) => `${e.name}(${e.id})`).join(", ")}이(가) 함께 씁니다.`, [...set].map((e) => e.id));
  // 채울 곳
  for (const e of list) {
    const g = templateGaps(e);
    if (g && g.fields.length + g.sections.length) {
      const miss = [...g.fields, ...g.sections.map((x) => "## " + x)];
      add("템플릿 빈 칸", "info", `${e.name}: ${miss.slice(0, 5).join(", ")}${miss.length > 5 ? ` 외 ${miss.length - 5}개` : ""}`, [e.id]);
    }
  }
  for (const e of list) if (!String(e.summary || "").trim()) add("요약 없음", "info", e.name, [e.id]);
  for (const e of list) if (!e.when && isEventType(e.type)) add("시점 없는 사건", "info", e.name, [e.id]);
  const linked = new Set();
  for (const e of list) for (const r of e.relations || []) if (byId.get(r.to) && statusOf(byId.get(r.to)) !== "discarded") { linked.add(e.id); linked.add(r.to); }
  for (const e of list) if (!linked.has(e.id)) add("관계 없는 항목", "info", e.name, [e.id]);
  // 너무 빠른 이동: 인물이 이어진 사건들 사이에 장소를 옮기는데 길로 가기에 시간이 모자라다
  const yearDays = Number(currentWorld()?.yearDays) > 0 ? Number(currentWorld().yearDays) : 365;
  const fastest = (a, b) => { let best = Infinity; for (const m of worldTravel().modes) { const r = travelPath(a, b, m.name); if (r) best = Math.min(best, r.dist / m.speed); } return best; };
  const placeOf = (ev) => { const ids = [...(ev.relations || []).map((r) => r.to), ...incoming(ev.id).map((x) => x.from.id)]; return ids.map((id) => byId.get(id)).find((x) => x && !x.deleted && isPlaceType(x.type)); };
  if (worldRoutes().length) for (const c of list.filter((e) => isCharacterType(e.type))) {
    const evs = list.filter((x) => isEventType(x.type) && x.when && ((c.relations || []).some((r) => r.to === x.id) || (x.relations || []).some((r) => r.to === c.id))).map((x) => ({ x, at: placeOf(x) })).filter((o) => o.at).sort((a, b) => a.x.when.start - b.x.when.start);
    for (let i = 1; i < evs.length; i++) {
      const A = evs[i - 1];
      const B = evs[i];
      if (A.at.id === B.at.id) continue;
      const gap = (B.x.when.start - (A.x.when.end ?? A.x.when.start)) * yearDays;
      const need = fastest(A.at.id, B.at.id);
      if (gap > 0 && Number.isFinite(need) && gap < need) add("너무 빠른 이동", "warn", `${c.name}: ${A.x.name}(${A.at.name}) → ${B.x.name}(${B.at.name}) 사이가 ${Math.round(gap)}일인데 가장 빨라도 ${fmtDays(need)} 걸립니다`, [c.id, A.x.id, B.x.id]);
    }
  }
  for (const e of list) for (const w of artifactWarnings(e)) add("유물 이력 확인", "warn", `${e.name}: ${w}`, [e.id]);
  for (const e of list) if (isMagicEntry(e)) {
    const miss = ["source", "cost", "limit"].filter((k) => !e.magic?.[k]);
    if (miss.length) add("마법 체계 빈 칸", "info", `${e.name}: ${miss.map(magicLabel).join(", ")}`, [e.id]);
    for (const sp of e.spells || []) if (!sp.cost) add("대가 없는 주문", "info", `${e.name}의 '${sp.name}'`, [e.id]);
  }
  for (const e of list) if (e.parent) { let cur = byId.get(e.parent); const seen = new Set([e.id]); while (cur && cur.parent) { if (seen.has(cur.id)) { add("장소 계층이 맴돈다", "warn", `${e.name}의 상위 장소를 따라가면 다시 돌아옵니다`, [e.id]); break; } seen.add(cur.id); cur = byId.get(cur.parent); } }
  // 인물 깊이
  for (const e of list) for (const ab of e.abilities || []) if (!ab.cost) add("대가 없는 능력", "warn", `${e.name}의 '${ab.name}'에 대가가 없습니다.`, [e.id]);
  const chars = list.filter((e) => isCharacterType(e.type));
  for (const e of chars) {
    const deg = (e.relations || []).length + incoming(e.id).length;
    const filled = INNER_KEYS.filter(([k]) => e.inner?.[k]).length;
    if (deg >= 2 && filled < 3) add("내면이 빈 주요 인물", "info", `${e.name}: 관계 ${deg}개인데 내면은 ${filled}/6칸`, [e.id]);
    const lv = (e.arc || []).map((x) => x.level).filter((x) => x != null);
    if ((e.arc || []).length >= 2 && lv.length >= 2 && Math.max(...lv) - Math.min(...lv) <= 1) add("평평한 성장 곡선", "info", `${e.name}: 처지가 거의 바뀌지 않습니다`, [e.id]);
  }
  for (const a of chars) for (const b of chars) {
    if (a.id >= b.id) continue;
    if (!!a.address?.[b.id] !== !!b.address?.[a.id]) { const [x, y] = a.address?.[b.id] ? [b, a] : [a, b]; add("한쪽만 정한 호칭", "info", `${x.name}이(가) ${y.name}을(를) 부르는 말이 없습니다`, [x.id, y.id]); }
  }
  const drafts = list.filter((e) => statusOf(e) === "draft");
  if (drafts.length) add("확정을 기다리는 초안", "info", `${drafts.length}개: ${drafts.slice(0, 8).map((e) => e.name).join(", ")}${drafts.length > 8 ? " …" : ""}`, drafts.map((e) => e.id));
  return issues;
}
function openChecksSheet() {
  if (!currentWorld()) { toast("먼저 세계관을 만드세요"); return; }
  const issues = computeChecks();
  const groups = [];
  for (const it of issues) {
    let g = groups.find((x) => x.name === it.group);
    if (!g) { g = { name: it.group, sev: it.sev, items: [] }; groups.push(g); }
    g.items.push(it);
  }
  groups.sort((a, b) => (a.sev === b.sev ? 0 : a.sev === "warn" ? -1 : 1));
  const warns = issues.filter((x) => x.sev === "warn");
  openSheet(`<h2 class="sheet-title">설정 점검</h2>
    <p class="meta" style="margin:0">확정·초안 항목 ${liveEntries().length}개를 살폈습니다. ${warns.length ? `확인이 필요한 곳 ${warns.length}개, ` : "모순으로 보이는 곳은 없고, "}채울 곳 ${issues.length - warns.length}개가 있습니다.</p>
    ${groups.map((g) => `<section class="check-group"><h3 class="${g.sev === "warn" ? "sev-warn" : ""}">${esc(g.name)} <span class="n">${g.items.length}</span></h3>
      ${g.items.slice(0, 30).map((it) => `<div class="check-item"><span class="txt">${esc(it.text)}</span>${it.refs.slice(0, 4).map((id) => `<button type="button" class="ref" data-ref="${id}">${id}</button>`).join("")}</div>`).join("")}
      ${g.items.length > 30 ? `<p class="meta">외 ${g.items.length - 30}개</p>` : ""}</section>`).join("") || `<p>살펴볼 항목이 아직 없습니다.</p>`}
    <section class="card" style="margin-top:16px">
      <h2>Claude 심층 점검</h2>
      <p>앱이 찾을 수 없는 세계 규칙 위반, 서술끼리의 모순, 거리·나이 불일치를 Claude가 확정 설정을 읽고 찾습니다. 새 대화에 요청을 채워 두니, 내용을 보고 보내세요. 설정 양만큼 비용이 듭니다.</p>
      <div class="row"><button class="btn btn-primary" type="button" data-act="deep-check">요청 채우기</button></div>
    </section>`, (root) => {
    root.onclick = (ev) => {
      const ref = ev.target.closest("[data-ref]");
      if (ref) { openEntry(ref.dataset.ref); return; }
      if (ev.target.closest('[data-act="deep-check"]')) {
        if (state.busy) { toast("Claude가 작업 중입니다"); return; }
        const found = warns.slice(0, 15).map((x) => `- ${x.text}`);
        closeSheet();
        newThread();
        fillInput(`설정 전체를 점검해 줘. 확정된 항목을 기준으로 세계 규칙 위반, 서술끼리의 모순, 연표·나이·거리 불일치, 어긋난 관계를 찾아서 항목별로 알려 주고, 고칠 방법을 2~3가지씩 제안해 줘. 고치는 건 내가 고른 다음에 해.${found.length ? `\n\n앱이 먼저 찾은 것:\n${found.join("\n")}` : ""}`);
      }
    };
  });
}

const QUESTIONS = QUESTION_BANK.map(([cat, q], i) => ({ id: `q${i + 1}`, cat, q }));
function worldQA(w = currentWorld()) {
  if (!w) return { done: {}, skipped: {}, custom: [] };
  w.qa = w.qa || { done: {}, skipped: {}, custom: [] };
  w.qa.done = w.qa.done || {}; w.qa.skipped = w.qa.skipped || {}; w.qa.custom = w.qa.custom || [];
  return w.qa;
}
function todaysQuestions() {
  const qa = worldQA();
  const pool = [...qa.custom, ...QUESTIONS].filter((x) => !qa.done[x.id] && !qa.skipped[x.id]);
  const day = new Date().toISOString().slice(0, 10);
  return pool.map((x) => ({ x, k: hashNum(`${state.worldId}|${day}|${x.id}`) - (x.custom ? 1 : 0) })).sort((a, b) => a.k - b.k).slice(0, 3).map((o) => o.x);
}
function renderQuestions(box) {
  const qa = worldQA();
  const all = [...qa.custom, ...QUESTIONS];
  const done = all.filter((x) => qa.done[x.id]);
  const cards = todaysQuestions();
  box.innerHTML = `<p class="meta" style="margin:12px 0 0">오늘의 질문으로 생각지 못한 생활 영역을 채워 보세요. 정한 질문 ${done.length} / 전체 ${all.length}</p>
    ${cards.length ? `<div class="q-cards">${cards.map((c) => `<section class="q-card"><span class="eyebrow">${esc(c.cat)}</span><p class="q-text">${esc(c.q)}</p>
      <div class="row"><button class="btn btn-small btn-primary" type="button" data-q-ask="${c.id}">대화로 답하기</button><button class="btn btn-small" type="button" data-q-done="${c.id}">정했음</button><button class="btn btn-small btn-ghost" type="button" data-q-skip="${c.id}">건너뛰기</button></div></section>`).join("")}</div>`
      : `<div class="empty-state"><h3>모든 질문을 다뤘습니다</h3></div>`}
    <div class="row" style="margin-top:12px"><button class="btn" type="button" data-act="q-custom">이 세계에 맞춘 질문 받기(Claude)</button></div>
    ${done.length ? `<details class="tl-missing"><summary>정한 질문 ${done.length}개</summary><ul class="list-plain" style="margin-top:8px">${done.map((x) => `<li class="meta">${esc(x.q)} <button class="btn btn-ghost btn-small" type="button" data-q-undo="${x.id}">되돌리기</button></li>`).join("")}</ul></details>` : ""}`;
}
async function markQuestion(id, kind) {
  const qa = worldQA();
  const w = currentWorld();
  if (kind === "undo") { delete qa.done[id]; delete qa.skipped[id]; } else qa[kind][id] = Date.now();
  w.updatedAt = Date.now();
  await persist.worlds();
  renderCodexTabResults();
}
async function askCustomQuestions(btn) {
  const w = currentWorld();
  btn.disabled = true;
  btn.textContent = "질문을 만드는 중…";
  try {
    const known = liveEntries().slice(0, 120).map(indexLine).join("\n");
    const text = await quickAsk(
      "너는 세계관 설계를 돕는 편집자다. 작가가 아직 정하지 않은 생활 영역을 짚는 질문을 만든다. 한 줄에 하나씩 '분야 | 질문' 형식으로만 쓰고 다른 말은 쓰지 않는다.",
      `세계관: ${w.name}\n핵심 전제: ${w.premise || "(없음)"}\n규칙:\n${w.rules || "(없음)"}\n\n이미 정한 항목:\n${known || "(없음)"}\n\n이 세계에 꼭 맞는, 아직 정해지지 않았을 법한 질문 5개를 만들어 줘.`,
    );
    if (!text) return;
    const qa = worldQA();
    const added = text.split("\n").map((l) => l.replace(/^\s*[-*\d.)]+\s*/, "").trim()).filter((l) => l.includes("|")).slice(0, 8)
      .map((l) => { const [cat, ...rest] = l.split("|"); return { id: `c-${uid().slice(-6)}`, cat: cat.trim() || "맞춤", q: rest.join("|").trim(), custom: true }; })
      .filter((x) => x.q);
    qa.custom.unshift(...added);
    w.updatedAt = Date.now();
    await persist.worlds();
    toast(`질문 ${added.length}개를 받았습니다`);
  } catch (err) {
    toast(describeError(err));
  } finally {
    renderCodexTabResults();
  }
}

function openManuscript(id) {
  const m = state.manuscripts.find((x) => x.id === id);
  if (!m) return;
  openSheet(`<div class="entry-head"><span class="catno">${esc(m.kind)}</span><span>${fmtDate(m.updatedAt)} · ${m.by === "user" ? "직접 씀" : "Claude"}</span></div>
    <h2 class="entry-name">${esc(m.title)}</h2>
    ${m.refs?.length ? `<p class="meta" style="margin:4px 0 10px">관련: ${m.refs.map((r) => `<button type="button" class="ref" data-ref="${r}">${r}</button> ${esc(nameOf(r))}`).join(" ")}</p>` : ""}
    <div class="md ms-body">${md(m.body)}</div>
    <div class="sheet-actions">
      <button class="btn btn-primary" type="button" data-act="ms-continue">대화로 이어 쓰기</button>
      <button class="btn" type="button" data-act="ms-edit">편집</button>
      <button class="btn" type="button" data-act="ms-copy">복사</button>
      <button class="btn btn-danger" type="button" data-act="ms-delete">삭제</button>
    </div>`, (root) => {
    root.onclick = async (ev) => {
      const ref = ev.target.closest("[data-ref]");
      if (ref) { openEntry(ref.dataset.ref); return; }
      const act = ev.target.closest("[data-act]")?.dataset.act;
      if (act === "ms-continue") { closeSheet(); newThread(); fillInput(`원고 '${m.title}'(${m.id})를 읽고 이어서 써 줘. 다 쓰면 같은 원고에 저장해 줘. `); }
      else if (act === "ms-edit") openMsEditor(m);
      else if (act === "ms-copy") { try { await navigator.clipboard.writeText(`# ${m.title}\n\n${m.body}`); toast("복사했습니다"); } catch { toast("복사하지 못했습니다"); } }
      else if (act === "ms-delete") {
        if (!(await confirmBox(`'${m.title}' 원고를 지울까요?`, "지우기", true))) return;
        state.manuscripts = state.manuscripts.filter((x) => x !== m);
        await addTombstone("manuscripts", `${state.worldId}:${m.id}`);
        logChange("user", "manuscript", null, `원고 삭제: ${m.title}`);
        await persist.world();
        closeSheet(); renderCodex(); toast("지웠습니다");
      }
    };
  });
}

  const isNew = !m;
  const d = m || { title: "", kind: "메모", body: "", refs: [] };
  openSheet(`<h2 class="sheet-title">${isNew ? "새 원고" : "원고 편집"}</h2>

        box.innerHTML = names.length ? `<ul class="list-plain">${names.map((x, i) => `<li class="gen-item"><span><strong>${esc(x.n)}</strong>${x.note ? ` <span class="meta">${esc(x.note)}</span>` : ""}</span><button class="btn btn-ghost btn-small" type="button" data-gen-copy="${i}">복사</button><button class="btn btn-ghost btn-small" type="button" data-gen-new="${i}">새 항목으로</button></li>`).join("")}</ul>` : `<p class="meta">이름을 받지 못했습니다. 다시 시도해 주세요.</p>`;
        box.onclick = async (e2) => {
          const c = e2.target.closest("[data-gen-copy]");
          const nw = e2.target.closest("[data-gen-new]");
          if (c) { try { await navigator.clipboard.writeText(names[Number(c.dataset.genCopy)].n); toast("복사했습니다"); } catch { toast("복사하지 못했습니다"); } }
          if (nw) { const x = names[Number(nw.dataset.genNew)]; openEditor(null, null, { name: x.n, summary: x.note }); }
        };
      } catch (err) {
        box.innerHTML = `<p class="note note-error">${esc(describeError(err))}</p>`;
      } finally { btn.disabled = false; }
    };
  });
}

    for (const [attr, kindName] of [["qDone", "done"], ["qSkip", "skipped"], ["qUndo", "undo"]]) {
      const el = e.target.closest(`[data-${attr.replace(/[A-Z]/g, (c) => "-" + c.toLowerCase())}]`);

    const act = e.target.closest("[data-act]")?.dataset.act;
    if (act === "ms-new") openMsEditor(null);
    else if (act === "naming-new") openNamingEditor(null);
    else if (act === "naming-ask") { startInNewThread("이 세계의 나라·종족마다 이름 규칙을 만들어 줘. 음절 구조, 자주 쓰는 소리와 어미, 성(姓)과 지명 규칙, 예시 이름까지 정해서 set_naming_rule로 저장해 줘. "); }
    else if (act === "senses-ask") { startInNewThread("감각이 비어 있는 장소들의 소리·냄새·빛·촉감·맛을 그 장소답게 정해서 senses에 채워 줘. 확정 설정과 어긋나지 않게. "); }

  });
}

function arcChartSVG(arc) {
  const pts = arc.map((x, i) => ({ i, x, lv: x.level })).filter((p) => p.lv != null);
  if (pts.length < 2) return "";
  const W = 320;
  const H = 120;
  const X = (i) => 20 + (arc.length === 1 ? 0 : (i / (arc.length - 1)) * (W - 40));
  const Y = (lv) => 60 - lv * 9.5;
  const path = pts.map((p, j) => `${j ? "L" : "M"}${X(p.i).toFixed(1)},${Y(p.lv).toFixed(1)}`).join(" ");
  return `<svg class="arc-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="성장 곡선 그래프">
    <line class="arc-zero" x1="10" x2="${W - 10}" y1="60" y2="60"/><text class="arc-ax" x="4" y="14">정점</text><text class="arc-ax" x="4" y="${H - 4}">바닥</text>
    <path class="arc-line" d="${path}"/>
    ${pts.map((p) => `<circle class="arc-dot" cx="${X(p.i)}" cy="${Y(p.lv)}" r="5"/><text class="arc-n" x="${X(p.i)}" y="${Y(p.lv) - 9}">${p.i + 1}</text>`).join("")}
  </svg>`;
}
function arcHTML(e) {

  const levels = arc.map((x) => x.level).filter((x) => x != null);

function openSpellEditor(e, idx) {

async function generatePlace(root, btn, kind, parentId, mood) {

    const w = currentWorld();

    const rules = worldNaming();
    const text = await quickAsk(
      "너는 판타지 세계관의 장소를 설계한다. 세계관의 전제·분위기·규칙과 이름 규칙을 지키고, 이미 있는 장소와 이름이 겹치지 않게 한다. 위험과 소문은 이야기의 떡밥이 되게 하고, 소문은 참·거짓을 섞는다. hook에는 이 장소에서 시작할 수 있는 이야기 고리를 두세 문장으로 쓴다. 모든 값은 한국어로 짧고 구체적으로 쓴다.",
      `${worldOverviewText(w)}\n${rules.length ? `이름 규칙:\n${rules.map((r) => `- ${r.name}: ${r.rules}`).join("\n")}\n` : ""}${parent ? `\n이 장소가 속할 곳: ${parent.name} — ${parent.summary || ""}\n${PLACE_KEYS.filter(([k2]) => parent.place?.[k2]).map(([k2, l]) => `${l}: ${parent.place[k2]}`).join("\n")}${parent.climate?.climate ? `\n기후: ${parent.climate.climate}` : ""}\n` : ""}\n이미 있는 장소: ${liveEntries().filter((x) => isPlaceType(x.type)).map((x) => x.name).join(", ") || "(없음)"}\n\n종류: ${kind}${mood ? `\n분위기: ${mood}` : ""}\n이 조건에 맞는 장소 하나를 만들어 줘.`,
      8000,
      { schema: PLACE_GEN_SCHEMA, effort: "medium" },

    generatedPlace = JSON.parse(text);

      <dl class="fields sense-fields">${Object.entries(SENSE_MAP).filter(([k2]) => g.senses[k2]).map(([k2, l]) => `<div><dt>${l}</dt><dd>${esc(g.senses[k2])}</dd></div>`).join("")}</dl>
      ${g.rumors.length ? `<p class="meta" style="margin:6px 0 4px">소문</p>${g.rumors.map((r) => `<p class="rumor-line"><span class="truth truth-${esc(r.truth)}">${esc(r.truth)}</span> ${esc(r.text)}</p>`).join("")}` : ""}
      <p class="meta" style="margin:6px 0 2px">이야기 고리</p><p>${esc(g.hook)}</p>
      <div class="row"><button class="btn btn-primary btn-small" type="button" data-ct="placegen-save">새 항목으로 저장</button><button class="btn btn-small" type="button" data-ct="placegen">다시 만들기</button></div></section>`;
  } catch (err) { out.innerHTML = `<p class="note note-error">${esc(err instanceof SyntaxError ? "결과를 읽지 못했습니다. 다시 시도해 주세요" : describeError(err))}</p>`; }
  finally { btn.disabled = false; }
}
async function savGeneratedPlace(parentId) {
  const g = generatedPlace;
  if (!g) return;
  if (state.busy) { toast("Claude가 작업 중입니다"); return; }
  const t = worldTypes().find((x) => x.key === "place") || worldTypes().find((x) => isPlaceType(x.key));
  if (!t) { toast("장소 분류가 없습니다. 분류·템플릿 관리에서 만들어 주세요"); return; }
  const SENSE_MAP = { sound: "소리", smell: "냄새", light: "빛", touch: "촉감", taste: "맛" };
  try {
    const e = createEntry({
      type: t.key, name: g.name, summary: g.summary, status: "초안",
      body: g.hook ? `## 이야기 고리\n${g.hook}` : "",
      parent: parentId || undefined,
      place: g.place,
      senses: Object.fromEntries(Object.entries(SENSE_MAP).map(([k, l]) => [l, g.senses[k]]).filter(([, v]) => v)),
      rumors: g.rumors.map((r) => ({ id: uid().slice(-6), text: r.text, truth: r.truth })),
    }, "user");
    generatedPlace = null;
    await persist.world();
    renderCodex();
    openEntry(e.id);
    toast("초안으로 저장했습니다");
  } catch (err) { toast(err.message); }
}

      <label>메모<input id="ro-note" value="${esc(r?.note || "")}"></label>

      if (dup) { toast("두 장소 사이에 이미 길이 있습니다"); return; }
      const next = { id: r?.id || uid().slice(-6), a, b, ...(dist ? { dist } : {}), terrain: $("#ro-terrain", root).value.trim(), modes: $$('input[type="checkbox"]:checked', root).map((i) => i.value), note: $("#ro-note", root).value.trim() };

    };
  });
}

      const box = $("#f-fields", root);

      const have = new Set($$(".fk", box).map((i) => i.value.trim()));
      for (const f of parseTemplate(t.template).fields) if (!have.has(f.key)) box.insertAdjacentHTML("beforeend", kvRow(f.key, "", f.hint));
      body.value = replace ? templateSkeletonBody(t.template) : mergeTemplate({}, body.value, t.template).body;
    };
    const refreshTemplate = (fresh) => {
      const t = typeInfo($("#f-type", root).value);
      const note = $("#f-tpl", root);
      note.hidden = !t.template;
      if (!t.template) return;
      note.innerHTML = `<span>${esc(t.label)} 템플릿이 있습니다</span><button type="button" class="btn btn-ghost btn-small" data-act="tpl-apply">템플릿 칸 채워 넣기</button>`;
      if (fresh && !touched) applyTemplate(t, true);
    };
    $("#f-type", root).addEventListener("change", () => refreshTemplate(true));
    refreshTemplate(isNew);
    const syncParent = () => { $("#f-parent-wrap", root).hidden = !isPlaceType($("#f-type", root).value) && !d.parent; };
    $("#f-type", root).addEventListener("change", syncParent);
    syncParent();
    $("#f-img", root).onchange = async (ev) => {
      const file = ev.target.files?.[0];

      if (!file) return;
      try {
        newImage = await entryPicture(file);
        const prev = $("#f-img-prev", root);

    if (opts.focusTime) {
      const ts = $("#f-ts", root);
      requestAnimationFrame(() => { $("#f-time", root).scrollIntoView({ block: "center" }); ts.focus(); });
    }
    root.onsubmit = async (ev) => {
      ev.preventDefault();
      if (state.busy) { toast("Claude가 작업 중입니다. 끝난 뒤에 저장해 주세요"); return; }
      const fields = {};
      for (const row of $$("#f-fields .kv-row", root)) {
        const k = $(".fk", row).value.trim();
        if (k) fields[k] = $(".fv", row).value.trim();
      }
      const relations = [];
      for (const row of $$("#f-rels .kv-row", root)) {
        const to = $(".rt", row).value;
        const label = $(".rl", row).value.trim();
        if (to && label && !relations.some((r) => r.to === to && r.label === label)) relations.push({ to, label });
      }
      const data = {
        type: $("#f-type", root).value,
        name: $("#f-name", root).value,
        aliases: splitList($("#f-aliases", root).value),
        summary: $("#f-summary", root).value,
        fields,
        body: $("#f-body", root).value,
        when: null,
        status: root.querySelector('input[name="f-status"]:checked')?.value || "canon",
        tags: splitList($("#f-tags", root).value).map((t) => t.replace(/^#/, "")),
        relations,
        parent: $("#f-parent", root).value,
      };
      const senses = {};
      for (const inp of $$(".sense-in", root)) if (inp.value.trim()) senses[inp.dataset.k] = inp.value.trim();
      const perspectives = [];
      for (const row of $$("#f-persp .persp-row", root)) {
        const byText = $(".pb", row).value.trim();
        const text = $(".pt", row).value.trim();
        if (!byText || !text) continue;
        const by = findEntry(byText.split(" ")[0])?.id || findEntry(byText)?.id || byText;
        if (!perspectives.some((x) => x.by === by)) perspectives.push({ by, text });
      }
      if (isNew) { data.senses = senses; data.perspectives = perspectives; }
      else { data.sensesAll = senses; data.perspectives = perspectives; }
      // 연표 시점: 비우면 연표에서 뺀다
      const tsText = $("#f-ts", root).value.trim();
      const teText = $("#f-te", root).value.trim();
      const ts = tsText ? parseYear(tsText) : null;
      const te = teText ? parseYear(teText) : null;
      if (tsText && ts === null) { toast("시작 연도는 숫자로 넣어 주세요"); return; }
      if (teText && te === null) { toast("끝 연도는 숫자로 넣어 주세요"); return; }
      if (te !== null && ts === null) { toast("끝 연도를 쓰려면 시작 연도도 넣어 주세요"); return; }
      if (te !== null && te < ts) { toast("끝 연도는 시작 연도보다 앞설 수 없습니다"); return; }
      data.when = ts !== null ? { start: ts, end: te, label: $("#f-tl", root).value.trim() } : null;
      try {
        let saved;
        if (isNew) saved = createEntry(data, "user");
        else { updateEntry(e, data, "user", "직접 편집"); saved = e; }
        if (newImage !== undefined && (newImage || curImage)) { state.images[saved.id] = { data: newImage, at: Date.now() }; await persist.images(); }
        await persist.world();
        renderCodex();
        openEntry(saved.id);
        toast("저장했습니다");
      } catch (err) { toast(err.message); }
    };
  });
}

const SVG_NS = "http://www.w3.org/2000/svg";
const graph = {
  worldId: undefined,       // 위치를 불러온 세계관
  nodes: new Map(),         // id → { id, entry, x, y, pinned, degree, isNew, r, el }
  edges: [],                // { a, b, rels:[{from,to,label}], el, labels:[{el, from}] }
  pos: {},                  // 저장된 위치 { id: [x, y, pinned] }
  vis: new Set(),
  visEdges: [],
  view: { tx: 0, ty: 0, s: 1 },
  fitted: false,
  selected: null,
  focusHops: 0,             // 0: 전체, 1~2: 선택 항목 주변만
  hiddenTypes: new Set(),
  hideIsolated: false,
  linkFrom: null,           // 관계 잇기 시작 항목
  pendingSelect: null,
  labelsAll: false,
  saveTimer: 0,
};
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function hashNum(str) {
  let h = 2166136261;
  for (const ch of String(str)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0) / 4294967295;
}
function resetGraphCache() { graph.worldId = undefined; }

async function loadGraphPositions() {
  if (graph.worldId === state.worldId) return;
  graph.worldId = state.worldId;
  graph.pos = (state.worldId && (await idb.get("graph:" + state.worldId)))?.pos || {};
  graph.nodes = new Map();
  graph.edges = [];
  graph.view = { tx: 0, ty: 0, s: 1 };
  graph.fitted = false;
  graph.selected = null;
  graph.focusHops = 0;
  graph.linkFrom = null;
  graph.hiddenTypes.clear();
  graph.hideIsolated = false;
}
function saveGraphPositions() {
  clearTimeout(graph.saveTimer);
  const wid = graph.worldId;
  graph.saveTimer = setTimeout(() => {
    if (!wid || wid !== state.worldId) return;
    const pos = {};
    for (const n of graph.nodes.values()) pos[n.id] = [Math.round(n.x * 10) / 10, Math.round(n.y * 10) / 10, n.pinned ? 1 : 0];
    graph.pos = pos;

}

function buildGraphModel() {
  const entries = liveEntries();
  const ids = new Set(entries.map((e) => e.id));
  const old = graph.nodes;
  const nodes = new Map();
  for (const e of entries) {
    const prev = old.get(e.id);
    const saved = graph.pos[e.id];
    nodes.set(e.id, {
      id: e.id, entry: e,
      x: prev ? prev.x : saved ? saved[0] : null,
      y: prev ? prev.y : saved ? saved[1] : null,
      pinned: prev ? prev.pinned : !!saved?.[2],
      degree: 0, isNew: !prev && !saved, r: 10, el: null,
    });
  }
  const pairs = new Map();
  for (const e of entries) {
    for (const r of e.relations || []) {
      if (!ids.has(r.to) || r.to === e.id) continue;
      const [a, b] = e.id < r.to ? [e.id, r.to] : [r.to, e.id];
      const key = `${a}|${b}`;
      if (!pairs.has(key)) pairs.set(key, { a, b, rels: [], el: null, labels: [] });
      pairs.get(key).rels.push({ from: e.id, to: r.to, label: r.label });
    }
  }
  graph.nodes = nodes;
  graph.edges = [...pairs.values()];
  for (const ed of graph.edges) { nodes.get(ed.a).degree++; nodes.get(ed.b).degree++; }
  const anyPlaced = [...nodes.values()].some((n) => n.x != null);
  const spread = Math.max(80, Math.sqrt(nodes.size) * 45);
  for (const n of nodes.values()) {
    if (n.x != null) continue;
    const ang = hashNum(n.id) * Math.PI * 2;
    const near = graph.edges
      .filter((ed) => ed.a === n.id || ed.b === n.id)
      .map((ed) => nodes.get(ed.a === n.id ? ed.b : ed.a))
      .filter((m) => m.x != null);
    if (near.length) {
      n.x = near.reduce((s, m) => s + m.x, 0) / near.length + Math.cos(ang) * 60;
      n.y = near.reduce((s, m) => s + m.y, 0) / near.length + Math.sin(ang) * 60;
    } else {
      const rad = anyPlaced ? spread * 0.9 : spread * (0.3 + hashNum(n.id + "r") * 0.7);
      n.x = Math.cos(ang) * rad;
      n.y = Math.sin(ang) * rad;
    }
  }
  if (graph.selected && !nodes.has(graph.selected)) { graph.selected = null; graph.focusHops = 0; }
  if (graph.linkFrom && !nodes.has(graph.linkFrom)) graph.linkFrom = null;
}

// 힘 기반 배치(Fruchterman-Reingold). full이면 전체를, 아니면 새로 생긴 항목만 움직인다.
function runLayout(full) {
  const ns = [...graph.nodes.values()];
  const n = ns.length;
  if (!n) return;
  const movable = ns.map((v) => !v.pinned && (full || v.isNew));
  if (!movable.some(Boolean)) return;
  const k = 110; // 선 길이 기준. 관계 이름이 들어갈 여유를 둔다.
  const iters = full ? (n > 200 ? 160 : 320) : 120;
  let temp = full ? 120 : 45;
  const index = new Map(ns.map((v, i) => [v.id, i]));
  const E = graph.edges.map((ed) => [index.get(ed.a), index.get(ed.b)]);
  const dx = new Float64Array(n);
  const dy = new Float64Array(n);
  for (let it = 0; it < iters; it++) {
    dx.fill(0); dy.fill(0);
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        let ddx = ns[i].x - ns[j].x;
        let ddy = ns[i].y - ns[j].y;
        let d2 = ddx * ddx + ddy * ddy;
        if (d2 < 0.01) { ddx = hashNum(ns[i].id + j) - 0.5; ddy = hashNum(ns[j].id + i) - 0.5; d2 = ddx * ddx + ddy * ddy + 0.01; }
        const f = (k * k) / d2;
        dx[i] += ddx * f; dy[i] += ddy * f;
        dx[j] -= ddx * f; dy[j] -= ddy * f;
      }
    }
    for (const [a, b] of E) {
      const ddx = ns[a].x - ns[b].x;
      const ddy = ns[a].y - ns[b].y;
      const f = Math.sqrt(ddx * ddx + ddy * ddy) / k;
      dx[a] -= ddx * f; dy[a] -= ddy * f;
      dx[b] += ddx * f; dy[b] += ddy * f;
    }
    for (let i = 0; i < n; i++) {
      if (!movable[i]) continue;
      dx[i] -= ns[i].x * 0.06;
      dy[i] -= ns[i].y * 0.06;
      const len = Math.sqrt(dx[i] * dx[i] + dy[i] * dy[i]) || 1;
      const step = Math.min(len, temp);
      ns[i].x += (dx[i] / len) * step;
      ns[i].y += (dy[i] / len) * step;
    }
    temp = Math.max(1, temp * (full ? 0.985 : 0.965));
  }
  for (const v of ns) v.isNew = false;
}

function visibleSets() {
  let vis = new Set();
  for (const n of graph.nodes.values()) {
    if (graph.hiddenTypes.has(n.entry.type)) continue;
    if (graph.hideIsolated && n.degree === 0) continue;
    vis.add(n.id);
  }
  if (graph.focusHops && graph.selected) {
    const keep = new Set([graph.selected]);
    let frontier = [graph.selected];
    for (let h = 0; h < graph.focusHops; h++) {
      const next = [];
      for (const id of frontier) {
        for (const ed of graph.edges) {
          const other = ed.a === id ? ed.b : ed.b === id ? ed.a : null;
          if (other && !keep.has(other)) { keep.add(other); next.push(other); }
        }
      }
      frontier = next;
    }
    vis = new Set([...vis].filter((id) => keep.has(id)));
    vis.add(graph.selected);
  }
  return { vis, edges: graph.edges.filter((ed) => vis.has(ed.a) && vis.has(ed.b)) };
}
const nodeRadius = (n) => Math.min(18, 9 + Math.sqrt(n.degree) * 3);

function buildGraphDOM() {
  const { vis, edges } = visibleSets();
  graph.vis = vis;
  graph.visEdges = edges;
  const eG = $("#gEdges");
  const lG = $("#gLabels");
  const nG = $("#gNodes");
  eG.textContent = "";
  lG.textContent = "";
  nG.textContent = "";
  for (const ed of edges) {
    const line = document.createElementNS(SVG_NS, "line");
    line.setAttribute("class", "g-edge");
    eG.appendChild(line);
    ed.el = line;
    ed.labels = [];
    for (const from of [ed.a, ed.b]) {
      const names = ed.rels.filter((r) => r.from === from).map((r) => r.label);
      if (!names.length) continue;
      const t = document.createElementNS(SVG_NS, "text");
      t.setAttribute("class", "g-elabel");
      t.textContent = cut(names.join(", "), 10);
      lG.appendChild(t);
      ed.labels.push({ el: t, from });
    }
  }
  for (const n of graph.nodes.values()) n.el = null;
  for (const id of vis) {
    const n = graph.nodes.get(id);
    n.r = nodeRadius(n);
    const g = document.createElementNS(SVG_NS, "g");
    g.setAttribute("class", `g-node${statusOf(n.entry) === "draft" ? " draft" : ""}`);
    g.dataset.id = id;
    g.innerHTML = `<circle class="halo" r="${n.r + 5}"></circle><circle class="dot" r="${n.r}" style="fill:${typeColor(n.entry.type)}"></circle><text y="${n.r + 15}">${esc(cut(n.entry.name, 12))}</text>`;
    nG.appendChild(g);
    n.el = g;
  }
  updateGraphPositions();
  applyGraphHighlight();
  renderGraphChrome();
}
function updateGraphPositions() {
  for (const ed of graph.visEdges) {
    const A = graph.nodes.get(ed.a);
    const B = graph.nodes.get(ed.b);
    const ddx = B.x - A.x;
    const ddy = B.y - A.y;
    const d = Math.hypot(ddx, ddy) || 1;
    const ux = ddx / d;
    const uy = ddy / d;
    const fwd = ed.rels.some((r) => r.from === ed.a);
    const back = ed.rels.some((r) => r.from === ed.b);
    const sa = Math.min(d / 2, A.r + (back ? 6 : 3));
    const sb = Math.min(d / 2, B.r + (fwd ? 6 : 3));
    ed.el.setAttribute("x1", A.x + ux * sa);
    ed.el.setAttribute("y1", A.y + uy * sa);
    ed.el.setAttribute("x2", B.x - ux * sb);
    ed.el.setAttribute("y2", B.y - uy * sb);
    for (const lb of ed.labels) {
      // 한쪽 관계면 선 가운데, 양쪽이면 각 관계가 가리키는 쪽(대상)으로 조금 치우쳐 둔다.
      // 선 위에 겹치지 않도록 선과 수직 방향으로 살짝 띄운다.
      const t = ed.labels.length === 1 ? 0.5 : lb.from === ed.a ? 0.62 : 0.38;
      const side = ed.labels.length === 1 ? 1 : lb.from === ed.a ? 1 : -1;
      lb.el.setAttribute("x", A.x + ddx * t - uy * 9 * side);
      lb.el.setAttribute("y", A.y + ddy * t + ux * 9 * side + 4);
    }
  }
  for (const n of graph.nodes.values()) if (n.el) n.el.setAttribute("transform", `translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
}
function applyGraphHighlight() {
  const sel = graph.selected && graph.vis.has(graph.selected) ? graph.selected : null;
  const near = new Set();
  if (sel) {
    near.add(sel);
    for (const ed of graph.visEdges) { if (ed.a === sel) near.add(ed.b); if (ed.b === sel) near.add(ed.a); }
  }
  for (const n of graph.nodes.values()) {
    if (!n.el) continue;
    n.el.classList.toggle("sel", n.id === sel);
    n.el.classList.toggle("dim", !!sel && !near.has(n.id) && !graph.linkFrom);
    n.el.classList.toggle("link-src", n.id === graph.linkFrom);
  }
  for (const ed of graph.visEdges) {
    const hl = !!sel && (ed.a === sel || ed.b === sel);
    ed.el.classList.toggle("hl", hl);
    ed.el.classList.toggle("dim", !!sel && !hl);
    const marker = hl ? "url(#gArrowHl)" : "url(#gArrow)";
    if (ed.rels.some((r) => r.from === ed.a)) ed.el.setAttribute("marker-end", marker); else ed.el.removeAttribute("marker-end");
    if (ed.rels.some((r) => r.from === ed.b)) ed.el.setAttribute("marker-start", marker); else ed.el.removeAttribute("marker-start");
    for (const lb of ed.labels) lb.el.classList.toggle("show", hl || (!sel && graph.labelsAll));
  }
}
function applyGraphTransform() {
  const { tx, ty, s } = graph.view;
  $("#gViewport").setAttribute("transform", `translate(${tx.toFixed(1)},${ty.toFixed(1)}) scale(${s.toFixed(3)})`);
  const stage = $("#graphStage");
  stage.style.backgroundSize = `${22 * s}px ${22 * s}px`;
  stage.style.backgroundPosition = `${tx}px ${ty}px`;
  const all = s >= 1.35;
  if (all !== graph.labelsAll) { graph.labelsAll = all; applyGraphHighlight(); }
}
function stageInnerHeight() {
  const stage = $("#graphStage");
  const card = $("#graphCard");
  return stage.clientHeight - (card.hidden ? 0 : card.offsetHeight + 16);
}
function fitGraph() {
  const stage = $("#graphStage");
  const W = stage.clientWidth;
  const H = stageInnerHeight();
  if (!W || H <= 0) return;
  const list = [...graph.vis].map((id) => graph.nodes.get(id));
  if (!list.length) { graph.view = { tx: W / 2, ty: H / 2, s: 1 }; applyGraphTransform(); return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of list) { x0 = Math.min(x0, n.x - 60); x1 = Math.max(x1, n.x + 60); y0 = Math.min(y0, n.y - 30); y1 = Math.max(y1, n.y + 40); }
  const s = clamp(Math.min(W / (x1 - x0), (H - 56) / (y1 - y0)), 0.3, 1.5);
  graph.view = { s, tx: W / 2 - ((x0 + x1) / 2) * s, ty: 56 + (H - 56) / 2 - ((y0 + y1) / 2) * s };
  applyGraphTransform();
}
function centerOn(id) {
  const n = graph.nodes.get(id);
  if (!n) return;
  const stage = $("#graphStage");
  const s = Math.max(graph.view.s, 1);
  graph.view = { s, tx: stage.clientWidth / 2 - n.x * s, ty: Math.max(120, stageInnerHeight() / 2) - n.y * s };
  applyGraphTransform();
}
function zoomAt(cx, cy, factor) {
  const rect = $("#graphStage").getBoundingClientRect();
  const mx = cx - rect.left;
  const my = cy - rect.top;
  const { tx, ty, s } = graph.view;
  const ns = clamp(s * factor, 0.25, 3);
  const wx = (mx - tx) / s;
  const wy = (my - ty) / s;
  graph.view = { s: ns, tx: mx - wx * ns, ty: my - wy * ns };
  applyGraphTransform();
}

function renderGraphChrome() {
  // 종류 필터
  const counts = {};
  for (const n of graph.nodes.values()) counts[n.entry.type] = (counts[n.entry.type] || 0) + 1;
  const isolated = [...graph.nodes.values()].filter((n) => n.degree === 0).length;
  $("#graphTypes").innerHTML = typeKeys().filter((k) => counts[k]).map((k) => `<button class="type-chip" type="button" data-gtype="${k}" aria-pressed="${!graph.hiddenTypes.has(k)}"><span class="tdot" style="background:${typeColor(k)}"></span>${esc(typeInfo(k).label)}<span class="n">${counts[k]}</span></button>`).join("")
    + (isolated ? `<button class="type-chip isolated" type="button" data-gtype="__isolated" aria-pressed="${!graph.hideIsolated}">연결 없는 항목<span class="n">${isolated}</span></button>` : "");

  // 빈 화면 안내
  const empty = $("#graphEmpty");
  const w = currentWorld();
  if (!w) { empty.hidden = false; empty.innerHTML = "<div><strong>세계관이 없습니다</strong>대화 탭에서 새 세계관을 만들어 보세요.</div>"; }
  else if (!graph.nodes.size) { empty.hidden = false; empty.innerHTML = "<div><strong>설정집이 비어 있습니다</strong>항목이 생기면 여기에 관계도가 그려집니다.</div>"; }
  else if (!graph.vis.size) { empty.hidden = false; empty.innerHTML = "<div><strong>보이는 항목이 없습니다</strong>위의 종류 필터를 켜 보세요.</div>"; }
  else empty.hidden = true;

  // 상단 안내(관계 잇기 / 주변만 보기 / 관계 없음)
  const hint = $("#graphHint");
  const sel = graph.selected ? graph.nodes.get(graph.selected) : null;
  if (graph.linkFrom) {
    const from = graph.nodes.get(graph.linkFrom);
    hint.hidden = false;
    hint.innerHTML = `<span><b>${esc(from.entry.name)}</b>와(과) 이을 항목을 누르세요</span><button class="btn btn-small" type="button" data-g="cancel-link">취소</button>`;
  } else if (graph.focusHops && sel) {
    hint.hidden = false;
    hint.innerHTML = `<span><b>${esc(sel.entry.name)}</b> 주변 ${graph.focusHops}단계만 보는 중</span><button class="btn btn-small" type="button" data-g="hops">${graph.focusHops === 1 ? "2단계까지" : "1단계만"}</button><button class="btn btn-small" type="button" data-g="unfocus">전체 보기</button>`;
  } else if (graph.nodes.size && !graph.edges.length) {
    hint.hidden = false;
    hint.innerHTML = "<span>아직 관계가 없습니다. 항목을 누르고 '관계 잇기'를 쓰거나, 대화에서 관계를 정해 달라고 해 보세요.</span>";
  } else hint.hidden = true;

  // 선택 카드
  const card = $("#graphCard");
  if (sel && graph.vis.has(sel.id) && !graph.linkFrom) {
    const e = sel.entry;
    card.hidden = false;
    card.innerHTML = `<div class="entry-head" style="--tc:${typeColor(e.type)}"><span class="catno">${e.id}</span><span>${esc(typeInfo(e.type).label)}</span><span class="pill">연결 ${sel.degree}</span></div>
      <strong class="gc-name">${esc(e.name)}</strong>
      <p class="gc-sum">${esc(e.summary || "요약 없음")}</p>
      <div class="row">
        <button class="btn btn-small btn-primary" type="button" data-g="open">자세히</button>
        <button class="btn btn-small" type="button" data-g="link">관계 잇기</button>
        <button class="btn btn-small" type="button" data-g="focus">${graph.focusHops ? "전체 보기" : "주변만 보기"}</button>
        <button class="btn btn-small" type="button" data-g="chat">대화로</button>
      </div>`;
  } else card.hidden = true;
}

let graphQueued = false;
function queueGraphRender() {
  if (graphQueued) return;
  graphQueued = true;
  requestAnimationFrame(() => { graphQueued = false; renderCurrentGraphMode(); });
}
async function renderGraph() {
  if (state.view !== "graph" || state.gmode !== "graph") return;
  await loadGraphPositions();
  const hadLayout = graph.nodes.size > 0 || Object.keys(graph.pos).length > 0;
  buildGraphModel();
  runLayout(!hadLayout);
  buildGraphDOM();
  if (graph.pendingSelect && graph.nodes.has(graph.pendingSelect)) {
    graph.selected = graph.pendingSelect;
    graph.hiddenTypes.delete(graph.nodes.get(graph.pendingSelect).entry.type);
    graph.pendingSelect = null;
    buildGraphDOM();

// 끌어서 이동, 두 손가락·휠로 확대. 누르기(움직이지 않고 뗀 것)는 onTap으로 넘긴다.
function makePanZoom(stage, apply, { min = 0.2, max = 4, onTap } = {}) {
  const v = { k: 1, x: 0, y: 0 };

  let downTarget = null;

    const wy = (cy - r.top - v.y) / v.k;
    set({ k, x: cx - r.left - wx * k, y: cy - r.top - wy * k });
  };

    if (e.target.closest(".zoom-ctrl, .graph-card, .graph-hint, .graph-empty.interactive > *")) return;

    stage.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

      return;
    }

    downTarget = e.target;
    start = { x: e.clientX, y: e.clientY, v: { ...v } };
  });
  stage.addEventListener("pointermove", (e) => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && ptrs.size >= 2) {
      const r = stage.getBoundingClientRect();
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const k = clamp(pinch.v.k * (d / pinch.d), min, max);
      const wx = (pinch.mid.x - r.left - pinch.v.x) / pinch.v.k;
      const wy = (pinch.mid.y - r.top - pinch.v.y) / pinch.v.k;
      set({ k, x: mid.x - r.left - wx * k, y: mid.y - r.top - wy * k });
      return;
    }
    if (!start) return;
    const dx = e.clientX - start.x;

    }

      const r = stage.getBoundingClientRect();

    }

  };

  // 키보드로 누른 단추(포인터 없이 생긴 click)도 누르기로 처리한다
  stage.addEventListener("click", (e) => { if (e.detail === 0 && onTap && !e.target.closest(".zoom-ctrl, .graph-card, .graph-hint, .graph-empty")) onTap({ target: e.target, wx: NaN, wy: NaN }); });
  stage.querySelector(".zoom-ctrl")?.addEventListener("click", (e) => {
    const b = e.target.closest("[data-pz]");
    if (!b) return;
    if (b.dataset.pz === "fit") api.onFit?.();
    else api.zoomBy(b.dataset.pz === "in" ? 1.3 : 1 / 1.3);
  });
  const api = {
    v,
    set,
    zoomBy(f) { const r = stage.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, f); },
    fit(b, pad = 24, maxK = 1.5) {
      const r = stage.getBoundingClientRect();
      if (!r.width || !r.height || !b.w || !b.h) return false;
      const k = clamp(Math.min((r.width - pad * 2) / b.w, (r.height - pad * 2) / b.h, maxK), min, max);
      set({ k, x: (r.width - b.w * k) / 2 - b.x * k, y: (r.height - b.h * k) / 2 - b.y * k });

    },
    center(wx, wy, k = v.k) { const r = stage.getBoundingClientRect(); set({ k, x: r.width / 2 - wx * k, y: r.height / 2 - wy * k }); },
    onFit: null,
  };
  return api;
}

const treeRoleOf = (label) => currentWorld()?.treeRoles?.[label] || guessTreeRole(label);
function treeEdges() {
  const live = liveEntries();

  const seen = new Set();
  for (const a of live) for (const r of a.relations || []) {
    if (!ids.has(r.to) || r.to === a.id) continue;
    const role = treeRoleOf(r.label);
    if (role === "up" || role === "down") {
      const pe = role === "up" ? { p: r.to, c: a.id, label: r.label } : { p: a.id, c: r.to, label: r.label };
      const k = `${pe.p}>${pe.c}`;

const TREE_W = 132;

function layoutTree(ids, edges, rootId) {
  const set = new Set(ids);
  const pe = edges.parentEdges.filter((e) => set.has(e.p) && set.has(e.c));
  const pr = edges.peerEdges.filter((e) => set.has(e.a) && set.has(e.b));
  const parents = new Map(ids.map((id) => [id, []]));
  const children = new Map(ids.map((id) => [id, []]));
  const peers = new Map(ids.map((id) => [id, []]));
  for (const e of pe) { parents.get(e.c).push(e.p); children.get(e.p).push(e.c); }
  for (const e of pr) { peers.get(e.a).push(e.b); peers.get(e.b).push(e.a); }
  // 세대(층): 자식은 부모보다 아래, 같은 줄은 같은 층, 부모 없는 이는 자식 바로 위로 내린다. 값은 늘기만 해서 끝난다.
  const N = ids.length + 1;

  for (let it = 0; it < N * 3; it++) {
    let changed = false;
    for (const e of pe) if (level.get(e.c) < level.get(e.p) + 1 && level.get(e.p) + 1 <= N) { level.set(e.c, level.get(e.p) + 1); changed = true; }
    for (const e of pr) { const m = Math.max(level.get(e.a), level.get(e.b)); if (level.get(e.a) !== m || level.get(e.b) !== m) { level.set(e.a, m); level.set(e.b, m); changed = true; } }
    for (const id of ids) {
      if (parents.get(id).length || !children.get(id).length) continue;
      const want = Math.min(...children.get(id).map((c) => level.get(c))) - 1;
      if (want > level.get(id)) { level.set(id, want); changed = true; }
    }

  const order = new Map();
  const q = [rootId && set.has(rootId) ? rootId : ids[0]];
  const seen = new Set(q);
  while (q.length) {
    const x = q.shift();
    order.set(x, order.size);
    const next = [...peers.get(x), ...children.get(x), ...parents.get(x)].sort((a, b) => nameOf(a).localeCompare(nameOf(b), "ko"));
    for (const y of next) if (!seen.has(y)) { seen.add(y); q.push(y); }

    const out = [];

      for (const p of peers.get(id)) if (!placed.has(p) && row.includes(p)) { out.push(p); placed.add(p); }

  const bary = (id, nbr) => { const xs = nbr.get(id).filter((n) => pos.has(n)).map((n) => pos.get(n)); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : pos.get(id); };

    for (let L = maxL - 1; L >= 0; L--) { rows[L] = keepPeersTogether(rows[L].slice().sort((a, b) => bary(a, children) - bary(b, children))); index(); }

  const X = new Map();

  const step = TREE_W + TREE_GAP;

function compareRows(list) {
  const cal = worldCalendar();
  const rows = [];
  const add = (group, label, get) => { const vals = list.map((e) => String(get(e) ?? "").trim()); if (vals.some(Boolean)) rows.push({ group, label, vals }); };
  add("기본", "요약", (e) => e.summary);
  add("기본", "상태", (e) => STATUS[statusOf(e)]);
  add("기본", "생몰", (e) => (e.when ? rangeText(e.when, cal) : ""));
  if (cal.now != null) add("기본", "지금 나이", (e) => (e.when && e.when.start <= cal.now && (e.when.end == null || cal.now <= e.when.end) ? `${Math.trunc(cal.now - e.when.start)}세` : e.when?.end != null && cal.now > e.when.end ? "사망" : ""));
  const fieldKeys = [...new Set(list.flatMap((e) => Object.keys(e.fields || {})))];
  for (const k of fieldKeys) add("속성", k, (e) => (isBlankValue(e.fields?.[k] || "") ? "" : e.fields?.[k]));
  for (const [k, l] of INNER_KEYS) add("내면", l, (e) => e.inner?.[k]);
  add("말투", "어조·말씨", (e) => e.voice?.tone);
  add("말투", "말버릇", (e) => e.voice?.habits);
  const lookKeys = [...new Set([...LOOK_KEYS, ...list.flatMap((e) => Object.keys(e.looks || {}))])];
  for (const k of lookKeys) add("외모", k, (e) => e.looks?.[k]);
  add("능력", "능력", (e) => (e.abilities || []).map((a) => a.name).join(", "));
  add("이야기", "성장 곡선", (e) => (e.arc?.length ? `${e.arc.length}단계 · ${e.arc.map((x) => x.label || "단계").join(" → ")}` : ""));
  add("이야기", "관계", (e) => `${(e.relations || []).length + incoming(e.id).length}개`);
  const others = list.map((e) => list.filter((x) => x !== e && e.address?.[x.id]).map((x) => `${x.name}: “${e.address[x.id].call || "?"}”${e.address[x.id].speech ? ` ${e.address[x.id].speech}` : ""}`).join(", "));
  if (others.some(Boolean)) rows.push({ group: "말투", label: "서로 부르는 말", vals: others });
  return rows;
}

/* ---- 등장 비중 · 잊힌 인물 ---- */
async function presenceStats() {
  const chars = liveEntries().filter((e) => isCharacterType(e.type));
  const keysOf = (e) => [e.id, e.name, ...(e.aliases || [])].filter((k) => k && k.length >= 2);
  const count = (text, keys) => keys.reduce((n, k) => n + (text.split(k).length - 1), 0);
  const stat = new Map(chars.map((e) => [e.id, { e, ms: 0, chat: 0, last: 0 }]));
  for (const m of state.manuscripts) {
    const text = `${m.title}\n${m.body}`;
    for (const st of stat.values()) {
      const n = count(text, keysOf(st.e)) + ((m.refs || []).includes(st.e.id) ? 1 : 0);
      if (n) { st.ms += n; st.last = Math.max(st.last, m.updatedAt || 0); }
    }
  }
  for (const t of state.threads) {
    const conv = t.id === state.threadId ? state.conv : await idb.get("conv:" + t.id);
    for (const item of conv?.display || []) {
      const text = item.role === "user" ? item.text || "" : (item.parts || []).filter((p) => p.kind === "text").map((p) => p.text).join("\n");
      if (!text) continue;
      for (const st of stat.values()) {
        const n = count(text, keysOf(st.e));
        if (n) { st.chat += n; st.last = Math.max(st.last, item.at || t.updatedAt || 0); }
      }
    }
  }
  for (const st of stat.values()) {
    const e = st.e;
    st.depth = INNER_KEYS.filter(([k]) => e.inner?.[k]).length + (hasKeys(e.voice) ? 1 : 0) + (hasKeys(e.looks) ? 1 : 0) + Math.min(2, e.arc?.length || 0) + Math.min(2, e.abilities?.length || 0)
      + Math.min(3, Object.values(e.fields || {}).filter((v) => !isBlankValue(v)).length) + (String(e.body || "").length > 200 ? 2 : String(e.body || "").length > 0 ? 1 : 0);
    st.total = st.ms + st.chat;
  }
  return [...stat.values()].sort((a, b) => b.total - a.total || a.e.id.localeCompare(b.e.id));
}

async function onMapTap({ target, wx, wy }) {
  const m = currentMap();
  if (!m) return;
  const pin = target?.closest?.(".map-pin");
  const inside = wx >= 0 && wy >= 0 && wx <= m.w && wy <= m.h;
  if (state.mapMode?.type === "move" || state.mapMode?.type === "add") {
    if (!inside) return;
    const x = clamp(wx / m.w, 0, 1);
    const y = clamp(wy / m.h, 0, 1);
    const mode = state.mapMode;
    state.mapMode = null;
    if (mode.type === "move") {
      const p = m.pins.find((q) => q.ref === mode.ref);
      if (p) { p.x = x; p.y = y; }
      await saveMaps(m);
      state.mapSel = mode.ref;
      renderMap();
      toast("옮겼습니다");
    } else { renderMap(); openPinPicker(m, x, y); }
    return;
  }
  if (state.mapMode?.type === "region") {
    if (!inside || !Number.isFinite(wx)) return;
    state.mapMode.points.push([clamp(wx / m.w, 0, 1), clamp(wy / m.h, 0, 1)]);
    renderMapOverlay(m);
    renderMapChrome(m);
    return;
  }
  if (pin) { state.mapSel = pin.dataset.pin; state.mapRegionSel = null; renderPins(m); renderMapOverlay(m); renderMapChrome(m); return; }
  const hit = inside ? (m.regions || []).filter(regionVisible).reverse().find((r) => pointInPoly(wx / m.w, wy / m.h, r.points)) : null;
  if (hit) { state.mapSel = null; state.mapRegionSel = hit.id; renderPins(m); renderMapOverlay(m); renderMapChrome(m); return; }
  if (state.mapSel || state.mapRegionSel) { state.mapSel = null; state.mapRegionSel = null; renderPins(m); renderMapOverlay(m); renderMapChrome(m); }
}

async function onMapFile(file) {

  try { loaded = await loadImage(file); } catch (err) { toast(err.message); return; }
  const { img, url } = loaded;
  try {
    const data = await blobToDataURL(await drawScaled(img, MAP_EDGE, "image/jpeg", 0.85));
    const scale = Math.min(1, MAP_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const imgId = uid();
    await idb.set("mapimg:" + imgId, data);
    state.mapImgs[imgId] = data;
    const target = state.maps.find((x) => x.id === mapView.replaceId);

      Object.assign(target, { img: imgId, w, h });

      state.mapId = target.id;
    } else {
      const m = { id: uid(), name: state.maps.length ? `지도 ${state.maps.length + 1}` : "세계 지도", img: imgId, w, h, pins: [] };
      state.maps.push(m);

    await saveMaps(currentMap());
    mapView.fitKey = "";
    renderMap();
    toast(target ? "지도 그림을 바꿨습니다(핀은 그대로)" : "지도를 올렸습니다");

    toast(err.message || "지도를 올리지 못했습니다");

}

function bindGraph() {
  const view = $("#view-graph");
  const stage = $("#graphStage");
  const gp = { pointers: new Map(), mode: null, node: null, moved: false, start: null, nodeStart: null, pinch: null };
  let frame = 0;
  const scheduleFrame = () => { if (!frame) frame = requestAnimationFrame(() => { frame = 0; updateGraphPositions(); }); };

  stage.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".graph-card, .graph-hint, .zoom-ctrl")) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    stage.setPointerCapture(e.pointerId);
    gp.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gp.pointers.size === 2) {
      const [p1, p2] = [...gp.pointers.values()];
      gp.mode = "pinch";
      gp.node = null;

      gp.pinch = { d: Math.hypot(p1.x - p2.x, p1.y - p2.y) || 1, mid: { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }, view: { ...graph.view } };
      return;
    }
    gp.moved = false;
    gp.start = { x: e.clientX, y: e.clientY, view: { ...graph.view } };
    const nodeEl = e.target.closest(".g-node");
    if (nodeEl) {
      gp.mode = "node";
      gp.node = graph.nodes.get(nodeEl.dataset.id);
      gp.nodeStart = { x: gp.node.x, y: gp.node.y };
    } else gp.mode = "pan";
  });
  stage.addEventListener("pointermove", (e) => {
    if (!gp.pointers.has(e.pointerId)) return;
    gp.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gp.mode === "pinch" && gp.pointers.size >= 2) {
      const [p1, p2] = [...gp.pointers.values()];
      const d = Math.hypot(p1.x - p2.x, p1.y - p2.y) || 1;
      const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      const rect = stage.getBoundingClientRect();
      const v0 = gp.pinch.view;
      const s = clamp(v0.s * (d / gp.pinch.d), 0.25, 3);
      const wx = (gp.pinch.mid.x - rect.left - v0.tx) / v0.s;
      const wy = (gp.pinch.mid.y - rect.top - v0.ty) / v0.s;
      graph.view = { s, tx: mid.x - rect.left - wx * s, ty: mid.y - rect.top - wy * s };
      applyGraphTransform();
      return;
    }
    if (!gp.start) return;
    const dx = e.clientX - gp.start.x;
    const dy = e.clientY - gp.start.y;
    if (!gp.moved && Math.hypot(dx, dy) < 6) return;
    gp.moved = true;
    if (gp.mode === "node" && gp.node) {
      gp.node.x = gp.nodeStart.x + dx / graph.view.s;
      gp.node.y = gp.nodeStart.y + dy / graph.view.s;
      gp.node.pinned = true;
      scheduleFrame();
    } else if (gp.mode === "pan") {
      graph.view = { ...gp.start.view, tx: gp.start.view.tx + dx, ty: gp.start.view.ty + dy };
      applyGraphTransform();
    }
  });
  const endPointer = (e) => {
    if (!gp.pointers.has(e.pointerId)) return;
    gp.pointers.delete(e.pointerId);
    if (gp.mode === "pinch") {
      if (gp.pointers.size === 1) {
        const p = [...gp.pointers.values()][0];
        gp.mode = "pan";
        gp.start = { x: p.x, y: p.y, view: { ...graph.view } };
      } else if (!gp.pointers.size) gp.mode = null;
      return;
    }
    if (gp.pointers.size) return;
    if (e.type !== "pointercancel") {
      if (!gp.moved && gp.mode === "node" && gp.node) onGraphNodeTap(gp.node.id);
      else if (!gp.moved && gp.mode === "pan") onGraphBackgroundTap();
      else if (gp.moved && gp.mode === "node") saveGraphPositions();
    }
    gp.mode = null;
    gp.node = null;
    gp.start = null;
  };
  stage.addEventListener("pointerup", endPointer);
  stage.addEventListener("pointercancel", endPointer);
  stage.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });

  view.addEventListener("click", async (e) => {
    const chip = e.target.closest("[data-gtype]");
    if (chip) {
      const t = chip.dataset.gtype;
      if (t === "__isolated") graph.hideIsolated = !graph.hideIsolated;
      else if (graph.hiddenTypes.has(t)) graph.hiddenTypes.delete(t);
      else graph.hiddenTypes.add(t);
      buildGraphDOM();
      return;
    }
    const g = e.target.closest("[data-g]")?.dataset.g;
    if (!g) return;
    const rect = stage.getBoundingClientRect();
    if (g === "fit") fitGraph();
    else if (g === "zoom-in") zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.3);
    else if (g === "zoom-out") zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1 / 1.3);
    else if (g === "relayout") {
      if (!graph.nodes.size) return;
      if (!(await confirmBox("모든 항목의 자리를 다시 잡을까요? 직접 옮겨 둔 위치도 처음부터 다시 배치됩니다.", "다시 배치"))) return;
      for (const n of graph.nodes.values()) { n.x = null; n.y = null; n.pinned = false; }
      graph.pos = {};
      buildGraphModel();
      runLayout(true);
      buildGraphDOM();
      fitGraph();
      saveGraphPositions();
    } else if (g === "open" && graph.selected) openEntry(graph.selected);
    else if (g === "link" && graph.selected) {
      if (state.busy) { toast("Claude가 작업 중입니다. 끝난 뒤에 이어 주세요"); return; }
      graph.linkFrom = graph.selected;
      applyGraphHighlight();
      renderGraphChrome();
      fitGraph(); // 이을 대상이 화면 밖에 있지 않도록 전체를 보여 준다
    } else if (g === "cancel-link") { graph.linkFrom = null; applyGraphHighlight(); renderGraphChrome(); }
    else if (g === "focus" && graph.selected) {
      graph.focusHops = graph.focusHops ? 0 : 1;
      buildGraphDOM();
      if (graph.focusHops) fitGraph(); else centerOn(graph.selected);
    } else if (g === "hops") { graph.focusHops = graph.focusHops === 1 ? 2 : 1; buildGraphDOM(); fitGraph(); }
    else if (g === "unfocus") { graph.focusHops = 0; buildGraphDOM(); centerOn(graph.selected); }
    else if (g === "chat" && graph.selected) {
      const ent = findEntry(graph.selected);
      switchView("chat");
      fillInput(`${ent.name}(${ent.id})의 인간관계와 연결을 더 만들어 줘. `);
    }
  });

  let searchTimer = 0;
  $("#graphSearch").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim().toLowerCase();
    searchTimer = setTimeout(() => {
      if (!q) return;
      const terms = q.split(/\s+/);
      const best = [...graph.nodes.values()].map((n) => ({ n, s: scoreEntry(n.entry, terms) })).filter((x) => x.s > 0).sort((a, b) => b.s - a.s)[0];
      if (!best) return;
      graph.linkFrom = null;
      graph.focusHops = 0;
      graph.hiddenTypes.delete(best.n.entry.type);
      if (graph.hideIsolated && best.n.degree === 0) graph.hideIsolated = false;
      graph.selected = best.n.id;
      buildGraphDOM();
      centerOn(best.n.id);
    }, 250);
  });
}
function onGraphNodeTap(id) {
  if (graph.linkFrom) {
    if (id === graph.linkFrom) { graph.linkFrom = null; applyGraphHighlight(); renderGraphChrome(); return; }
    openLinkForm(graph.linkFrom, id);
    return;
  }
  selectGraphNode(id);
}
function onGraphBackgroundTap() {
  if (graph.linkFrom || graph.focusHops) return;
  if (!graph.selected) return;
  graph.selected = null;
  applyGraphHighlight();
  renderGraphChrome();
}

function templateItem(fileName, text) {
  const { meta, body } = splitFrontmatter(text);
  const base = String(fileName || "").replace(/\.(md|markdown|txt)$/i, "").trim();
  return {
    fileName,
    label: meta["분류"] || meta["이름"] || meta.name || meta.label || base,
    code: String(meta["코드"] || meta.code || "").toUpperCase(),
    desc: meta["설명"] || meta.description || meta.desc || "",
    base: meta["기존분류"] || meta.base || "",
    template: body,
  };
}
async function readTemplateFiles(files) {
  const items = [];
  for (const f of [...files].slice(0, 30)) {
    try {
      const { data } = await prepareText(f);
      items.push(templateItem(f.name, data));
    } catch (err) { toast(`${f.name}: ${err?.message || err}`); }
  }
  return items;
}
function entryCountByType() {
  const counts = {};
  for (const e of state.entries) counts[e.type] = (counts[e.type] || 0) + 1;
  return counts;
}
async function commitTypes(newTypes, note) {
  const w = currentWorld();
  w.types = newTypes;
  w.updatedAt = Date.now();
  logChange("user", "types", null, note);
  await Promise.all([persist.worlds(), persist.log()]);
  renderCodex();
}

  const hi = Math.max(...known);
  const pad = Math.max(1, Math.round((hi - lo) * 0.03));
  const y0 = lo - pad;
  const y1 = hi + pad;
  const openEnd = (e) => e.when.end ?? Math.max(e.when.start, cal.now ?? hi);
  const avail = Math.max(280, (root.clientWidth || 360) - 34);
  const ppy = (avail / (y1 - y0)) * state.lifeZoom;
  const W = Math.round((y1 - y0) * ppy);
  const X = (yr) => (yr - y0) * ppy;
  const AXIS = 28;
  const EVL = events.length ? 24 : 0;
  const ROW = 30;
  const TOP = AXIS + EVL + 4;
  const H = TOP + rows.length * ROW + 8;
  const year = state.lifeYear ?? cal.now;
  const alive = (e) => year != null && e.when.start <= year && year <= openEnd(e);
  let svg = "";
  // 시대 띠
  cal.eras.slice().sort((a, b) => a.start - b.start).forEach((era, i) => {
    const a = Math.max(era.start, y0);
    const b = Math.min(Number.isFinite(era.end) ? era.end : y1, y1);
    if (b <= a) return;
    svg += `<rect class="life-era${i % 2 ? " alt" : ""}" x="${X(a)}" y="0" width="${X(b) - X(a)}" height="${H}"/><text class="life-era-t" x="${X(a) + 4}" y="${H - 6}">${esc(cut(era.name, 12))}</text>`;
  });
  // 눈금
  const step = niceStep(64 / ppy);
  for (let t = Math.ceil(y0 / step) * step; t <= y1; t += step) svg += `<line class="life-tick" x1="${X(t)}" x2="${X(t)}" y1="${AXIS - 6}" y2="${H}"/><text class="life-tick-t" x="${X(t)}" y="${AXIS - 10}">${fmtYearNum(t)}</text>`;
  if (cal.now != null) svg += `<line class="life-now" x1="${X(cal.now)}" x2="${X(cal.now)}" y1="${AXIS - 6}" y2="${H}"/>`;
  // 사건
  for (const e of events) {
    const x = X(e.when.start);
    const cy = AXIS + 11;
    svg += e.when.end != null
      ? `<rect class="life-ev span" data-ref="${e.id}" x="${x}" y="${cy - 4}" width="${Math.max(4, X(e.when.end) - x)}" height="8" rx="4"><title>${esc(e.name)} · ${esc(rangeText(e.when, cal))}</title></rect>`
      : `<path class="life-ev" data-ref="${e.id}" d="M${x},${cy - 6} L${x + 6},${cy} L${x},${cy + 6} L${x - 6},${cy} Z"><title>${esc(e.name)} · ${esc(rangeText(e.when, cal))}</title></path>`;
  }
  // 생애 막대
  rows.forEach((e, i) => {
    const y = TOP + i * ROW;
    const x1 = X(e.when.start);
    const w = Math.max(4, X(openEnd(e)) - x1);
    const tw = e.name.length * 12.5 + 14;
    const inside = w > tw;
    const dim = year != null && !alive(e);
    svg += `<g class="life-row${dim ? " dim" : ""}${e.when.end == null ? " open" : ""}" style="--tc:${typeColor(e.type)}">
      <rect class="life-bar" x="${x1}" y="${y + 5}" width="${w}" height="20" rx="10"${e.when.end == null ? ' mask="url(#lifeFade)"' : ""}/>
      <text class="life-name${inside ? " in" : ""}" x="${inside ? x1 + 9 : x1 + w + 5}" y="${y + 19.5}">${esc(e.name)}</text></g>`;
  });
  if (year != null) svg += `<line class="life-cursor" x1="${X(year)}" x2="${X(year)}" y1="${AXIS - 6}" y2="${H}"/>`;
  const era = year != null && cal.eras.length ? eraOf(year, cal) : null;
  const aliveRows = year != null ? rows.filter(alive) : [];
  const yearEvents = year != null ? events.filter((e) => e.when.start <= year && year <= (e.when.end ?? e.when.start)) : [];
  const panel = year == null
    ? `<p class="meta life-hint">막대 위를 누르면 그해에 살아 있던 인물과 나이를 보여 줍니다.</p>`
    : `<div class="life-panel">
        <div class="life-year"><strong>${esc(fmtYear(year, cal))}</strong>${era ? `<span class="meta">${esc(era.name)}</span>` : ""}${year === cal.now ? `<span class="pill">지금</span>` : ""}<span class="sp"></span><button class="btn btn-ghost btn-small" type="button" data-life="prev" aria-label="한 해 앞">◀</button><button class="btn btn-ghost btn-small" type="button" data-life="next" aria-label="한 해 뒤">▶</button></div>
        <p class="meta" style="margin:6px 0">살아 있는 ${state.lifeAll ? "인물·세력" : "인물"} ${aliveRows.length}</p>
        <div class="life-chips">${aliveRows.map((e) => `<button class="life-chip" type="button" data-ref="${e.id}" style="--tc:${typeColor(e.type)}"><b>${esc(e.name)}</b> ${esc(lifeAgeText(e, year))}</button>`).join("") || `<span class="meta">없음</span>`}</div>
        ${yearEvents.length ? `<p class="meta" style="margin:8px 0 6px">이 해의 사건</p><div class="life-chips">${yearEvents.map((e) => `<button class="life-chip ev" type="button" data-ref="${e.id}"><b>${esc(e.name)}</b></button>`).join("")}</div>` : ""}
      </div>`;
  root.innerHTML = `${tabs}${controls}
    <div class="life-scroll"><svg class="life-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" data-y0="${y0}" data-ppy="${ppy}" role="img" aria-label="인물 생애 막대">
      <defs><linearGradient id="lifeFadeG" x1="0" x2="1" y1="0" y2="0"><stop offset="0.75" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0.15"/></linearGradient><mask id="lifeFade" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#lifeFadeG)"/></mask></defs>
      ${svg}</svg></div>
    ${panel}${missing}`;
  const sc = $(".life-scroll", root);
  if (state.lifeRecenter && year != null) { sc.scrollLeft = X(year) - sc.clientWidth / 2; state.lifeRecenter = false; }
  else if (prevScroll != null) sc.scrollLeft = prevScroll;
}

function bindTimeline() {
  $("#view-timeline").addEventListener("click", (e) => {
    const mode = e.target.closest("[data-tlmode]");
    if (mode) { state.tlMode = mode.dataset.tlmode; LS.set("lk.tlmode", state.tlMode); state.lifeRecenter = true; renderTimeline(); return; }
    const lifeAct = e.target.closest("[data-life]")?.dataset.life;
    if (lifeAct) {
      const cal = worldCalendar();
      const cur = state.lifeYear ?? cal.now;
      if (lifeAct === "all") state.lifeAll = !state.lifeAll;
      else if (lifeAct === "in") { state.lifeZoom = Math.min(40, state.lifeZoom * 1.6); state.lifeRecenter = true; }
      else if (lifeAct === "out") { state.lifeZoom = Math.max(1, state.lifeZoom / 1.6); state.lifeRecenter = true; }
      else if ((lifeAct === "prev" || lifeAct === "next") && cur != null) state.lifeYear = cur + (lifeAct === "next" ? 1 : -1);
      renderTimeline();
      return;
    }
    const lifeRef = e.target.closest(".life-panel [data-ref], .life-svg [data-ref]");
    if (lifeRef) { openEntry(lifeRef.dataset.ref); return; }
    const lifeSvg = e.target.closest(".life-svg");
    if (lifeSvg) {
      const r = lifeSvg.getBoundingClientRect();
      state.lifeYear = Math.round(Number(lifeSvg.dataset.y0) + (e.clientX - r.left) / Number(lifeSvg.dataset.ppy));
      renderTimeline();
      return;
    }
    const chip = e.target.closest("[data-tlt]");
    if (chip) {
      const k = chip.dataset.tlt;
      if (state.tlHidden.has(k)) state.tlHidden.delete(k); else state.tlHidden.add(k);
      renderTimelineResults();
      return;
    }
    const set = e.target.closest("[data-tl-set]");
    if (set) {
      if (state.busy) { toast("Claude가 작업 중입니다. 끝난 뒤에 고쳐 주세요"); return; }
      const ent = findEntry(set.dataset.tlSet);
      if (ent) openEditor(ent, null, { focusTime: true });
      return;
    }
    const act = e.target.closest("[data-tl]")?.dataset.tl;
    if (act === "calendar") openCalendarSheet();
    else if (act === "new") {
      if (state.busy) { toast("Claude가 작업 중입니다"); return; }
      openEditor(null, eventTypeKey(), { focusTime: true });
    } else if (act === "ask") {
      switchView("chat");
      fillInput("시점이 없는 사건들의 시점을 정해서 연표에 올려 줘. 앞뒤 순서와 인물 나이가 맞는지도 확인해 줘. ");
    }
  });
}

function applyTheme() {
  const root = document.documentElement;
  if (settings.theme === "light" || settings.theme === "dark") root.setAttribute("data-theme", settings.theme);
  else root.removeAttribute("data-theme");

  btn.setAttribute("aria-label", dark ? "라이트 모드로 바꾸기" : "다크 모드로 바꾸기");

  for (const m of $$('meta[name="theme-color"]')) {
    if (m.dataset.origContent === undefined) { m.dataset.origContent = m.getAttribute("content") || ""; m.dataset.origMedia = m.getAttribute("media") || ""; }
    if (settings.theme === "light" || settings.theme === "dark") { m.setAttribute("content", bg); m.removeAttribute("media"); }
    else { m.setAttribute("content", m.dataset.origContent); if (m.dataset.origMedia) m.setAttribute("media", m.dataset.origMedia); }
  }
}

/* ============================================================
   12-5. GitHub 동기화
   비공개 저장소의 lorekeeper/ 폴더에 데이터를 나눠 저장하고, 기기끼리 합친다.
   - lorekeeper/index.json   : 세계관 목록과 삭제 기록(tombstones)
   - lorekeeper/w/<세계관>.json : 항목, 변경 기록, 대화 목록, 관계도 위치
   - lorekeeper/c/<대화>.json  : 대화 기록
   - lorekeeper/i/<세계관>.json : 항목 그림(있을 때만)
   - lorekeeper/m/<그림>.json  : 지도 그림(지도 정보와 핀은 세계관 파일에)
   한 번 동기화할 때 바뀐 파일만 모아 커밋 하나로 올리고, 그 사이 다른 기기가
   먼저 올렸으면(fast-forward 실패) 다시 받아 합친 뒤 올린다.
   ============================================================ */
const SYNC_DIR = "lorekeeper";
const SYNC_KEY_RE = /^(worlds$|entries:|log:|threads:|graph:|conv:|ms:|imgs:|maps:|mapimg:|sync:tombstones$)/;
const syncCfg = Object.assign(
  { enabled: false, repo: "", token: "", device: "", auto: true, lastSyncAt: 0, lastCommit: "", shas: {}, lastError: "" },
  LS.get("lk.sync", {}),
);
const saveSyncCfg = () => LS.set("lk.sync", syncCfg);
const syncState = { running: false, queued: false, timer: 0, applying: false, poller: 0 };
const textEnc = new TextEncoder();

function defaultDeviceName() {
  const ua = navigator.userAgent || "";
  if (/iPhone/.test(ua)) return "아이폰";
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "아이패드";
  if (/Android/.test(ua)) return /Mobile/.test(ua) ? "안드로이드 폰" : "안드로이드 태블릿";
  if (/Macintosh/.test(ua)) return "맥";
  if (/Windows/.test(ua)) return "윈도우 PC";
  return "브라우저";
}
// 로컬 데이터가 바뀌면 잠시 뒤 동기화한다(idb.set/del에서 부른다).
function noteLocalChange(key) {
  if (!syncCfg.enabled || syncState.applying || !SYNC_KEY_RE.test(key)) return;
  scheduleSync(15000);
}
async function addTombstone(kind, key) {
  const tomb = (await idb.get("sync:tombstones")) || { worlds: {}, threads: {}, entries: {} };
  tomb[kind] = tomb[kind] || {};
  tomb[kind][key] = Date.now();
  await idb.set("sync:tombstones", tomb);
}

// ---- GitHub API ----
async function gh(method, path, body) {
  const url = `https://api.github.com/repos/${syncCfg.repo}${path}`;
  let res;
  try {
    res = await fetch(url, {
      method,
      cache: "no-store",
      headers: {
        Authorization: `Bearer ${syncCfg.token}`,
        Accept: "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        ...(body ? { "Content-Type": "application/json" } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    const err = new Error("network");
    err.status = 0;
    throw err;
  }
  if (!res.ok) {
    let msg = "";
    try { msg = (await res.json()).message || ""; } catch { /* 본문 없음 */ }
    const err = new Error(msg || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}
function describeSyncError(err) {
  if (err?.status === 0) return "네트워크에 연결할 수 없습니다.";
  if (err?.status === "shrink") return `안전을 위해 동기화를 멈췄습니다(${err.message}). 데이터는 바꾸지 않았습니다. 설정의 '기록에서 되살리기'로 확인해 주세요.`;
  if (err?.status === 401) return "토큰이 올바르지 않거나 만료되었습니다. 새 토큰을 넣어 주세요.";
  if (err?.status === 403) return /rate limit/i.test(err.message) ? "GitHub 요청 한도에 걸렸습니다. 잠시 후 다시 시도합니다." : "토큰에 이 저장소의 Contents 읽기·쓰기 권한이 없습니다.";
  if (err?.status === 404) return "저장소를 찾을 수 없습니다. 저장소 이름과, 토큰이 그 저장소에 접근할 수 있는지 확인하세요.";
  return `동기화 오류: ${err?.message || err}`;
}
async function gitBlobSha(text) {
  const body = textEnc.encode(text);
  const head = textEnc.encode(`blob ${body.length}\0`);
  const buf = new Uint8Array(head.length + body.length);
  buf.set(head);
  buf.set(body, head.length);
  const d = await crypto.subtle.digest("SHA-1", buf);
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
function b64ToText(b64) {
  const bin = atob(String(b64).replace(/\s/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function textToB64(text) {
  const bytes = textEnc.encode(text);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
// 원격 저장소의 현재 상태: 브랜치 머리 커밋과 lorekeeper/ 아래 파일들의 blob sha
async function remoteHead() {
  const repo = await gh("GET", "");
  const branch = repo.default_branch || "main";
  let ref;
  try {
    ref = await gh("GET", `/git/ref/heads/${encodeURIComponent(branch)}`);
  } catch (err) {
    if (err.status !== 409 && err.status !== 404) throw err;
    // 빈 저장소: 첫 커밋을 만든다
    await gh("PUT", "/contents/README.md", { message: "로어키퍼 동기화 시작", content: textToB64("# 로어키퍼 데이터\n\n로어키퍼 앱이 동기화에 쓰는 저장소입니다. 직접 고치지 마세요.\n") });
    ref = await gh("GET", `/git/ref/heads/${encodeURIComponent(branch)}`);
  }
  const head = ref.object.sha;
  const commit = await gh("GET", `/git/commits/${head}`);
  const tree = await gh("GET", `/git/trees/${commit.tree.sha}?recursive=1`);
  const files = {};
  for (const t of tree.tree || []) if (t.type === "blob" && t.path.startsWith(SYNC_DIR + "/")) files[t.path] = t.sha;
  return { branch, head, treeSha: commit.tree.sha, files };
}

// ---- 로컬 스냅숏 ----
async function flushLocal() {
  if (!state.worldId) return;
  syncState.applying = true;
  try { await Promise.all([persist.world(), persist.threads(), persist.worlds(), persist.conv(), persist.images(), persist.maps()]); }
  finally { syncState.applying = false; }
}
async function loadLocalSnapshot() {
  const worlds = (await idb.get("worlds")) || [];
  const tomb = (await idb.get("sync:tombstones")) || { worlds: {}, threads: {}, entries: {} };
  const data = {};
  const convs = {};
  const mapImgs = {};
  for (const w of worlds) {
    const threads = (await idb.get("threads:" + w.id)) || [];
    const maps = (await idb.get("maps:" + w.id)) || [];
    const entries = (await idb.get("entries:" + w.id)) || [];
    for (const img of blobRefs({ maps, entries })) { const d = await idb.get("mapimg:" + img); if (d) mapImgs[img] = d; }
    data[w.id] = {
      entries: (await idb.get("entries:" + w.id)) || [],
      log: (await idb.get("log:" + w.id)) || [],
      threads,
      graph: (await idb.get("graph:" + w.id)) || null,
      ms: (await idb.get("ms:" + w.id)) || [],
      images: (await idb.get("imgs:" + w.id)) || {},
      maps,
    };
    for (const t of threads) convs[t.id] = (await idb.get("conv:" + t.id)) || null;
  }
  return { worlds, tomb: { worlds: {}, threads: {}, entries: {}, ...tomb }, data, convs, mapImgs };
}
const worldPath = (id) => `${SYNC_DIR}/w/${id}.json`;
const convPath = (id) => `${SYNC_DIR}/c/${id}.json`;
const imgPath = (id) => `${SYNC_DIR}/i/${id}.json`;
const mapImgPath = (img) => `${SYNC_DIR}/m/${img}.json`;
// 따로 저장하는 그림 덩어리: 지도 그림 + 인물 무드보드
const blobRefs = (d) => [...(d?.maps || []).map((m) => m.img), ...(d?.entries || []).flatMap((e) => (e.gallery || []).map((g) => g.img))];
const emptyWorldData = () => ({ entries: [], log: [], threads: [], graph: null, ms: [], images: {}, maps: [] });
const INDEX_PATH = `${SYNC_DIR}/index.json`;
function serializeSnapshot(snap) {
  const files = {};
  files[INDEX_PATH] = JSON.stringify({ app: "lorekeeper-sync", version: 1, worlds: snap.worlds, tombstones: snap.tomb });
  for (const w of snap.worlds) {
    const d = snap.data[w.id] || emptyWorldData();
    // 원고가 없으면 예전 형식 그대로 둔다(바뀐 것 없이 다시 올리지 않게)
    files[worldPath(w.id)] = JSON.stringify({ entries: d.entries, log: d.log, threads: d.threads, graph: d.graph, ...(d.ms?.length ? { ms: d.ms } : {}), ...(d.maps?.length ? { maps: d.maps } : {}) });
    if (d.images && Object.keys(d.images).length) files[imgPath(w.id)] = JSON.stringify(d.images);
    for (const img of blobRefs(d)) if (snap.mapImgs?.[img]) files[mapImgPath(img)] = JSON.stringify({ data: snap.mapImgs[img] });
    for (const t of d.threads) if (snap.convs[t.id]) files[convPath(t.id)] = JSON.stringify(snap.convs[t.id]);
  }
  return files;
}

// ---- 합치기 ----
function mergeTombstones(a, b) {
  const out = { worlds: {}, threads: {}, entries: {} };
  for (const src of [a, b]) for (const k of ["worlds", "threads", "entries", "manuscripts", "maps"]) for (const [id, at] of Object.entries(src?.[k] || {})) { out[k] = out[k] || {}; out[k][id] = Math.max(out[k][id] || 0, at); }
  const cutoff = Date.now() - 90 * 24 * 3600 * 1000; // 90일 지난 삭제 기록은 정리
  for (const k of Object.keys(out)) for (const [id, at] of Object.entries(out[k])) if (at < cutoff) delete out[k][id];
  return out;
}
function mergeCounters(a = {}, b = {}) {
  const out = { ...a };
  for (const [k, v] of Object.entries(b)) out[k] = Math.max(out[k] || 0, v);
  return out;
}
function mergeWorldList(local, remote) {
  const out = new Map(local.map((w) => [w.id, w]));
  for (const r of remote) {
    const l = out.get(r.id);
    if (!l) { out.set(r.id, r); continue; }
    const win = (r.updatedAt || 0) > (l.updatedAt || 0) ? r : l;
    out.set(r.id, { ...win, counters: mergeCounters(l.counters, r.counters) });
  }

    for (let i = 0; i < 4 && !ok; i++) ok = await syncOnce();
    if (!ok) throw new Error("다른 기기와 동시에 올리는 중입니다. 잠시 후 다시 시도합니다.");
