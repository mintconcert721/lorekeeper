function download(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function exportAll() {
  if (state.worldId) await Promise.all([persist.world(), persist.threads(), persist.conv(), persist.worlds(), persist.images(), persist.maps()]);
  const data = { app: "lorekeeper", version: 1, exportedAt: new Date().toISOString(), worlds: [] };
  for (const w of state.worlds) {
    const threads = (await idb.get("threads:" + w.id)) || [];
    const convs = {};
    for (const t of threads) convs[t.id] = (await idb.get("conv:" + t.id)) || null;
    data.worlds.push({
      world: w,
      entries: (await idb.get("entries:" + w.id)) || [],
      log: (await idb.get("log:" + w.id)) || [],
      graph: (await idb.get("graph:" + w.id)) || null,
      manuscripts: (await idb.get("ms:" + w.id)) || [],
      images: (await idb.get("imgs:" + w.id)) || {},
      maps: (await idb.get("maps:" + w.id)) || [],
      mapImages: Object.fromEntries(await Promise.all(blobRefs({ maps: (await idb.get("maps:" + w.id)) || [], entries: (await idb.get("entries:" + w.id)) || [] }).map(async (img) => [img, (await idb.get("mapimg:" + img)) || ""]))),
      threads,
      convs,
    });
  }
  download(`lorekeeper-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data), "application/json");
  LS.set("lk.lastBackup", Date.now());
  toast("백업 파일을 만들었습니다");
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast("백업 파일을 읽을 수 없습니다"); return; }
  if (data?.app !== "lorekeeper" || !Array.isArray(data.worlds)) { toast("로어키퍼 백업 파일이 아닙니다"); return; }
  const clash = data.worlds.filter((x) => state.worlds.some((w) => w.id === x.world?.id));
  const msg = `세계관 ${data.worlds.length}개를 불러옵니다.${clash.length ? `\n이미 있는 ${clash.length}개는 백업 내용으로 덮어씁니다.` : ""}`;
  if (!(await confirmBox(msg, "불러오기"))) return;
  await applyBackupData(data);
  toast("백업을 불러왔습니다");
}
async function applyBackupData(data) {
  for (const x of data.worlds) {
    if (!x.world?.id) continue;
    const id = x.world.id;
    const i = state.worlds.findIndex((w) => w.id === id);
    if (i >= 0) state.worlds[i] = x.world; else state.worlds.push(x.world);
    await Promise.all([
      idb.set("entries:" + id, x.entries || []),
      idb.set("log:" + id, x.log || []),
      x.graph ? idb.set("graph:" + id, x.graph) : idb.del("graph:" + id),
      idb.set("ms:" + id, x.manuscripts || []),
      idb.set("imgs:" + id, x.images || {}),
      idb.set("maps:" + id, x.maps || []),
      ...Object.entries(x.mapImages || {}).filter(([, v]) => v).map(([k, v]) => idb.set("mapimg:" + k, v)),
      idb.set("threads:" + id, x.threads || []),
      ...Object.entries(x.convs || {}).filter(([, v]) => v).map(([tid, v]) => idb.set("conv:" + tid, v)),
    ]);
  }
  await persist.worlds();
  resetGraphCache(); // 불러온 관계도 위치를 다시 읽게 한다
  if (state.worlds.length) await openWorld(state.worldId && state.worlds.some((w) => w.id === state.worldId) ? state.worldId : state.worlds[0].id);
  renderSettings();
}
/* ============================================================
   14-1. 데이터 지키기: 동기화 기록에서 되살리기 · 저장소 점검
   ============================================================ */
async function syncHistory(limit = 30) {
  const head = await remoteHead();
  const out = [];
  let sha = head.head;
  while (sha && out.length < limit) {
    const c = await gh("GET", `/git/commits/${sha}`);
    const tree = await gh("GET", `/git/trees/${c.tree.sha}?recursive=1`);
    const items = (tree.tree || []).filter((t) => t.type === "blob" && t.path.startsWith(SYNC_DIR + "/"));
    out.push({
      sha, tree: c.tree.sha, date: c.committer?.date || c.author?.date || null, message: String(c.message || ""),
      worlds: items.filter((t) => t.path.startsWith(`${SYNC_DIR}/w/`)).length,
      convs: items.filter((t) => t.path.startsWith(`${SYNC_DIR}/c/`)).length,
      size: items.filter((t) => t.path.startsWith(`${SYNC_DIR}/w/`)).reduce((a, t) => a + (t.size || 0), 0),
    });
    sha = c.parents?.[0]?.sha;
  }
  return out;
}
async function snapshotFromTree(treeSha, full) {
  const tree = await gh("GET", `/git/trees/${treeSha}?recursive=1`);
  const files = {};
  for (const t of tree.tree || []) if (t.type === "blob") files[t.path] = t.sha;
  const read = async (p) => (files[p] ? JSON.parse(b64ToText((await gh("GET", `/git/blobs/${files[p]}`)).content)) : null);
  const index = (await read(INDEX_PATH)) || { worlds: [] };
  const worlds = [];
  for (const w of index.worlds || []) {
    const wf = (await read(worldPath(w.id))) || {};
    const x = { world: w, entries: wf.entries || [], log: wf.log || [], graph: wf.graph || null, manuscripts: wf.ms || [], maps: wf.maps || [], threads: wf.threads || [] };
    if (full) {
      x.images = (await read(imgPath(w.id))) || {};
      x.mapImages = {};
      for (const img of blobRefs({ maps: x.maps, entries: x.entries })) { const d = await read(mapImgPath(img)); if (d?.data) x.mapImages[img] = d.data; }
      x.convs = {};
      for (const t of x.threads) x.convs[t.id] = await read(convPath(t.id));
    }
    worlds.push(x);
  }
  return { app: "lorekeeper", version: 1, exportedAt: new Date().toISOString(), worlds };
}

const WORLD_KEY_RE = /^(entries|log|threads|graph|ms|imgs|maps):(.+)$/;
async function scanStorage() {
  const keys = (await idb.keys()) || [];
  const worlds = (await idb.get("worlds")) || [];
  const listed = new Set(worlds.map((w) => w.id));
  const found = new Map();
  for (const k of keys) { const m = String(k).match(WORLD_KEY_RE); if (m) { if (!found.has(m[2])) found.set(m[2], new Set()); found.get(m[2]).add(m[1]); } }
  const info = async (wid) => {
    const entries = (await idb.get("entries:" + wid)) || [];
    const threads = (await idb.get("threads:" + wid)) || [];
    const ms = (await idb.get("ms:" + wid)) || [];
    return { wid, entries: entries.filter((e) => !e.deleted).length, threads: threads.length, ms: ms.length, sample: entries.filter((e) => !e.deleted).slice(0, 4).map((e) => e.name), threadTitles: threads.slice(0, 3).map((t) => t.title), last: Math.max(0, ...entries.map((e) => e.updatedAt || 0), ...threads.map((t) => t.updatedAt || 0)) };
  };
  const listedInfo = [];
  for (const w of worlds) listedInfo.push({ w, ...(await info(w.id)) });
  const orphans = [];
  for (const wid of found.keys()) if (!listed.has(wid)) orphans.push(await info(wid));
  let est = null;
  try { est = await navigator.storage?.estimate?.(); } catch { est = null; }
  let persisted = null;
  try { persisted = await navigator.storage?.persisted?.(); } catch { persisted = null; }
  return { keys: keys.length, listedInfo, orphans: orphans.filter((o) => o.entries || o.threads || o.ms), est, persisted, broken: idb.broken };
}

      : `<p class="meta">없습니다. 이 기기 저장소에는 목록 밖에 남은 세계관 데이터가 없습니다.</p>`}

        const now = Date.now();

        await persist.worlds();

function exportMarkdown() {
  const w = currentWorld();
  if (!w) return;
  const parts = [`# ${w.name}`, "", w.premise ? `> ${w.premise}` : "", "", w.tone ? `**분위기 · 문체**: ${w.tone}` : "", "", w.rules ? `## 세계 규칙\n\n${w.rules}` : ""];
  for (const k of typeKeys()) {
    const list = liveEntries().filter((e) => e.type === k).sort((a, b) => a.id.localeCompare(b.id));
    if (!list.length) continue;
    parts.push("", `## ${typeInfo(k).label}`);
    for (const e of list) {
      parts.push("", `### ${e.name} \`${e.id}\`${statusOf(e) === "draft" ? " (초안)" : ""}`);
      if (e.aliases?.length) parts.push(`*별칭: ${e.aliases.join(", ")}*`);
      parts.push("", e.summary || "");
      const f = Object.entries(e.fields || {});
      if (f.length) parts.push("", ...f.map(([kk, v]) => `- **${kk}**: ${v}`));
      if (e.body) parts.push("", e.body);
      const rel = (e.relations || []).map((r) => `- ${r.label} → ${nameOf(r.to)} (\`${r.to}\`)`);
      if (rel.length) parts.push("", "**관계**", ...rel);
      if (e.when) parts.push("", `*시점: ${rangeText(e.when)}${e.when.label ? ` · ${e.when.label}` : ""}*`);
      const sn = Object.entries(e.senses || {}).filter(([, v]) => v);
      if (sn.length) parts.push("", "**감각**", ...sn.map(([kk, v]) => `- ${kk}: ${v}`));
      if (e.perspectives?.length) parts.push("", "**관점별 서술**", ...e.perspectives.map((x) => `- ${nameOf(x.by) === "(없는 항목)" ? x.by : nameOf(x.by)}: ${x.text}`));
      if (e.tags?.length) parts.push("", e.tags.map((t) => "#" + t).join(" "));
    }
  }
  const tl = timelineEntries();
  if (tl.length) {
    const cal = worldCalendar();
    parts.push("", "## 연표");
    for (const x of cal.eras.slice().sort((a, b) => a.start - b.start)) parts.push(`- 시대: **${x.name}** (${eraRangeText(x, cal)})`);
    parts.push("");
    for (const e of tl) parts.push(`- **${rangeText(e.when, cal)}** ${e.name} (\`${e.id}\`)${e.summary ? ` — ${e.summary}` : ""}`);
  }
  const rules = worldNaming(w);
  if (rules.length) {
    parts.push("", "## 이름 규칙");
    for (const r of rules) parts.push("", `### ${r.name}`, r.applies?.length ? `*적용: ${r.applies.join(", ")}*` : "", "", r.rules || "", r.examples?.length ? `\n예: ${r.examples.join(", ")}` : "");
  }
  if (state.manuscripts.length) {
    parts.push("", "## 원고함");
    for (const m of state.manuscripts.slice().sort((a, b) => a.createdAt - b.createdAt)) parts.push("", `### ${m.title} (${m.kind})`, "", m.body);
  }
  const safe = w.name.replace(/[\\/:*?"<>|]/g, "_");
  download(`${safe}.md`, parts.join("\n").replace(/\n{3,}/g, "\n\n"), "text/markdown");
  toast("문서 파일을 만들었습니다");
}

  }
  try { switchView(LS.get("lk.view", "chat")); } catch (err) { console.error(err); }
  if (idb.broken) showDataBanner("이 브라우저에서는 저장소를 열 수 없어 지금은 임시로만 저장됩니다. 개인정보 보호 모드라면 일반 창에서 여세요.");
  else checkOrphans();
  if (state.worlds.length && !LS.get("lk.persistAsked", false)) {
    LS.set("lk.persistAsked", true);
    navigator.storage?.persisted?.().then((p) => (p ? null : navigator.storage.persist?.())).catch(() => {});
  }
  if (syncCfg.enabled) runSync("startup");
}
function showDataBanner(html) {
  const b = $("#dataBanner");
  b.hidden = false;
  b.innerHTML = `<span>${html}</span><button class="btn btn-small btn-primary" type="button" data-banner="check">저장소 점검</button><button class="btn btn-small btn-ghost" type="button" data-banner="close" aria-label="닫기">×</button>`;
}
// 세계관 목록에서 빠졌지만 이 기기에 남아 있는 데이터가 있으면 알려 준다
async function checkOrphans() {
  try {
    const keys = (await idb.keys()) || [];
    const listed = new Set(state.worlds.map((w) => w.id));
    const wids = new Set(keys.map((k) => String(k).match(/^entries:(.+)$/)?.[1]).filter((x) => x && !listed.has(x)));
    let n = 0;
    for (const wid of wids) n += ((await idb.get("entries:" + wid)) || []).filter((e) => !e.deleted).length;
    if (n) showDataBanner(`세계관 목록에서 빠진 데이터(항목 ${n}개)가 이 기기에 남아 있습니다.`);
  } catch (err) { console.warn(err); }
}
init();
</script>
