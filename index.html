const SVG_NS = "http://www.w3.org/2000/svg";
const graph = {
  worldId: undefined,       // 위치를 불러온 세계관
  nodes: new Map(),         // id → { id, entry, x, y, pinned, degree, isNew, r, el }
  edges: [],                // { a, b, rels:[{from,to,label}], el, labels:[{el, from}] }
  pos: {},                  // 저장된 위치 { id: [x, y, pinned] }
  vis: new Set(),
  visEdges: [],
  view: { tx: 0, ty: 0, s: 1 },
  fitted: false,
  selected: null,
  focusHops: 0,             // 0: 전체, 1~2: 선택 항목 주변만
  hiddenTypes: new Set(),
  hideIsolated: false,
  linkFrom: null,           // 관계 잇기 시작 항목
  pendingSelect: null,
  labelsAll: false,
  saveTimer: 0,
};
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function hashNum(str) {
  let h = 2166136261;
  for (const ch of String(str)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0) / 4294967295;
}
function resetGraphCache() { graph.worldId = undefined; }

async function loadGraphPositions() {
  if (graph.worldId === state.worldId) return;
  graph.worldId = state.worldId;
  graph.pos = (state.worldId && (await idb.get("graph:" + state.worldId)))?.pos || {};
  graph.nodes = new Map();
  graph.edges = [];
  graph.view = { tx: 0, ty: 0, s: 1 };
  graph.fitted = false;
  graph.selected = null;
  graph.focusHops = 0;
  graph.linkFrom = null;
  graph.hiddenTypes.clear();
  graph.hideIsolated = false;
}
function saveGraphPositions() {
  clearTimeout(graph.saveTimer);
  const wid = graph.worldId;
  graph.saveTimer = setTimeout(() => {
    if (!wid || wid !== state.worldId) return;
    const pos = {};
    for (const n of graph.nodes.values()) pos[n.id] = [Math.round(n.x * 10) / 10, Math.round(n.y * 10) / 10, n.pinned ? 1 : 0];
    graph.pos = pos;
    idb.set("graph:" + wid, { pos });
  }, 300);
}

function buildGraphModel() {
  const entries = activeEntries();
  const ids = new Set(entries.map((e) => e.id));
  const old = graph.nodes;
  const nodes = new Map();
  for (const e of entries) {
    const prev = old.get(e.id);
    const saved = graph.pos[e.id];
    nodes.set(e.id, {
      id: e.id, entry: e,
      x: prev ? prev.x : saved ? saved[0] : null,
      y: prev ? prev.y : saved ? saved[1] : null,
      pinned: prev ? prev.pinned : !!saved?.[2],
      degree: 0, isNew: !prev && !saved, r: 10, el: null,
    });
  }
  const pairs = new Map();
  for (const e of entries) {
    for (const r of e.relations || []) {
      if (!ids.has(r.to) || r.to === e.id) continue;
      const [a, b] = e.id < r.to ? [e.id, r.to] : [r.to, e.id];
      const key = `${a}|${b}`;
      if (!pairs.has(key)) pairs.set(key, { a, b, rels: [], el: null, labels: [] });
      pairs.get(key).rels.push({ from: e.id, to: r.to, label: r.label });
    }
  }
  graph.nodes = nodes;
  graph.edges = [...pairs.values()];
  for (const ed of graph.edges) { nodes.get(ed.a).degree++; nodes.get(ed.b).degree++; }
  const anyPlaced = [...nodes.values()].some((n) => n.x != null);
  const spread = Math.max(80, Math.sqrt(nodes.size) * 45);
  for (const n of nodes.values()) {
    if (n.x != null) continue;
    const ang = hashNum(n.id) * Math.PI * 2;
    const near = graph.edges
      .filter((ed) => ed.a === n.id || ed.b === n.id)
      .map((ed) => nodes.get(ed.a === n.id ? ed.b : ed.a))
      .filter((m) => m.x != null);
    if (near.length) {
      n.x = near.reduce((s, m) => s + m.x, 0) / near.length + Math.cos(ang) * 60;
      n.y = near.reduce((s, m) => s + m.y, 0) / near.length + Math.sin(ang) * 60;
    } else {
      const rad = anyPlaced ? spread * 0.9 : spread * (0.3 + hashNum(n.id + "r") * 0.7);
      n.x = Math.cos(ang) * rad;
      n.y = Math.sin(ang) * rad;
    }
  }
  if (graph.selected && !nodes.has(graph.selected)) { graph.selected = null; graph.focusHops = 0; }
  if (graph.linkFrom && !nodes.has(graph.linkFrom)) graph.linkFrom = null;
}

// 힘 기반 배치(Fruchterman-Reingold). full이면 전체를, 아니면 새로 생긴 항목만 움직인다.
function runLayout(full) {
  const ns = [...graph.nodes.values()];
  const n = ns.length;
  if (!n) return;
  const movable = ns.map((v) => !v.pinned && (full || v.isNew));
  if (!movable.some(Boolean)) return;
  const k = 110; // 선 길이 기준. 관계 이름이 들어갈 여유를 둔다.
  const iters = full ? (n > 200 ? 160 : 320) : 120;
  let temp = full ? 120 : 45;
  const index = new Map(ns.map((v, i) => [v.id, i]));
  const E = graph.edges.map((ed) => [index.get(ed.a), index.get(ed.b)]);
  const dx = new Float64Array(n);
  const dy = new Float64Array(n);
  for (let it = 0; it < iters; it++) {
    dx.fill(0); dy.fill(0);
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        let ddx = ns[i].x - ns[j].x;
        let ddy = ns[i].y - ns[j].y;
        let d2 = ddx * ddx + ddy * ddy;
        if (d2 < 0.01) { ddx = hashNum(ns[i].id + j) - 0.5; ddy = hashNum(ns[j].id + i) - 0.5; d2 = ddx * ddx + ddy * ddy + 0.01; }
        const f = (k * k) / d2;
        dx[i] += ddx * f; dy[i] += ddy * f;
        dx[j] -= ddx * f; dy[j] -= ddy * f;
      }
    }
    for (const [a, b] of E) {
      const ddx = ns[a].x - ns[b].x;
      const ddy = ns[a].y - ns[b].y;
      const f = Math.sqrt(ddx * ddx + ddy * ddy) / k;
      dx[a] -= ddx * f; dy[a] -= ddy * f;
      dx[b] += ddx * f; dy[b] += ddy * f;
    }
    for (let i = 0; i < n; i++) {
      if (!movable[i]) continue;
      dx[i] -= ns[i].x * 0.06;
      dy[i] -= ns[i].y * 0.06;
      const len = Math.sqrt(dx[i] * dx[i] + dy[i] * dy[i]) || 1;
      const step = Math.min(len, temp);
      ns[i].x += (dx[i] / len) * step;
      ns[i].y += (dy[i] / len) * step;
    }
    temp = Math.max(1, temp * (full ? 0.985 : 0.965));
  }
  for (const v of ns) v.isNew = false;
}

function visibleSets() {
  let vis = new Set();
  for (const n of graph.nodes.values()) {
    if (graph.hiddenTypes.has(n.entry.type)) continue;
    if (graph.hideIsolated && n.degree === 0) continue;
    vis.add(n.id);
  }
  if (graph.focusHops && graph.selected) {
    const keep = new Set([graph.selected]);
    let frontier = [graph.selected];
    for (let h = 0; h < graph.focusHops; h++) {
      const next = [];
      for (const id of frontier) {
        for (const ed of graph.edges) {
          const other = ed.a === id ? ed.b : ed.b === id ? ed.a : null;
          if (other && !keep.has(other)) { keep.add(other); next.push(other); }
        }
      }
      frontier = next;
    }
    vis = new Set([...vis].filter((id) => keep.has(id)));
    vis.add(graph.selected);
  }
  return { vis, edges: graph.edges.filter((ed) => vis.has(ed.a) && vis.has(ed.b)) };
}
const nodeRadius = (n) => Math.min(18, 9 + Math.sqrt(n.degree) * 3);

function buildGraphDOM() {
  const { vis, edges } = visibleSets();
  graph.vis = vis;
  graph.visEdges = edges;
  const eG = $("#gEdges");
  const lG = $("#gLabels");
  const nG = $("#gNodes");
  eG.textContent = "";
  lG.textContent = "";
  nG.textContent = "";
  for (const ed of edges) {
    const line = document.createElementNS(SVG_NS, "line");
    line.setAttribute("class", "g-edge");
    eG.appendChild(line);
    ed.el = line;
    ed.labels = [];
    for (const from of [ed.a, ed.b]) {
      const names = ed.rels.filter((r) => r.from === from).map((r) => r.label);
      if (!names.length) continue;
      const t = document.createElementNS(SVG_NS, "text");
      t.setAttribute("class", "g-elabel");
      t.textContent = cut(names.join(", "), 10);
      lG.appendChild(t);
      ed.labels.push({ el: t, from });
    }
  }
  for (const n of graph.nodes.values()) n.el = null;
  for (const id of vis) {
    const n = graph.nodes.get(id);
    n.r = nodeRadius(n);
    const g = document.createElementNS(SVG_NS, "g");
    g.setAttribute("class", "g-node");
    g.dataset.id = id;
    g.innerHTML = `<circle class="halo" r="${n.r + 5}"></circle><circle class="dot" r="${n.r}" style="fill:${typeColor(n.entry.type)}"></circle><text y="${n.r + 15}">${esc(cut(n.entry.name, 12))}</text>`;
    nG.appendChild(g);
    n.el = g;
  }
  updateGraphPositions();
  applyGraphHighlight();
  renderGraphChrome();
}
function updateGraphPositions() {
  for (const ed of graph.visEdges) {
    const A = graph.nodes.get(ed.a);
    const B = graph.nodes.get(ed.b);
    const ddx = B.x - A.x;
    const ddy = B.y - A.y;
    const d = Math.hypot(ddx, ddy) || 1;
    const ux = ddx / d;
    const uy = ddy / d;
    const fwd = ed.rels.some((r) => r.from === ed.a);
    const back = ed.rels.some((r) => r.from === ed.b);
    const sa = Math.min(d / 2, A.r + (back ? 6 : 3));
    const sb = Math.min(d / 2, B.r + (fwd ? 6 : 3));
    ed.el.setAttribute("x1", A.x + ux * sa);
    ed.el.setAttribute("y1", A.y + uy * sa);
    ed.el.setAttribute("x2", B.x - ux * sb);
    ed.el.setAttribute("y2", B.y - uy * sb);
    for (const lb of ed.labels) {
      // 한쪽 관계면 선 가운데, 양쪽이면 각 관계가 가리키는 쪽(대상)으로 조금 치우쳐 둔다.
      // 선 위에 겹치지 않도록 선과 수직 방향으로 살짝 띄운다.
      const t = ed.labels.length === 1 ? 0.5 : lb.from === ed.a ? 0.62 : 0.38;
      const side = ed.labels.length === 1 ? 1 : lb.from === ed.a ? 1 : -1;
      lb.el.setAttribute("x", A.x + ddx * t - uy * 9 * side);
      lb.el.setAttribute("y", A.y + ddy * t + ux * 9 * side + 4);
    }
  }
  for (const n of graph.nodes.values()) if (n.el) n.el.setAttribute("transform", `translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
}
function applyGraphHighlight() {
  const sel = graph.selected && graph.vis.has(graph.selected) ? graph.selected : null;
  const near = new Set();
  if (sel) {
    near.add(sel);
    for (const ed of graph.visEdges) { if (ed.a === sel) near.add(ed.b); if (ed.b === sel) near.add(ed.a); }
  }
  for (const n of graph.nodes.values()) {
    if (!n.el) continue;
    n.el.classList.toggle("sel", n.id === sel);
    n.el.classList.toggle("dim", !!sel && !near.has(n.id) && !graph.linkFrom);
    n.el.classList.toggle("link-src", n.id === graph.linkFrom);
  }
  for (const ed of graph.visEdges) {
    const hl = !!sel && (ed.a === sel || ed.b === sel);
    ed.el.classList.toggle("hl", hl);
    ed.el.classList.toggle("dim", !!sel && !hl);
    const marker = hl ? "url(#gArrowHl)" : "url(#gArrow)";
    if (ed.rels.some((r) => r.from === ed.a)) ed.el.setAttribute("marker-end", marker); else ed.el.removeAttribute("marker-end");
    if (ed.rels.some((r) => r.from === ed.b)) ed.el.setAttribute("marker-start", marker); else ed.el.removeAttribute("marker-start");
    for (const lb of ed.labels) lb.el.classList.toggle("show", hl || (!sel && graph.labelsAll));
  }
}
function applyGraphTransform() {
  const { tx, ty, s } = graph.view;
  $("#gViewport").setAttribute("transform", `translate(${tx.toFixed(1)},${ty.toFixed(1)}) scale(${s.toFixed(3)})`);
  const stage = $("#graphStage");
  stage.style.backgroundSize = `${22 * s}px ${22 * s}px`;
  stage.style.backgroundPosition = `${tx}px ${ty}px`;
  const all = s >= 1.35;
  if (all !== graph.labelsAll) { graph.labelsAll = all; applyGraphHighlight(); }
}
function stageInnerHeight() {
  const stage = $("#graphStage");
  const card = $("#graphCard");
  return stage.clientHeight - (card.hidden ? 0 : card.offsetHeight + 16);
}
function fitGraph() {
  const stage = $("#graphStage");
  const W = stage.clientWidth;
  const H = stageInnerHeight();
  if (!W || H <= 0) return;
  const list = [...graph.vis].map((id) => graph.nodes.get(id));
  if (!list.length) { graph.view = { tx: W / 2, ty: H / 2, s: 1 }; applyGraphTransform(); return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of list) { x0 = Math.min(x0, n.x - 60); x1 = Math.max(x1, n.x + 60); y0 = Math.min(y0, n.y - 30); y1 = Math.max(y1, n.y + 40); }
  const s = clamp(Math.min(W / (x1 - x0), (H - 56) / (y1 - y0)), 0.3, 1.5);
  graph.view = { s, tx: W / 2 - ((x0 + x1) / 2) * s, ty: 56 + (H - 56) / 2 - ((y0 + y1) / 2) * s };
  applyGraphTransform();
}
function centerOn(id) {
  const n = graph.nodes.get(id);
  if (!n) return;
  const stage = $("#graphStage");
  const s = Math.max(graph.view.s, 1);
  graph.view = { s, tx: stage.clientWidth / 2 - n.x * s, ty: Math.max(120, stageInnerHeight() / 2) - n.y * s };
  applyGraphTransform();
}
function zoomAt(cx, cy, factor) {
  const rect = $("#graphStage").getBoundingClientRect();
  const mx = cx - rect.left;
  const my = cy - rect.top;
  const { tx, ty, s } = graph.view;
  const ns = clamp(s * factor, 0.25, 3);
  const wx = (mx - tx) / s;
  const wy = (my - ty) / s;
  graph.view = { s: ns, tx: mx - wx * ns, ty: my - wy * ns };
  applyGraphTransform();
}

function renderGraphChrome() {
  // 종류 필터
  const counts = {};
  for (const n of graph.nodes.values()) counts[n.entry.type] = (counts[n.entry.type] || 0) + 1;
  const isolated = [...graph.nodes.values()].filter((n) => n.degree === 0).length;
  $("#graphTypes").innerHTML = typeKeys().filter((k) => counts[k]).map((k) => `<button class="type-chip" type="button" data-gtype="${k}" aria-pressed="${!graph.hiddenTypes.has(k)}"><span class="tdot" style="background:${typeColor(k)}"></span>${esc(typeInfo(k).label)}<span class="n">${counts[k]}</span></button>`).join("")
    + (isolated ? `<button class="type-chip isolated" type="button" data-gtype="__isolated" aria-pressed="${!graph.hideIsolated}">연결 없는 항목<span class="n">${isolated}</span></button>` : "");

  // 빈 화면 안내
  const empty = $("#graphEmpty");
  const w = currentWorld();
  if (!w) { empty.hidden = false; empty.innerHTML = "<div><strong>세계관이 없습니다</strong>대화 탭에서 새 세계관을 만들어 보세요.</div>"; }
  else if (!graph.nodes.size) { empty.hidden = false; empty.innerHTML = "<div><strong>설정집이 비어 있습니다</strong>항목이 생기면 여기에 관계도가 그려집니다.</div>"; }
  else if (!graph.vis.size) { empty.hidden = false; empty.innerHTML = "<div><strong>보이는 항목이 없습니다</strong>위의 종류 필터를 켜 보세요.</div>"; }
  else empty.hidden = true;

  // 상단 안내(관계 잇기 / 주변만 보기 / 관계 없음)
  const hint = $("#graphHint");
  const sel = graph.selected ? graph.nodes.get(graph.selected) : null;
  if (graph.linkFrom) {
    const from = graph.nodes.get(graph.linkFrom);
    hint.hidden = false;
    hint.innerHTML = `<span><b>${esc(from.entry.name)}</b>와(과) 이을 항목을 누르세요</span><button class="btn btn-small" type="button" data-g="cancel-link">취소</button>`;
  } else if (graph.focusHops && sel) {
    hint.hidden = false;
    hint.innerHTML = `<span><b>${esc(sel.entry.name)}</b> 주변 ${graph.focusHops}단계만 보는 중</span><button class="btn btn-small" type="button" data-g="hops">${graph.focusHops === 1 ? "2단계까지" : "1단계만"}</button><button class="btn btn-small" type="button" data-g="unfocus">전체 보기</button>`;
  } else if (graph.nodes.size && !graph.edges.length) {
    hint.hidden = false;
    hint.innerHTML = "<span>아직 관계가 없습니다. 항목을 누르고 '관계 잇기'를 쓰거나, 대화에서 관계를 정해 달라고 해 보세요.</span>";
  } else hint.hidden = true;

  // 선택 카드
  const card = $("#graphCard");
  if (sel && graph.vis.has(sel.id) && !graph.linkFrom) {
    const e = sel.entry;
    card.hidden = false;
    card.innerHTML = `<div class="entry-head" style="--tc:${typeColor(e.type)}"><span class="catno">${e.id}</span><span>${esc(typeInfo(e.type).label)}</span><span class="pill">연결 ${sel.degree}</span></div>
      <strong class="gc-name">${esc(e.name)}</strong>
      <p class="gc-sum">${esc(e.summary || "요약 없음")}</p>
      <div class="row">
        <button class="btn btn-small btn-primary" type="button" data-g="open">자세히</button>
        <button class="btn btn-small" type="button" data-g="link">관계 잇기</button>
        <button class="btn btn-small" type="button" data-g="focus">${graph.focusHops ? "전체 보기" : "주변만 보기"}</button>
        <button class="btn btn-small" type="button" data-g="chat">대화로</button>
      </div>`;
  } else card.hidden = true;
}

let graphQueued = false;
function queueGraphRender() {
  if (graphQueued) return;
  graphQueued = true;
  requestAnimationFrame(() => { graphQueued = false; renderGraph(); });
}
async function renderGraph() {
  if (state.view !== "graph") return;
  await loadGraphPositions();
  const hadLayout = graph.nodes.size > 0 || Object.keys(graph.pos).length > 0;
  buildGraphModel();
  runLayout(!hadLayout);
  buildGraphDOM();
  if (graph.pendingSelect && graph.nodes.has(graph.pendingSelect)) {
    graph.selected = graph.pendingSelect;
    graph.hiddenTypes.delete(graph.nodes.get(graph.pendingSelect).entry.type);
    graph.pendingSelect = null;
    buildGraphDOM();
    graph.fitted = true;
    centerOn(graph.selected);
  } else if (!graph.fitted) {
    fitGraph();
    graph.fitted = true;
  } else applyGraphTransform();
  saveGraphPositions();
}
function showInGraph(id) {
  graph.pendingSelect = id;
  graph.focusHops = 0;
  graph.linkFrom = null;
  switchView("graph");
}
function selectGraphNode(id) {
  graph.selected = id;
  if (graph.focusHops) buildGraphDOM();
  else { applyGraphHighlight(); renderGraphChrome(); }
}

function openLinkForm(fromId, toId) {
  const a = findEntry(fromId);
  const b = findEntry(toId);
  if (!a || !b) return;
  const common = ["스승", "제자", "가족", "연인", "친구", "동료", "경쟁", "적대", "소속", "지도자", "거주지", "출신", "소유", "원인"];
  openSheet(`<h2 class="sheet-title">관계 잇기</h2>
    <p class="meta" style="margin:0 0 12px">${esc(a.name)} ⇄ ${esc(b.name)}</p>
    <form class="form" id="linkForm">
      <label>${esc(a.name)}에게 ${esc(b.name)}은(는)<input id="l-label" required placeholder="예: 스승" autocomplete="off"></label>
      <label>반대로 ${esc(b.name)}에게 ${esc(a.name)}은(는) <small>비워 두면 한쪽만</small><input id="l-reverse" placeholder="예: 제자" autocomplete="off"></label>
      <div class="label-chips">${common.map((c) => `<button type="button" class="action-chip" data-fill="${c}"><span>${c}</span></button>`).join("")}</div>
      <div class="sheet-actions">
        <button class="btn" type="button" data-act="cancel">취소</button>
        <button class="btn btn-primary" type="submit">잇기</button>
      </div>
    </form>`, (root) => {
    let target = $("#l-label", root);
    root.addEventListener("focusin", (ev) => { if (ev.target.matches("#l-label, #l-reverse")) target = ev.target; });
    target.focus(); // 시트가 열리는 즉시 첫 칸에 커서를 둔다(나중에 옮기면 입력 중인 칸을 빼앗을 수 있다)
    root.onclick = (ev) => {
      const fill = ev.target.closest("[data-fill]");
      if (fill) {
        const label = $("#l-label", root);
        const rev = $("#l-reverse", root);
        const box = target === rev || (label.value && !rev.value) ? rev : label;
        box.value = fill.dataset.fill;
        target = box === label ? rev : label;
        return;
      }
      if (ev.target.closest('[data-act="cancel"]')) closeSheet();
    };
    root.onsubmit = async (ev) => {
      ev.preventDefault();
      if (state.busy) { toast("Claude가 작업 중입니다. 끝난 뒤에 이어 주세요"); return; }
      const label = $("#l-label", root).value.trim();
      const rev = $("#l-reverse", root).value.trim();
      if (!label) { toast("관계 이름을 넣어 주세요"); return; }
      const added = addRelation(a, b.id, label, "user");
      if (rev) addRelation(b, a.id, rev, "user");
      await persist.world();
      graph.linkFrom = null;
      graph.selected = a.id;
      closeSheet();
      renderCodex();
      toast(added || rev ? "관계를 이었습니다" : "이미 있는 관계입니다");
    };
  });
}

function bindGraph() {
  const view = $("#view-graph");
  const stage = $("#graphStage");
  const gp = { pointers: new Map(), mode: null, node: null, moved: false, start: null, nodeStart: null, pinch: null };
  let frame = 0;
  const scheduleFrame = () => { if (!frame) frame = requestAnimationFrame(() => { frame = 0; updateGraphPositions(); }); };

  stage.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".graph-card, .graph-hint, .zoom-ctrl")) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    stage.setPointerCapture(e.pointerId);
    gp.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gp.pointers.size === 2) {
      const [p1, p2] = [...gp.pointers.values()];
      gp.mode = "pinch";
      gp.node = null;
      gp.moved = true;
      gp.pinch = { d: Math.hypot(p1.x - p2.x, p1.y - p2.y) || 1, mid: { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }, view: { ...graph.view } };
      return;
    }
    gp.moved = false;
    gp.start = { x: e.clientX, y: e.clientY, view: { ...graph.view } };
    const nodeEl = e.target.closest(".g-node");
    if (nodeEl) {
      gp.mode = "node";
      gp.node = graph.nodes.get(nodeEl.dataset.id);
      gp.nodeStart = { x: gp.node.x, y: gp.node.y };
    } else gp.mode = "pan";
  });
  stage.addEventListener("pointermove", (e) => {
    if (!gp.pointers.has(e.pointerId)) return;
    gp.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gp.mode === "pinch" && gp.pointers.size >= 2) {
      const [p1, p2] = [...gp.pointers.values()];
      const d = Math.hypot(p1.x - p2.x, p1.y - p2.y) || 1;
      const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      const rect = stage.getBoundingClientRect();
      const v0 = gp.pinch.view;
      const s = clamp(v0.s * (d / gp.pinch.d), 0.25, 3);
      const wx = (gp.pinch.mid.x - rect.left - v0.tx) / v0.s;
      const wy = (gp.pinch.mid.y - rect.top - v0.ty) / v0.s;
      graph.view = { s, tx: mid.x - rect.left - wx * s, ty: mid.y - rect.top - wy * s };
      applyGraphTransform();
      return;
    }
    if (!gp.start) return;
    const dx = e.clientX - gp.start.x;
    const dy = e.clientY - gp.start.y;
    if (!gp.moved && Math.hypot(dx, dy) < 6) return;
    gp.moved = true;
    if (gp.mode === "node" && gp.node) {
      gp.node.x = gp.nodeStart.x + dx / graph.view.s;
      gp.node.y = gp.nodeStart.y + dy / graph.view.s;
      gp.node.pinned = true;
      scheduleFrame();
    } else if (gp.mode === "pan") {
      graph.view = { ...gp.start.view, tx: gp.start.view.tx + dx, ty: gp.start.view.ty + dy };
      applyGraphTransform();
    }
  });
  const endPointer = (e) => {
    if (!gp.pointers.has(e.pointerId)) return;
    gp.pointers.delete(e.pointerId);
    if (gp.mode === "pinch") {
      if (gp.pointers.size === 1) {
        const p = [...gp.pointers.values()][0];
        gp.mode = "pan";
        gp.start = { x: p.x, y: p.y, view: { ...graph.view } };
      } else if (!gp.pointers.size) gp.mode = null;
      return;
    }
    if (gp.pointers.size) return;
    if (e.type !== "pointercancel") {
      if (!gp.moved && gp.mode === "node" && gp.node) onGraphNodeTap(gp.node.id);
      else if (!gp.moved && gp.mode === "pan") onGraphBackgroundTap();
      else if (gp.moved && gp.mode === "node") saveGraphPositions();
    }
    gp.mode = null;
    gp.node = null;
    gp.start = null;
  };
  stage.addEventListener("pointerup", endPointer);
  stage.addEventListener("pointercancel", endPointer);
  stage.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });

  view.addEventListener("click", async (e) => {
    const chip = e.target.closest("[data-gtype]");
    if (chip) {
      const t = chip.dataset.gtype;
      if (t === "__isolated") graph.hideIsolated = !graph.hideIsolated;
      else if (graph.hiddenTypes.has(t)) graph.hiddenTypes.delete(t);
      else graph.hiddenTypes.add(t);
      buildGraphDOM();
      return;
    }
    const g = e.target.closest("[data-g]")?.dataset.g;
    if (!g) return;
    const rect = stage.getBoundingClientRect();
    if (g === "fit") fitGraph();
    else if (g === "zoom-in") zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.3);
    else if (g === "zoom-out") zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1 / 1.3);
    else if (g === "relayout") {
      if (!graph.nodes.size) return;
      if (!(await confirmBox("모든 항목의 자리를 다시 잡을까요? 직접 옮겨 둔 위치도 처음부터 다시 배치됩니다.", "다시 배치"))) return;
      for (const n of graph.nodes.values()) { n.x = null; n.y = null; n.pinned = false; }
      graph.pos = {};
      buildGraphModel();
      runLayout(true);
      buildGraphDOM();
      fitGraph();
      saveGraphPositions();
    } else if (g === "open" && graph.selected) openEntry(graph.selected);
    else if (g === "link" && graph.selected) {
      if (state.busy) { toast("Claude가 작업 중입니다. 끝난 뒤에 이어 주세요"); return; }
      graph.linkFrom = graph.selected;
      applyGraphHighlight();
      renderGraphChrome();
      fitGraph(); // 이을 대상이 화면 밖에 있지 않도록 전체를 보여 준다
    } else if (g === "cancel-link") { graph.linkFrom = null; applyGraphHighlight(); renderGraphChrome(); }
    else if (g === "focus" && graph.selected) {
      graph.focusHops = graph.focusHops ? 0 : 1;
      buildGraphDOM();
      if (graph.focusHops) fitGraph(); else centerOn(graph.selected);
    } else if (g === "hops") { graph.focusHops = graph.focusHops === 1 ? 2 : 1; buildGraphDOM(); fitGraph(); }
    else if (g === "unfocus") { graph.focusHops = 0; buildGraphDOM(); centerOn(graph.selected); }
    else if (g === "chat" && graph.selected) {
      const ent = findEntry(graph.selected);
      switchView("chat");
      fillInput(`${ent.name}(${ent.id})의 인간관계와 연결을 더 만들어 줘. `);
    }
  });

  let searchTimer = 0;
  $("#graphSearch").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim().toLowerCase();
    searchTimer = setTimeout(() => {
      if (!q) return;
      const terms = q.split(/\s+/);
      const best = [...graph.nodes.values()].map((n) => ({ n, s: scoreEntry(n.entry, terms) })).filter((x) => x.s > 0).sort((a, b) => b.s - a.s)[0];
      if (!best) return;
      graph.linkFrom = null;
      graph.focusHops = 0;
      graph.hiddenTypes.delete(best.n.entry.type);
      if (graph.hideIsolated && best.n.degree === 0) graph.hideIsolated = false;
      graph.selected = best.n.id;
      buildGraphDOM();
      centerOn(best.n.id);
    }, 250);
  });
}
function onGraphNodeTap(id) {
  if (graph.linkFrom) {
    if (id === graph.linkFrom) { graph.linkFrom = null; applyGraphHighlight(); renderGraphChrome(); return; }
    openLinkForm(graph.linkFrom, id);
    return;
  }
  selectGraphNode(id);
}
function onGraphBackgroundTap() {
  if (graph.linkFrom || graph.focusHops) return;
  if (!graph.selected) return;
  graph.selected = null;
  applyGraphHighlight();
  renderGraphChrome();
}

function templateItem(fileName, text) {
  const { meta, body } = splitFrontmatter(text);
  const base = String(fileName || "").replace(/\.(md|markdown|txt)$/i, "").trim();
  return {
    fileName,
    label: meta["분류"] || meta["이름"] || meta.name || meta.label || base,
    code: String(meta["코드"] || meta.code || "").toUpperCase(),
    desc: meta["설명"] || meta.description || meta.desc || "",
    base: meta["기존분류"] || meta.base || "",
    template: body,
  };
}
async function readTemplateFiles(files) {
  const items = [];
  for (const f of [...files].slice(0, 30)) {
    try {
      const { data } = await prepareText(f);
      items.push(templateItem(f.name, data));
    } catch (err) { toast(`${f.name}: ${err?.message || err}`); }
  }
  return items;
}
function entryCountByType() {
  const counts = {};
  for (const e of state.entries) counts[e.type] = (counts[e.type] || 0) + 1;
  return counts;
}
async function commitTypes(newTypes, note) {
  const w = currentWorld();

  logChange("user", "types", null, note);
  await Promise.all([persist.worlds(), persist.log()]);
  renderCodex();
}

        ? [existing.label !== label && `이름 ${existing.label}→${label}`, existing.code !== code && `코드 ${code}`, existing.template !== template && "템플릿 수정", existing.desc !== desc && "설명 수정"].filter(Boolean).join(", ")
        : "새 분류";
      await commitTypes(list, `${label}${what ? ` (${what})` : ""}`);
      openTypesSheet();
      toast("저장했습니다");
    };
  });
}

function openTemplateImport(items) {
  const types = worldTypes();
  const taken = new Set(types.map((t) => t.code));
  const rows = items.map((it) => {
    const byLabel = types.find((t) => t.label === it.label) || (it.base && types.find((t) => t.label === it.base));
    let code = it.code;
    if (!CODE_RE.test(code) || taken.has(code)) code = suggestCode([...taken]);
    if (!byLabel) taken.add(code);
    return { ...it, target: byLabel ? byLabel.key : "__new", code };
  });
  openSheet(`<h2 class="sheet-title">템플릿 가져오기</h2>
    <p class="meta" style="margin:0 0 12px">파일마다 분류를 정해 주세요. 기존 분류에 연결하면 그 분류의 이름도 아래 이름으로 바뀌고, 템플릿은 새것으로 바뀝니다.</p>
    <form class="form" id="importTplForm">
      ${rows.map((r, i) => {
        const p = parseTemplate(r.template);
        return `<fieldset class="imp" data-i="${i}">
          <legend>${esc(r.fileName)}</legend>
          <label class="switch">가져오기<input type="checkbox" class="imp-on" checked></label>
          <label>분류 이름<input class="imp-label" value="${esc(r.label)}"></label>
          <label>연결<select class="imp-target"><option value="__new"${r.target === "__new" ? " selected" : ""}>새 분류로 추가</option>${types.map((t) => `<option value="${t.key}"${r.target === t.key ? " selected" : ""}>기존 분류: ${esc(t.label)}</option>`).join("")}</select></label>
          <label class="imp-code-wrap"${r.target === "__new" ? "" : " hidden"}>ID 코드 <small>영문 대문자 1~3자</small><input class="imp-code" value="${esc(r.code)}" maxlength="3" autocomplete="off"></label>
          <label>설명<input class="imp-desc" value="${esc(r.desc)}"></label>
          <p class="meta" style="margin:0">속성 칸 ${p.fields.length}개 · 소제목 ${p.sections.length}개</p>
        </fieldset>`;
      }).join("")}
      <div class="sheet-actions">
        <button class="btn" type="button" data-imp="back">돌아가기</button>
        <button class="btn btn-primary" type="submit">가져오기</button>
      </div>
    </form>`, (root) => {
    root.addEventListener("change", (ev) => {
      if (ev.target.matches(".imp-target")) ev.target.closest(".imp").querySelector(".imp-code-wrap").hidden = ev.target.value !== "__new";
    });
    root.onclick = (ev) => { if (ev.target.closest('[data-imp="back"]')) openTypesSheet(); };
    root.onsubmit = async (ev) => {
      ev.preventDefault();
      if (state.busy) { toast("Claude가 작업 중입니다. 끝난 뒤에 바꿔 주세요"); return; }
      const list = worldTypes().map((t) => ({ ...t }));
      const done = [];
      for (const fs of $$(".imp", root)) {
        if (!$(".imp-on", fs).checked) continue;
        const r = rows[Number(fs.dataset.i)];
        const label = $(".imp-label", fs).value.trim();
        const target = $(".imp-target", fs).value;
        const desc = $(".imp-desc", fs).value.trim();
        if (!label) { toast(`${r.fileName}: 분류 이름을 넣어 주세요`); return; }
        if (target === "__new") {
          const code = $(".imp-code", fs).value.trim().toUpperCase();
          if (!CODE_RE.test(code)) { toast(`${r.fileName}: ID 코드는 영문 대문자로 시작하는 1~3자여야 합니다`); return; }
          if (list.some((t) => t.code === code)) { toast(`${r.fileName}: 코드 ${code}가 이미 쓰이고 있습니다`); return; }
          const used = new Set(list.map((t) => t.color));
          const color = ["c1", "c2", "c3", "c4", "c5", "c6", "c7", "c8"].find((c) => !used.has(c)) || "c1";
          list.push({ key: `u_${uid()}`, label, code, color, desc, template: r.template });
        } else {
          const t = list.find((x) => x.key === target);
          t.label = label;
          t.template = r.template;
          if (desc) t.desc = desc;
        }
        done.push(label);
      }
      const labels = list.map((t) => t.label.toLowerCase());
      const dup = labels.find((l, i) => labels.indexOf(l) !== i);
      if (dup) { toast(`'${dup}' 이름의 분류가 둘 이상입니다. 이름을 바꿔 주세요`); return; }
      if (!done.length) { toast("가져올 파일을 하나 이상 고르세요"); return; }
      await commitTypes(list, `템플릿 가져오기: ${done.join(", ")}`);
      openTypesSheet();
      toast(`템플릿 ${done.length}개를 가져왔습니다`);
    };
  });
}

function download(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function exportAll() {
  if (state.worldId) await Promise.all([persist.world(), persist.threads(), persist.conv(), persist.worlds()]);
  const data = { app: "lorekeeper", version: 1, exportedAt: new Date().toISOString(), worlds: [] };
  for (const w of state.worlds) {
    const threads = (await idb.get("threads:" + w.id)) || [];
    const convs = {};
    for (const t of threads) convs[t.id] = (await idb.get("conv:" + t.id)) || null;
    data.worlds.push({
      world: w,
      entries: (await idb.get("entries:" + w.id)) || [],
      log: (await idb.get("log:" + w.id)) || [],
      graph: (await idb.get("graph:" + w.id)) || null,
      threads,
      convs,
    });
  }
  download(`lorekeeper-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data), "application/json");
  toast("백업 파일을 만들었습니다");
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast("백업 파일을 읽을 수 없습니다"); return; }
  if (data?.app !== "lorekeeper" || !Array.isArray(data.worlds)) { toast("로어키퍼 백업 파일이 아닙니다"); return; }
  const clash = data.worlds.filter((x) => state.worlds.some((w) => w.id === x.world?.id));
  const msg = `세계관 ${data.worlds.length}개를 불러옵니다.${clash.length ? `\n이미 있는 ${clash.length}개는 백업 내용으로 덮어씁니다.` : ""}`;
  if (!(await confirmBox(msg, "불러오기"))) return;
  for (const x of data.worlds) {
    if (!x.world?.id) continue;
    const id = x.world.id;
    const i = state.worlds.findIndex((w) => w.id === id);
    if (i >= 0) state.worlds[i] = x.world; else state.worlds.push(x.world);
    await Promise.all([
      idb.set("entries:" + id, x.entries || []),
      idb.set("log:" + id, x.log || []),
      x.graph ? idb.set("graph:" + id, x.graph) : idb.del("graph:" + id),
      idb.set("threads:" + id, x.threads || []),
      ...Object.entries(x.convs || {}).filter(([, v]) => v).map(([tid, v]) => idb.set("conv:" + tid, v)),
    ]);
  }
  await persist.worlds();
  resetGraphCache(); // 불러온 관계도 위치를 다시 읽게 한다
  await openWorld(state.worldId && state.worlds.some((w) => w.id === state.worldId) ? state.worldId : state.worlds[0].id);
  renderSettings();
  toast("백업을 불러왔습니다");
}
function exportMarkdown() {
  const w = currentWorld();
  if (!w) return;
  const parts = [`# ${w.name}`, "", w.premise ? `> ${w.premise}` : "", "", w.tone ? `**분위기 · 문체**: ${w.tone}` : "", "", w.rules ? `## 세계 규칙\n\n${w.rules}` : ""];
  for (const k of typeKeys()) {
    const list = activeEntries().filter((e) => e.type === k).sort((a, b) => a.id.localeCompare(b.id));
    if (!list.length) continue;
    parts.push("", `## ${typeInfo(k).label}`);
    for (const e of list) {
      parts.push("", `### ${e.name} \`${e.id}\``);
      if (e.aliases?.length) parts.push(`*별칭: ${e.aliases.join(", ")}*`);
      parts.push("", e.summary || "");
      const f = Object.entries(e.fields || {});
      if (f.length) parts.push("", ...f.map(([kk, v]) => `- **${kk}**: ${v}`));
      if (e.body) parts.push("", e.body);
      const rel = (e.relations || []).map((r) => `- ${r.label} → ${nameOf(r.to)} (\`${r.to}\`)`);
      if (rel.length) parts.push("", "**관계**", ...rel);
      if (e.tags?.length) parts.push("", e.tags.map((t) => "#" + t).join(" "));
    }
  }
  const safe = w.name.replace(/[\\/:*?"<>|]/g, "_");
  download(`${safe}.md`, parts.join("\n").replace(/\n{3,}/g, "\n\n"), "text/markdown");
  toast("문서 파일을 만들었습니다");
}

    const chip = e.target.closest("[data-type]");
    if (chip && e.target.closest("#codex")) { state.codexType = chip.dataset.type; renderCodexResults(); return; }
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (!act) return;
    if (inSheet && !["new-world", "load-sample", "edit-world"].includes(act)) return;
    if (act === "new-world") openWorldForm(null);
    else if (act === "load-sample") loadSample();
    else if (act === "edit-world") { const w = currentWorld(); if (w) openWorldForm(w); }
    else if (act === "new-entry") { if (state.busy) toast("Claude가 작업 중입니다"); else openEditor(null); }
    else if (act === "trash") openTrash();
    else if (act === "types") openTypesSheet();
    else if (act === "retry") { if (!state.busy) runAgent(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("#dialog").hidden) return;
    if (!$("#sheet").hidden) closeSheet();
  });
  window.addEventListener("beforeunload", (e) => { if (state.busy) { e.preventDefault(); e.returnValue = ""; } });
}

async function init() {
  bindGlobal();
  bindGraph();
  updateCostBadge();
  state.worlds = (await idb.get("worlds")) || [];
  const want = LS.get("lk.world", null);
  const w = state.worlds.find((x) => x.id === want) || state.worlds[0];
  if (w) await openWorld(w.id);
  else { renderWorldName(); renderChat(); renderCodex(); }
  switchView(LS.get("lk.view", "chat"));
  if (idb.broken) toast("이 브라우저에서는 데이터가 저장되지 않습니다. 개인정보 보호 모드를 끄세요");
}
init();
</script>
</body>
</html>
