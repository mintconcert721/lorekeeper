<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#EEF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111719" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="로어키퍼">
<title>로어키퍼</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F7468'/%3E%3Cpath d='M20 14h24v36l-12-8-12 8z' fill='%23F3F7F5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 상단 세계관 바 · 가운데 작업 영역 · 하단 탭. 설정집은 기록 보관소의 색인 카드처럼 분류번호(C-001)로 정리한다. */
:root {
  --bg: #EEF0EC;
  --surface: #F8F9F6;
  --surface-2: #E2E7E1;
  --ink: #1D2A2E;
  --muted: #5B6A6A;
  --line: #CAD2CB;
  --accent: #2F7468;
  --accent-ink: #F3F7F5;
  --accent-soft: #D5E7E1;
  --danger: #A33A2F;
  --danger-soft: #F3DEDA;
  --user-bubble: #DCE5EC;
  --backdrop: rgba(12, 20, 22, .45);
  --shadow: 0 6px 24px rgba(20, 32, 34, .14);
  --t-character: #8B4A7E;
  --t-place: #33689A;
  --t-faction: #A24E2A;
  --t-species: #557A2E;
  --t-event: #8E6D12;
  --t-item: #5B57A8;
  --t-concept: #2F7468;
  --t-other: #66706F;
  --t-c1: #A8475A;
  --t-c2: #2C7A8A;
  --t-c3: #76691C;
  --t-c4: #6A4E9E;
  --t-c5: #B05F2B;
  --t-c6: #3B7A4D;
  --t-c7: #9C4379;
  --t-c8: #4A6278;
  --font-display: "Hahmlet", "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111719;
    --surface: #182023;
    --surface-2: #222C2F;
    --ink: #E2E8E4;
    --muted: #93A19F;
    --line: #2F3B3D;
    --accent: #6DBCAD;
    --accent-ink: #0D1917;
    --accent-soft: #1D3833;
    --danger: #E58374;
    --danger-soft: #3A2220;
    --user-bubble: #22313B;
    --backdrop: rgba(0, 0, 0, .6);
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    --t-character: #D493C6;
    --t-place: #86B6E3;
    --t-faction: #E79A72;
    --t-species: #A6CB7A;
    --t-event: #D9B85A;
    --t-item: #A9A5EE;
    --t-concept: #6DBCAD;
    --t-other: #A5AFAE;
    --t-c1: #E8919F;
    --t-c2: #7CC4D2;
    --t-c3: #D0C26A;
    --t-c4: #B9A2EA;
    --t-c5: #EBA470;
    --t-c6: #8CCB9C;
    --t-c7: #E39BC8;
    --t-c8: #9DB3C8;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 var(--font-body);
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

#app {
  position: fixed;
  left: 0; right: 0;
  top: var(--app-top, 0px);
  height: var(--app-h, 100dvh);
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-columns: minmax(0, 1fr);
  background: var(--bg);
}

/* 상단 바 */
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) var(--gutter-r) 8px var(--gutter-l);
  border-bottom: 1px solid var(--line);
}
.world-switch {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: flex-start;
  background: none; border: 0; padding: 2px 0; text-align: left;
}
.eyebrow { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.world-switch .name {
  font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1.3;
  max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.world-switch .name::after { content: " ▾"; font-size: 12px; color: var(--muted); }
.cost-badge {
  border: 0; border-radius: 999px; padding: 4px 10px;
  background: var(--surface-2); color: var(--muted);
  font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums;
}

/* 본문 / 뷰 */
main { min-height: 0; min-width: 0; position: relative; }
.view { height: 100%; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; min-width: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pad { padding: 16px var(--gutter-r) 32px var(--gutter-l); }

/* 하단 탭 */
.tabbar {
  display: grid; grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--line); background: var(--surface);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar button {
  background: none; border: 0; padding: 8px 0 10px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 12px; color: var(--muted);
}
.tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 600; }
@media (pointer: coarse) { body.kb-open .tabbar { display: none; } }

/* 공통 버튼 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 14px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); font-size: 14px; font-weight: 500;
}
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-danger { color: var(--danger); }
.btn-danger-solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn-ghost { background: none; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn-small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }

/* 대화 */
.thread-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 6px var(--gutter-r) 6px var(--gutter-l);
  border-bottom: 1px solid var(--line);
  font-size: 13px; color: var(--muted);
}
.thread-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctx-meter { font: 12px var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ctx-meter.warn { color: var(--danger); }
.chat-log {
  display: flex; flex-direction: column; gap: 18px;
  padding: 16px var(--gutter-r) 24px var(--gutter-l);
}
.msg-user {
  align-self: flex-end; max-width: 86%;
  background: var(--user-bubble);
  padding: 10px 14px; border-radius: 16px 16px 4px 16px;
  display: flex; flex-direction: column; gap: 8px;
}
.msg-text { white-space: pre-wrap; }
.msg-files { display: flex; flex-wrap: wrap; gap: 6px; }
.msg-thumb { padding: 0; border: 0; background: none; border-radius: 10px; overflow: hidden; width: 96px; height: 96px; }
.msg-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.file-chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0;
  padding: 4px 10px 4px 6px; border-radius: 8px; background: var(--surface); font-size: 13px;
}
.file-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ftype {
  flex: none; font: 600 10px var(--font-mono); letter-spacing: .04em;
  color: var(--accent-ink); background: var(--accent); border-radius: 4px; padding: 2px 4px;
}
.preview-img { width: 100%; border-radius: 12px; display: block; }
.msg-assistant { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.msg-meta { font: 11px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.status-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.status-line::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .status-line::before { animation: none; } }
.thinking { border-left: 2px solid var(--line); padding-left: 10px; color: var(--muted); font-size: 13px; }
.thinking summary { cursor: pointer; list-style: none; font-size: 12px; letter-spacing: .04em; }
.thinking summary::-webkit-details-marker { display: none; }
.thinking summary::before { content: "▸ "; }
.thinking[open] summary::before { content: "▾ "; }
.thinking-body { margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.action-chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); padding: 3px 10px 3px 8px;
  font-size: 12.5px; text-align: left;
}
.action-chip .glyph { font: 600 12px var(--font-mono); color: var(--accent); }
.action-chip.read { background: none; color: var(--muted); }
.action-chip.read .glyph { color: var(--muted); }
.action-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note { margin: 0; font-size: 13px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); }
.note-error { background: var(--danger-soft); color: var(--danger); }
.retry-row { display: flex; justify-content: center; }
.quick-replies { display: flex; flex-direction: column; gap: 8px; }
.qr-row { display: flex; gap: 6px; align-items: stretch; }
.qr {
  flex: 1; min-width: 0; text-align: left;
  border: 1px solid var(--accent); border-radius: 12px;
  background: var(--accent-soft); color: var(--ink);
  padding: 10px 14px; font-size: 14.5px; line-height: 1.45;
}
.qr:active { transform: translateY(1px); }
.qr-toggle { display: flex; align-items: flex-start; gap: 10px; background: var(--surface); border-color: var(--line); }
.qr-toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.qr-box { flex: none; width: 18px; height: 18px; margin-top: 2px; border: 1.5px solid var(--muted); border-radius: 5px; }
.qr-toggle[aria-pressed="true"] .qr-box { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--accent-soft); }
@media (prefers-reduced-motion: reduce) { .qr:active { transform: none; } }
.composer-wrap { border-top: 1px solid var(--line); background: var(--surface); }
.banner {
  margin: 8px var(--gutter-r) 0 var(--gutter-l);
  padding: 8px 12px; border-radius: 10px;
  background: var(--accent-soft); font-size: 13px;
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
}
.composer {
  display: flex; gap: 8px; align-items: flex-end;
  padding: 8px var(--gutter-r) 8px var(--gutter-l);
}
.composer textarea {
  flex: 1; min-width: 0; resize: none; max-height: 200px;
  border: 1px solid var(--line); border-radius: 14px;
  padding: 9px 12px; background: var(--bg);
  font-size: 16px; line-height: 1.45;
}
.composer .btn { min-height: 42px; border-radius: 14px; }
.attach-btn { flex: none; display: grid; place-items: center; width: 42px; min-height: 42px; border-radius: 14px; }
.attach-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.attach-tray { display: flex; gap: 8px; overflow-x: auto; padding: 8px var(--gutter-r) 0 var(--gutter-l); scrollbar-width: none; }
.attach-tray::-webkit-scrollbar { display: none; }
.att {
  flex: none; display: flex; align-items: center; gap: 8px; max-width: 250px;
  padding: 6px 2px 6px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
}
.att img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex: none; }
.att .ftype { width: 40px; height: 40px; display: grid; place-items: center; font-size: 11px; padding: 0; border-radius: 8px; }
.att-meta { display: flex; flex-direction: column; min-width: 0; }
.att-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-sub { font: 11px var(--font-mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.att-x { flex: none; border: 0; background: none; color: var(--muted); width: 34px; height: 34px; font-size: 18px; }
.attach-note { margin: 6px var(--gutter-r) 0 var(--gutter-l); font-size: 12px; color: var(--danger); }
#view-chat.dragging .composer-wrap { outline: 2px dashed var(--accent); outline-offset: -4px; }
.empty-chat { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.empty-chat h2 { margin: 0; font: 700 22px/1.35 var(--font-display); text-wrap: balance; }
.empty-chat p { margin: 0; color: var(--muted); }
.suggestions { display: flex; flex-direction: column; gap: 8px; }
.suggestion {
  text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: 12px; padding: 10px 14px; font-size: 14px;
}

/* 마크다운 */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 .7em; }
.md h3, .md h4, .md h5, .md h6 { font-family: var(--font-display); margin: 1em 0 .4em; line-height: 1.35; text-wrap: balance; }
.md h3 { font-size: 18px; } .md h4 { font-size: 16px; } .md h5, .md h6 { font-size: 15px; }
.md ul, .md ol { margin: 0 0 .7em; padding-left: 1.3em; }
.md li { margin: .15em 0; }
.md blockquote { margin: 0 0 .7em; padding: 4px 12px; border-left: 3px solid var(--accent); color: var(--muted); }
.md code { font: 13px var(--font-mono); background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.md pre { overflow-x: auto; background: var(--surface-2); padding: 10px 12px; border-radius: 10px; }
.md pre code { background: none; padding: 0; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
.ref {
  border: 0; background: var(--accent-soft); color: var(--accent);
  font: 600 12px var(--font-mono); padding: 1px 6px; border-radius: 6px; vertical-align: 1px;
}

/* 설정집 */
.world-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;
}
.world-card h2 { margin: 0; font: 700 20px/1.35 var(--font-display); text-wrap: balance; }
.world-card .label { font-size: 11px; letter-spacing: .08em; color: var(--muted); margin-top: 4px; }
.world-card p { margin: 0; }
.codex-tools { display: flex; gap: 8px; margin: 16px 0 10px; }
.codex-tools input {
  flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); padding: 8px 12px; font-size: 16px;
}
.type-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.type-chips::-webkit-scrollbar { display: none; }
.type-chip {
  flex: none; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 4px 12px; font-size: 13px;
}
.type-chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.type-chip .n { font: 11px var(--font-mono); opacity: .7; margin-left: 4px; }
.group-title {
  margin: 20px 0 8px; font-size: 12px; letter-spacing: .08em; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.group-title::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.entry-list { display: flex; flex-direction: column; gap: 8px; }
.entry-card {
  width: 100%; text-align: left;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 14px;
}
.catno { font: 600 12px var(--font-mono); color: var(--tc, var(--muted)); font-variant-numeric: tabular-nums; padding-top: 3px; }
.entry-card .ename { font-weight: 600; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-card .esum { grid-column: 2; color: var(--muted); font-size: 13.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.entry-card .etags { grid-column: 2; font-size: 12px; color: var(--muted); }
.empty-state { text-align: center; color: var(--muted); padding: 32px 8px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty-state h3 { margin: 0; font: 700 18px var(--font-display); color: var(--ink); }

/* 시트 */
.sheet { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--backdrop); }
.sheet-panel {
  position: relative; width: 100%; max-width: 760px; margin: 0 auto;
  max-height: 92%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 6px var(--gutter-r) calc(20px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
}
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 6px auto 14px; }
.sheet-title { margin: 0 0 12px; font: 700 20px/1.35 var(--font-display); }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.entry-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.entry-head .catno { padding: 0; }
.entry-name { margin: 4px 0 2px; font: 700 24px/1.3 var(--font-display); text-wrap: balance; }
.aliases { margin: 0; color: var(--muted); font-size: 13px; }
.summary { margin: 10px 0; font-size: 15px; }
.fields { margin: 12px 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.fields > div { display: grid; grid-template-columns: minmax(70px, 30%) minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.fields dt { color: var(--muted); font-size: 13px; }
.fields dd { margin: 0; }
.section-label { margin: 18px 0 6px; font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.rel-list { display: flex; flex-direction: column; gap: 6px; }
.rel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; }
.rel .lbl { color: var(--muted); font-size: 13px; }
.tag { font-size: 13px; color: var(--accent); margin-right: 8px; }
.meta { margin: 14px 0 0; font-size: 12px; color: var(--muted); }
.pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); }
.pill-danger { background: var(--danger-soft); color: var(--danger); }
.list-plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.list-item {
  width: 100%; text-align: left; display: flex; flex-direction: column; gap: 2px;
  border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 14px;
}
.list-item.current { border-color: var(--accent); }
.list-item .t { font-weight: 600; }
.list-item .s { font-size: 13px; color: var(--muted); }
.list-row { display: flex; gap: 8px; align-items: stretch; }
.list-row .list-item { flex: 1; min-width: 0; }

/* 폼 */

const SYSTEM_V1 = `너는 '로어키퍼'라는 모바일 앱 안에서 일하는 세계관 공동 작가이자 설정 편집자다. 사용자와 대화하며 창작 세계관(세계 개요, 인물, 장소, 세력, 종족, 사건, 사물, 개념)을 함께 만들고, 앱의 설정집에 정리해 저장한다.

## 설정집 다루는 법
- 설정집은 도구로만 읽고 쓴다. 대화의 첫 메시지에는 앱이 자동으로 붙인 [설정집 현황]이 있다. 항목은 분류번호 id(예: C-001)로 가리킨다.
- 기존 항목을 고치기 전에는 get_entries로 최신 내용을 읽는다. 새 항목을 만들기 전에는 같은 대상이 이미 있는지 확인한다.
- 사용자가 직접 말한 설정, 또는 네 제안 중 사용자가 고른 것은 바로 저장한다. 네가 새로 떠올린 아이디어는 먼저 제안하고, 사용자가 받아들이면 저장한다. 사용자가 "알아서 채워줘"처럼 맡기면 바로 저장해도 된다.
- 한 정보는 가장 알맞은 항목 한 곳에 저장하고, 항목 사이의 연결은 set_relation으로 표현한다.
- summary는 목록만 봐도 무엇인지 알 수 있는 한 줄로 쓴다. fields에는 짧은 사실(나이, 소속, 위치, 외모, 말투 등)을, body에는 서술과 배경 이야기를 담는다.
- 삭제는 사용자가 분명히 요청했을 때만 한다.
- [앱 알림]으로 사용자가 직접 수정한 내용이 전달되면 그것을 최신 설정으로 받아들인다.

## 일관성
- 새 설정이 기존 설정이나 세계 규칙과 충돌하면, 저장하기 전에 어느 항목의 어떤 내용과 부딪히는지 짚고 해결 방법을 2~3가지 제안한다.
- 연표, 나이, 거리, 인물 관계처럼 숫자와 사실이 얽힌 부분은 특히 꼼꼼히 맞춘다.

## 창작 태도

const idb = (() => {
  const mem = new Map();
  let dbp = null;
  let broken = false;
  const open = () => {
    if (!dbp) {
      dbp = new Promise((res, rej) => {
        try {
          const r = indexedDB.open("lorekeeper", 1);
          r.onupgradeneeded = () => r.result.createObjectStore("kv");
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        } catch (e) { rej(e); }
      }).catch((e) => { broken = true; console.warn("IndexedDB 사용 불가", e); return null; });
    }
    return dbp;
  };
  const run = async (mode, fn, fallback) => {
    const db = await open();
    if (!db) return fallback();
    return new Promise((res, rej) => {
      const t = db.transaction("kv", mode);
      const req = fn(t.objectStore("kv"));
      t.oncomplete = () => res(req?.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  };
  return {
    get: (k) => run("readonly", (s) => s.get(k), () => mem.get(k)),
    set: (k, v) => run("readwrite", (s) => s.put(v, k), () => { mem.set(k, v); }),
    del: (k) => run("readwrite", (s) => s.delete(k), () => { mem.delete(k); }),
    get broken() { return broken; },
  };
})();

// 템플릿 해석: "- 이름: 설명" 줄은 속성(fields) 키, "## 제목"은 본문 소제목, ">"로 시작하는 줄은 작성 안내.
function splitFrontmatter(text) {
  const src = String(text || "").replace(/^﻿/, "").replace(/\r\n?/g, "\n");
  const m = src.match(/^---\n([\s\S]*?)\n---\n?/);
  if (!m) return { meta: {}, body: src.trim() };
  const meta = {};
  for (const line of m[1].split("\n")) {
    const kv = line.match(/^\s*([^:：]+?)\s*[:：]\s*(.*?)\s*$/);
    if (kv) meta[kv[1].trim().toLowerCase()] = kv[2].replace(/^["']|["']$/g, "");
  }
  return { meta, body: src.slice(m[0].length).trim() };
}
function parseTemplate(md) {
  const fields = [];
  const sections = [];
  for (const line of String(md || "").split("\n")) {
    let m;
    if ((m = line.match(/^\s*#{2,4}\s+(.+?)\s*#*\s*$/))) { if (!sections.includes(m[1])) sections.push(m[1]); continue; }
    if ((m = line.match(/^\s*[-*]\s+(?:\*\*)?([^:：\n*]{1,30}?)(?:\*\*)?\s*[:：]\s*(.*)$/))) {
      const key = m[1].trim();
      if (key && !fields.some((f) => f.key === key)) fields.push({ key, hint: m[2].trim() });
    }
  }
  return { fields, sections };
}
function templateSkeletonBody(md) {
  return parseTemplate(md).sections.map((s) => `## ${s}\n`).join("\n").trim();
}
function bodyHeadings(body) {
  return new Set(String(body || "").split("\n").map((l) => l.match(/^\s*#{2,4}\s+(.+?)\s*#*\s*$/)?.[1]).filter(Boolean));
}
const isBlankValue = (v) => !String(v ?? "").trim() || /^\(?\s*미정\s*\)?$/.test(String(v).trim());
function templateGaps(e) {
  const t = typeInfo(e.type);
  if (!t.template) return null;
  const { fields, sections } = parseTemplate(t.template);
  const heads = bodyHeadings(e.body);
  return {
    label: t.label,
    fields: fields.filter((f) => isBlankValue(e.fields?.[f.key])).map((f) => f.key),
    sections: sections.filter((s) => !heads.has(s)),
    total: fields.length + sections.length,
  };
}
// 빠진 속성 키와 소제목을 덧붙인다(기존 내용은 그대로 둔다).
function mergeTemplate(fieldsIn, bodyIn, md) {
  const { fields, sections } = parseTemplate(md);
  const out = { ...fieldsIn };
  for (const f of fields) if (!(f.key in out)) out[f.key] = "";
  const heads = bodyHeadings(bodyIn);
  const add = sections.filter((s) => !heads.has(s)).map((s) => `## ${s}\n`).join("\n");
  const body = add ? `${String(bodyIn || "").trimEnd()}${bodyIn && bodyIn.trim() ? "\n\n" : ""}${add}`.trim() : bodyIn;
  return { fields: out, body };
}
function templateFileText(t) {
  return `---\n분류: ${t.label}\n코드: ${t.code}\n설명: ${t.desc || ""}\n---\n\n${t.template || ""}\n`;
}

function findEntry(ref) {

function nextId(type) {

  const code = typeInfo(type).code;

function snapshot(e) { const { history, ...rest } = e; return clone(rest); }

function assertUniqueName(type, name, exceptId) {

function createEntry(d, by) {

  assertUniqueName(d.type, name);
  const now = Date.now();
  const e = {
    id: nextId(d.type), type: d.type, name,
    aliases: d.aliases || [], summary: String(d.summary || "").trim(),
    fields: d.fields || {}, body: d.body || "", tags: d.tags || [],
    relations: d.relations || [],

  a.relations.push({ to: toId, label });

  if (keep.length === before) return 0;
  pushHistory(a, by, "관계 삭제");
  a.relations = keep;
  a.updatedAt = Date.now(); a.updatedBy = by;
  logChange(by, "relation", a, `삭제 → ${toId}`);

}

  e.updatedAt = Date.now(); e.updatedBy = "user";

function scoreEntry(e, terms) {
  const hay = {
    name: e.name.toLowerCase(),

    tags: (e.tags || []).join(" ").toLowerCase(),
    sum: (e.summary || "").toLowerCase(),
    fields: Object.entries(e.fields || {}).flat().join(" ").toLowerCase(),
    body: (e.body || "").toLowerCase(),
    id: e.id.toLowerCase(),

  let total = 0;
  for (const t of terms) {
    let s = 0;
    if (hay.id === t) s += 20;
    if (hay.name.includes(t)) s += 10;
    if (hay.alias.includes(t)) s += 8;
    if (hay.tags.includes(t)) s += 5;
    if (hay.sum.includes(t)) s += 3;
    if (hay.fields.includes(t)) s += 2;

}

  if (e.body) lines.push("본문:", e.body);
  const out = (e.relations || []).map((r) => `- ${r.label} → ${r.to} ${nameOf(r.to)}`);
  const inc = incoming(e.id).map(({ from, label }) => `- ${from.id} ${from.name}의 ${label} (상대 쪽에서 맺은 관계)`);
  if (out.length || inc.length) lines.push("관계:", ...out, ...inc);

function validateInput(schema, input) {

  for (const [k, v] of Object.entries(input)) {
    const p = schema.properties[k];
    if (!p) continue;
    if (p.type === "string" && typeof v !== "string") return `'${k}'는 문자열이어야 합니다.`;
    if (p.enum && !p.enum.includes(v)) return `'${k}' 값이 올바르지 않습니다: ${v}`;
    if (p.type === "boolean" && typeof v !== "boolean") return `'${k}'는 true/false여야 합니다.`;
    if (p.type === "array" && (!Array.isArray(v) || v.some((x) => typeof x !== "string"))) return `'${k}'는 문자열 배열이어야 합니다.`;
    if (p.type === "object" && (typeof v !== "object" || v === null || Array.isArray(v) || Object.values(v).some((x) => typeof x !== "string"))) return `'${k}'는 문자열 값을 가진 객체여야 합니다.`;
  }
  return null;
}

const TOOL_IMPL = {
  search_entries({ query, type }) {
    let list = activeEntries();
    if (type) {
      const t = findType(type);
      if (!t) throw new Error(`분류 '${type}'가 없습니다. 쓸 수 있는 분류: ${worldTypes().map((x) => x.label).join(", ")}`);
      list = list.filter((e) => e.type === t.key);
    }
    const q = (query || "").trim().toLowerCase();
    if (q) {
      const terms = q.split(/\s+/);
      list = list.map((e) => ({ e, s: scoreEntry(e, terms) })).filter((x) => x.s > 0).sort((a, b) => b.s - a.s).map((x) => x.e);
    }
    const shown = list.slice(0, q ? 40 : 300);
    const head = list.length ? `${list.length}개 항목${list.length > shown.length ? `, 앞의 ${shown.length}개만 표시` : ""}:` : "일치하는 항목이 없습니다.";
    return {
      content: [head, ...shown.map(indexLine)].join("\n"),
      action: { kind: "read", text: q ? `검색 · ${query}` : "목록 확인" },
    };
  },
  get_entries({ ids }) {
    const found = [];
    const missing = [];
    for (const id of ids.slice(0, 20)) { const e = findEntry(id); if (e) found.push(e); else missing.push(id); }
    let content = found.map(entryToText).join("\n\n");
    if (missing.length) content += `\n\n찾을 수 없는 id: ${missing.join(", ")}`;
    return {
      content: content.trim(),
      is_error: !found.length,
      action: found.length ? { kind: "read", text: `읽음 · ${found.map((e) => e.name).join(", ")}` } : null,
    };
  },
  create_entry(input) {
    const t = findType(input.type);
    if (!t) throw new Error(`분류 '${input.type}'가 없습니다. 쓸 수 있는 분류: ${worldTypes().map((x) => x.label).join(", ")}`);
    const e = createEntry({ ...input, type: t.key }, "claude");
    const gaps = templateGaps(e);
    const note = gaps && (gaps.fields.length || gaps.sections.length)
      ? `\n템플릿에서 아직 비어 있는 칸: ${[...gaps.fields, ...gaps.sections.map((s) => "## " + s)].join(", ")}`
      : "";
    return { content: `생성됨: ${e.id} (${t.label} · ${e.name})${note}`, action: { kind: "create", text: `${t.label} ${e.name}`, ref: e.id }, changed: true };
  },
  update_entry(input) {
    const e = findEntry(input.id);
    if (!e || e.deleted) throw new Error(`${input.id} 항목이 없습니다. search_entries로 id를 확인하세요.`);
    if (input.body !== undefined && input.append_body !== undefined) throw new Error("body와 append_body는 함께 쓸 수 없습니다.");
    const patch = { ...input };
    if (input.type !== undefined) {
      const t = findType(input.type);
      if (!t) throw new Error(`분류 '${input.type}'가 없습니다. 쓸 수 있는 분류: ${worldTypes().map((x) => x.label).join(", ")}`);
      patch.type = t.key;
    }
    updateEntry(e, patch, "claude", input.reason);
    return { content: `수정됨: ${e.id} (${e.name})`, action: { kind: "update", text: `${typeInfo(e.type).label} ${e.name}`, ref: e.id }, changed: true };
  },
  list_types() {
    return { content: `분류 ${worldTypes().length}개:\n${typeListText()}`, action: { kind: "read", text: "분류 목록 확인" } };
  },
  get_template({ type }) {
    const t = findType(type);
    if (!t) throw new Error(`분류 '${type}'가 없습니다. 쓸 수 있는 분류: ${worldTypes().map((x) => x.label).join(", ")}`);
    if (!t.template.trim()) return { content: `'${t.label}' 분류에는 템플릿이 없다. 자유 형식으로 쓴다.`, action: { kind: "read", text: `템플릿 · ${t.label}` } };
    const { fields, sections } = parseTemplate(t.template);
    return {
      content: [
        `# ${t.label} 템플릿`,
        `속성(fields) 키: ${fields.length ? fields.map((f) => f.key).join(", ") : "(없음)"}`,
        `본문 소제목: ${sections.length ? sections.join(", ") : "(없음)"}`,
        "",
        "--- 템플릿 원문 ---",
        t.template,
      ].join("\n"),
      action: { kind: "read", text: `템플릿 · ${t.label}` },
    };
  },
  set_relation({ from_id, to_id, label, reverse_label, remove }) {
    const a = findEntry(from_id);
    const b = findEntry(to_id);
    if (!a || a.deleted) throw new Error(`${from_id} 항목이 없습니다.`);
    if (!b || b.deleted) throw new Error(`${to_id} 항목이 없습니다.`);
    if (a === b) throw new Error("자기 자신과는 관계를 맺을 수 없습니다.");
    if (remove) {
      const n = removeRelation(a, b.id, label?.trim(), "claude");
      return {
        content: n ? `관계 삭제: ${a.id} → ${b.id}` : "지울 관계가 없습니다.",
        action: n ? { kind: "relation", text: `${a.name} ⇢ ${b.name} 관계 삭제`, ref: a.id } : null,
        changed: !!n,
      };
    }
    if (!label || !label.trim()) throw new Error("label이 필요합니다.");
    addRelation(a, b.id, label.trim(), "claude");
    if (reverse_label && reverse_label.trim()) addRelation(b, a.id, reverse_label.trim(), "claude");
    return {
      content: `관계 저장: ${a.id} -[${label.trim()}]-> ${b.id}${reverse_label ? `, ${b.id} -[${reverse_label.trim()}]-> ${a.id}` : ""}`,
      action: { kind: "relation", text: `${a.name} → ${label.trim()} → ${b.name}`, ref: a.id },
      changed: true,
    };
  },
  delete_entry({ id, reason }) {
    const e = findEntry(id);
    if (!e || e.deleted) throw new Error(`${id} 항목이 없습니다.`);
    trashEntry(e, "claude", reason);
    return { content: `휴지통으로 옮김: ${e.id} (${e.name})`, action: { kind: "delete", text: `${typeInfo(e.type).label} ${e.name}`, ref: e.id }, changed: true };
  },
  suggest_replies() {
    // 다른 도구와 섞여 호출된 경우에만 여기로 온다. 단독 호출은 runAgent에서 처리한다.
    return { content: "표시하지 않았다: 다른 도구와 같은 차례에 호출됐다. 모든 작업과 답변을 마친 뒤 맨 마지막에 suggest_replies만 단독으로 호출할 것.", is_error: true };
  },
  update_world(input) {
    const w = currentWorld();
    for (const k of ["name", "premise", "tone", "rules"]) if (input[k] !== undefined) w[k] = input[k];
    w.updatedAt = Date.now();
    logChange("claude", "world", null, "세계관 개요 수정");
    return { content: "세계관 개요를 고쳤습니다.\n" + worldOverviewText(w), action: { kind: "world", text: "세계관 개요" }, changed: true };
  },
};

function runTool(name, input, tools) {
  const tool = tools.find((t) => t.name === name);
  if (!tool) return { content: `알 수 없는 도구: ${name}`, is_error: true };
  const problem = validateInput(tool.input_schema, input);
  if (problem) return { content: JSON.stringify({ error: problem, INVALID_JSON: JSON.stringify(input) }), is_error: true };
  try {
    return TOOL_IMPL[name](input);
  } catch (err) {
    return { content: String(err?.message || err), is_error: true };
  }
}

/* ============================================================
   7. Claude 호출
   ============================================================ */
function calcCost(u, modelId) {
  const p = PRICES[modelId] || PRICES[settings.model];
  const inTok = u?.input_tokens || 0;
  const cw = u?.cache_creation_input_tokens || 0;
  const cr = u?.cache_read_input_tokens || 0;
  const out = u?.output_tokens || 0;
  let pin = p.in, pout = p.out, pcr = p.cacheRead;
  if (modelId === "claude-haiku-5-5" && inTok + cw + cr > 100000) { pin = 0.5; pout = 2.5; pcr = 0.05; }
  return (inTok * pin + cw * pin * 1.25 + cr * pcr + out * pout) / 1e6;
}
function addCost(v) {
  cost.total += v;
  cost.months[monthKey()] = (cost.months[monthKey()] || 0) + v;
  cost.requests += 1;
  saveCost();
  updateCostBadge();
}

// 대화의 프롬프트 버전. 새 대화는 최신 버전으로 시작하고, 끝까지 그 버전을 쓴다.
function threadVersion(thread) {
  if (thread.promptVersion) return thread.promptVersion;
  let v = 1;
  for (const r of PROMPT_RELEASES) if ((thread.createdAt || 0) >= r.at) v = r.v;
  const usedSuggest = state.conv.api.some((m) => Array.isArray(m.content) && m.content.some((b) => b.type === "tool_use" && b.name === SUGGEST));
  if (v < 2 && usedSuggest) v = 2;
  thread.promptVersion = v; // 한 번 정하면 고정한다
  return v;
}
function promptSetFor(thread) {
  return PROMPT_SETS[thread ? threadVersion(thread) : PROMPT_CURRENT] || PROMPT_SETS[PROMPT_CURRENT];
}

function buildParams(thread) {
  const m = PRICES[settings.model];
  const set = promptSetFor(thread);
  const params = {
    model: settings.model,
    max_tokens: 64000,
    system: [{ type: "text", text: set.system, cache_control: { type: "ephemeral" } }],
    tools: set.tools,
    messages: state.conv.api.slice(),
    thinking: {
      type: "adaptive",
      display: settings.showThinking ? "summarized" : "omitted",
      // 기록이 어긋나더라도 오류 대신 해당 thinking 블록만 버리고 계속한다(안전장치).
      block_binding: { prefix_mismatch_behavior: "drop_block" },
    },
    output_config: { effort: settings.effort },
    cache_control: { type: "ephemeral" },
    betas: ["thinking-binding-controls-2026-08-01"],
  };
  if (m?.fallback) {
    // 안전 정책 오판으로 거절되면 서버가 권장 모델로 자동 재시도한다.
    params.betas.push("server-side-fallback-2026-07-01");
    params.fallbacks = "default";
  }
  return params;
}

function contextNoteFor(thread) {
  const w = currentWorld();
  const v = threadVersion(thread);
  if (!thread.contextSent) {
    const list = activeEntries();
    const shown = list.slice(0, 400);
    const lines = [
      "[설정집 현황 · 앱이 자동으로 첨부함]",
      worldOverviewText(w),
      "",
    ];
    if (v >= 4) lines.push("분류 목록 (항목을 만들 때 이 중 하나를 쓴다. 템플릿이 있는 분류는 get_template로 구조를 확인한다):", typeListText(), "");
    lines.push(
      `항목 ${list.length}개${list.length > shown.length ? ` (앞의 ${shown.length}개만 표시, 나머지는 search_entries로 찾을 것)` : ""}:`,
      ...(shown.length ? shown.map(indexLine) : ["(아직 없음)"]),
    );
    return lines.join("\n");
  }
  // 분류·템플릿 변경 알림은 그 도구를 가진 대화(버전 4 이상)에만 보낸다.
  const changes = state.log.filter((c) => c.by === "user" && c.at > (thread.syncedAt || 0) && (c.action !== "types" || v >= 4));
  if (!changes.length) return null;
  const label = { create: "추가", update: "수정", delete: "삭제", restore: "복구", purge: "완전 삭제", relation: "관계 변경", world: "세계관 개요 수정", types: "분류·템플릿 변경" };
  const seen = new Set();
  const lines = [];
  for (const c of changes.slice().reverse()) {
    const key = (c.id || "world") + c.action + (c.action === "types" ? c.note : "");
    if (seen.has(key)) continue;
    seen.add(key);
    if (c.id) lines.push(`- ${c.id} ${c.name}: ${label[c.action] || c.action}`);
    else if (c.action === "types") lines.push(`- ${label.types}: ${c.note}`);
    else lines.push(`- ${label[c.action] || c.action}`);
  }
  const typesChanged = changes.some((c) => c.action === "types");
  const head = typesChanged
    ? "[앱 알림: 사용자가 대화 밖에서 직접 바꾼 내용. 필요하면 get_entries로 최신 내용을 읽고, 분류나 템플릿이 바뀌었으면 list_types와 get_template로 다시 확인할 것]"
    : "[앱 알림: 사용자가 대화 밖에서 직접 바꾼 내용. 필요하면 get_entries로 최신 내용을 읽을 것]";
  return [head, ...lines.reverse()].join("\n");
}

function apiMessage(err) {
  return err?.error?.error?.message || err?.message || String(err);
}
function describeError(err) {
  if (err instanceof Anthropic.AuthenticationError) return "API 키가 올바르지 않습니다. 설정에서 키를 확인하세요.";
  if (err instanceof Anthropic.PermissionDeniedError) return "이 API 키로는 이 모델을 쓸 권한이 없습니다. 설정에서 다른 모델을 고르거나 Console 권한을 확인하세요.";
  if (err instanceof Anthropic.NotFoundError) return "모델을 찾을 수 없습니다. 설정에서 모델을 확인하세요.";
  if (err instanceof Anthropic.RateLimitError) return "요청 한도에 걸렸습니다. 잠시 후 다시 시도하세요.";
  if (err instanceof Anthropic.BadRequestError) {
    const m = apiMessage(err);
    return /credit/i.test(m) ? `크레딧이 부족합니다. Console의 Billing에서 잔액을 확인하세요. (${m})` : `요청이 거부되었습니다: ${m}`;
  }
  if (err instanceof Anthropic.InternalServerError) return `Anthropic 서버가 일시적으로 응답하지 않습니다(${err.status}). 잠시 후 다시 시도하세요.`;
  if (err instanceof Anthropic.APIConnectionError) return "네트워크에 연결할 수 없습니다. 인터넷 연결을 확인하세요.";
  if (err instanceof Anthropic.APIError && err.status === 413) return "요청이 너무 큽니다(최대 32MB). 첨부가 많은 대화라면 새 대화에서 다시 시도하세요.";
  if (err instanceof Anthropic.APIError) return `API 오류 ${err.status ?? ""}: ${apiMessage(err)}`;
  return `오류: ${err?.message || err}`;
}

// 대답 추천 도구의 결과는 사용자의 다음 메시지 맨 앞에 붙여 보낸다(추가 API 호출 없이 차례를 끝내기 위해).
function pendingResults(picked) {
  const pending = state.conv.pending;
  if (!pending?.length) return [];
  return pending.map(({ id, ok }) => (ok
    ? { type: "tool_result", tool_use_id: id, content: picked ? "사용자가 추천한 대답 중에서 골랐다. 대답은 이어지는 메시지에 있다." : "사용자가 추천 대신 직접 입력했다. 대답은 이어지는 메시지에 있다." }
    : { type: "tool_result", tool_use_id: id, content: "입력이 올바르지 않아 표시하지 못했다. options는 비어 있지 않은 문자열 배열이어야 한다.", is_error: true }));
}
function currentSuggest() {
  if (!state.conv.pending?.length) return null;
  const last = state.conv.display[state.conv.display.length - 1];
  return last && last.role === "assistant" && last.suggest ? last.suggest : null;
}

function canSend() {
  if (state.busy) return false;
  if (!settings.apiKey) { toast("설정에서 API 키를 먼저 넣으세요"); switchView("settings"); return false; }
  if (!currentWorld()) { toast("먼저 세계관을 만드세요"); openWorldSheet(); return false; }
  if (attachments.some((a) => a.status !== "ready")) { toast("첨부 파일을 준비하는 중입니다. 잠시 후 보내세요"); return false; }
  return true;
}

async function sendMessage(typed, picked = false) {
  if (!canSend()) return;
  const atts = attachments.slice();
  const text = typed || (atts.length ? "첨부한 파일을 봐 줘." : "");
  if (!text) return;
  attachments = [];
  renderAttachTray();
  let thread = currentThread();
  if (!thread) thread = await createThread(typed || (atts[0] ? `첨부: ${atts[0].name}` : text));
  const blocks = pendingResults(picked);
  state.conv.pending = null;
  qrSelected.clear();
  const note = contextNoteFor(thread);
  if (note) blocks.push({ type: "text", text: note });
  for (const a of atts) blocks.push(attachmentBlock(a));
  blocks.push({ type: "text", text });
  state.conv.api.push({ role: "user", content: blocks });
  state.conv.display.push({
    role: "user", text, at: Date.now(),
    ...(atts.length ? { files: atts.map((a) => ({ name: a.name, kind: a.kind, size: a.size, thumb: a.thumb || null })) } : {}),
  });
  thread.contextSent = true;
  thread.syncedAt = Date.now();
  thread.updatedAt = Date.now();
  await Promise.all([persist.conv(), persist.threads()]);
  renderChat();
  await runAgent();
}

function handleEvent(ev, item, blockParts) {
  if (ev.type === "content_block_start") {
    const b = ev.content_block;
    if (b.type === "thinking" || b.type === "redacted_thinking") {
      const p = { kind: "thinking", text: "", streaming: true };
      item.parts.push(p);
      blockParts.set(ev.index, p);
      live.status = "생각하는 중…";
    } else if (b.type === "text") {
      const p = { kind: "text", text: "" };
      item.parts.push(p);
      blockParts.set(ev.index, p);
      live.status = "";
    } else if (b.type === "tool_use") {
      live.status = TOOL_STATUS[b.name] || "설정집 작업 중…";
    } else if (b.type === "fallback") {
      item.parts.push({ kind: "note", tone: "info", text: `안전 정책 판단으로 ${b.to?.model || "다른 모델"}이 이어서 답합니다.` });
    }
  } else if (ev.type === "content_block_delta") {
    const p = blockParts.get(ev.index);
    if (!p) return;
    if (ev.delta.type === "thinking_delta") p.text += ev.delta.thinking;
    else if (ev.delta.type === "text_delta") p.text += ev.delta.text;
  } else if (ev.type === "content_block_stop") {
    const p = blockParts.get(ev.index);
    if (p && p.kind === "thinking") { p.streaming = false; live.status = "정리하는 중…"; }
  }
  scheduleLive();
}

async function runAgent() {
  const thread = currentThread();
  state.busy = true;
  const item = { role: "assistant", parts: [], at: Date.now(), cost: 0, model: settings.model };
  state.conv.display.push(item);
  live = { item, el: null, status: "생각하는 중…", stream: null, stopped: false };
  renderChat();
  updateComposer();
  const client = new Anthropic({ apiKey: settings.apiKey, dangerouslyAllowBrowser: true });
  let jsonRetries = 0;
  let dataChanged = false;
  try {
    let finished = false;
    for (let round = 0; round < MAX_ROUNDS && !finished; round++) {
      const before = item.parts.length;
      const blockParts = new Map();
      let message;
      try {
        const stream = client.beta.messages.stream(buildParams(thread));
        live.stream = stream;
        for await (const ev of stream) handleEvent(ev, item, blockParts);
        message = await stream.finalMessage();
        jsonRetries = 0;
      } catch (err) {
        if (err instanceof Anthropic.APIUserAbortError || live.stopped) {
          item.parts.push({ kind: "note", tone: "info", text: "응답을 멈췄습니다. 멈춘 부분은 대화 기록에 남지 않습니다." });
          return;
        }
        if (err instanceof Anthropic.APIError) throw err;
        if (jsonRetries++ >= 2) throw err;
        item.parts.length = before;
        continue;
      }

      const dropped = (message.input_transformations || []).filter((x) => x.reason === "prefix_binding_mismatch");
      if (dropped.length) console.warn("대화 기록이 어긋나 이전 추론 일부를 버렸습니다", dropped);
      const turnCost = calcCost(message.usage, message.model);
      item.cost += turnCost;
      item.model = message.model;
      addCost(turnCost);
      if (thread) {
        const u = message.usage || {};
        thread.lastCtx = (u.input_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0);
      }

      if (message.stop_reason === "refusal") {
        const cat = message.stop_details?.category;
        item.parts.push({ kind: "note", tone: "error", text: `안전 정책에 따라 이 요청에는 답할 수 없습니다${cat ? ` (분류: ${cat})` : ""}. 표현을 바꿔 다시 요청해 보세요.` });
        return;
      }
      const toolUses = message.content.filter((b) => b.type === "tool_use");
      if (message.stop_reason === "max_tokens" && toolUses.length) {
        item.parts.push({ kind: "note", tone: "error", text: "응답이 너무 길어 중간에 끊겼습니다. 요청을 나눠서 다시 보내 주세요." });
        return;
      }
      state.conv.api.push({ role: "assistant", content: clone(message.content) });
      if (message.stop_reason === "pause_turn") { await persist.conv(); continue; }
      if (toolUses.length && toolUses.every((b) => b.name === SUGGEST)) {
        // 대답 추천만 부른 차례: 여기서 끝내고, 도구 결과는 사용자의 다음 메시지와 함께 보낸다.
        let shown = null;
        for (const tu of toolUses) {
          const problem = validateInput(SUGGEST_TOOL.input_schema, tu.input);
          const options = problem ? [] : [...new Set(tu.input.options.map((o) => cut(o, 160)).filter(Boolean))].slice(0, 6);
          if (!shown && options.length) shown = { id: tu.id, options, multiple: !!tu.input.multiple };
        }
        state.conv.pending = toolUses.map((tu) => ({ id: tu.id, ok: shown?.id === tu.id }));
        if (shown) item.suggest = { options: shown.options, multiple: shown.multiple };
        qrSelected.clear();
        finished = true;
        break;
      }
      if (!toolUses.length) {
        if (message.stop_reason === "max_tokens") item.parts.push({ kind: "note", tone: "info", text: "답변이 길이 제한에 걸려 끝까지 나오지 않았습니다. '계속'이라고 보내면 이어서 씁니다." });
        finished = true;
        break;
      }
      const results = [];
      for (const tu of toolUses) {
        const r = runTool(tu.name, tu.input, promptSetFor(thread).tools);
        results.push({ type: "tool_result", tool_use_id: tu.id, content: r.content, ...(r.is_error ? { is_error: true } : {}) });
        if (r.action) item.parts.push({ kind: "action", action: r.action });
        if (r.changed) dataChanged = true;
      }
      state.conv.api.push({ role: "user", content: results });
      live.status = "이어서 생각하는 중…";
      if (dataChanged) { await persist.world(); renderCodex(); renderWorldName(); }
      await persist.conv();
      scheduleLive();
      if (round === MAX_ROUNDS - 1) {
        item.parts.push({ kind: "note", tone: "info", text: "작업 단계가 많아 여기서 멈췄습니다. '계속'이라고 보내면 이어서 진행합니다." });
      }
    }
  } catch (err) {
    console.error(err);
    item.parts.push({ kind: "note", tone: "error", text: describeError(err) });
  } finally {
    item.parts = item.parts.filter((p) => !(p.kind === "thinking" && !p.text.trim()));
    for (const p of item.parts) delete p.streaming;
    live = null;
    state.busy = false;
    if (thread) thread.updatedAt = Date.now();
    await Promise.all([persist.conv(), persist.threads(), persist.world(), persist.worlds()]);
    renderChat();
    renderCodex();
    renderWorldName();
    updateComposer();
  }
}

function stopAgent() {
  if (!live) return;
  live.stopped = true;
  try { live.stream?.abort(); } catch { /* 이미 끝남 */ }
}

/* ============================================================
   7-1. 첨부 파일
   ============================================================ */
const ATT_LIMITS = {
  count: 10,                       // 한 메시지에 붙일 수 있는 파일 수
  pdfBytes: 20 * 1024 * 1024,      // PDF 한 개 (base64로 늘어나도 요청 한도 32MB 안에 들도록)
  textChars: 300000,               // 텍스트 파일 글자 수
  threadB64: 24 * 1024 * 1024,     // 한 대화에 쌓이는 첨부 총량(매 요청마다 다시 보내므로)
  imageEdge: 1568,                 // 이미지 긴 변. 더 크면 토큰이 크게 늘어 줄여서 보낸다.
  countB64: 8 * 1024 * 1024,       // 이보다 큰 파일은 토큰 미리 계산을 건너뛴다(데이터 절약)
};
const OK_IMAGE_TYPES = ["image/jpeg", "image/png", "image/gif", "image/webp"];
let attachments = []; // 입력창에 올려 둔 파일

const fmtSize = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + "MB" : Math.max(1, Math.round(n / 1024)) + "KB");
function kindOf(file) {
  const t = (file.type || "").toLowerCase();
  const n = (file.name || "").toLowerCase();
  if (t.startsWith("image/") || /\.(heic|heif)$/.test(n)) return "image";
  if (t === "application/pdf" || n.endsWith(".pdf")) return "pdf";
  if (t.startsWith("text/") || t === "application/json" || /\.(txt|md|markdown|csv|tsv|json|log)$/.test(n)) return "text";
  return null;
}
function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error || new Error("파일을 읽을 수 없습니다"));
    r.readAsDataURL(blob);
  });
}
async function blobToBase64(blob) {
  const url = await blobToDataURL(blob);
  return url.slice(url.indexOf(",") + 1);
}
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이 브라우저에서 열 수 없는 이미지입니다")); };
    img.src = url;
  });
}
function drawScaled(img, maxEdge, type, quality) {
  const scale = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const g = canvas.getContext("2d");
  if (type === "image/jpeg") { g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h); }
  g.drawImage(img, 0, 0, w, h);
  return new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("이미지 변환에 실패했습니다"))), type, quality));
}
async function prepareImage(file) {
  const { img, url } = await loadImage(file);
  try {
    let blob = file;
    let type = (file.type || "").toLowerCase();
    const tooBig = Math.max(img.naturalWidth, img.naturalHeight) > ATT_LIMITS.imageEdge;
    if (!OK_IMAGE_TYPES.includes(type) || tooBig || file.size > 3.5 * 1024 * 1024) {
      blob = await drawScaled(img, ATT_LIMITS.imageEdge, "image/jpeg", 0.86);
      type = "image/jpeg";
    }
    const thumb = await blobToDataURL(await drawScaled(img, 480, "image/jpeg", 0.8));
    return { mediaType: type, data: await blobToBase64(blob), size: blob.size, thumb };
  } finally {
    URL.revokeObjectURL(url);
  }
}
async function preparePdf(file) {
  if (file.size > ATT_LIMITS.pdfBytes) throw new Error(`PDF는 ${fmtSize(ATT_LIMITS.pdfBytes)}까지 첨부할 수 있습니다`);
  return { mediaType: "application/pdf", data: await blobToBase64(file), size: file.size };
}
async function prepareText(file) {
  const buf = await file.arrayBuffer();
  let text = new TextDecoder("utf-8").decode(buf);
  const broken = (text.match(/�/g) || []).length;
  if (broken > Math.max(3, text.length * 0.002)) {
    // 윈도우 메모장 등에서 저장한 한글 파일(EUC-KR)
    try { text = new TextDecoder("euc-kr").decode(buf); } catch { /* 디코더 미지원 */ }
  }
  text = text.replace(/^﻿/, "");
  if (!text.trim()) throw new Error("빈 파일입니다");
  if (text.length > ATT_LIMITS.textChars) throw new Error(`텍스트가 너무 깁니다(${ATT_LIMITS.textChars.toLocaleString("ko-KR")}자까지)`);
  return { mediaType: "text/plain", data: text, size: file.size };
}
function attachmentBlock(a) {
  if (a.kind === "image") return { type: "image", source: { type: "base64", media_type: a.mediaType, data: a.data } };
  if (a.kind === "pdf") return { type: "document", source: { type: "base64", media_type: "application/pdf", data: a.data }, title: a.name };
  return { type: "text", text: `[첨부 파일: ${a.name}]\n${a.data}` };
}
function threadAttachBytes() {
  let n = 0;
  for (const m of state.conv.api) {
    if (!Array.isArray(m.content)) continue;
    for (const b of m.content) if ((b.type === "image" || b.type === "document") && b.source?.type === "base64") n += b.source.data.length;
  }
  return n;
}
const trayBytes = () => attachments.reduce((s, a) => s + (a.kind === "text" ? 0 : a.data?.length || 0), 0);

async function addFiles(fileList) {
  const files = [...(fileList || [])];
  if (!files.length) return;
  if (!currentWorld()) { toast("먼저 세계관을 만드세요"); return; }
  for (const file of files) {
    if (attachments.length >= ATT_LIMITS.count) { toast(`한 번에 ${ATT_LIMITS.count}개까지 첨부할 수 있습니다`); break; }
    const kind = kindOf(file);
    if (!kind) { toast(`${file.name}: 이미지, PDF, 텍스트 파일만 첨부할 수 있습니다`); continue; }
    const a = { id: uid(), name: file.name || "사진.jpg", kind, status: "processing", size: file.size, tokens: null };
    attachments.push(a);
    renderAttachTray();
    try {
      Object.assign(a, kind === "image" ? await prepareImage(file) : kind === "pdf" ? await preparePdf(file) : await prepareText(file));
      if (threadAttachBytes() + trayBytes() > ATT_LIMITS.threadB64) throw new Error("이 대화에 첨부가 너무 많습니다. 새 대화에서 첨부하세요");
      a.status = "ready";
      countAttachment(a);
    } catch (err) {
      attachments = attachments.filter((x) => x !== a);
      toast(`${a.name}: ${err?.message || err}`);
    }
    renderAttachTray();
  }
}
async function countAttachment(a) {
  // 토큰 수 확인(count_tokens)은 응답을 만들지 않으며 무료입니다(분당 횟수 제한 있음).
  if (!settings.apiKey || (a.data?.length || 0) > ATT_LIMITS.countB64) return;
  try {
    const client = new Anthropic({ apiKey: settings.apiKey, dangerouslyAllowBrowser: true });
    const r = await client.messages.countTokens({
      model: settings.model,
      messages: [{ role: "user", content: [attachmentBlock(a), { type: "text", text: "." }] }],
    });
    a.tokens = r.input_tokens;
  } catch (err) {
    console.warn("첨부 토큰 계산 실패", err);
    a.tokens = -1;
  }
  if (attachments.includes(a)) renderAttachTray();
}
function attSub(a) {
  if (a.status === "processing") return "준비 중…";
  const parts = [fmtSize(a.size)];
  if (a.tokens > 0) parts.push(`약 ${fmtTok(a.tokens)} 토큰`, fmtUSD((a.tokens * (PRICES[settings.model]?.in || 4)) / 1e6));
  else if (a.tokens === null && settings.apiKey) parts.push("토큰 계산 중…");
  return parts.join(" · ");
}
function renderAttachTray() {
  const tray = $("#attachTray");
  tray.hidden = !attachments.length;
  tray.innerHTML = attachments.map((a) => `<div class="att">${a.thumb ? `<img src="${a.thumb}" alt="">` : `<span class="ftype">${a.kind === "pdf" ? "PDF" : "TXT"}</span>`}<span class="att-meta"><span class="att-name">${esc(a.name)}</span><span class="att-sub">${esc(attSub(a))}</span></span><button type="button" class="att-x" data-att-remove="${a.id}" aria-label="${esc(a.name)} 첨부 빼기">×</button></div>`).join("");
  const total = attachments.reduce((s, a) => s + (a.tokens > 0 ? a.tokens : 0), 0);
  const note = $("#attachNote");
  note.hidden = total < 50000;
  note.textContent = total >= 50000
    ? `첨부가 약 ${fmtTok(total)} 토큰입니다. 이 대화에서는 이후 요청마다 함께 보내지므로(캐시되면 훨씬 저렴), 큰 자료는 새 대화에서 쓰는 편이 비용이 적습니다.`
    : "";
}

/* ============================================================
   8. 마크다운
   ============================================================ */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*(?!\s)([^*\n]+?)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/\b([A-Z][A-Z0-9]{0,2}-\d{3,})\b/g, (m, id) => (findEntry(id) ? `<button type="button" class="ref" data-ref="${id}">${id}</button>` : m));
}
function md(src) {
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  let html = "";
  let para = [];
  let list = null;
  let quote = [];
  let code = null;
  const flushPara = () => { if (para.length) { html += `<p>${para.map(inline).join("<br>")}</p>`; para = []; } };
  const flushList = () => { if (list) { html += `<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`; list = null; } };
  const flushQuote = () => { if (quote.length) { html += `<blockquote>${quote.map(inline).join("<br>")}</blockquote>`; quote = []; } };
  const flushAll = () => { flushPara(); flushList(); flushQuote(); };
  for (const line of lines) {
    if (code) {
      if (/^\s*```/.test(line)) { html += `<pre><code>${esc(code.join("\n"))}</code></pre>`; code = null; } else code.push(line);
      continue;
    }
    if (/^\s*```/.test(line)) { flushAll(); code = []; continue; }
    if (!line.trim()) { flushAll(); continue; }
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { flushAll(); const lv = Math.min(m[1].length + 2, 6); html += `<h${lv}>${inline(m[2])}</h${lv}>`; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushAll(); html += "<hr>"; continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) {
      flushPara(); flushQuote();
      if (!list || list.tag !== "ul") { flushList(); list = { tag: "ul", items: [] }; }
      list.items.push(m[1]);
      continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      flushPara(); flushQuote();
      if (!list || list.tag !== "ol") { flushList(); list = { tag: "ol", items: [] }; }
      list.items.push(m[1]);
      continue;
    }
    if ((m = line.match(/^>\s?(.*)$/))) { flushPara(); flushList(); quote.push(m[1]); continue; }
    if (list && /^\s{2,}\S/.test(line)) { list.items[list.items.length - 1] += " " + line.trim(); continue; }
    flushList(); flushQuote();
    para.push(line);
  }
  if (code) html += `<pre><code>${esc(code.join("\n"))}</code></pre>`;
  flushAll();
  return html;
}

   10. 화면: 대화

function actionChip(a) {
  const glyph = { create: "+", update: "✎", relation: "↔", delete: "×", world: "◎", read: "·" }[a.kind] || "·";
  const verb = { create: "추가", update: "수정", relation: "", delete: "휴지통", world: "수정", read: "" }[a.kind] || "";
  const label = `${a.text}${verb ? " " + verb : ""}`;
  const attr = a.ref ? ` data-ref="${esc(a.ref)}"` : "";
  return `<button type="button" class="action-chip ${a.kind === "read" ? "read" : ""}"${attr}><span class="glyph">${glyph}</span><span>${esc(label)}</span></button>`;
}
function assistantInner(item, isLive) {
  let html = "";
  let chips = [];
  const flushChips = () => { if (chips.length) { html += `<div class="chips">${chips.join("")}</div>`; chips = []; } };
  for (const p of item.parts) {
    if (p.kind === "action") { chips.push(actionChip(p.action)); continue; }
    flushChips();
    if (p.kind === "thinking") {
      if (!p.text.trim()) continue;
      html += `<details class="thinking"${isLive && p.streaming ? " open" : ""}><summary>생각 요약</summary><div class="thinking-body md">${md(p.text)}</div></details>`;
    } else if (p.kind === "text") {
      if (p.text) html += `<div class="md">${md(p.text)}</div>`;
    } else if (p.kind === "note") {
      html += `<p class="note ${p.tone === "error" ? "note-error" : ""}">${esc(p.text)}</p>`;
    }
  }
  flushChips();
  if (isLive && live?.status) html += `<div class="status-line">${esc(live.status)}</div>`;
  if (!isLive && item.cost) html += `<div class="msg-meta">${esc(PRICES[item.model]?.label || item.model)} · ${fmtUSD(item.cost)}</div>`;
  return html;
}

function quickRepliesHTML(s) {

function composeMulti(s) {

function onQuickReply(e) {
  const s = currentSuggest();
  if (!s || state.busy) return;
  const one = e.target.closest("[data-qr]");
  if (one) { sendMessage(s.options[Number(one.dataset.qr)], true); return; }
  const edit = e.target.closest("[data-qr-edit]");
  if (edit) { fillInput(s.options[Number(edit.dataset.qrEdit)]); return; }
  const toggle = e.target.closest("[data-qr-toggle]");
  if (toggle) {
    const k = Number(toggle.dataset.qrToggle);
    if (qrSelected.has(k)) qrSelected.delete(k); else qrSelected.add(k);
    const box = $("#quickReplies");
    if (box) box.outerHTML = quickRepliesHTML(s);
    return;
  }
  if (e.target.closest("[data-qr-send]") && qrSelected.size) { sendMessage(composeMulti(s), true); return; }

}
function userBubble(m, i) {

function renderChat() {

let liveFrame = 0;

  if (!missing.length) return `<div class="tpl-status done"><span><b>${esc(g.label)} 템플릿</b>을 모두 채웠습니다</span></div>`;
  const list = missing.slice(0, 6).join(", ") + (missing.length > 6 ? ` 외 ${missing.length - 6}개` : "");
