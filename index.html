    ${existing ? "" : `<p class="meta">이름만 정해도 됩니다. 나머지는 Claude와 대화하며 채울 수 있습니다.</p>`}`, (root) => {
    root.onclick = async (ev) => {
      const act = ev.target.closest("[data-act]")?.dataset.act;
      if (act === "cancel") closeSheet();
      if (act === "delete-world") {
        if (!(await confirmBox(`'${w.name}' 세계관과 모든 항목, 대화를 지웁니다. 되돌릴 수 없습니다. 먼저 백업을 받아 두세요.`, "모두 지우기", true))) return;
        const id = w.id;
        const threads = (await idb.get("threads:" + id)) || [];
        await Promise.all([idb.del("entries:" + id), idb.del("log:" + id), idb.del("threads:" + id), ...threads.map((t) => idb.del("conv:" + t.id))]);
        state.worlds = state.worlds.filter((x) => x.id !== id);
        await persist.worlds();
        closeSheet();
        if (state.worlds[0]) await openWorld(state.worlds[0].id);
        else { state.worldId = null; state.entries = []; state.log = []; state.threads = []; state.threadId = null; state.conv = { api: [], display: [] }; renderWorldName(); renderChat(); renderCodex(); }
        toast("세계관을 지웠습니다");
      }
    };
    root.onsubmit = async (ev) => {
      ev.preventDefault();
      if (state.busy) { toast("Claude가 작업 중입니다"); return; }
      const data = {
        name: $("#w-name", root).value.trim(),
        premise: $("#w-premise", root).value.trim(),
        tone: $("#w-tone", root).value.trim(),
        rules: $("#w-rules", root).value.trim(),
      };
      if (!data.name) { toast("이름을 넣어 주세요"); return; }
      if (existing) {
        Object.assign(existing, data, { updatedAt: Date.now() });
        logChange("user", "world", null, "세계관 개요 수정");
        await Promise.all([persist.worlds(), persist.log()]);
        closeSheet(); renderWorldName(); renderCodex(); toast("저장했습니다");
      } else {
        const now = Date.now();
        closeSheet();
        await addWorld({ id: uid(), ...data, counters: {}, createdAt: now, updatedAt: now, entryCount: 0 });
        switchView("chat");
        toast("새 세계관을 만들었습니다");
      }
    };
  });
}
async function loadSample() {
  const { w, entries } = sampleWorld();
  w.entryCount = entries.length;
  closeSheet();
  await addWorld(w, entries);
  switchView("codex");
  toast("예시 세계관을 불러왔습니다");
}

/* ============================================================
   13. 화면: 설정
   ============================================================ */
async function renderSettings() {
  const root = $("#settings");
  const month = cost.months[monthKey()] || 0;
  let persisted = null;
  try { persisted = await navigator.storage?.persisted?.(); } catch { persisted = null; }
  const masked = settings.apiKey ? settings.apiKey.slice(0, 10) + "…" + settings.apiKey.slice(-4) : "";
  root.innerHTML = `
    <section class="card">
      <h2>Claude API 키</h2>
      <p>${settings.apiKey ? `저장된 키: <code>${esc(masked)}</code>` : "Console(platform.claude.com)의 API Keys에서 키를 만들어 붙여 넣으세요."} 키는 이 기기의 브라우저에만 저장되고 Anthropic API로만 전송됩니다.</p>
      <form class="form" id="keyForm">
        <input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-…" aria-label="API 키">
        <div class="row">
          <button class="btn btn-primary" type="submit">저장</button>
          <button class="btn" type="button" data-act="test-key"${settings.apiKey ? "" : " disabled"}>연결 확인</button>
          ${settings.apiKey ? `<button class="btn btn-danger" type="button" data-act="clear-key">키 지우기</button>` : ""}
        </div>
      </form>
      <p>이 앱 전용 키를 만들고, Console에서 월 사용 한도를 걸어 두는 것을 권합니다.</p>
    </section>

    <section class="card">
      <h2>모델</h2>
      <div class="radio-list">${MODEL_CHOICES.map((m) => { const p = PRICES[m.id]; return `<label class="radio"><input type="radio" name="model" value="${m.id}"${settings.model === m.id ? " checked" : ""}><span class="t">${p.label}</span><span class="s">입력 $${p.in} · 출력 $${p.out} / 100만 토큰 — ${m.note}</span></label>`; }).join("")}</div>
      <p>Opus와 Sonnet은 안전 정책 오판으로 거절되면 서버가 권장 모델로 자동 재시도합니다.</p>
    </section>

    <section class="card">
      <h2>생각 깊이</h2>
      <div class="radio-list">${EFFORTS.map((x) => `<label class="radio"><input type="radio" name="effort" value="${x.id}"${settings.effort === x.id ? " checked" : ""}><span class="t">${x.label}</span><span class="s">${x.note}</span></label>`).join("")}</div>
      <label class="switch">생각 요약 보기 <input type="checkbox" id="showThinking"${settings.showThinking ? " checked" : ""}></label>
      <p>생각한 분량도 출력 토큰으로 과금됩니다. 요약을 보든 안 보든 비용은 같습니다.</p>
    </section>

    <section class="card">
      <h2>사용 비용 <span class="meta">(추정)</span></h2>
      <div class="stats">
        <div class="stat"><div class="v">${fmtUSD(month)}</div><div class="k">이번 달</div></div>
        <div class="stat"><div class="v">${fmtUSD(cost.total)}</div><div class="k">누적</div></div>
        <div class="stat"><div class="v">${cost.requests}</div><div class="k">요청 수</div></div>
      </div>
      <p>응답의 토큰 사용량과 공개 단가로 계산한 값입니다. 정확한 청구액은 Console의 Usage에서 확인하세요.</p>
      <div class="row"><button class="btn btn-small" type="button" data-act="reset-cost">비용 기록 초기화</button></div>
    </section>

    <section class="card">
      <h2>백업</h2>
      <p>데이터는 이 기기 브라우저에만 있습니다. 브라우저 데이터를 지우거나 기기를 바꾸면 사라지므로 자주 내보내 두세요.${persisted === true ? " 이 브라우저는 저장 공간을 보존하도록 설정되어 있습니다." : persisted === false ? " 아이폰은 홈 화면에 추가해서 쓰면 데이터가 더 오래 보존됩니다." : ""}</p>
      <div class="row">
        <button class="btn" type="button" data-act="export-all">전체 백업 내보내기</button>
        <button class="btn" type="button" data-act="import">백업 불러오기</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <div class="row">
        <button class="btn" type="button" data-act="export-md"${currentWorld() ? "" : " disabled"}>현재 세계관을 문서(.md)로</button>
      </div>
    </section>

    <section class="card">
      <h2>홈 화면에 추가</h2>
      <p>아이폰 Safari: 공유 버튼 → 홈 화면에 추가. 안드로이드 Chrome: 메뉴 → 홈 화면에 추가. 앱처럼 전체 화면으로 열립니다.</p>
    </section>`;

  root.onsubmit = (ev) => {
    if (ev.target.id !== "keyForm") return;
    ev.preventDefault();
    const v = $("#apiKey", root).value.trim();
    if (!v) { toast("키를 붙여 넣어 주세요"); return; }
    settings.apiKey = v;
    saveSettings();
    updateComposer();
    renderSettings();
    toast("키를 저장했습니다");
  };
  root.onchange = (ev) => {
    const t = ev.target;
    if (t.name === "model") { settings.model = t.value; saveSettings(); toast(`${PRICES[t.value].label}로 바꿨습니다`); }
    else if (t.name === "effort") { settings.effort = t.value; saveSettings(); }
    else if (t.id === "showThinking") { settings.showThinking = t.checked; saveSettings(); }
    else if (t.id === "importFile" && t.files?.[0]) importBackup(t.files[0]);
  };
  root.onclick = async (ev) => {
    const act = ev.target.closest("[data-act]")?.dataset.act;
    if (!act) return;
    if (act === "test-key") testKey();
    else if (act === "clear-key") {
      if (!(await confirmBox("저장된 API 키를 지울까요?", "지우기", true))) return;
      settings.apiKey = ""; saveSettings(); updateComposer(); renderSettings();
    } else if (act === "reset-cost") {
      if (!(await confirmBox("비용 기록을 0으로 초기화할까요? 실제 청구에는 영향이 없습니다.", "초기화"))) return;
      cost.total = 0; cost.months = {}; cost.requests = 0; saveCost(); updateCostBadge(); renderSettings();
    } else if (act === "export-all") exportAll();
    else if (act === "import") $("#importFile", root).click();
    else if (act === "export-md") exportMarkdown();
  };
}
async function testKey() {
  try {
    const client = new Anthropic({ apiKey: settings.apiKey, dangerouslyAllowBrowser: true });
    const m = await client.models.retrieve(settings.model);
    toast(`연결됨: ${m.display_name || m.id}`);
  } catch (err) {
    toast(describeError(err));
  }
}

/* ============================================================
   14. 백업
   ============================================================ */
function download(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function exportAll() {
  if (state.worldId) await Promise.all([persist.world(), persist.threads(), persist.conv(), persist.worlds()]);
  const data = { app: "lorekeeper", version: 1, exportedAt: new Date().toISOString(), worlds: [] };
  for (const w of state.worlds) {
    const threads = (await idb.get("threads:" + w.id)) || [];
    const convs = {};
    for (const t of threads) convs[t.id] = (await idb.get("conv:" + t.id)) || null;
    data.worlds.push({
      world: w,
      entries: (await idb.get("entries:" + w.id)) || [],
      log: (await idb.get("log:" + w.id)) || [],
      threads,
      convs,
    });
  }
  download(`lorekeeper-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data), "application/json");
  toast("백업 파일을 만들었습니다");
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast("백업 파일을 읽을 수 없습니다"); return; }
  if (data?.app !== "lorekeeper" || !Array.isArray(data.worlds)) { toast("로어키퍼 백업 파일이 아닙니다"); return; }
  const clash = data.worlds.filter((x) => state.worlds.some((w) => w.id === x.world?.id));
  const msg = `세계관 ${data.worlds.length}개를 불러옵니다.${clash.length ? `\n이미 있는 ${clash.length}개는 백업 내용으로 덮어씁니다.` : ""}`;
  if (!(await confirmBox(msg, "불러오기"))) return;
  for (const x of data.worlds) {
    if (!x.world?.id) continue;
    const id = x.world.id;
    const i = state.worlds.findIndex((w) => w.id === id);
    if (i >= 0) state.worlds[i] = x.world; else state.worlds.push(x.world);
    await Promise.all([
      idb.set("entries:" + id, x.entries || []),
      idb.set("log:" + id, x.log || []),
      idb.set("threads:" + id, x.threads || []),
      ...Object.entries(x.convs || {}).filter(([, v]) => v).map(([tid, v]) => idb.set("conv:" + tid, v)),
    ]);
  }
  await persist.worlds();
  await openWorld(state.worldId && state.worlds.some((w) => w.id === state.worldId) ? state.worldId : state.worlds[0].id);
  renderSettings();
  toast("백업을 불러왔습니다");
}
function exportMarkdown() {
  const w = currentWorld();
  if (!w) return;
  const parts = [`# ${w.name}`, "", w.premise ? `> ${w.premise}` : "", "", w.tone ? `**분위기 · 문체**: ${w.tone}` : "", "", w.rules ? `## 세계 규칙\n\n${w.rules}` : ""];
  for (const k of TYPE_KEYS) {
    const list = activeEntries().filter((e) => e.type === k).sort((a, b) => a.id.localeCompare(b.id));
    if (!list.length) continue;
    parts.push("", `## ${TYPES[k].label}`);
    for (const e of list) {
      parts.push("", `### ${e.name} \`${e.id}\``);
      if (e.aliases?.length) parts.push(`*별칭: ${e.aliases.join(", ")}*`);
      parts.push("", e.summary || "");
      const f = Object.entries(e.fields || {});
      if (f.length) parts.push("", ...f.map(([kk, v]) => `- **${kk}**: ${v}`));
      if (e.body) parts.push("", e.body);
      const rel = (e.relations || []).map((r) => `- ${r.label} → ${nameOf(r.to)} (\`${r.to}\`)`);
      if (rel.length) parts.push("", "**관계**", ...rel);
      if (e.tags?.length) parts.push("", e.tags.map((t) => "#" + t).join(" "));
    }
  }
  const safe = w.name.replace(/[\\/:*?"<>|]/g, "_");
  download(`${safe}.md`, parts.join("\n").replace(/\n{3,}/g, "\n\n"), "text/markdown");
  toast("문서 파일을 만들었습니다");
}

/* ============================================================
   15. 입력 · 시작
   ============================================================ */
function autosize(t) {
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 200) + "px";
}
function fitViewport() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  document.documentElement.style.setProperty("--app-h", `${h}px`);
  document.documentElement.style.setProperty("--app-top", `${vv ? vv.offsetTop : 0}px`);
}

function bindGlobal() {
  window.visualViewport?.addEventListener("resize", fitViewport);
  window.visualViewport?.addEventListener("scroll", fitViewport);
  window.addEventListener("resize", fitViewport);
  fitViewport();

  $(".tabbar").onclick = (e) => { const b = e.target.closest("[data-view]"); if (b) switchView(b.dataset.view); };
  $("#worldBtn").onclick = openWorldSheet;
  $("#costBadge").onclick = () => switchView("settings");
  $("#threadsBtn").onclick = openThreadsSheet;
  $("#newThreadBtn").onclick = newThread;
  $("#chatLog").addEventListener("click", onChatClick);

  // 첨부: 버튼, 붙여넣기, 끌어다 놓기
  $("#attachBtn").onclick = () => $("#fileInput").click();
  $("#fileInput").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
  $("#attachTray").onclick = (e) => {
    const x = e.target.closest("[data-att-remove]");
    if (!x) return;
    attachments = attachments.filter((a) => a.id !== x.dataset.attRemove);
    renderAttachTray();
  };
  const chatView = $("#view-chat");
  chatView.addEventListener("dragover", (e) => {
    if (![...(e.dataTransfer?.types || [])].includes("Files")) return;
    e.preventDefault();
    chatView.classList.add("dragging");
  });
  chatView.addEventListener("dragleave", (e) => { if (!chatView.contains(e.relatedTarget)) chatView.classList.remove("dragging"); });
  chatView.addEventListener("drop", (e) => {
    chatView.classList.remove("dragging");
    if (!e.dataTransfer?.files?.length) return;
    e.preventDefault();
    addFiles(e.dataTransfer.files);
  });

  const input = $("#input");
  input.addEventListener("input", () => autosize(input));
  input.addEventListener("focus", () => document.body.classList.add("kb-open"));
  // 탭이 끝난 뒤에 하단 탭을 되돌린다. 바로 되돌리면 레이아웃이 밀려 누른 버튼을 놓친다.
  input.addEventListener("blur", () => setTimeout(() => {
    if (document.activeElement !== input) document.body.classList.remove("kb-open");
  }, 250));
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("#composer").requestSubmit(); }
  });
  input.addEventListener("paste", (e) => {
    const files = [...(e.clipboardData?.files || [])];
    if (!files.length) return;
    e.preventDefault();
    addFiles(files);
  });
  // 보내기 버튼을 눌러도 입력란 포커스가 유지되게 한다. 포커스가 빠지면 키보드가 닫히며 레이아웃이 밀려 버튼을 놓친다.
  $("#sendBtn").addEventListener("pointerdown", (e) => e.preventDefault());
  $("#sendBtn").addEventListener("mousedown", (e) => e.preventDefault());
  $("#composer").onsubmit = (e) => {
    e.preventDefault();
    if (state.busy) { stopAgent(); return; }
    const text = input.value.trim();
    if (!text && !attachments.length) return;
    if (!canSend()) return; // 보낼 수 없으면 입력한 글을 지우지 않는다
    input.value = "";
    autosize(input);
    sendMessage(text);
  };

  document.addEventListener("click", async (e) => {
    if (e.target.closest("[data-close-sheet]")) { closeSheet(); return; }
    const inSheet = e.target.closest("#sheetBody");
    const ref = e.target.closest("[data-ref]");
    if (ref && !inSheet) { openEntry(ref.dataset.ref); return; }
    const go = e.target.closest("[data-goto]");
    if (go) { switchView(go.dataset.goto); return; }
    const sug = e.target.closest("[data-suggest]");
    if (sug) { input.value = sug.dataset.suggest; autosize(input); input.focus(); return; }
    const chip = e.target.closest("[data-type]");
    if (chip && e.target.closest("#codex")) { state.codexType = chip.dataset.type; renderCodexResults(); return; }
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (!act) return;
    if (inSheet && !["new-world", "load-sample", "edit-world"].includes(act)) return;
    if (act === "new-world") openWorldForm(null);
    else if (act === "load-sample") loadSample();
    else if (act === "edit-world") { const w = currentWorld(); if (w) openWorldForm(w); }
    else if (act === "new-entry") { if (state.busy) toast("Claude가 작업 중입니다"); else openEditor(null); }
    else if (act === "trash") openTrash();
    else if (act === "retry") { if (!state.busy) runAgent(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("#dialog").hidden) return;
    if (!$("#sheet").hidden) closeSheet();
  });
  window.addEventListener("beforeunload", (e) => { if (state.busy) { e.preventDefault(); e.returnValue = ""; } });
}

async function init() {
  bindGlobal();
  updateCostBadge();
  state.worlds = (await idb.get("worlds")) || [];
  const want = LS.get("lk.world", null);
  const w = state.worlds.find((x) => x.id === want) || state.worlds[0];
  if (w) await openWorld(w.id);
  else { renderWorldName(); renderChat(); renderCodex(); }
  switchView(LS.get("lk.view", "chat"));
  if (idb.broken) toast("이 브라우저에서는 데이터가 저장되지 않습니다. 개인정보 보호 모드를 끄세요");
}
init();
</script>
