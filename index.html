function updateGraphPositions() {
  for (const ed of graph.visEdges) {
    const A = graph.nodes.get(ed.a);
    const B = graph.nodes.get(ed.b);
    const ddx = B.x - A.x;
    const ddy = B.y - A.y;
    const d = Math.hypot(ddx, ddy) || 1;
    const ux = ddx / d;
    const uy = ddy / d;
    const fwd = ed.rels.some((r) => r.from === ed.a);
    const back = ed.rels.some((r) => r.from === ed.b);
    const sa = Math.min(d / 2, A.r + (back ? 6 : 3));
    const sb = Math.min(d / 2, B.r + (fwd ? 6 : 3));
    ed.el.setAttribute("x1", A.x + ux * sa);
    ed.el.setAttribute("y1", A.y + uy * sa);
    ed.el.setAttribute("x2", B.x - ux * sb);
    ed.el.setAttribute("y2", B.y - uy * sb);
    for (const lb of ed.labels) {
      // 한쪽 관계면 선 가운데, 양쪽이면 각 관계가 가리키는 쪽(대상)으로 조금 치우쳐 둔다.
      // 선 위에 겹치지 않도록 선과 수직 방향으로 살짝 띄운다.
      const t = ed.labels.length === 1 ? 0.5 : lb.from === ed.a ? 0.62 : 0.38;
      const side = ed.labels.length === 1 ? 1 : lb.from === ed.a ? 1 : -1;
      lb.el.setAttribute("x", A.x + ddx * t - uy * 9 * side);
      lb.el.setAttribute("y", A.y + ddy * t + ux * 9 * side + 4);
    }
  }
  for (const n of graph.nodes.values()) if (n.el) n.el.setAttribute("transform", `translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
}
function applyGraphHighlight() {
  const sel = graph.selected && graph.vis.has(graph.selected) ? graph.selected : null;
  const near = new Set();
  if (sel) {
    near.add(sel);
    for (const ed of graph.visEdges) { if (ed.a === sel) near.add(ed.b); if (ed.b === sel) near.add(ed.a); }
  }
  for (const n of graph.nodes.values()) {
    if (!n.el) continue;
    n.el.classList.toggle("sel", n.id === sel);
    n.el.classList.toggle("dim", !!sel && !near.has(n.id) && !graph.linkFrom);
    n.el.classList.toggle("link-src", n.id === graph.linkFrom);
  }
  for (const ed of graph.visEdges) {
    const hl = !!sel && (ed.a === sel || ed.b === sel);
    ed.el.classList.toggle("hl", hl);
    ed.el.classList.toggle("dim", !!sel && !hl);
    const marker = hl ? "url(#gArrowHl)" : "url(#gArrow)";
    if (ed.rels.some((r) => r.from === ed.a)) ed.el.setAttribute("marker-end", marker); else ed.el.removeAttribute("marker-end");

}

  const list = [...graph.vis].map((id) => graph.nodes.get(id));
  if (!list.length) { graph.view = { tx: W / 2, ty: H / 2, s: 1 }; applyGraphTransform(); return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of list) { x0 = Math.min(x0, n.x - 60); x1 = Math.max(x1, n.x + 60); y0 = Math.min(y0, n.y - 30); y1 = Math.max(y1, n.y + 40); }
  const s = clamp(Math.min(W / (x1 - x0), (H - 56) / (y1 - y0)), 0.3, 1.5);
  graph.view = { s, tx: W / 2 - ((x0 + x1) / 2) * s, ty: 56 + (H - 56) / 2 - ((y0 + y1) / 2) * s };
  applyGraphTransform();
}
function centerOn(id) {
  const n = graph.nodes.get(id);
  if (!n) return;
  const stage = $("#graphStage");
  const s = Math.max(graph.view.s, 1);
  graph.view = { s, tx: stage.clientWidth / 2 - n.x * s, ty: Math.max(120, stageInnerHeight() / 2) - n.y * s };
  applyGraphTransform();
}
function zoomAt(cx, cy, factor) {
  const rect = $("#graphStage").getBoundingClientRect();
  const mx = cx - rect.left;
  const my = cy - rect.top;
  const { tx, ty, s } = graph.view;
  const ns = clamp(s * factor, 0.25, 3);
  const wx = (mx - tx) / s;
  const wy = (my - ty) / s;
  graph.view = { s: ns, tx: mx - wx * ns, ty: my - wy * ns };
  applyGraphTransform();
}

function renderGraphChrome() {
  // 종류 필터
  const counts = {};
  for (const n of graph.nodes.values()) counts[n.entry.type] = (counts[n.entry.type] || 0) + 1;
  const isolated = [...graph.nodes.values()].filter((n) => n.degree === 0).length;
  $("#graphTypes").innerHTML = typeKeys().filter((k) => counts[k]).map((k) => `<button class="type-chip" type="button" data-gtype="${k}" aria-pressed="${!graph.hiddenTypes.has(k)}"><span class="tdot" style="background:${typeColor(k)}"></span>${esc(typeInfo(k).label)}<span class="n">${counts[k]}</span></button>`).join("")
    + (isolated ? `<button class="type-chip isolated" type="button" data-gtype="__isolated" aria-pressed="${!graph.hideIsolated}">연결 없는 항목<span class="n">${isolated}</span></button>` : "");

  // 빈 화면 안내
  const empty = $("#graphEmpty");
  const w = currentWorld();
  if (!w) { empty.hidden = false; empty.innerHTML = "<div><strong>세계관이 없습니다</strong>대화 탭에서 새 세계관을 만들어 보세요.</div>"; }
  else if (!graph.nodes.size) { empty.hidden = false; empty.innerHTML = "<div><strong>설정집이 비어 있습니다</strong>항목이 생기면 여기에 관계도가 그려집니다.</div>"; }
  else if (!graph.vis.size) { empty.hidden = false; empty.innerHTML = "<div><strong>보이는 항목이 없습니다</strong>위의 종류 필터를 켜 보세요.</div>"; }
  else empty.hidden = true;

  // 상단 안내(관계 잇기 / 주변만 보기 / 관계 없음)
  const hint = $("#graphHint");
  const sel = graph.selected ? graph.nodes.get(graph.selected) : null;
  if (graph.linkFrom) {
    const from = graph.nodes.get(graph.linkFrom);
    hint.hidden = false;
    hint.innerHTML = `<span><b>${esc(from.entry.name)}</b>와(과) 이을 항목을 누르세요</span><button class="btn btn-small" type="button" data-g="cancel-link">취소</button>`;
  } else if (graph.focusHops && sel) {
    hint.hidden = false;
    hint.innerHTML = `<span><b>${esc(sel.entry.name)}</b> 주변 ${graph.focusHops}단계만 보는 중</span><button class="btn btn-small" type="button" data-g="hops">${graph.focusHops === 1 ? "2단계까지" : "1단계만"}</button><button class="btn btn-small" type="button" data-g="unfocus">전체 보기</button>`;
  } else if (graph.nodes.size && !graph.edges.length) {
    hint.hidden = false;
    hint.innerHTML = "<span>아직 관계가 없습니다. 항목을 누르고 '관계 잇기'를 쓰거나, 대화에서 관계를 정해 달라고 해 보세요.</span>";
  } else hint.hidden = true;

  // 선택 카드
  const card = $("#graphCard");
  if (sel && graph.vis.has(sel.id) && !graph.linkFrom) {
    const e = sel.entry;
    card.hidden = false;
    card.innerHTML = `<div class="entry-head" style="--tc:${typeColor(e.type)}"><span class="catno">${e.id}</span><span>${esc(typeInfo(e.type).label)}</span><span class="pill">연결 ${sel.degree}</span></div>
      <strong class="gc-name">${esc(e.name)}</strong>
      <p class="gc-sum">${esc(e.summary || "요약 없음")}</p>
      <div class="row">
        <button class="btn btn-small btn-primary" type="button" data-g="open">자세히</button>
        <button class="btn btn-small" type="button" data-g="link">관계 잇기</button>
        <button class="btn btn-small" type="button" data-g="focus">${graph.focusHops ? "전체 보기" : "주변만 보기"}</button>
        <button class="btn btn-small" type="button" data-g="chat">대화로</button>
      </div>`;
  } else card.hidden = true;
}

let graphQueued = false;
function queueGraphRender() {
  if (graphQueued) return;
  graphQueued = true;
  requestAnimationFrame(() => { graphQueued = false; renderGraph(); });
}
async function renderGraph() {
  if (state.view !== "graph") return;
  await loadGraphPositions();
  const hadLayout = graph.nodes.size > 0 || Object.keys(graph.pos).length > 0;
  buildGraphModel();
  runLayout(!hadLayout);
  buildGraphDOM();
  if (graph.pendingSelect && graph.nodes.has(graph.pendingSelect)) {
    graph.selected = graph.pendingSelect;
    graph.hiddenTypes.delete(graph.nodes.get(graph.pendingSelect).entry.type);
    graph.pendingSelect = null;
    buildGraphDOM();
    graph.fitted = true;
    centerOn(graph.selected);
  } else if (!graph.fitted) {
    fitGraph();
    graph.fitted = true;
  } else applyGraphTransform();
  saveGraphPositions();
}
function showInGraph(id) {
  graph.pendingSelect = id;
  graph.focusHops = 0;
  graph.linkFrom = null;
  switchView("graph");
}
function selectGraphNode(id) {
  graph.selected = id;
  if (graph.focusHops) buildGraphDOM();
  else { applyGraphHighlight(); renderGraphChrome(); }
}

function openLinkForm(fromId, toId) {
  const a = findEntry(fromId);
  const b = findEntry(toId);
  if (!a || !b) return;
  const common = ["스승", "제자", "가족", "연인", "친구", "동료", "경쟁", "적대", "소속", "지도자", "거주지", "출신", "소유", "원인"];
  openSheet(`<h2 class="sheet-title">관계 잇기</h2>
    <p class="meta" style="margin:0 0 12px">${esc(a.name)} ⇄ ${esc(b.name)}</p>
    <form class="form" id="linkForm">
      <label>${esc(a.name)}에게 ${esc(b.name)}은(는)<input id="l-label" required placeholder="예: 스승" autocomplete="off"></label>
      <label>반대로 ${esc(b.name)}에게 ${esc(a.name)}은(는) <small>비워 두면 한쪽만</small><input id="l-reverse" placeholder="예: 제자" autocomplete="off"></label>
      <div class="label-chips">${common.map((c) => `<button type="button" class="action-chip" data-fill="${c}"><span>${c}</span></button>`).join("")}</div>
      <div class="sheet-actions">
        <button class="btn" type="button" data-act="cancel">취소</button>
        <button class="btn btn-primary" type="submit">잇기</button>
      </div>
    </form>`, (root) => {
    let target = $("#l-label", root);
    root.addEventListener("focusin", (ev) => { if (ev.target.matches("#l-label, #l-reverse")) target = ev.target; });
    target.focus(); // 시트가 열리는 즉시 첫 칸에 커서를 둔다(나중에 옮기면 입력 중인 칸을 빼앗을 수 있다)
    root.onclick = (ev) => {
      const fill = ev.target.closest("[data-fill]");
      if (fill) {
        const label = $("#l-label", root);
        const rev = $("#l-reverse", root);
        const box = target === rev || (label.value && !rev.value) ? rev : label;
        box.value = fill.dataset.fill;
        target = box === label ? rev : label;
        return;
      }
      if (ev.target.closest('[data-act="cancel"]')) closeSheet();
    };
    root.onsubmit = async (ev) => {
      ev.preventDefault();
      if (state.busy) { toast("Claude가 작업 중입니다. 끝난 뒤에 이어 주세요"); return; }
      const label = $("#l-label", root).value.trim();
      const rev = $("#l-reverse", root).value.trim();
      if (!label) { toast("관계 이름을 넣어 주세요"); return; }
      const added = addRelation(a, b.id, label, "user");
      if (rev) addRelation(b, a.id, rev, "user");
      await persist.world();
      graph.linkFrom = null;
      graph.selected = a.id;
      closeSheet();
      renderCodex();
      toast(added || rev ? "관계를 이었습니다" : "이미 있는 관계입니다");
    };
  });
}

function bindGraph() {
  const view = $("#view-graph");
  const stage = $("#graphStage");
  const gp = { pointers: new Map(), mode: null, node: null, moved: false, start: null, nodeStart: null, pinch: null };
  let frame = 0;
  const scheduleFrame = () => { if (!frame) frame = requestAnimationFrame(() => { frame = 0; updateGraphPositions(); }); };

  stage.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".graph-card, .graph-hint, .zoom-ctrl")) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    stage.setPointerCapture(e.pointerId);
    gp.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gp.pointers.size === 2) {
      const [p1, p2] = [...gp.pointers.values()];
      gp.mode = "pinch";
      gp.node = null;
      gp.moved = true;
      gp.pinch = { d: Math.hypot(p1.x - p2.x, p1.y - p2.y) || 1, mid: { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }, view: { ...graph.view } };
      return;
    }
    gp.moved = false;
    gp.start = { x: e.clientX, y: e.clientY, view: { ...graph.view } };
    const nodeEl = e.target.closest(".g-node");
    if (nodeEl) {
      gp.mode = "node";
      gp.node = graph.nodes.get(nodeEl.dataset.id);
      gp.nodeStart = { x: gp.node.x, y: gp.node.y };
    } else gp.mode = "pan";
  });
  stage.addEventListener("pointermove", (e) => {
    if (!gp.pointers.has(e.pointerId)) return;
    gp.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gp.mode === "pinch" && gp.pointers.size >= 2) {
      const [p1, p2] = [...gp.pointers.values()];
      const d = Math.hypot(p1.x - p2.x, p1.y - p2.y) || 1;
      const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      const rect = stage.getBoundingClientRect();
      const v0 = gp.pinch.view;
      const s = clamp(v0.s * (d / gp.pinch.d), 0.25, 3);
      const wx = (gp.pinch.mid.x - rect.left - v0.tx) / v0.s;
      const wy = (gp.pinch.mid.y - rect.top - v0.ty) / v0.s;
      graph.view = { s, tx: mid.x - rect.left - wx * s, ty: mid.y - rect.top - wy * s };
      applyGraphTransform();
      return;
    }
    if (!gp.start) return;
    const dx = e.clientX - gp.start.x;
    const dy = e.clientY - gp.start.y;
    if (!gp.moved && Math.hypot(dx, dy) < 6) return;
    gp.moved = true;
    if (gp.mode === "node" && gp.node) {
      gp.node.x = gp.nodeStart.x + dx / graph.view.s;
      gp.node.y = gp.nodeStart.y + dy / graph.view.s;
      gp.node.pinned = true;
      scheduleFrame();
    } else if (gp.mode === "pan") {
      graph.view = { ...gp.start.view, tx: gp.start.view.tx + dx, ty: gp.start.view.ty + dy };
      applyGraphTransform();
    }
  });
  const endPointer = (e) => {
    if (!gp.pointers.has(e.pointerId)) return;
    gp.pointers.delete(e.pointerId);
    if (gp.mode === "pinch") {
      if (gp.pointers.size === 1) {
        const p = [...gp.pointers.values()][0];
        gp.mode = "pan";
        gp.start = { x: p.x, y: p.y, view: { ...graph.view } };
      } else if (!gp.pointers.size) gp.mode = null;
      return;
    }
    if (gp.pointers.size) return;
    if (e.type !== "pointercancel") {
      if (!gp.moved && gp.mode === "node" && gp.node) onGraphNodeTap(gp.node.id);
      else if (!gp.moved && gp.mode === "pan") onGraphBackgroundTap();
      else if (gp.moved && gp.mode === "node") saveGraphPositions();
    }
    gp.mode = null;
    gp.node = null;
    gp.start = null;
  };
  stage.addEventListener("pointerup", endPointer);
  stage.addEventListener("pointercancel", endPointer);
  stage.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });

  view.addEventListener("click", async (e) => {
    const chip = e.target.closest("[data-gtype]");
    if (chip) {
      const t = chip.dataset.gtype;
      if (t === "__isolated") graph.hideIsolated = !graph.hideIsolated;
      else if (graph.hiddenTypes.has(t)) graph.hiddenTypes.delete(t);
      else graph.hiddenTypes.add(t);
      buildGraphDOM();
      return;
    }
    const g = e.target.closest("[data-g]")?.dataset.g;
    if (!g) return;
    const rect = stage.getBoundingClientRect();
    if (g === "fit") fitGraph();
    else if (g === "zoom-in") zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.3);
    else if (g === "zoom-out") zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1 / 1.3);
    else if (g === "relayout") {
      if (!graph.nodes.size) return;
      if (!(await confirmBox("모든 항목의 자리를 다시 잡을까요? 직접 옮겨 둔 위치도 처음부터 다시 배치됩니다.", "다시 배치"))) return;
      for (const n of graph.nodes.values()) { n.x = null; n.y = null; n.pinned = false; }
      graph.pos = {};
      buildGraphModel();
      runLayout(true);
      buildGraphDOM();
      fitGraph();
      saveGraphPositions();
    } else if (g === "open" && graph.selected) openEntry(graph.selected);
    else if (g === "link" && graph.selected) {
      if (state.busy) { toast("Claude가 작업 중입니다. 끝난 뒤에 이어 주세요"); return; }
      graph.linkFrom = graph.selected;
      applyGraphHighlight();
      renderGraphChrome();
      fitGraph(); // 이을 대상이 화면 밖에 있지 않도록 전체를 보여 준다
    } else if (g === "cancel-link") { graph.linkFrom = null; applyGraphHighlight(); renderGraphChrome(); }
    else if (g === "focus" && graph.selected) {
      graph.focusHops = graph.focusHops ? 0 : 1;
      buildGraphDOM();
      if (graph.focusHops) fitGraph(); else centerOn(graph.selected);
    } else if (g === "hops") { graph.focusHops = graph.focusHops === 1 ? 2 : 1; buildGraphDOM(); fitGraph(); }
    else if (g === "unfocus") { graph.focusHops = 0; buildGraphDOM(); centerOn(graph.selected); }
    else if (g === "chat" && graph.selected) {
      const ent = findEntry(graph.selected);
      switchView("chat");
      fillInput(`${ent.name}(${ent.id})의 인간관계와 연결을 더 만들어 줘. `);
    }
  });

  let searchTimer = 0;
  $("#graphSearch").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim().toLowerCase();
    searchTimer = setTimeout(() => {
      if (!q) return;
      const terms = q.split(/\s+/);
      const best = [...graph.nodes.values()].map((n) => ({ n, s: scoreEntry(n.entry, terms) })).filter((x) => x.s > 0).sort((a, b) => b.s - a.s)[0];
      if (!best) return;
      graph.linkFrom = null;
      graph.focusHops = 0;
      graph.hiddenTypes.delete(best.n.entry.type);
      if (graph.hideIsolated && best.n.degree === 0) graph.hideIsolated = false;
      graph.selected = best.n.id;
      buildGraphDOM();
      centerOn(best.n.id);
    }, 250);
  });
}
function onGraphNodeTap(id) {
  if (graph.linkFrom) {
    if (id === graph.linkFrom) { graph.linkFrom = null; applyGraphHighlight(); renderGraphChrome(); return; }
    openLinkForm(graph.linkFrom, id);
    return;
  }
  selectGraphNode(id);
}
function onGraphBackgroundTap() {
  if (graph.linkFrom || graph.focusHops) return;
  if (!graph.selected) return;
  graph.selected = null;
  applyGraphHighlight();
  renderGraphChrome();
}

function templateItem(fileName, text) {
  const { meta, body } = splitFrontmatter(text);
  const base = String(fileName || "").replace(/\.(md|markdown|txt)$/i, "").trim();
  return {
    fileName,
    label: meta["분류"] || meta["이름"] || meta.name || meta.label || base,
    code: String(meta["코드"] || meta.code || "").toUpperCase(),
    desc: meta["설명"] || meta.description || meta.desc || "",
    base: meta["기존분류"] || meta.base || "",
    template: body,
  };
}
async function readTemplateFiles(files) {
  const items = [];
  for (const f of [...files].slice(0, 30)) {
    try {
      const { data } = await prepareText(f);
      items.push(templateItem(f.name, data));
    } catch (err) { toast(`${f.name}: ${err?.message || err}`); }
  }
  return items;
}
function entryCountByType() {
  const counts = {};
  for (const e of state.entries) counts[e.type] = (counts[e.type] || 0) + 1;
  return counts;
}
async function commitTypes(newTypes, note) {
  const w = currentWorld();
  w.types = newTypes;
  w.updatedAt = Date.now();
  logChange("user", "types", null, note);
  await Promise.all([persist.worlds(), persist.log()]);
  renderCodex();
}

function openTemplateImport(items) {
  const types = worldTypes();
  const taken = new Set(types.map((t) => t.code));
  const rows = items.map((it) => {
    const byLabel = types.find((t) => t.label === it.label) || (it.base && types.find((t) => t.label === it.base));
    let code = it.code;
    if (!CODE_RE.test(code) || taken.has(code)) code = suggestCode([...taken]);
    if (!byLabel) taken.add(code);

    });

    root.onsubmit = async (ev) => {
      ev.preventDefault();
      if (state.busy) { toast("Claude가 작업 중입니다. 끝난 뒤에 바꿔 주세요"); return; }
      const list = worldTypes().map((t) => ({ ...t }));
      const done = [];
      for (const fs of $$(".imp", root)) {
        if (!$(".imp-on", fs).checked) continue;
        const r = rows[Number(fs.dataset.i)];
        const label = $(".imp-label", fs).value.trim();
        const target = $(".imp-target", fs).value;
        const desc = $(".imp-desc", fs).value.trim();
        if (!label) { toast(`${r.fileName}: 분류 이름을 넣어 주세요`); return; }
        if (target === "__new") {

          if (list.some((t) => t.code === code)) { toast(`${r.fileName}: 코드 ${code}가 이미 쓰이고 있습니다`); return; }

        } else {
          const t = list.find((x) => x.key === target);
          t.label = label;

          if (desc) t.desc = desc;

        done.push(label);

      toast(`템플릿 ${done.length}개를 가져왔습니다`);
    };

const isCharacterType = (key) => key === "character" || /인물|캐릭터/.test(typeInfo(key).label);
const isEventType = (key) => key === "event" || /사건|역사|전쟁/.test(typeInfo(key).label);

function renderTimelineResults() {
  const box = $("#tlResults");
  if (!box) return;
  const cal = worldCalendar();
  const all = timelineEntries();
  const counts = {};
  for (const e of all) counts[e.type] = (counts[e.type] || 0) + 1;
  let list = all.filter((e) => !state.tlHidden.has(e.type));
  const q = state.tlQuery.trim().toLowerCase();
  if (q) { const terms = q.split(/\s+/); list = list.filter((e) => scoreEntry(e, terms) > 0); }

  // 간격이 유난히 긴 곳에 "… N년 뒤" 표시(연속된 서로 다른 시작 연도 간격의 중앙값 3배 이상)
  const starts = [...new Set(list.map((e) => e.when.start))];
  const diffs = starts.slice(1).map((v, i) => v - starts[i]).sort((a, b) => a - b);
  const gapLimit = diffs.length >= 3 ? Math.max(1, diffs[Math.floor(diffs.length / 2)] * 3) : Infinity;

  let html = "";
  let eraName;
  let prev = null;
  let nowShown = cal.now === null;
  const nowHTML = () => `<div class="tl-now"><span>지금 · ${esc(fmtYear(cal.now, cal))}</span></div>`;
  for (const e of list) {
    const start = e.when.start;
    if (!nowShown && start > cal.now) { html += nowHTML(); nowShown = true; }
    const era = cal.eras.length ? eraOf(start, cal) : null;
    const name = era ? era.name : null;
    if (cal.eras.length && name !== eraName) {
      html += era
        ? `<div class="tl-era"><strong>${esc(era.name)}</strong><span>${esc(eraRangeText(era, cal))}</span></div>`
        : `<div class="tl-era"><strong>시대 구분 밖</strong><span></span></div>`;
      eraName = name;
    } else if (prev !== null && start - prev >= gapLimit) {
      html += `<div class="tl-gap"><span>… ${esc(fmtYearNum(start - prev))}${esc(cal.suffix)} 뒤</span></div>`;
    }
    prev = start;
    const t = typeInfo(e.type);
    let extra = "";
    if (e.when.end != null) extra = isCharacterType(e.type) ? `향년 ${fmtYearNum(e.when.end - e.when.start)}` : spanText(e.when, cal);
    else if (isCharacterType(e.type) && cal.now !== null && cal.now >= start) extra = `지금 ${fmtYearNum(cal.now - start)}살`;
    html += `<div class="tl-row${state.tlHighlight === e.id ? " hl" : ""}${statusOf(e) === "draft" ? " draft" : ""}" id="tl-${e.id}" style="--tc:${typeColor(e.type)}">
      <div class="tl-year">${esc(fmtYearNum(start))}</div>
      <div class="tl-axis"><span class="tl-dot${e.when.end != null ? " span" : ""}"></span></div>
      <button class="tl-card" type="button" data-ref="${e.id}">

/* ============================================================
   12-5. GitHub 동기화
   비공개 저장소의 lorekeeper/ 폴더에 데이터를 나눠 저장하고, 기기끼리 합친다.
   - lorekeeper/index.json   : 세계관 목록과 삭제 기록(tombstones)
   - lorekeeper/w/<세계관>.json : 항목, 변경 기록, 대화 목록, 관계도 위치
   - lorekeeper/c/<대화>.json  : 대화 기록
   - lorekeeper/i/<세계관>.json : 항목 그림(있을 때만)
   한 번 동기화할 때 바뀐 파일만 모아 커밋 하나로 올리고, 그 사이 다른 기기가
   먼저 올렸으면(fast-forward 실패) 다시 받아 합친 뒤 올린다.

const SYNC_DIR = "lorekeeper";
const SYNC_KEY_RE = /^(worlds$|entries:|log:|threads:|graph:|conv:|ms:|imgs:|sync:tombstones$)/;
const syncCfg = Object.assign(
  { enabled: false, repo: "", token: "", device: "", auto: true, lastSyncAt: 0, lastCommit: "", shas: {}, lastError: "" },
  LS.get("lk.sync", {}),

const textEnc = new TextEncoder();

  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "아이패드";

  if (/Macintosh/.test(ua)) return "맥";

}

// ---- GitHub API ----
async function gh(method, path, body) {
  const url = `https://api.github.com/repos/${syncCfg.repo}${path}`;
  let res;
  try {
    res = await fetch(url, {
      method,
      cache: "no-store",
      headers: {
        Authorization: `Bearer ${syncCfg.token}`,
        Accept: "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        ...(body ? { "Content-Type": "application/json" } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    const err = new Error("network");
    err.status = 0;
    throw err;
  }
  if (!res.ok) {
    let msg = "";
    try { msg = (await res.json()).message || ""; } catch { /* 본문 없음 */ }
    const err = new Error(msg || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}
function describeSyncError(err) {
  if (err?.status === 0) return "네트워크에 연결할 수 없습니다.";
  if (err?.status === 401) return "토큰이 올바르지 않거나 만료되었습니다. 새 토큰을 넣어 주세요.";
  if (err?.status === 403) return /rate limit/i.test(err.message) ? "GitHub 요청 한도에 걸렸습니다. 잠시 후 다시 시도합니다." : "토큰에 이 저장소의 Contents 읽기·쓰기 권한이 없습니다.";
  if (err?.status === 404) return "저장소를 찾을 수 없습니다. 저장소 이름과, 토큰이 그 저장소에 접근할 수 있는지 확인하세요.";
  return `동기화 오류: ${err?.message || err}`;
}
async function gitBlobSha(text) {
  const body = textEnc.encode(text);
  const head = textEnc.encode(`blob ${body.length}\0`);
  const buf = new Uint8Array(head.length + body.length);
  buf.set(head);
  buf.set(body, head.length);
  const d = await crypto.subtle.digest("SHA-1", buf);
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
function b64ToText(b64) {
  const bin = atob(String(b64).replace(/\s/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function textToB64(text) {
  const bytes = textEnc.encode(text);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
// 원격 저장소의 현재 상태: 브랜치 머리 커밋과 lorekeeper/ 아래 파일들의 blob sha
async function remoteHead() {
  const repo = await gh("GET", "");
  const branch = repo.default_branch || "main";
  let ref;
  try {
    ref = await gh("GET", `/git/ref/heads/${encodeURIComponent(branch)}`);
  } catch (err) {
    if (err.status !== 409 && err.status !== 404) throw err;
    // 빈 저장소: 첫 커밋을 만든다
    await gh("PUT", "/contents/README.md", { message: "로어키퍼 동기화 시작", content: textToB64("# 로어키퍼 데이터\n\n로어키퍼 앱이 동기화에 쓰는 저장소입니다. 직접 고치지 마세요.\n") });
    ref = await gh("GET", `/git/ref/heads/${encodeURIComponent(branch)}`);
  }
  const head = ref.object.sha;
  const commit = await gh("GET", `/git/commits/${head}`);
  const tree = await gh("GET", `/git/trees/${commit.tree.sha}?recursive=1`);
  const files = {};
  for (const t of tree.tree || []) if (t.type === "blob" && t.path.startsWith(SYNC_DIR + "/")) files[t.path] = t.sha;
  return { branch, head, treeSha: commit.tree.sha, files };
}

async function flushLocal() {

async function loadLocalSnapshot() {
  const worlds = (await idb.get("worlds")) || [];
  const tomb = (await idb.get("sync:tombstones")) || { worlds: {}, threads: {}, entries: {} };
  const data = {};
  const convs = {};
  for (const w of worlds) {
    const threads = (await idb.get("threads:" + w.id)) || [];
    data[w.id] = {
      entries: (await idb.get("entries:" + w.id)) || [],
      log: (await idb.get("log:" + w.id)) || [],
      threads,
      graph: (await idb.get("graph:" + w.id)) || null,
      ms: (await idb.get("ms:" + w.id)) || [],
      images: (await idb.get("imgs:" + w.id)) || {},
    };
    for (const t of threads) convs[t.id] = (await idb.get("conv:" + t.id)) || null;
  }
  return { worlds, tomb: { worlds: {}, threads: {}, entries: {}, ...tomb }, data, convs };
}
const worldPath = (id) => `${SYNC_DIR}/w/${id}.json`;
const convPath = (id) => `${SYNC_DIR}/c/${id}.json`;
const imgPath = (id) => `${SYNC_DIR}/i/${id}.json`;
const emptyWorldData = () => ({ entries: [], log: [], threads: [], graph: null, ms: [], images: {} });
const INDEX_PATH = `${SYNC_DIR}/index.json`;
function serializeSnapshot(snap) {
  const files = {};
  files[INDEX_PATH] = JSON.stringify({ app: "lorekeeper-sync", version: 1, worlds: snap.worlds, tombstones: snap.tomb });
  for (const w of snap.worlds) {
    const d = snap.data[w.id] || emptyWorldData();
    // 원고가 없으면 예전 형식 그대로 둔다(바뀐 것 없이 다시 올리지 않게)
    files[worldPath(w.id)] = JSON.stringify({ entries: d.entries, log: d.log, threads: d.threads, graph: d.graph, ...(d.ms?.length ? { ms: d.ms } : {}) });
    if (d.images && Object.keys(d.images).length) files[imgPath(w.id)] = JSON.stringify(d.images);
    for (const t of d.threads) if (snap.convs[t.id]) files[convPath(t.id)] = JSON.stringify(snap.convs[t.id]);
  }
  return files;
}

// ---- 합치기 ----
function mergeTombstones(a, b) {
  const out = { worlds: {}, threads: {}, entries: {} };
  for (const src of [a, b]) for (const k of ["worlds", "threads", "entries", "manuscripts"]) for (const [id, at] of Object.entries(src?.[k] || {})) { out[k] = out[k] || {}; out[k][id] = Math.max(out[k][id] || 0, at); }
  const cutoff = Date.now() - 90 * 24 * 3600 * 1000; // 90일 지난 삭제 기록은 정리
  for (const k of Object.keys(out)) for (const [id, at] of Object.entries(out[k])) if (at < cutoff) delete out[k][id];
  return out;
}
function mergeCounters(a = {}, b = {}) {
  const out = { ...a };
  for (const [k, v] of Object.entries(b)) out[k] = Math.max(out[k] || 0, v);
  return out;
}
function mergeWorldList(local, remote) {
  const out = new Map(local.map((w) => [w.id, w]));
  for (const r of remote) {
    const l = out.get(r.id);
    if (!l) { out.set(r.id, r); continue; }
    const win = (r.updatedAt || 0) > (l.updatedAt || 0) ? r : l;
    out.set(r.id, { ...win, counters: mergeCounters(l.counters, r.counters) });
  }
  return [...out.values()];
}
function nextFreeId(code, taken) {
  let n = 0;
  for (const id of taken) {
    const m = id.match(/^([A-Z][A-Z0-9]{0,2})-(\d+)$/);
    if (m && m[1] === code) n = Math.max(n, Number(m[2]));
  }
  return `${code}-${String(n + 1).padStart(3, "0")}`;
}
function mergeWorldData(local, remote) {
  const out = new Map(local.entries.map((e) => [e.id, e]));
  const localOrigin = new Set(local.entries.map((e) => e.id));
  const collided = [];
  for (const r of remote.entries || []) {
    const l = out.get(r.id);
    if (!l) { out.set(r.id, r); continue; }
    if (l.createdAt === r.createdAt) {
      if ((r.updatedAt || 0) > (l.updatedAt || 0)) { out.set(r.id, r); localOrigin.delete(r.id); }
      continue;
    }

// ---- 한 번의 동기화 ----
async function syncOnce() {
  await flushLocal();
  const remote = await remoteHead();
  const local = await loadLocalSnapshot();
  const before = serializeSnapshot(local);

  // 지난 동기화 뒤 원격에서 바뀐 파일만 받는다
  const changed = Object.keys(remote.files).filter((p) => remote.files[p] !== syncCfg.shas[p]);
  const localShas = {};
  for (const p of changed) if (before[p] !== undefined) localShas[p] = await gitBlobSha(before[p]);
  const toFetch = changed.filter((p) => remote.files[p] !== localShas[p]);
  const got = {};
  for (const p of toFetch) got[p] = JSON.parse(b64ToText((await gh("GET", `/git/blobs/${remote.files[p]}`)).content));

  const merged = { worlds: local.worlds, tomb: local.tomb, data: local.data, convs: local.convs };
  const changedConvs = new Set();
  if (got[INDEX_PATH]) {
    merged.worlds = mergeWorldList(local.worlds, got[INDEX_PATH].worlds || []);
    merged.tomb = mergeTombstones(local.tomb, got[INDEX_PATH].tombstones);
  }
  for (const w of merged.worlds) {
    const r = got[worldPath(w.id)];
    const ri = got[imgPath(w.id)];
    if (!merged.data[w.id]) merged.data[w.id] = r ? { entries: r.entries || [], log: r.log || [], threads: r.threads || [], graph: r.graph || null, ms: r.ms || [], images: ri || {} } : { ...emptyWorldData(), images: ri || {} };
    else {
      if (r) merged.data[w.id] = mergeWorldData(merged.data[w.id], r);
      if (ri) merged.data[w.id].images = mergeImages(merged.data[w.id].images, ri);
    }
  }
  for (const p of Object.keys(got)) {
    if (!p.startsWith(`${SYNC_DIR}/c/`)) continue;
    const id = p.slice(`${SYNC_DIR}/c/`.length, -".json".length);
    const res = mergeConv(local.convs[id], got[p]);
    merged.convs[id] = res.conv;
    changedConvs.add(id);
    if (res.copy) {
      // 이 기기에서 이어진 쪽을 사본 대화로 남긴다
      const wid = Object.keys(merged.data).find((k) => merged.data[k].threads.some((t) => t.id === id));
      if (wid) {
        const meta = merged.data[wid].threads.find((t) => t.id === id);
        const copyId = uid();
        merged.data[wid].threads.push({ ...meta, id: copyId, title: `${meta.title} (${syncCfg.device || "이 기기"} 사본)`, updatedAt: Date.now() });
        merged.convs[copyId] = res.copy;
        changedConvs.add(copyId);
      }
    }
  }
  applyTombstones(merged);

  // 합친 결과를 이 기기에 저장
  const after = serializeSnapshot(merged);
  syncState.applying = true;
  let localChanged = false;
  try {
    if (after[INDEX_PATH] !== before[INDEX_PATH]) { await idb.set("worlds", merged.worlds); await idb.set("sync:tombstones", merged.tomb); localChanged = true; }
    const liveWorlds = new Set(merged.worlds.map((w) => w.id));
    for (const w of merged.worlds) {
      if (after[worldPath(w.id)] !== before[worldPath(w.id)]) {
        const d = merged.data[w.id];
        await Promise.all([idb.set("entries:" + w.id, d.entries), idb.set("log:" + w.id, d.log), idb.set("threads:" + w.id, d.threads), d.graph ? idb.set("graph:" + w.id, d.graph) : idb.del("graph:" + w.id), idb.set("ms:" + w.id, d.ms || [])]);
        localChanged = true;
      }
      if (after[imgPath(w.id)] !== before[imgPath(w.id)]) { await idb.set("imgs:" + w.id, merged.data[w.id].images || {}); localChanged = true; }
    }
    for (const w of local.worlds) if (!liveWorlds.has(w.id)) { await Promise.all(["entries:", "log:", "threads:", "graph:", "ms:", "imgs:"].map((k) => idb.del(k + w.id))); localChanged = true; }
    const liveThreads = new Set(merged.worlds.flatMap((w) => merged.data[w.id].threads.map((t) => t.id)));
    for (const id of Object.keys(merged.convs)) {
      if (!liveThreads.has(id)) { if (local.convs[id] !== undefined) { await idb.del("conv:" + id); localChanged = true; } continue; }
      if (after[convPath(id)] !== before[convPath(id)] && merged.convs[id]) { await idb.set("conv:" + id, merged.convs[id]); localChanged = true; }
    }
  } finally {
    syncState.applying = false;
  }

  // 원격과 다른 파일을 올린다
  const finalShas = {};
  for (const [p, text] of Object.entries(after)) finalShas[p] = await gitBlobSha(text);
  const uploads = Object.keys(after).filter((p) => remote.files[p] !== finalShas[p]);
  const deletions = Object.keys(remote.files).filter((p) => !(p in after));
  let head = remote.head;
  if (uploads.length || deletions.length) {
    const items = [];
    for (const p of uploads) {
      const blob = await gh("POST", "/git/blobs", { content: after[p], encoding: "utf-8" });
      items.push({ path: p, mode: "100644", type: "blob", sha: blob.sha });
    }
    for (const p of deletions) items.push({ path: p, mode: "100644", type: "blob", sha: null });
    const tree = await gh("POST", "/git/trees", { base_tree: remote.treeSha, tree: items });
    const commit = await gh("POST", "/git/commits", { message: `로어키퍼 동기화 · ${syncCfg.device || defaultDeviceName()}`, tree: tree.sha, parents: [remote.head] });
    try {
      await gh("PATCH", `/git/refs/heads/${encodeURIComponent(remote.branch)}`, { sha: commit.sha, force: false });
    } catch (err) {
      if (err.status === 422 || err.status === 409) { if (localChanged) await reloadAfterSync(changedConvs); return false; } // 그 사이 다른 기기가 올렸다: 다시 받아서 합친다
      throw err;
    }
    head = commit.sha;
  }
  syncCfg.shas = finalShas;
  syncCfg.lastCommit = head;
  if (localChanged) await reloadAfterSync(changedConvs);
  return true;
}
async function reloadAfterSync(changedConvs) {
  state.worlds = (await idb.get("worlds")) || [];
  resetGraphCache();
  if (!state.worlds.length) {
    state.worldId = null; state.entries = []; state.log = []; state.threads = []; state.manuscripts = []; state.images = {}; state.threadId = null; state.conv = { api: [], display: [] };
    renderWorldName(); renderChat(); renderCodex();
    return;
  }
  if (!state.worlds.some((w) => w.id === state.worldId)) { await openWorld(state.worlds[0].id); return; }
  state.entries = (await idb.get("entries:" + state.worldId)) || [];
  state.log = (await idb.get("log:" + state.worldId)) || [];
  state.threads = (await idb.get("threads:" + state.worldId)) || [];
  state.manuscripts = (await idb.get("ms:" + state.worldId)) || [];
  state.images = (await idb.get("imgs:" + state.worldId)) || {};
  if (state.threadId && !state.threads.some((t) => t.id === state.threadId)) { state.threadId = null; state.conv = { api: [], display: [] }; }
  else if (state.threadId && changedConvs.has(state.threadId)) state.conv = (await idb.get("conv:" + state.threadId)) || { api: [], display: [] };
  renderWorldName();
  renderChat();
  renderCodex();
}

function scheduleSync(delay = 15000) {
  if (!syncCfg.enabled || !syncCfg.auto) return;
  clearTimeout(syncState.timer);
  syncState.timer = setTimeout(() => runSync("auto"), delay);
}
async function runSync(reason) {
  if (!syncCfg.enabled) return false;
  if (syncState.running) { syncState.queued = true; return false; }
  // Claude가 답하는 중이거나 편집 창이 열려 있으면 잠시 뒤에 한다(열린 화면의 데이터를 바꾸지 않도록)
  if (state.busy || !$("#sheet").hidden || !$("#dialog").hidden) {
    clearTimeout(syncState.timer);
    syncState.timer = setTimeout(() => runSync(reason), 5000);
    return false;
  }
  clearTimeout(syncState.timer);
  syncState.running = true;
  renderSyncIndicator();
  let ok = false;
  try {
    for (let i = 0; i < 4 && !ok; i++) ok = await syncOnce();
    if (!ok) throw new Error("다른 기기와 동시에 올리는 중입니다. 잠시 후 다시 시도합니다.");
    syncCfg.lastError = "";
    syncCfg.lastSyncAt = Date.now();
  } catch (err) {
    console.warn("동기화 실패", err);
    syncCfg.lastError = describeSyncError(err);
  } finally {
    saveSyncCfg();
    syncState.running = false;
    renderSyncIndicator();
    if (syncState.queued) { syncState.queued = false; scheduleSync(2000); }
  }
  return ok;
}

  btn.classList.toggle("running", syncState.running);
  btn.classList.toggle("error", !!syncCfg.lastError && !syncState.running);
  btn.setAttribute("aria-label", syncState.running ? "동기화 중" : syncCfg.lastError ? `동기화 오류: ${syncCfg.lastError}` : "지금 동기화");

}

async function connectSync(repo, token, device) {

  if (!token.trim()) { toast("토큰을 넣어 주세요"); return; }
  const prev = { ...syncCfg };
  Object.assign(syncCfg, { repo: m, token: token.trim(), device: device.trim() || defaultDeviceName() });
  let info;
  try {
    info = await gh("GET", "");
  } catch (err) {
    Object.assign(syncCfg, { repo: prev.repo, token: prev.token, device: prev.device });

  }
  if (info.private === false && !(await confirmBox("이 저장소는 공개 저장소입니다. 세계관과 대화 내용이 누구에게나 보이게 됩니다. 그래도 연결할까요?", "그래도 연결", true))) {
    Object.assign(syncCfg, { repo: prev.repo, token: prev.token, device: prev.device });
    return;
  }
  if (info.permissions && info.permissions.push === false) {
    Object.assign(syncCfg, { repo: prev.repo, token: prev.token, device: prev.device });
    toast("토큰에 이 저장소의 쓰기 권한이 없습니다");
    return;
  }
  Object.assign(syncCfg, { enabled: true, auto: true, shas: prev.repo === m ? prev.shas : {}, lastError: "" });
  saveSyncCfg();
  renderSyncIndicator();
  renderSettings();
  toast("연결했습니다. 동기화를 시작합니다");
  const ok = await runSync("connect");
  toast(ok ? "동기화했습니다" : syncCfg.lastError || "동기화하지 못했습니다");
  renderSettings();
}
function bindSync() {
  if (!syncCfg.device) syncCfg.device = defaultDeviceName();
  $("#syncBtn").onclick = async () => {
    const ok = await runSync("manual");
    toast(ok ? "동기화했습니다" : syncCfg.lastError || "잠시 후 다시 시도합니다");
  };
  document.addEventListener("visibilitychange", () => {
    if (!syncCfg.enabled) return;
    if (document.visibilityState === "visible" && Date.now() - syncCfg.lastSyncAt > 30000) runSync("visible");

  });
  syncState.poller = setInterval(() => {
    if (syncCfg.enabled && syncCfg.auto && document.visibilityState === "visible" && Date.now() - syncCfg.lastSyncAt > 60000) runSync("poll");
  }, 90000);
  renderSyncIndicator();
}

function download(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function exportAll() {
  if (state.worldId) await Promise.all([persist.world(), persist.threads(), persist.conv(), persist.worlds(), persist.images()]);
  const data = { app: "lorekeeper", version: 1, exportedAt: new Date().toISOString(), worlds: [] };
  for (const w of state.worlds) {
    const threads = (await idb.get("threads:" + w.id)) || [];
    const convs = {};
    for (const t of threads) convs[t.id] = (await idb.get("conv:" + t.id)) || null;
    data.worlds.push({
      world: w,
      entries: (await idb.get("entries:" + w.id)) || [],
      log: (await idb.get("log:" + w.id)) || [],
      graph: (await idb.get("graph:" + w.id)) || null,
      manuscripts: (await idb.get("ms:" + w.id)) || [],
      images: (await idb.get("imgs:" + w.id)) || {},
      threads,
      convs,
    });
  }
  download(`lorekeeper-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data), "application/json");
  toast("백업 파일을 만들었습니다");
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast("백업 파일을 읽을 수 없습니다"); return; }
  if (data?.app !== "lorekeeper" || !Array.isArray(data.worlds)) { toast("로어키퍼 백업 파일이 아닙니다"); return; }
  const clash = data.worlds.filter((x) => state.worlds.some((w) => w.id === x.world?.id));
  const msg = `세계관 ${data.worlds.length}개를 불러옵니다.${clash.length ? `\n이미 있는 ${clash.length}개는 백업 내용으로 덮어씁니다.` : ""}`;
  if (!(await confirmBox(msg, "불러오기"))) return;
  for (const x of data.worlds) {
    if (!x.world?.id) continue;
    const id = x.world.id;
    const i = state.worlds.findIndex((w) => w.id === id);
    if (i >= 0) state.worlds[i] = x.world; else state.worlds.push(x.world);
    await Promise.all([
      idb.set("entries:" + id, x.entries || []),
      idb.set("log:" + id, x.log || []),
      x.graph ? idb.set("graph:" + id, x.graph) : idb.del("graph:" + id),
      idb.set("ms:" + id, x.manuscripts || []),
      idb.set("imgs:" + id, x.images || {}),
      idb.set("threads:" + id, x.threads || []),
      ...Object.entries(x.convs || {}).filter(([, v]) => v).map(([tid, v]) => idb.set("conv:" + tid, v)),
    ]);
  }
  await persist.worlds();
  resetGraphCache(); // 불러온 관계도 위치를 다시 읽게 한다
  await openWorld(state.worldId && state.worlds.some((w) => w.id === state.worldId) ? state.worldId : state.worlds[0].id);
  renderSettings();
  toast("백업을 불러왔습니다");
}
function exportMarkdown() {
  const w = currentWorld();
  if (!w) return;
  const parts = [`# ${w.name}`, "", w.premise ? `> ${w.premise}` : "", "", w.tone ? `**분위기 · 문체**: ${w.tone}` : "", "", w.rules ? `## 세계 규칙\n\n${w.rules}` : ""];
  for (const k of typeKeys()) {
    const list = liveEntries().filter((e) => e.type === k).sort((a, b) => a.id.localeCompare(b.id));
    if (!list.length) continue;
    parts.push("", `## ${typeInfo(k).label}`);
    for (const e of list) {
      parts.push("", `### ${e.name} \`${e.id}\`${statusOf(e) === "draft" ? " (초안)" : ""}`);
      if (e.aliases?.length) parts.push(`*별칭: ${e.aliases.join(", ")}*`);
      parts.push("", e.summary || "");
      const f = Object.entries(e.fields || {});
      if (f.length) parts.push("", ...f.map(([kk, v]) => `- **${kk}**: ${v}`));
      if (e.body) parts.push("", e.body);
      const rel = (e.relations || []).map((r) => `- ${r.label} → ${nameOf(r.to)} (\`${r.to}\`)`);
      if (rel.length) parts.push("", "**관계**", ...rel);
      if (e.when) parts.push("", `*시점: ${rangeText(e.when)}${e.when.label ? ` · ${e.when.label}` : ""}*`);
      const sn = Object.entries(e.senses || {}).filter(([, v]) => v);
      if (sn.length) parts.push("", "**감각**", ...sn.map(([kk, v]) => `- ${kk}: ${v}`));
      if (e.perspectives?.length) parts.push("", "**관점별 서술**", ...e.perspectives.map((x) => `- ${nameOf(x.by) === "(없는 항목)" ? x.by : nameOf(x.by)}: ${x.text}`));
      if (e.tags?.length) parts.push("", e.tags.map((t) => "#" + t).join(" "));
    }
  }
  const tl = timelineEntries();
  if (tl.length) {
    const cal = worldCalendar();
    parts.push("", "## 연표");
    for (const x of cal.eras.slice().sort((a, b) => a.start - b.start)) parts.push(`- 시대: **${x.name}** (${eraRangeText(x, cal)})`);
    parts.push("");
    for (const e of tl) parts.push(`- **${rangeText(e.when, cal)}** ${e.name} (\`${e.id}\`)${e.summary ? ` — ${e.summary}` : ""}`);
  }
  const rules = worldNaming(w);
  if (rules.length) {
    parts.push("", "## 이름 규칙");
    for (const r of rules) parts.push("", `### ${r.name}`, r.applies?.length ? `*적용: ${r.applies.join(", ")}*` : "", "", r.rules || "", r.examples?.length ? `\n예: ${r.examples.join(", ")}` : "");
  }
  if (state.manuscripts.length) {
    parts.push("", "## 원고함");
    for (const m of state.manuscripts.slice().sort((a, b) => a.createdAt - b.createdAt)) parts.push("", `### ${m.title} (${m.kind})`, "", m.body);
  }
  const safe = w.name.replace(/[\\/:*?"<>|]/g, "_");
  download(`${safe}.md`, parts.join("\n").replace(/\n{3,}/g, "\n\n"), "text/markdown");
  toast("문서 파일을 만들었습니다");
}

function autosize(t) {
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 200) + "px";
}
function fitViewport() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  document.documentElement.style.setProperty("--app-h", `${h}px`);
  document.documentElement.style.setProperty("--app-top", `${vv ? vv.offsetTop : 0}px`);
}

function bindGlobal() {
  window.visualViewport?.addEventListener("resize", fitViewport);
  window.visualViewport?.addEventListener("scroll", fitViewport);
  window.addEventListener("resize", fitViewport);
  fitViewport();

  $(".tabbar").onclick = (e) => { const b = e.target.closest("[data-view]"); if (b) switchView(b.dataset.view); };

    else if (m === "cancel") { state.pendingMode = null; renderModeBar(); }
  };
  $("#fileInput").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
  $("#attachTray").onclick = (e) => {
    const x = e.target.closest("[data-att-remove]");
    if (!x) return;
    attachments = attachments.filter((a) => a.id !== x.dataset.attRemove);
    renderAttachTray();
  };
  const chatView = $("#view-chat");
  chatView.addEventListener("dragover", (e) => {
    if (![...(e.dataTransfer?.types || [])].includes("Files")) return;
    e.preventDefault();
    chatView.classList.add("dragging");
  });
  chatView.addEventListener("dragleave", (e) => { if (!chatView.contains(e.relatedTarget)) chatView.classList.remove("dragging"); });
  chatView.addEventListener("drop", (e) => {
    chatView.classList.remove("dragging");
    if (!e.dataTransfer?.files?.length) return;
    e.preventDefault();
    addFiles(e.dataTransfer.files);
  });

  const input = $("#input");
  input.addEventListener("input", () => autosize(input));
  input.addEventListener("focus", () => document.body.classList.add("kb-open"));
  // 탭이 끝난 뒤에 하단 탭을 되돌린다. 바로 되돌리면 레이아웃이 밀려 누른 버튼을 놓친다.
  input.addEventListener("blur", () => setTimeout(() => {
    if (document.activeElement !== input) document.body.classList.remove("kb-open");
  }, 250));
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("#composer").requestSubmit(); }
  });
  input.addEventListener("paste", (e) => {
    const files = [...(e.clipboardData?.files || [])];
    if (!files.length) return;
    e.preventDefault();
    addFiles(files);
  });
  // 보내기 버튼을 눌러도 입력란 포커스가 유지되게 한다. 포커스가 빠지면 키보드가 닫히며 레이아웃이 밀려 버튼을 놓친다.
  $("#sendBtn").addEventListener("pointerdown", (e) => e.preventDefault());
  $("#sendBtn").addEventListener("mousedown", (e) => e.preventDefault());
  $("#composer").onsubmit = (e) => {
    e.preventDefault();
    if (state.busy) { stopAgent(); return; }
    const text = input.value.trim();
    if (!text && !attachments.length) return;
    if (!canSend()) return; // 보낼 수 없으면 입력한 글을 지우지 않는다
    input.value = "";
    autosize(input);
    sendMessage(text);
  };

  document.addEventListener("click", async (e) => {
    if (e.target.closest("[data-close-sheet]")) { closeSheet(); return; }
    const inSheet = e.target.closest("#sheetBody");
    const ref = e.target.closest("[data-ref]");
    if (ref && !inSheet) { openEntry(ref.dataset.ref); return; }
    const go = e.target.closest("[data-goto]");
    if (go) { switchView(go.dataset.goto); return; }
    const sug = e.target.closest("[data-suggest]");
    if (sug) { input.value = sug.dataset.suggest; autosize(input); input.focus(); return; }
    const chip = e.target.closest("[data-type]");
    if (chip && e.target.closest("#codex")) { state.codexType = chip.dataset.type; renderCodexResults(); return; }
    const stChip = e.target.closest("[data-status]");
    if (stChip && e.target.closest("#codex")) {
      const k = stChip.dataset.status;
      if (state.codexStatus.has(k)) { if (state.codexStatus.size > 1) state.codexStatus.delete(k); } else state.codexStatus.add(k);
      renderCodexResults();
      return;
    }
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (!act) return;
    if (inSheet && !["new-world", "load-sample", "edit-world"].includes(act)) return;
    if (act === "new-world") openWorldForm(null);
    else if (act === "load-sample") loadSample();
    else if (act === "edit-world") { const w = currentWorld(); if (w) openWorldForm(w); }
    else if (act === "new-entry") { if (state.busy) toast("Claude가 작업 중입니다"); else openEditor(null); }
    else if (act === "trash") openTrash();
    else if (act === "types") openTypesSheet();
    else if (act === "checks") openChecksSheet();
    else if (act === "retry") { if (!state.busy) runAgent(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("#dialog").hidden) return;
    if (!$("#sheet").hidden) closeSheet();
  });
  window.addEventListener("beforeunload", (e) => { if (state.busy) { e.preventDefault(); e.returnValue = ""; } });
}

  bindSync();
  updateCostBadge();
  state.worlds = (await idb.get("worlds")) || [];
  const want = LS.get("lk.world", null);
  const w = state.worlds.find((x) => x.id === want) || state.worlds[0];
  if (w) await openWorld(w.id);
  else { renderWorldName(); renderChat(); renderCodex(); }
  switchView(LS.get("lk.view", "chat"));
  if (idb.broken) toast("이 브라우저에서는 데이터가 저장되지 않습니다. 개인정보 보호 모드를 끄세요");
  if (syncCfg.enabled) runSync("startup");
}
init();
</script>
</body>
</html>
