<title>로어키퍼</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F7468'/%3E%3Cpath d='M20 14h24v36l-12-8-12 8z' fill='%23F3F7F5'/%3E%3C/svg%3E">

<style>
/* 레이아웃: 상단 세계관 바 · 가운데 작업 영역 · 하단 탭. 설정집은 기록 보관소의 색인 카드처럼 분류번호(C-001)로 정리한다. */
:root {
  --bg: #EEF0EC;
  --surface: #F8F9F6;
  --surface-2: #E2E7E1;
  --ink: #1D2A2E;
  --muted: #5B6A6A;
  --line: #CAD2CB;
  --accent: #2F7468;
  --accent-ink: #F3F7F5;
  --accent-soft: #D5E7E1;
  --danger: #A33A2F;
  --danger-soft: #F3DEDA;
  --user-bubble: #DCE5EC;
  --backdrop: rgba(12, 20, 22, .45);
  --shadow: 0 6px 24px rgba(20, 32, 34, .14);
  --t-character: #8B4A7E;
  --t-place: #33689A;
  --t-faction: #A24E2A;
  --t-species: #557A2E;
  --t-event: #8E6D12;
  --t-item: #5B57A8;
  --t-concept: #2F7468;
  --t-other: #66706F;
  --t-c1: #A8475A;
  --t-c2: #2C7A8A;
  --t-c3: #76691C;
  --t-c4: #6A4E9E;
  --t-c5: #B05F2B;
  --t-c6: #3B7A4D;
  --t-c7: #9C4379;
  --t-c8: #4A6278;
  --font-display: "Hahmlet", "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
/* 테마: 기본은 기기 설정을 따르고, 설정에서 라이트/다크를 고르면 html[data-theme]로 고정한다. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111719;
    --surface: #182023;
    --surface-2: #222C2F;
    --ink: #E2E8E4;
    --muted: #93A19F;
    --line: #2F3B3D;
    --accent: #6DBCAD;
    --accent-ink: #0D1917;
    --accent-soft: #1D3833;
    --danger: #E58374;
    --danger-soft: #3A2220;
    --user-bubble: #22313B;
    --backdrop: rgba(0, 0, 0, .6);
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    --t-character: #D493C6;
    --t-place: #86B6E3;
    --t-faction: #E79A72;
    --t-species: #A6CB7A;
    --t-event: #D9B85A;
    --t-item: #A9A5EE;
    --t-concept: #6DBCAD;
    --t-other: #A5AFAE;
    --t-c1: #E8919F;
    --t-c2: #7CC4D2;
    --t-c3: #D0C26A;
    --t-c4: #B9A2EA;
    --t-c5: #EBA470;
    --t-c6: #8CCB9C;
    --t-c7: #E39BC8;
    --t-c8: #9DB3C8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111719;
  --surface: #182023;
  --surface-2: #222C2F;
  --ink: #E2E8E4;
  --muted: #93A19F;
  --line: #2F3B3D;
  --accent: #6DBCAD;
  --accent-ink: #0D1917;
  --accent-soft: #1D3833;
  --danger: #E58374;
  --danger-soft: #3A2220;
  --user-bubble: #22313B;
  --backdrop: rgba(0, 0, 0, .6);
  --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  --t-character: #D493C6;
  --t-place: #86B6E3;
  --t-faction: #E79A72;
  --t-species: #A6CB7A;
  --t-event: #D9B85A;
  --t-item: #A9A5EE;
  --t-concept: #6DBCAD;
  --t-other: #A5AFAE;
  --t-c1: #E8919F;
  --t-c2: #7CC4D2;
  --t-c3: #D0C26A;
  --t-c4: #B9A2EA;
  --t-c5: #EBA470;
  --t-c6: #8CCB9C;
  --t-c7: #E39BC8;
  --t-c8: #9DB3C8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 var(--font-body);
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

#app {
  position: fixed;
  left: 0; right: 0;
  top: var(--app-top, 0px);
  height: var(--app-h, 100dvh);
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-columns: minmax(0, 1fr);
  background: var(--bg);
}

/* 상단 바 */
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) var(--gutter-r) 8px var(--gutter-l);
  border-bottom: 1px solid var(--line);
}
.world-switch {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: flex-start;
  background: none; border: 0; padding: 2px 0; text-align: left;
}
.eyebrow { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.world-switch .name {
  font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1.3;
  max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.world-switch .name::after { content: " ▾"; font-size: 12px; color: var(--muted); }
.theme-btn {
  flex: none; display: grid; place-items: center; width: 36px; height: 36px;
  border: 0; border-radius: 999px; background: var(--surface-2); color: var(--ink);
}
.theme-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sync-btn.running svg { animation: spin 1s linear infinite; }
.sync-btn.error { background: var(--danger-soft); color: var(--danger); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .sync-btn.running svg { animation: none; } }
.sync-status { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
.sync-err { color: var(--danger); }
.steps { margin: 0; padding-left: 1.3em; font-size: 13.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.cost-badge {
  border: 0; border-radius: 999px; padding: 4px 10px;
  background: var(--surface-2); color: var(--muted);
  font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums;
}

/* 본문 / 뷰 */
main { min-height: 0; min-width: 0; position: relative; }
.view { height: 100%; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; min-width: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pad { padding: 16px var(--gutter-r) 32px var(--gutter-l); }

/* 하단 탭 */
.tabbar {
  display: grid; grid-template-columns: repeat(5, 1fr);
  border-top: 1px solid var(--line); background: var(--surface);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar button {
  background: none; border: 0; padding: 8px 0 10px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 12px; color: var(--muted);
}
.tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 600; }
@media (pointer: coarse) { body.kb-open .tabbar { display: none; } }

/* 공통 버튼 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 14px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); font-size: 14px; font-weight: 500;
}
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-danger { color: var(--danger); }
.btn-danger-solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn-ghost { background: none; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn-small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }

/* 대화 */
.thread-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 6px var(--gutter-r) 6px var(--gutter-l);
  border-bottom: 1px solid var(--line);
  font-size: 13px; color: var(--muted);
}
.thread-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctx-meter { font: 12px var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ctx-meter.warn { color: var(--danger); }
.chat-log {
  display: flex; flex-direction: column; gap: 18px;
  padding: 16px var(--gutter-r) 24px var(--gutter-l);
}
.msg-user {
  align-self: flex-end; max-width: 86%;
  background: var(--user-bubble);
  padding: 10px 14px; border-radius: 16px 16px 4px 16px;
  display: flex; flex-direction: column; gap: 8px;
}
.msg-text { white-space: pre-wrap; }
.msg-files { display: flex; flex-wrap: wrap; gap: 6px; }
.msg-thumb { padding: 0; border: 0; background: none; border-radius: 10px; overflow: hidden; width: 96px; height: 96px; }
.msg-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.file-chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0;
  padding: 4px 10px 4px 6px; border-radius: 8px; background: var(--surface); font-size: 13px;
}
.file-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ftype {
  flex: none; font: 600 10px var(--font-mono); letter-spacing: .04em;
  color: var(--accent-ink); background: var(--accent); border-radius: 4px; padding: 2px 4px;
}
.preview-img { width: 100%; border-radius: 12px; display: block; }
.msg-assistant { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.msg-meta { font: 11px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.status-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.status-line::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .status-line::before { animation: none; } }
.thinking { border-left: 2px solid var(--line); padding-left: 10px; color: var(--muted); font-size: 13px; }
.thinking summary { cursor: pointer; list-style: none; font-size: 12px; letter-spacing: .04em; }
.thinking summary::-webkit-details-marker { display: none; }
.thinking summary::before { content: "▸ "; }
.thinking[open] summary::before { content: "▾ "; }
.thinking-body { margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.action-chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); padding: 3px 10px 3px 8px;
  font-size: 12.5px; text-align: left;
}
.action-chip .glyph { font: 600 12px var(--font-mono); color: var(--accent); }
.action-chip.read { background: none; color: var(--muted); }
.action-chip.read .glyph { color: var(--muted); }
.action-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note { margin: 0; font-size: 13px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); }
.note-error { background: var(--danger-soft); color: var(--danger); }
.retry-row { display: flex; justify-content: center; }
.quick-replies { display: flex; flex-direction: column; gap: 8px; }
.qr-row { display: flex; gap: 6px; align-items: stretch; }
.qr {
  flex: 1; min-width: 0; text-align: left;
  border: 1px solid var(--accent); border-radius: 12px;
  background: var(--accent-soft); color: var(--ink);
  padding: 10px 14px; font-size: 14.5px; line-height: 1.45;
}
.qr:active { transform: translateY(1px); }
.qr-toggle { display: flex; align-items: flex-start; gap: 10px; background: var(--surface); border-color: var(--line); }
.qr-toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.qr-box { flex: none; width: 18px; height: 18px; margin-top: 2px; border: 1.5px solid var(--muted); border-radius: 5px; }
.qr-toggle[aria-pressed="true"] .qr-box { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--accent-soft); }
@media (prefers-reduced-motion: reduce) { .qr:active { transform: none; } }
.composer-wrap { border-top: 1px solid var(--line); background: var(--surface); }
.banner {
  margin: 8px var(--gutter-r) 0 var(--gutter-l);
  padding: 8px 12px; border-radius: 10px;
  background: var(--accent-soft); font-size: 13px;
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
}
.composer {
  display: flex; gap: 8px; align-items: flex-end;
  padding: 8px var(--gutter-r) 8px var(--gutter-l);
}
.composer textarea {
  flex: 1; min-width: 0; resize: none; max-height: 200px;
  border: 1px solid var(--line); border-radius: 14px;
  padding: 9px 12px; background: var(--bg);
  font-size: 16px; line-height: 1.45;
}
.composer .btn { min-height: 42px; border-radius: 14px; }
.attach-btn { flex: none; display: grid; place-items: center; width: 42px; min-height: 42px; border-radius: 14px; }
.attach-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.attach-tray { display: flex; gap: 8px; overflow-x: auto; padding: 8px var(--gutter-r) 0 var(--gutter-l); scrollbar-width: none; }
.attach-tray::-webkit-scrollbar { display: none; }
.att {
  flex: none; display: flex; align-items: center; gap: 8px; max-width: 250px;
  padding: 6px 2px 6px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
}
.att img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex: none; }
.att .ftype { width: 40px; height: 40px; display: grid; place-items: center; font-size: 11px; padding: 0; border-radius: 8px; }
.att-meta { display: flex; flex-direction: column; min-width: 0; }
.att-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-sub { font: 11px var(--font-mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.att-x { flex: none; border: 0; background: none; color: var(--muted); width: 34px; height: 34px; font-size: 18px; }
.attach-note { margin: 6px var(--gutter-r) 0 var(--gutter-l); font-size: 12px; color: var(--danger); }
#view-chat.dragging .composer-wrap { outline: 2px dashed var(--accent); outline-offset: -4px; }
.empty-chat { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.empty-chat h2 { margin: 0; font: 700 22px/1.35 var(--font-display); text-wrap: balance; }
.empty-chat p { margin: 0; color: var(--muted); }
.suggestions { display: flex; flex-direction: column; gap: 8px; }
.suggestion {
  text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: 12px; padding: 10px 14px; font-size: 14px;
}

/* 마크다운 */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 .7em; }
.md h3, .md h4, .md h5, .md h6 { font-family: var(--font-display); margin: 1em 0 .4em; line-height: 1.35; text-wrap: balance; }
.md h3 { font-size: 18px; } .md h4 { font-size: 16px; } .md h5, .md h6 { font-size: 15px; }
.md ul, .md ol { margin: 0 0 .7em; padding-left: 1.3em; }
.md li { margin: .15em 0; }
.md blockquote { margin: 0 0 .7em; padding: 4px 12px; border-left: 3px solid var(--accent); color: var(--muted); }
.md code { font: 13px var(--font-mono); background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.md pre { overflow-x: auto; background: var(--surface-2); padding: 10px 12px; border-radius: 10px; }
.md pre code { background: none; padding: 0; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
.ref {
  border: 0; background: var(--accent-soft); color: var(--accent);
  font: 600 12px var(--font-mono); padding: 1px 6px; border-radius: 6px; vertical-align: 1px;
}

/* 설정집 */
.world-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;
}
.world-card h2 { margin: 0; font: 700 20px/1.35 var(--font-display); text-wrap: balance; }
.world-card .label { font-size: 11px; letter-spacing: .08em; color: var(--muted); margin-top: 4px; }
.world-card p { margin: 0; }
.codex-tools { display: flex; gap: 8px; margin: 16px 0 10px; }
.codex-tools input {
  flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); padding: 8px 12px; font-size: 16px;
}
.type-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.type-chips::-webkit-scrollbar { display: none; }
.type-chip {
  flex: none; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 4px 12px; font-size: 13px;
}
.type-chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.type-chip .n { font: 11px var(--font-mono); opacity: .7; margin-left: 4px; }
.group-title {
  margin: 20px 0 8px; font-size: 12px; letter-spacing: .08em; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.group-title::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.entry-list { display: flex; flex-direction: column; gap: 8px; }
.entry-card {
  width: 100%; text-align: left;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 14px;
}
.catno { font: 600 12px var(--font-mono); color: var(--tc, var(--muted)); font-variant-numeric: tabular-nums; padding-top: 3px; }
.entry-card .ename { font-weight: 600; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-card .esum { grid-column: 2; color: var(--muted); font-size: 13.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.entry-card .etags { grid-column: 2; font-size: 12px; color: var(--muted); }
.empty-state { text-align: center; color: var(--muted); padding: 32px 8px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty-state h3 { margin: 0; font: 700 18px var(--font-display); color: var(--ink); }

/* 시트 */
.sheet { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--backdrop); }
.sheet-panel {

- 적절할 때 답의 끝에 이야기를 넓힐 거리(갈등의 씨앗, 아직 정해지지 않은 질문)를 1~3개 짧게 덧붙인다. 매번 붙일 필요는 없다.
- 이 세계관의 주인은 사용자다. 사용자의 결정을 존중하고, 네 취향으로 방향을 바꾸지 않는다.

## 답변 형식
- 한국어로 답한다. 휴대폰 화면에서 읽으므로 짧은 문단과 목록을 쓰고, 표는 쓰지 않는다.
- 항목을 언급할 때 이름 옆에 id를 붙이면(예: 서리(C-001)) 사용자가 눌러서 바로 볼 수 있다.
- 설정집을 바꿨다면 답의 마지막에 무엇을 바꿨는지 한두 줄로 알린다. 앱이 변경 내역을 따로 표시하므로 길게 반복하지 않는다.

## 대답 추천
- 답을 마칠 때마다 맨 마지막에 suggest_replies를 단독으로 호출해, 사용자가 눌러서 바로 보낼 다음 대답 2~4개를 띄운다.
- 선택지를 제시했다면 각 선택지를 고르는 대답을, 질문을 했다면 그럴듯한 답들을 넣는다. 필요하면 "알아서 정해 줘"처럼 맡기는 대답도 하나 넣는다.
- 여러 개를 함께 골라도 되는 목록(받아들일 아이디어, 추가할 특징 등)이면 multiple을 true로 한다.
- 선택지의 자세한 내용은 본문에 쓰고, 추천 대답은 사용자 입장의 짧은 문장으로 쓴다.

## 첨부 파일
- 사용자는 이미지, PDF, 텍스트 파일을 첨부할 수 있다. 텍스트 파일은 [첨부 파일: 이름] 머리말과 함께 들어온다.
- 첨부 자료에서 설정을 뽑아 달라고 하면, 먼저 설정집과 비교해 새로 만들 항목과 고칠 항목을 짧게 정리해 보여 주고, 사용자가 동의하면 저장한다. 사용자가 바로 저장하라고 했으면 바로 저장한다.
- 이미지는 외모, 복장, 분위기, 지형, 건축 같은 시각 정보를 구체적인 글로 옮겨 설정에 반영한다. 이미지 자체는 설정집에 저장되지 않으므로 필요한 정보는 글로 남긴다.`;

function partialJsonString(src, key) {
  const m = new RegExp(`"${key}"\\s*:\\s*"`).exec(src);
  if (!m) return "";
  let i = m.index + m[0].length;
  let out = "";
  const ESC = { n: "\n", t: "\t", r: "\r", b: "\b", f: "\f", '"': '"', "\\": "\\", "/": "/" };
  while (i < src.length) {
    const ch = src[i];
    if (ch === '"') break;
    if (ch === "\\") {
      const nx = src[i + 1];
      if (nx === undefined) break;
      if (nx === "u") {
        const hex = src.slice(i + 2, i + 6);
        if (hex.length < 4) break;
        out += String.fromCharCode(parseInt(hex, 16));
        i += 6;
        continue;
      }
      out += ESC[nx] ?? nx;
      i += 2;
      continue;
    }
    out += ch;
    i++;
  }
  return out;
}

  const mem = new Map();
  let dbp = null;
  let broken = false;
  const open = () => {
    if (!dbp) {
      dbp = new Promise((res, rej) => {
        try {
          const r = indexedDB.open("lorekeeper", 1);
          r.onupgradeneeded = () => r.result.createObjectStore("kv");
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        } catch (e) { rej(e); }
      }).catch((e) => { broken = true; console.warn("IndexedDB 사용 불가", e); return null; });
    }
    return dbp;
  };
  const run = async (mode, fn, fallback) => {
    const db = await open();
    if (!db) return fallback();
    return new Promise((res, rej) => {
      const t = db.transaction("kv", mode);
      const req = fn(t.objectStore("kv"));
      t.oncomplete = () => res(req?.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  };
  return {
    get: (k) => run("readonly", (s) => s.get(k), () => mem.get(k)),
    set: (k, v) => run("readwrite", (s) => s.put(v, k), () => { mem.set(k, v); }).then((r) => { noteLocalChange(k); return r; }),

// 템플릿 해석: "- 이름: 설명" 줄은 속성(fields) 키, "## 제목"은 본문 소제목, ">"로 시작하는 줄은 작성 안내.

/* ============================================================

   항목의 시점은 entry.when = { start, end, label } (숫자는 이 세계 달력의 연도).

function runTool(name, input, tools) {
  const tool = tools.find((t) => t.name === name);
  if (!tool) return { content: `알 수 없는 도구: ${name}`, is_error: true };
  const problem = validateInput(tool.input_schema, input);
  if (problem) return { content: JSON.stringify({ error: problem, INVALID_JSON: JSON.stringify(input) }), is_error: true };
  try {
    return TOOL_IMPL[name](input);
  } catch (err) {
    return { content: String(err?.message || err), is_error: true };
  }

function calcCost(u, modelId) {
  const p = PRICES[modelId] || PRICES[settings.model];
  const inTok = u?.input_tokens || 0;
  const cw = u?.cache_creation_input_tokens || 0;
  const cr = u?.cache_read_input_tokens || 0;
  const out = u?.output_tokens || 0;
  let pin = p.in, pout = p.out, pcr = p.cacheRead;
  if (modelId === "claude-haiku-5-5" && inTok + cw + cr > 100000) { pin = 0.5; pout = 2.5; pcr = 0.05; }
  return (inTok * pin + cw * pin * 1.25 + cr * pcr + out * pout) / 1e6;
}

}

      lines.push(rules.length ? `이름 규칙:\n${rules.map((r) => `- ${r.name}${r.applies?.length ? ` (적용: ${r.applies.join(", ")})` : ""}: ${cut(r.rules, 160)}${r.examples?.length ? ` · 예: ${r.examples.slice(0, 6).join(", ")}` : ""}`).join("\n")}` : "이름 규칙: 없음", `원고함: ${state.manuscripts.length}편${state.manuscripts.length ? " (get_manuscripts로 읽는다)" : ""}`, "");
      if (thread.mode?.type === "interview") {
        const who = findEntry(thread.mode.ref);
        if (who) lines.push(`[인물 인터뷰] 대상: ${who.id} ${who.name}. 이 대화에서 너는 ${who.name}이(가) 되어 1인칭으로 답한다. (( )) 안의 말은 작가로서 받는다. "인터뷰 정리"를 부탁받으면 새로 드러난 사실을 정리해 제안하고 요약을 원고함에 저장한다.`, "");
      }
    }
    if (v >= 4) lines.push("분류 목록 (항목을 만들 때 이 중 하나를 쓴다. 템플릿이 있는 분류는 get_template로 구조를 확인한다):", typeListText(), "");
    lines.push(
      `항목 ${list.length}개${list.length > shown.length ? ` (앞의 ${shown.length}개만 표시, 나머지는 search_entries로 찾을 것)` : ""}${discardedCount ? ` · 폐기된 항목 ${discardedCount}개는 뺐다(search_entries의 include_discarded로 찾을 수 있다)` : ""}:`,
      ...(shown.length ? shown.map(indexLine) : ["(아직 없음)"]),
    );
    return lines.join("\n");
  }
  // 분류·템플릿 변경 알림은 그 도구를 가진 대화(버전 4 이상)에만 보낸다.
  const changes = state.log.filter((c) => c.by === "user" && c.at > (thread.syncedAt || 0) && (c.action !== "types" || v >= 4) && (c.action !== "calendar" || v >= 5) && ((c.action !== "naming" && c.action !== "manuscript") || v >= 7));
  if (!changes.length) return null;
  const label = { create: "추가", update: "수정", delete: "삭제", restore: "복구", purge: "완전 삭제", relation: "관계 변경", world: "세계관 개요 수정", types: "분류·템플릿 변경", calendar: "달력·시대 변경", naming: "이름 규칙 변경", manuscript: "원고함 변경" };
  const seen = new Set();
  const lines = [];
  for (const c of changes.slice().reverse()) {
    const key = (c.id || "world") + c.action + (["types", "naming", "manuscript"].includes(c.action) ? c.note : "");
    if (seen.has(key)) continue;
    seen.add(key);
    if (c.id) lines.push(`- ${c.id} ${c.name}: ${label[c.action] || c.action}`);
    else if (c.action === "types") lines.push(`- ${label.types}: ${c.note}`);
    else if (c.action === "calendar") lines.push(`- ${label.calendar}:\n${calendarText()}`);
    else if (c.action === "naming" || c.action === "manuscript") lines.push(`- ${label[c.action]}: ${c.note}`);
    else lines.push(`- ${label[c.action] || c.action}`);
  }
  const typesChanged = changes.some((c) => c.action === "types");
  const head = typesChanged
    ? "[앱 알림: 사용자가 대화 밖에서 직접 바꾼 내용. 필요하면 get_entries로 최신 내용을 읽고, 분류나 템플릿이 바뀌었으면 list_types와 get_template로 다시 확인할 것]"
    : "[앱 알림: 사용자가 대화 밖에서 직접 바꾼 내용. 필요하면 get_entries로 최신 내용을 읽을 것]";
  return [head, ...lines.reverse()].join("\n");
}

function apiMessage(err) {
  return err?.error?.error?.message || err?.message || String(err);
}
function describeError(err) {
  if (err instanceof Anthropic.AuthenticationError) return "API 키가 올바르지 않습니다. 설정에서 키를 확인하세요.";
  if (err instanceof Anthropic.PermissionDeniedError) return "이 API 키로는 이 모델을 쓸 권한이 없습니다. 설정에서 다른 모델을 고르거나 Console 권한을 확인하세요.";
  if (err instanceof Anthropic.NotFoundError) return "모델을 찾을 수 없습니다. 설정에서 모델을 확인하세요.";
  if (err instanceof Anthropic.RateLimitError) return "요청 한도에 걸렸습니다. 잠시 후 다시 시도하세요.";
  if (err instanceof Anthropic.BadRequestError) {
    const m = apiMessage(err);
    return /credit/i.test(m) ? `크레딧이 부족합니다. Console의 Billing에서 잔액을 확인하세요. (${m})` : `요청이 거부되었습니다: ${m}`;
  }
  if (err instanceof Anthropic.InternalServerError) return `Anthropic 서버가 일시적으로 응답하지 않습니다(${err.status}). 잠시 후 다시 시도하세요.`;
  if (err instanceof Anthropic.APIConnectionError) return "네트워크에 연결할 수 없습니다. 인터넷 연결을 확인하세요.";
  if (err instanceof Anthropic.APIError && err.status === 413) return "요청이 너무 큽니다(최대 32MB). 첨부가 많은 대화라면 새 대화에서 다시 시도하세요.";
  if (err instanceof Anthropic.APIError) return `API 오류 ${err.status ?? ""}: ${apiMessage(err)}`;
  return `오류: ${err?.message || err}`;
}

// 대답 추천 도구의 결과는 사용자의 다음 메시지 맨 앞에 붙여 보낸다(추가 API 호출 없이 차례를 끝내기 위해).
function pendingResults(picked) {
  const pending = state.conv.pending;
  if (!pending?.length) return [];
  return pending.map(({ id, ok }) => (ok
    ? { type: "tool_result", tool_use_id: id, content: picked ? "사용자가 추천한 대답 중에서 골랐다. 대답은 이어지는 메시지에 있다." : "사용자가 추천 대신 직접 입력했다. 대답은 이어지는 메시지에 있다." }
    : { type: "tool_result", tool_use_id: id, content: "입력이 올바르지 않아 표시하지 못했다. message는 문자열, options는 문자열 배열이어야 한다.", is_error: true }));
}
function currentSuggest() {
  if (!state.conv.pending?.length) return null;
  const last = state.conv.display[state.conv.display.length - 1];
  return last && last.role === "assistant" && last.suggest ? last.suggest : null;
}

function canSend() {
  if (state.busy) return false;
  if (!settings.apiKey) { toast("설정에서 API 키를 먼저 넣으세요"); switchView("settings"); return false; }
  if (!currentWorld()) { toast("먼저 세계관을 만드세요"); openWorldSheet(); return false; }
  if (attachments.some((a) => a.status !== "ready")) { toast("첨부 파일을 준비하는 중입니다. 잠시 후 보내세요"); return false; }
  return true;
}

async function sendMessage(typed, picked = false) {
  if (!canSend()) return;
  const atts = attachments.slice();
  const text = typed || (atts.length ? "첨부한 파일을 봐 줘." : "");
  if (!text) return;
  attachments = [];
  renderAttachTray();
  let thread = currentThread();
  if (!thread) thread = await createThread(typed || (atts[0] ? `첨부: ${atts[0].name}` : text));
  const blocks = pendingResults(picked);
  state.conv.pending = null;
  qrSelected.clear();
  const note = contextNoteFor(thread);
  if (note) blocks.push({ type: "text", text: note });
  for (const a of atts) blocks.push(attachmentBlock(a));
  blocks.push({ type: "text", text });
  state.conv.api.push({ role: "user", content: blocks });
  state.conv.display.push({
    role: "user", text, at: Date.now(),
    ...(atts.length ? { files: atts.map((a) => ({ name: a.name, kind: a.kind, size: a.size, thumb: a.thumb || null })) } : {}),
  });
  thread.contextSent = true;
  thread.syncedAt = Date.now();
  thread.updatedAt = Date.now();
  await Promise.all([persist.conv(), persist.threads()]);
  renderChat();
  await runAgent();
}

function handleEvent(ev, item, blockParts) {
  if (ev.type === "content_block_start") {
    const b = ev.content_block;
    if (b.type === "thinking" || b.type === "redacted_thinking") {
      const p = { kind: "thinking", text: "", streaming: true };
      item.parts.push(p);
      blockParts.set(ev.index, p);
      live.status = "생각하는 중…";
    } else if (b.type === "text") {
      const p = { kind: "text", text: "" };
      item.parts.push(p);
      blockParts.set(ev.index, p);
      live.status = "";
    } else if (b.type === "tool_use") {
      if (b.name === RESPOND) {
        const p = { kind: "text", text: "", respondId: b.id, _json: "" };
        item.parts.push(p);
        blockParts.set(ev.index, p);
        live.status = "";
      } else {
        // 예전 대화(v2~v5): 대답 추천 바로 앞의 진행 메모(요약된 thinking)는 답의 일부이므로 본문으로 보여 준다
        if (b.name === SUGGEST) {
          const prev = blockParts.get(ev.index - 1);
          if (prev && prev.kind === "thinking" && prev.text.trim()) { prev.kind = "text"; delete prev.streaming; }
        }
        live.status = TOOL_STATUS[b.name] || "설정집 작업 중…";
      }
    } else if (b.type === "fallback") {
      item.parts.push({ kind: "note", tone: "info", text: `안전 정책 판단으로 ${b.to?.model || "다른 모델"}이 이어서 답합니다.` });
    }
  } else if (ev.type === "content_block_delta") {
    const p = blockParts.get(ev.index);
    if (!p) return;
    if (ev.delta.type === "thinking_delta") p.text += ev.delta.thinking;
    else if (ev.delta.type === "text_delta") p.text += ev.delta.text;
    else if (ev.delta.type === "input_json_delta" && p.respondId) { p._json += ev.delta.partial_json; p.text = partialJsonString(p._json, "message"); }
  } else if (ev.type === "content_block_stop") {
    const p = blockParts.get(ev.index);
    if (p && p.kind === "thinking") { p.streaming = false; live.status = "정리하는 중…"; }
  }
  scheduleLive();
}

async function runAgent() {
  const thread = currentThread();
  state.busy = true;
  const item = { role: "assistant", parts: [], at: Date.now(), cost: 0, model: settings.model };
  state.conv.display.push(item);
  live = { item, el: null, status: "생각하는 중…", stream: null, stopped: false };
  renderChat();
  updateComposer();
  const client = new Anthropic({ apiKey: settings.apiKey, dangerouslyAllowBrowser: true });
  let jsonRetries = 0;
  let dataChanged = false;
  try {
    let finished = false;
    for (let round = 0; round < MAX_ROUNDS && !finished; round++) {
      const before = item.parts.length;
      const blockParts = new Map();
      let message;
      try {
        const stream = client.beta.messages.stream(buildParams(thread));
        live.stream = stream;
        for await (const ev of stream) handleEvent(ev, item, blockParts);
        message = await stream.finalMessage();
        jsonRetries = 0;
      } catch (err) {
        if (err instanceof Anthropic.APIUserAbortError || live.stopped) {
          item.parts.push({ kind: "note", tone: "info", text: "응답을 멈췄습니다. 멈춘 부분은 대화 기록에 남지 않습니다." });
          return;
        }
        if (err instanceof Anthropic.APIError) throw err;
        if (jsonRetries++ >= 2) throw err;
        item.parts.length = before;
        continue;
      }

      const dropped = (message.input_transformations || []).filter((x) => x.reason === "prefix_binding_mismatch");
      if (dropped.length) console.warn("대화 기록이 어긋나 이전 추론 일부를 버렸습니다", dropped);
      const turnCost = calcCost(message.usage, message.model);
      item.cost += turnCost;
      item.model = message.model;
      addCost(turnCost);
      if (thread) {
        const u = message.usage || {};
        thread.lastCtx = (u.input_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0);
      }

      if (message.stop_reason === "refusal") {
        const cat = message.stop_details?.category;
        item.parts.push({ kind: "note", tone: "error", text: `안전 정책에 따라 이 요청에는 답할 수 없습니다${cat ? ` (분류: ${cat})` : ""}. 표현을 바꿔 다시 요청해 보세요.` });
        return;
      }
      const toolUses = message.content.filter((b) => b.type === "tool_use");
      if (message.stop_reason === "max_tokens" && toolUses.length) {
        item.parts.push({ kind: "note", tone: "error", text: "응답이 너무 길어 중간에 끊겼습니다. 요청을 나눠서 다시 보내 주세요." });
        return;
      }
      state.conv.api.push({ role: "assistant", content: clone(message.content) });
      if (message.stop_reason === "pause_turn") { await persist.conv(); continue; }
      if (toolUses.length && toolUses.every((b) => REPLY_TOOLS.has(b.name))) {
        // 답(respond)이나 대답 추천만 부른 차례: 여기서 끝내고, 도구 결과는 사용자의 다음 메시지와 함께 보낸다.
        let shown = null;
        const okIds = new Set();
        for (const tu of toolUses) {
          const schema = tu.name === RESPOND ? RESPOND_TOOL.input_schema : SUGGEST_TOOL.input_schema;
          const problem = validateInput(schema, tu.input);
          if (tu.name === RESPOND) {
            const part = item.parts.find((p) => p.respondId === tu.id);
            if (!problem) {
              okIds.add(tu.id);
              if (part) part.text = tu.input.message; else item.parts.push({ kind: "text", text: tu.input.message, respondId: tu.id });
            } else if (part) item.parts.splice(item.parts.indexOf(part), 1);
          } else if (!problem) okIds.add(tu.id);
          const options = problem ? [] : [...new Set((tu.input.options || []).map((o) => cut(o, 160)).filter(Boolean))].slice(0, 6);
          if (!shown && options.length) shown = { id: tu.id, options, multiple: !!tu.input.multiple };
        }
        state.conv.pending = toolUses.map((tu) => ({ id: tu.id, ok: okIds.has(tu.id) }));
        if (shown) item.suggest = { options: shown.options, multiple: shown.multiple };
        qrSelected.clear();
        finished = true;
        break;
      }
      if (!toolUses.length) {
        if (message.stop_reason === "max_tokens") item.parts.push({ kind: "note", tone: "info", text: "답변이 길이 제한에 걸려 끝까지 나오지 않았습니다. '계속'이라고 보내면 이어서 씁니다." });
        finished = true;
        break;
      }
      const mixedRespond = new Set(toolUses.filter((b) => b.name === RESPOND).map((b) => b.id));
      if (mixedRespond.size) item.parts = item.parts.filter((p) => !mixedRespond.has(p.respondId));
      const results = [];
      for (const tu of toolUses) {
        const r = runTool(tu.name, tu.input, promptSetFor(thread).tools);
        results.push({ type: "tool_result", tool_use_id: tu.id, content: r.content, ...(r.is_error ? { is_error: true } : {}) });
        if (r.action) item.parts.push({ kind: "action", action: r.action });
        if (r.changed) dataChanged = true;
      }
      state.conv.api.push({ role: "user", content: results });
      live.status = "이어서 생각하는 중…";
      if (dataChanged) { await persist.world(); renderCodex(); renderWorldName(); }
      await persist.conv();
      scheduleLive();
      if (round === MAX_ROUNDS - 1) {
        item.parts.push({ kind: "note", tone: "info", text: "작업 단계가 많아 여기서 멈췄습니다. '계속'이라고 보내면 이어서 진행합니다." });
      }
    }
  } catch (err) {
    console.error(err);
    item.parts.push({ kind: "note", tone: "error", text: describeError(err) });
  } finally {
    item.parts = item.parts.filter((p) => !(p.kind === "thinking" && !p.text.trim()));
    for (const p of item.parts) { delete p.streaming; delete p._json; }
    live = null;
    state.busy = false;
    if (thread) thread.updatedAt = Date.now();
    await Promise.all([persist.conv(), persist.threads(), persist.world(), persist.worlds()]);
    renderChat();
    renderCodex();
    renderWorldName();
    updateComposer();
  }
}

function stopAgent() {
  if (!live) return;
  live.stopped = true;
  try { live.stream?.abort(); } catch { /* 이미 끝남 */ }
}

/* ============================================================
   7-1. 첨부 파일
   ============================================================ */
const ATT_LIMITS = {
  count: 10,                       // 한 메시지에 붙일 수 있는 파일 수
  pdfBytes: 20 * 1024 * 1024,      // PDF 한 개 (base64로 늘어나도 요청 한도 32MB 안에 들도록)
  textChars: 300000,               // 텍스트 파일 글자 수
  threadB64: 24 * 1024 * 1024,     // 한 대화에 쌓이는 첨부 총량(매 요청마다 다시 보내므로)
  imageEdge: 1568,                 // 이미지 긴 변. 더 크면 토큰이 크게 늘어 줄여서 보낸다.
  countB64: 8 * 1024 * 1024,       // 이보다 큰 파일은 토큰 미리 계산을 건너뛴다(데이터 절약)
};
const OK_IMAGE_TYPES = ["image/jpeg", "image/png", "image/gif", "image/webp"];
let attachments = []; // 입력창에 올려 둔 파일

const fmtSize = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + "MB" : Math.max(1, Math.round(n / 1024)) + "KB");
function kindOf(file) {
  const t = (file.type || "").toLowerCase();
  const n = (file.name || "").toLowerCase();
  if (t.startsWith("image/") || /\.(heic|heif)$/.test(n)) return "image";
  if (t === "application/pdf" || n.endsWith(".pdf")) return "pdf";
  if (t.startsWith("text/") || t === "application/json" || /\.(txt|md|markdown|csv|tsv|json|log)$/.test(n)) return "text";
  return null;
}
function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error || new Error("파일을 읽을 수 없습니다"));
    r.readAsDataURL(blob);
  });
}
async function blobToBase64(blob) {
  const url = await blobToDataURL(blob);
  return url.slice(url.indexOf(",") + 1);
}
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이 브라우저에서 열 수 없는 이미지입니다")); };
    img.src = url;
  });
}
function drawScaled(img, maxEdge, type, quality) {
  const scale = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const g = canvas.getContext("2d");
  if (type === "image/jpeg") { g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h); }
  g.drawImage(img, 0, 0, w, h);
  return new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("이미지 변환에 실패했습니다"))), type, quality));
}
async function prepareImage(file) {
  const { img, url } = await loadImage(file);
  try {
    let blob = file;
    let type = (file.type || "").toLowerCase();
    const tooBig = Math.max(img.naturalWidth, img.naturalHeight) > ATT_LIMITS.imageEdge;
    if (!OK_IMAGE_TYPES.includes(type) || tooBig || file.size > 3.5 * 1024 * 1024) {
      blob = await drawScaled(img, ATT_LIMITS.imageEdge, "image/jpeg", 0.86);
      type = "image/jpeg";
    }
    const thumb = await blobToDataURL(await drawScaled(img, 480, "image/jpeg", 0.8));
    return { mediaType: type, data: await blobToBase64(blob), size: blob.size, thumb };
  } finally {
    URL.revokeObjectURL(url);
  }
}
async function preparePdf(file) {
  if (file.size > ATT_LIMITS.pdfBytes) throw new Error(`PDF는 ${fmtSize(ATT_LIMITS.pdfBytes)}까지 첨부할 수 있습니다`);
  return { mediaType: "application/pdf", data: await blobToBase64(file), size: file.size };
}
async function prepareText(file) {
  const buf = await file.arrayBuffer();
  let text = new TextDecoder("utf-8").decode(buf);
  const broken = (text.match(/�/g) || []).length;
  if (broken > Math.max(3, text.length * 0.002)) {
    // 윈도우 메모장 등에서 저장한 한글 파일(EUC-KR)
    try { text = new TextDecoder("euc-kr").decode(buf); } catch { /* 디코더 미지원 */ }
  }
  text = text.replace(/^﻿/, "");
  if (!text.trim()) throw new Error("빈 파일입니다");
  if (text.length > ATT_LIMITS.textChars) throw new Error(`텍스트가 너무 깁니다(${ATT_LIMITS.textChars.toLocaleString("ko-KR")}자까지)`);
  return { mediaType: "text/plain", data: text, size: file.size };
}
function attachmentBlock(a) {
  if (a.kind === "image") return { type: "image", source: { type: "base64", media_type: a.mediaType, data: a.data } };
  if (a.kind === "pdf") return { type: "document", source: { type: "base64", media_type: "application/pdf", data: a.data }, title: a.name };
  return { type: "text", text: `[첨부 파일: ${a.name}]\n${a.data}` };
}
function threadAttachBytes() {
  let n = 0;
  for (const m of state.conv.api) {
    if (!Array.isArray(m.content)) continue;
    for (const b of m.content) if ((b.type === "image" || b.type === "document") && b.source?.type === "base64") n += b.source.data.length;
  }
  return n;
}
const trayBytes = () => attachments.reduce((s, a) => s + (a.kind === "text" ? 0 : a.data?.length || 0), 0);

async function addFiles(fileList) {
  const files = [...(fileList || [])];
  if (!files.length) return;
  if (!currentWorld()) { toast("먼저 세계관을 만드세요"); return; }
  for (const file of files) {
    if (attachments.length >= ATT_LIMITS.count) { toast(`한 번에 ${ATT_LIMITS.count}개까지 첨부할 수 있습니다`); break; }
    const kind = kindOf(file);
    if (!kind) { toast(`${file.name}: 이미지, PDF, 텍스트 파일만 첨부할 수 있습니다`); continue; }
    const a = { id: uid(), name: file.name || "사진.jpg", kind, status: "processing", size: file.size, tokens: null };
    attachments.push(a);
    renderAttachTray();
    try {
      Object.assign(a, kind === "image" ? await prepareImage(file) : kind === "pdf" ? await preparePdf(file) : await prepareText(file));
      if (threadAttachBytes() + trayBytes() > ATT_LIMITS.threadB64) throw new Error("이 대화에 첨부가 너무 많습니다. 새 대화에서 첨부하세요");
      a.status = "ready";
      countAttachment(a);
    } catch (err) {
      attachments = attachments.filter((x) => x !== a);
      toast(`${a.name}: ${err?.message || err}`);
    }
    renderAttachTray();
  }
}
async function countAttachment(a) {
  // 토큰 수 확인(count_tokens)은 응답을 만들지 않으며 무료입니다(분당 횟수 제한 있음).
  if (!settings.apiKey || (a.data?.length || 0) > ATT_LIMITS.countB64) return;
  try {
    const client = new Anthropic({ apiKey: settings.apiKey, dangerouslyAllowBrowser: true });
    const r = await client.messages.countTokens({
      model: settings.model,
      messages: [{ role: "user", content: [attachmentBlock(a), { type: "text", text: "." }] }],
    });
    a.tokens = r.input_tokens;
  } catch (err) {
    console.warn("첨부 토큰 계산 실패", err);
    a.tokens = -1;
  }
  if (attachments.includes(a)) renderAttachTray();
}
function attSub(a) {
  if (a.status === "processing") return "준비 중…";
  const parts = [fmtSize(a.size)];
  if (a.tokens > 0) parts.push(`약 ${fmtTok(a.tokens)} 토큰`, fmtUSD((a.tokens * (PRICES[settings.model]?.in || 4)) / 1e6));
  else if (a.tokens === null && settings.apiKey) parts.push("토큰 계산 중…");
  return parts.join(" · ");
}
function renderAttachTray() {
  const tray = $("#attachTray");
  tray.hidden = !attachments.length;
  tray.innerHTML = attachments.map((a) => `<div class="att">${a.thumb ? `<img src="${a.thumb}" alt="">` : `<span class="ftype">${a.kind === "pdf" ? "PDF" : "TXT"}</span>`}<span class="att-meta"><span class="att-name">${esc(a.name)}</span><span class="att-sub">${esc(attSub(a))}</span></span><button type="button" class="att-x" data-att-remove="${a.id}" aria-label="${esc(a.name)} 첨부 빼기">×</button></div>`).join("");
  const total = attachments.reduce((s, a) => s + (a.tokens > 0 ? a.tokens : 0), 0);
  const note = $("#attachNote");
  note.hidden = total < 50000;
  note.textContent = total >= 50000
    ? `첨부가 약 ${fmtTok(total)} 토큰입니다. 이 대화에서는 이후 요청마다 함께 보내지므로(캐시되면 훨씬 저렴), 큰 자료는 새 대화에서 쓰는 편이 비용이 적습니다.`
    : "";
}

/* ============================================================
   8. 마크다운
   ============================================================ */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*(?!\s)([^*\n]+?)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/\b([A-Z][A-Z0-9]{0,2}-\d{3,})\b/g, (m, id) => (findEntry(id) ? `<button type="button" class="ref" data-ref="${id}">${id}</button>` : m));
}
function md(src) {
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  let html = "";
  let para = [];
  let list = null;
  let quote = [];
  let code = null;
  const flushPara = () => { if (para.length) { html += `<p>${para.map(inline).join("<br>")}</p>`; para = []; } };
  const flushList = () => { if (list) { html += `<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`; list = null; } };
  const flushQuote = () => { if (quote.length) { html += `<blockquote>${quote.map(inline).join("<br>")}</blockquote>`; quote = []; } };
  const flushAll = () => { flushPara(); flushList(); flushQuote(); };
  for (const line of lines) {
    if (code) {
      if (/^\s*```/.test(line)) { html += `<pre><code>${esc(code.join("\n"))}</code></pre>`; code = null; } else code.push(line);
      continue;
    }
    if (/^\s*```/.test(line)) { flushAll(); code = []; continue; }
    if (!line.trim()) { flushAll(); continue; }
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { flushAll(); const lv = Math.min(m[1].length + 2, 6); html += `<h${lv}>${inline(m[2])}</h${lv}>`; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushAll(); html += "<hr>"; continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) {
      flushPara(); flushQuote();
      if (!list || list.tag !== "ul") { flushList(); list = { tag: "ul", items: [] }; }
      list.items.push(m[1]);
      continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      flushPara(); flushQuote();
      if (!list || list.tag !== "ol") { flushList(); list = { tag: "ol", items: [] }; }
      list.items.push(m[1]);
      continue;
    }
    if ((m = line.match(/^>\s?(.*)$/))) { flushPara(); flushList(); quote.push(m[1]); continue; }
    if (list && /^\s{2,}\S/.test(line)) { list.items[list.items.length - 1] += " " + line.trim(); continue; }
    flushList(); flushQuote();
    para.push(line);
  }
  if (code) html += `<pre><code>${esc(code.join("\n"))}</code></pre>`;
  flushAll();
  return html;
}

function actionChip(a) {
  const glyph = { create: "+", update: "✎", relation: "↔", delete: "×", world: "◎", read: "·" }[a.kind] || "·";
  const verb = { create: "추가", update: "수정", relation: "", delete: "휴지통", world: "수정", read: "" }[a.kind] || "";
  const label = `${a.text}${verb ? " " + verb : ""}`;
  const attr = a.ref ? ` data-ref="${esc(a.ref)}"` : "";
  return `<button type="button" class="action-chip ${a.kind === "read" ? "read" : ""}"${attr}><span class="glyph">${glyph}</span><span>${esc(label)}</span></button>`;
}
function assistantInner(item, isLive) {
  let html = "";
  let chips = [];
  const flushChips = () => { if (chips.length) { html += `<div class="chips">${chips.join("")}</div>`; chips = []; } };
  for (const p of item.parts) {
    if (p.kind === "action") { chips.push(actionChip(p.action)); continue; }
    flushChips();
    if (p.kind === "thinking") {
      if (!p.text.trim()) continue;
      html += `<details class="thinking"${isLive && p.streaming ? " open" : ""}><summary>생각 요약</summary><div class="thinking-body md">${md(p.text)}</div></details>`;
    } else if (p.kind === "text") {
      if (p.text) html += `<div class="md">${md(p.text)}</div>`;
    } else if (p.kind === "note") {
      html += `<p class="note ${p.tone === "error" ? "note-error" : ""}">${esc(p.text)}</p>`;
    }
  }
  flushChips();
  if (isLive && live?.status) html += `<div class="status-line">${esc(live.status)}</div>`;
  if (!isLive && item.cost) html += `<div class="msg-meta">${esc(PRICES[item.model]?.label || item.model)} · ${fmtUSD(item.cost)}</div>`;
  return html;
}

function composeMulti(s) {

function fillInput(text) {
  const input = $("#input");
  input.value = text;

  input.focus();
  try { input.setSelectionRange(text.length, text.length); } catch { /* 일부 브라우저 */ }

function onQuickReply(e) {
  const s = currentSuggest();
  if (!s || state.busy) return;
  const one = e.target.closest("[data-qr]");
  if (one) { sendMessage(s.options[Number(one.dataset.qr)], true); return; }
  const edit = e.target.closest("[data-qr-edit]");
  if (edit) { fillInput(s.options[Number(edit.dataset.qrEdit)]); return; }
  const toggle = e.target.closest("[data-qr-toggle]");
  if (toggle) {
    const k = Number(toggle.dataset.qrToggle);
    if (qrSelected.has(k)) qrSelected.delete(k); else qrSelected.add(k);
    const box = $("#quickReplies");
    if (box) box.outerHTML = quickRepliesHTML(s);
    return;
  }
  if (e.target.closest("[data-qr-send]") && qrSelected.size) { sendMessage(composeMulti(s), true); return; }
  if (e.target.closest("[data-qr-compose]") && qrSelected.size) fillInput(composeMulti(s));
}

}

function renderChat() {
  const log = $("#chatLog");

  } else {
    log.innerHTML = d.map((m, i) => {

    }).join("");
    const last = state.conv.api[state.conv.api.length - 1];

    <div class="sheet-actions"><button class="btn btn-primary" type="button" data-act="new-thread">새 대화</button></div>

    };

// 설정 점검: 앱이 바로 계산할 수 있는 구멍과 모순을 모은다(비용 없음).
function computeChecks() {
  const list = liveEntries();
  const byId = new Map(state.entries.map((e) => [e.id, e]));
  const issues = [];
  const add = (group, sev, text, refs) => issues.push({ group, sev, text, refs });
  // 연표: 인물이 태어나기 전에 끝났거나 죽은 뒤에 일어난 일과 이어져 있다
  for (const c of list.filter((e) => isCharacterType(e.type) && e.when)) {
    const links = new Set([...(c.relations || []).map((r) => r.to), ...incoming(c.id).map((x) => x.from.id)]);
    for (const id of links) {
      const ev = byId.get(id);
      if (!ev || ev.deleted || statusOf(ev) === "discarded" || !ev.when || isCharacterType(ev.type)) continue;
      const evEnd = ev.when.end ?? ev.when.start;
      if (evEnd < c.when.start) add("연표 확인", "warn", `${c.name}은(는) ${fmtYear(c.when.start)}에 태어났는데, 그 전에 끝난 ${ev.name}(${rangeText(ev.when)})과 이어져 있습니다.`, [c.id, ev.id]);
      if (c.when.end != null && ev.when.start > c.when.end) add("연표 확인", "warn", `${c.name}은(는) ${fmtYear(c.when.end)}에 죽었는데, 그 뒤의 ${ev.name}(${rangeText(ev.when)})과 이어져 있습니다.`, [c.id, ev.id]);
    }
  }
  // 폐기된 항목이나 휴지통 항목과 연결
  for (const e of list) {
    for (const r of e.relations || []) {
      const t = byId.get(r.to);
      if (t && (t.deleted || statusOf(t) === "discarded")) add("버린 항목과 연결", "warn", `${e.name} → ${r.label} → ${t.name}(${t.deleted ? "휴지통" : "폐기"})`, [e.id, t.id]);
    }
  }
  // 같은 이름을 여러 항목이 쓴다
  const names = new Map();
  for (const e of list) for (const n of [e.name, ...(e.aliases || [])]) {
    const k = String(n).trim().toLowerCase();
    if (!k) continue;
    if (!names.has(k)) names.set(k, new Set());
    names.get(k).add(e);
  }
  for (const [n, set] of names) if (set.size > 1) add("이름 겹침", "warn", `'${n}'을(를) ${[...set].map((e) => `${e.name}(${e.id})`).join(", ")}이(가) 함께 씁니다.`, [...set].map((e) => e.id));
  // 채울 곳
  for (const e of list) {
    const g = templateGaps(e);
    if (g && g.fields.length + g.sections.length) {
      const miss = [...g.fields, ...g.sections.map((x) => "## " + x)];
      add("템플릿 빈 칸", "info", `${e.name}: ${miss.slice(0, 5).join(", ")}${miss.length > 5 ? ` 외 ${miss.length - 5}개` : ""}`, [e.id]);
    }
  }
  for (const e of list) if (!String(e.summary || "").trim()) add("요약 없음", "info", e.name, [e.id]);
  for (const e of list) if (!e.when && isEventType(e.type)) add("시점 없는 사건", "info", e.name, [e.id]);
  const linked = new Set();
  for (const e of list) for (const r of e.relations || []) if (byId.get(r.to) && statusOf(byId.get(r.to)) !== "discarded") { linked.add(e.id); linked.add(r.to); }
  for (const e of list) if (!linked.has(e.id)) add("관계 없는 항목", "info", e.name, [e.id]);
  const drafts = list.filter((e) => statusOf(e) === "draft");
  if (drafts.length) add("확정을 기다리는 초안", "info", `${drafts.length}개: ${drafts.slice(0, 8).map((e) => e.name).join(", ")}${drafts.length > 8 ? " …" : ""}`, drafts.map((e) => e.id));
  return issues;
}
function openChecksSheet() {
  if (!currentWorld()) { toast("먼저 세계관을 만드세요"); return; }
  const issues = computeChecks();
  const groups = [];
  for (const it of issues) {
    let g = groups.find((x) => x.name === it.group);
    if (!g) { g = { name: it.group, sev: it.sev, items: [] }; groups.push(g); }
    g.items.push(it);
  }
  groups.sort((a, b) => (a.sev === b.sev ? 0 : a.sev === "warn" ? -1 : 1));
  const warns = issues.filter((x) => x.sev === "warn");
  openSheet(`<h2 class="sheet-title">설정 점검</h2>
    <p class="meta" style="margin:0">확정·초안 항목 ${liveEntries().length}개를 살폈습니다. ${warns.length ? `확인이 필요한 곳 ${warns.length}개, ` : "모순으로 보이는 곳은 없고, "}채울 곳 ${issues.length - warns.length}개가 있습니다.</p>
    ${groups.map((g) => `<section class="check-group"><h3 class="${g.sev === "warn" ? "sev-warn" : ""}">${esc(g.name)} <span class="n">${g.items.length}</span></h3>
      ${g.items.slice(0, 30).map((it) => `<div class="check-item"><span class="txt">${esc(it.text)}</span>${it.refs.slice(0, 4).map((id) => `<button type="button" class="ref" data-ref="${id}">${id}</button>`).join("")}</div>`).join("")}
      ${g.items.length > 30 ? `<p class="meta">외 ${g.items.length - 30}개</p>` : ""}</section>`).join("") || `<p>살펴볼 항목이 아직 없습니다.</p>`}
    <section class="card" style="margin-top:16px">

      <div class="row"><button class="btn btn-primary" type="button" data-act="deep-check">요청 채우기</button></div>
    </section>`, (root) => {
    root.onclick = (ev) => {
      const ref = ev.target.closest("[data-ref]");
      if (ref) { openEntry(ref.dataset.ref); return; }
      if (ev.target.closest('[data-act="deep-check"]')) {
        if (state.busy) { toast("Claude가 작업 중입니다"); return; }
        const found = warns.slice(0, 15).map((x) => `- ${x.text}`);
        closeSheet();
        newThread();
        fillInput(`설정 전체를 점검해 줘. 확정된 항목을 기준으로 세계 규칙 위반, 서술끼리의 모순, 연표·나이·거리 불일치, 어긋난 관계를 찾아서 항목별로 알려 주고, 고칠 방법을 2~3가지씩 제안해 줘. 고치는 건 내가 고른 다음에 해.${found.length ? `\n\n앱이 먼저 찾은 것:\n${found.join("\n")}` : ""}`);
      }
    };
  });
}

const QUESTIONS = QUESTION_BANK.map(([cat, q], i) => ({ id: `q${i + 1}`, cat, q }));
function worldQA(w = currentWorld()) {
  if (!w) return { done: {}, skipped: {}, custom: [] };
  w.qa = w.qa || { done: {}, skipped: {}, custom: [] };
  w.qa.done = w.qa.done || {}; w.qa.skipped = w.qa.skipped || {}; w.qa.custom = w.qa.custom || [];
  return w.qa;
}
function todaysQuestions() {
  const qa = worldQA();
  const pool = [...qa.custom, ...QUESTIONS].filter((x) => !qa.done[x.id] && !qa.skipped[x.id]);
  const day = new Date().toISOString().slice(0, 10);
  return pool.map((x) => ({ x, k: hashNum(`${state.worldId}|${day}|${x.id}`) - (x.custom ? 1 : 0) })).sort((a, b) => a.k - b.k).slice(0, 3).map((o) => o.x);
}
function renderQuestions(box) {
  const qa = worldQA();
  const all = [...qa.custom, ...QUESTIONS];
  const done = all.filter((x) => qa.done[x.id]);
  const cards = todaysQuestions();
  box.innerHTML = `<p class="meta" style="margin:12px 0 0">오늘의 질문으로 생각지 못한 생활 영역을 채워 보세요. 정한 질문 ${done.length} / 전체 ${all.length}</p>
    ${cards.length ? `<div class="q-cards">${cards.map((c) => `<section class="q-card"><span class="eyebrow">${esc(c.cat)}</span><p class="q-text">${esc(c.q)}</p>
      <div class="row"><button class="btn btn-small btn-primary" type="button" data-q-ask="${c.id}">대화로 답하기</button><button class="btn btn-small" type="button" data-q-done="${c.id}">정했음</button><button class="btn btn-small btn-ghost" type="button" data-q-skip="${c.id}">건너뛰기</button></div></section>`).join("")}</div>`
      : `<div class="empty-state"><h3>모든 질문을 다뤘습니다</h3></div>`}
    <div class="row" style="margin-top:12px"><button class="btn" type="button" data-act="q-custom">이 세계에 맞춘 질문 받기(Claude)</button></div>
    ${done.length ? `<details class="tl-missing"><summary>정한 질문 ${done.length}개</summary><ul class="list-plain" style="margin-top:8px">${done.map((x) => `<li class="meta">${esc(x.q)} <button class="btn btn-ghost btn-small" type="button" data-q-undo="${x.id}">되돌리기</button></li>`).join("")}</ul></details>` : ""}`;
}
async function markQuestion(id, kind) {
  const qa = worldQA();
  const w = currentWorld();
  if (kind === "undo") { delete qa.done[id]; delete qa.skipped[id]; } else qa[kind][id] = Date.now();
  w.updatedAt = Date.now();
  await persist.worlds();
  renderCodexTabResults();
}
async function askCustomQuestions(btn) {
  const w = currentWorld();
  btn.disabled = true;
  btn.textContent = "질문을 만드는 중…";
  try {
    const known = liveEntries().slice(0, 120).map(indexLine).join("\n");
    const text = await quickAsk(
      "너는 세계관 설계를 돕는 편집자다. 작가가 아직 정하지 않은 생활 영역을 짚는 질문을 만든다. 한 줄에 하나씩 '분야 | 질문' 형식으로만 쓰고 다른 말은 쓰지 않는다.",
      `세계관: ${w.name}\n핵심 전제: ${w.premise || "(없음)"}\n규칙:\n${w.rules || "(없음)"}\n\n이미 정한 항목:\n${known || "(없음)"}\n\n이 세계에 꼭 맞는, 아직 정해지지 않았을 법한 질문 5개를 만들어 줘.`,
    );
    if (!text) return;
    const qa = worldQA();
    const added = text.split("\n").map((l) => l.replace(/^\s*[-*\d.)]+\s*/, "").trim()).filter((l) => l.includes("|")).slice(0, 8)
      .map((l) => { const [cat, ...rest] = l.split("|"); return { id: `c-${uid().slice(-6)}`, cat: cat.trim() || "맞춤", q: rest.join("|").trim(), custom: true }; })
      .filter((x) => x.q);
    qa.custom.unshift(...added);
    w.updatedAt = Date.now();
    await persist.worlds();
    toast(`질문 ${added.length}개를 받았습니다`);
  } catch (err) {
    toast(describeError(err));
  } finally {
    renderCodexTabResults();
  }
}

function openManuscript(id) {
  const m = state.manuscripts.find((x) => x.id === id);
  if (!m) return;
  openSheet(`<div class="entry-head"><span class="catno">${esc(m.kind)}</span><span>${fmtDate(m.updatedAt)} · ${m.by === "user" ? "직접 씀" : "Claude"}</span></div>
    <h2 class="entry-name">${esc(m.title)}</h2>
    ${m.refs?.length ? `<p class="meta" style="margin:4px 0 10px">관련: ${m.refs.map((r) => `<button type="button" class="ref" data-ref="${r}">${r}</button> ${esc(nameOf(r))}`).join(" ")}</p>` : ""}
    <div class="md ms-body">${md(m.body)}</div>
    <div class="sheet-actions">
      <button class="btn btn-primary" type="button" data-act="ms-continue">대화로 이어 쓰기</button>
      <button class="btn" type="button" data-act="ms-edit">편집</button>
      <button class="btn" type="button" data-act="ms-copy">복사</button>
      <button class="btn btn-danger" type="button" data-act="ms-delete">삭제</button>
    </div>`, (root) => {
    root.onclick = async (ev) => {
      const ref = ev.target.closest("[data-ref]");
      if (ref) { openEntry(ref.dataset.ref); return; }
      const act = ev.target.closest("[data-act]")?.dataset.act;
      if (act === "ms-continue") { closeSheet(); newThread(); fillInput(`원고 '${m.title}'(${m.id})를 읽고 이어서 써 줘. 다 쓰면 같은 원고에 저장해 줘. `); }
      else if (act === "ms-edit") openMsEditor(m);
      else if (act === "ms-copy") { try { await navigator.clipboard.writeText(`# ${m.title}\n\n${m.body}`); toast("복사했습니다"); } catch { toast("복사하지 못했습니다"); } }
      else if (act === "ms-delete") {
        if (!(await confirmBox(`'${m.title}' 원고를 지울까요?`, "지우기", true))) return;
        state.manuscripts = state.manuscripts.filter((x) => x !== m);
        await addTombstone("manuscripts", `${state.worldId}:${m.id}`);
        logChange("user", "manuscript", null, `원고 삭제: ${m.title}`);
        await persist.world();
        closeSheet(); renderCodex(); toast("지웠습니다");
      }
    };
  });
}
function openMsEditor(m) {
  const isNew = !m;
  const d = m || { title: "", kind: "메모", body: "", refs: [] };
  openSheet(`<h2 class="sheet-title">${isNew ? "새 원고" : "원고 편집"}</h2>

        if (text === null) { box.innerHTML = ""; return; }
        const names = text.split("\n").map((l) => l.replace(/^\s*[-*\d.)]+\s*/, "").trim()).filter(Boolean).map((l) => { const [n, ...rest] = l.split("|"); return { n: n.trim(), note: rest.join("|").trim() }; }).filter((x) => x.n && x.n.length <= 30);
        box.innerHTML = names.length ? `<ul class="list-plain">${names.map((x, i) => `<li class="gen-item"><span><strong>${esc(x.n)}</strong>${x.note ? ` <span class="meta">${esc(x.note)}</span>` : ""}</span><button class="btn btn-ghost btn-small" type="button" data-gen-copy="${i}">복사</button><button class="btn btn-ghost btn-small" type="button" data-gen-new="${i}">새 항목으로</button></li>`).join("")}</ul>` : `<p class="meta">이름을 받지 못했습니다. 다시 시도해 주세요.</p>`;
        box.onclick = async (e2) => {
          const c = e2.target.closest("[data-gen-copy]");
          const nw = e2.target.closest("[data-gen-new]");
          if (c) { try { await navigator.clipboard.writeText(names[Number(c.dataset.genCopy)].n); toast("복사했습니다"); } catch { toast("복사하지 못했습니다"); } }
          if (nw) { const x = names[Number(nw.dataset.genNew)]; openEditor(null, null, { name: x.n, summary: x.note }); }
        };
      } catch (err) {
        box.innerHTML = `<p class="note note-error">${esc(describeError(err))}</p>`;
      } finally { btn.disabled = false; }
    };
  });
}

function bindCodexTabs() {
  $("#codex").addEventListener("click", async (e) => {
    const tabBtn = e.target.closest("[data-ctab]");
    if (tabBtn) { state.codexTab = tabBtn.dataset.ctab; renderCodex(); return; }
    const kind = e.target.closest("[data-mskind]");
    if (kind) { state.msKind = kind.dataset.mskind; renderCodexTabResults(); return; }
    const ms = e.target.closest("[data-ms]");
    if (ms) { openManuscript(ms.dataset.ms); return; }
    const sc = e.target.closest("[data-sense-copy]");
    if (sc) {
      const en = findEntry(sc.dataset.senseCopy);
      try { await navigator.clipboard.writeText(`${en.name}\n${Object.entries(en.senses || {}).map(([k, v]) => `${k}: ${v}`).join("\n")}`); toast("복사했습니다"); } catch { toast("복사하지 못했습니다"); }
      return;
    }
    const se = e.target.closest("[data-sense-edit]");
    if (se) { if (state.busy) { toast("Claude가 작업 중입니다"); return; } openEditor(findEntry(se.dataset.senseEdit), null, { focusSenses: true }); return; }
    const qAsk = e.target.closest("[data-q-ask]");
    if (qAsk) {
      const q = [...worldQA().custom, ...QUESTIONS].find((x) => x.id === qAsk.dataset.qAsk);
      switchView("chat");
      fillInput(`질문 카드: ${q.q}\n이 세계에서는 어떨지 같이 정해 보자. 정해지면 알맞은 항목에 저장해 줘. `);
      return;
    }
    for (const [attr, kindName] of [["qDone", "done"], ["qSkip", "skipped"], ["qUndo", "undo"]]) {
      const el = e.target.closest(`[data-${attr.replace(/[A-Z]/g, (c) => "-" + c.toLowerCase())}]`);
      if (el) { await markQuestion(el.dataset[attr], kindName); return; }
    }
    const ng = e.target.closest("[data-naming-gen]");
    if (ng) { openNameGenerator(worldNaming().find((r) => r.id === ng.dataset.namingGen)); return; }
    const ne = e.target.closest("[data-naming-edit]");
    if (ne) { openNamingEditor(worldNaming().find((r) => r.id === ne.dataset.namingEdit)); return; }
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (act === "ms-new") openMsEditor(null);
    else if (act === "naming-new") openNamingEditor(null);
    else if (act === "naming-ask") { startInNewThread("이 세계의 나라·종족마다 이름 규칙을 만들어 줘. 음절 구조, 자주 쓰는 소리와 어미, 성(姓)과 지명 규칙, 예시 이름까지 정해서 set_naming_rule로 저장해 줘. "); }
    else if (act === "senses-ask") { startInNewThread("감각이 비어 있는 장소들의 소리·냄새·빛·촉감·맛을 그 장소답게 정해서 senses에 채워 줘. 확정 설정과 어긋나지 않게. "); }
    else if (act === "q-custom") askCustomQuestions(e.target.closest("[data-act]"));
  });
}

function relationsHTML(e) {
  const out = (e.relations || []).map((r) => {
    const t = findEntry(r.to);
    return `<div class="rel"><span class="lbl">${esc(r.label)}</span> → ${t ? `<button type="button" class="ref" data-ref="${t.id}">${t.id}</button> ${esc(t.name)}${t.deleted ? ' <span class="pill pill-danger">휴지통</span>' : ""}` : esc(r.to)}</div>`;
  });
  const inc = incoming(e.id).map(({ from, label }) => `<div class="rel"><button type="button" class="ref" data-ref="${from.id}">${from.id}</button><span>${esc(from.name)}의 <span class="lbl">${esc(label)}</span></span></div>`);
  if (!out.length && !inc.length) return "";
  return `<p class="section-label">관계</p><div class="rel-list">${out.join("")}${inc.join("")}</div>`;
}
function openEntry(ref) {

  const img = entryImage(e.id);
  const senses = Object.entries(e.senses || {}).filter(([, v]) => v);
  const canInterview = !e.deleted && isCharacterType(e.type) && statusOf(e) !== "discarded";
  openSheet(`
    ${img ? `<button type="button" class="entry-img-btn" data-act="img-zoom" aria-label="그림 크게 보기"><img class="entry-img" src="${img}" alt="${esc(e.name)} 그림"></button>` : ""}
    <div class="entry-head" style="--tc:${typeColor(e.type)}">
      <span class="catno">${e.id}</span><span>${esc(typeInfo(e.type).label)}</span>${statusBadge(e)}${e.deleted ? '<span class="pill pill-danger">휴지통</span>' : ""}
    </div>

      : !e.deleted && isEventType(e.type) ? `<p class="when-line"><span class="lbl">시점</span><span class="meta" style="margin:0">아직 연표에 없습니다</span><button class="btn btn-ghost btn-small" type="button" data-act="set-time">시점 넣기</button></p>` : ""}
    ${!e.deleted && statusOf(e) !== "canon" ? `<div class="st-actions">${statusOf(e) === "draft" ? `<span>아직 정하지 않은 초안입니다.</span><button class="btn btn-small btn-primary" type="button" data-act="st-canon">확정으로</button><button class="btn btn-small" type="button" data-act="st-discarded">폐기</button>` : `<span>버린 안입니다. 연표와 관계도에서 빠집니다.</span><button class="btn btn-small" type="button" data-act="st-draft">초안으로 되살리기</button>`}</div>` : ""}
    ${templateStatusHTML(e)}
    ${fields.length ? `<dl class="fields">${fields.map(([k, v]) => `<div><dt>${esc(k)}</dt>${isBlankValue(v) ? `<dd class="blank">미정</dd>` : `<dd>${esc(v)}</dd>`}</div>`).join("")}</dl>` : ""}
    ${e.body ? `<p class="section-label">본문</p><div class="md">${md(e.body)}</div>` : ""}
    ${senses.length ? `<p class="section-label">감각</p><dl class="fields sense-fields">${senses.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>` : ""}
    ${e.perspectives?.length ? `<p class="section-label">관점별 서술</p><div class="persp-list">${e.perspectives.map((x) => { const by = findEntry(x.by); return `<blockquote class="persp"><span class="persp-by">${by ? `<button type="button" class="ref" data-ref="${by.id}">${by.id}</button> ${esc(by.name)}` : esc(x.by)}의 관점</span><p>${esc(x.text)}</p></blockquote>`; }).join("")}</div>` : ""}
    ${relationsHTML(e)}
    ${e.tags?.length ? `<p class="section-label">태그</p><div>${e.tags.map((t) => `<span class="tag">#${esc(t)}</span>`).join("")}</div>` : ""}
    <p class="meta">${fmtDate(e.updatedAt)} 수정 · ${e.updatedBy === "user" ? "직접 수정" : "Claude"} · 이력 ${e.history?.length || 0}개</p>
    <div class="sheet-actions">
      ${e.deleted
        ? `<button class="btn btn-primary" type="button" data-act="restore">되살리기</button><button class="btn" type="button" data-act="history">이력</button><button class="btn btn-danger" type="button" data-act="purge">완전히 지우기</button>`
        : `<button class="btn btn-primary" type="button" data-act="develop">대화로 발전시키기</button>${canInterview ? `<button class="btn" type="button" data-act="interview">인터뷰</button>` : ""}<button class="btn" type="button" data-act="edit">편집</button><button class="btn" type="button" data-act="persp">관점 더하기</button>${img ? `<button class="btn" type="button" data-act="img-ask">그림으로 묘사 받기</button>` : ""}<button class="btn" type="button" data-act="graph">관계도</button><button class="btn" type="button" data-act="history">이력</button><button class="btn btn-danger" type="button" data-act="trash-entry">삭제</button>`}

    root.onclick = async (ev) => {
      const refBtn = ev.target.closest("[data-ref]");
      if (refBtn) { openEntry(refBtn.dataset.ref); return; }
      const act = ev.target.closest("[data-act]")?.dataset.act;
      if (!act) return;
      if (!["develop", "history", "graph", "tpl-ask", "timeline", "img-zoom"].includes(act) && state.busy) { toast("Claude가 작업 중입니다. 끝난 뒤에 고쳐 주세요"); return; }

      if (act === "persp") { closeSheet(); startInNewThread(`${e.name}(${e.id})을(를) 이 세계의 서로 다른 세력이나 인물은 어떻게 알고 믿고 있는지 정해 줘. 누가 무엇을 숨기거나 왜곡하는지도. 정해지면 set_perspective로 기록해 줘. `); return; }
      if (act === "img-ask") {
        closeSheet();
        switchView("chat");
        try {
          fillInput(`첨부한 그림은 ${e.name}(${e.id})의 모습이야. 그림을 보고 외모·옷차림·분위기를 설정에 넣을 만하게 묘사해서 제안해 줘. 기존 설정과 다른 점이 있으면 짚어 줘. `);
          const blob = await (await fetch(img)).blob();
          await addFiles([new File([blob], `${e.name}.jpg`, { type: "image/jpeg" })]);
        } catch { toast("그림을 첨부하지 못했습니다"); }
        return;
      }
      if (act.startsWith("st-")) {
        const st = act.slice(3);

        renderCodex(); openEntry(e.id); toast(`${STATUS[st]}(으)로 바꿨습니다`);
        return;
      }
      if (act === "set-time") { openEditor(e, null, { focusTime: true }); return; }
      if (act === "tpl-fill") {
        const merged = mergeTemplate(e.fields || {}, e.body || "", typeInfo(e.type).template);
        updateEntry(e, { fields: merged.fields, body: merged.body }, "user", "템플릿 칸 추가");
        await persist.world();
        renderCodex(); openEntry(e.id); toast("템플릿 칸을 추가했습니다");
      } else if (act === "tpl-ask") {
        closeSheet();

function kvRow(k = "", v = "", hint = "") {
  return `<div class="kv-row"><input class="fk" placeholder="이름 (예: 나이)" value="${esc(k)}" aria-label="속성 이름"><input class="fv" placeholder="${esc(hint || "내용")}" value="${esc(v)}" aria-label="속성 내용"><button type="button" class="icon-btn" data-del-row aria-label="삭제">×</button></div>`;
}
function templateStatusHTML(e) {
  if (e.deleted) return "";
  const g = templateGaps(e);
  if (!g || !g.total) return "";
  const missing = [...g.fields, ...g.sections.map((s) => `## ${s}`)];
  if (!missing.length) return `<div class="tpl-status done"><span><b>${esc(g.label)} 템플릿</b>을 모두 채웠습니다</span></div>`;
  const list = missing.slice(0, 6).join(", ") + (missing.length > 6 ? ` 외 ${missing.length - 6}개` : "");
  return `<div class="tpl-status"><span><b>${esc(g.label)} 템플릿</b> 빈 칸 ${missing.length}개: ${esc(list)}</span>
    <div class="row"><button class="btn btn-small" type="button" data-act="tpl-fill">빈 칸 추가</button><button class="btn btn-small btn-primary" type="button" data-act="tpl-ask">Claude에게 채우기</button></div></div>`;
}

// 항목 그림: 긴 변 512px JPEG data URL
async function entryPicture(file) {
  if (!/^image\//.test(file.type || "") && !/\.(png|jpe?g|gif|webp|heic|avif)$/i.test(file.name)) throw new Error("그림 파일만 넣을 수 있습니다");
  const { img, url } = await loadImage(file);
  try { return await blobToDataURL(await drawScaled(img, 512, "image/jpeg", 0.82)); }
  finally { URL.revokeObjectURL(url); }
}

      const have = new Set($$(".fk", box).map((i) => i.value.trim()));
      for (const f of parseTemplate(t.template).fields) if (!have.has(f.key)) box.insertAdjacentHTML("beforeend", kvRow(f.key, "", f.hint));

    };

      note.innerHTML = `<span>${esc(t.label)} 템플릿이 있습니다</span><button type="button" class="btn btn-ghost btn-small" data-act="tpl-apply">템플릿 칸 채워 넣기</button>`;
      if (fresh && !touched) applyTemplate(t, true);
    };
    $("#f-type", root).addEventListener("change", () => refreshTemplate(true));
    refreshTemplate(isNew);

      const file = ev.target.files?.[0];
      ev.target.value = "";
      if (!file) return;

        const k = $(".fk", row).value.trim();
        if (k) fields[k] = $(".fv", row).value.trim();
      }
      const relations = [];
      for (const row of $$("#f-rels .kv-row", root)) {
        const to = $(".rt", row).value;
        const label = $(".rl", row).value.trim();
        if (to && label && !relations.some((r) => r.to === to && r.label === label)) relations.push({ to, label });
      }
      const data = {
        type: $("#f-type", root).value,
        name: $("#f-name", root).value,
        aliases: splitList($("#f-aliases", root).value),
        summary: $("#f-summary", root).value,
        fields,
        body: $("#f-body", root).value,
        when: null,
        status: root.querySelector('input[name="f-status"]:checked')?.value || "canon",
        tags: splitList($("#f-tags", root).value).map((t) => t.replace(/^#/, "")),
        relations,
      };
      const senses = {};
      for (const inp of $$(".sense-in", root)) if (inp.value.trim()) senses[inp.dataset.k] = inp.value.trim();
      const perspectives = [];
      for (const row of $$("#f-persp .persp-row", root)) {
        const byText = $(".pb", row).value.trim();
        const text = $(".pt", row).value.trim();
        if (!byText || !text) continue;
        const by = findEntry(byText.split(" ")[0])?.id || findEntry(byText)?.id || byText;
        if (!perspectives.some((x) => x.by === by)) perspectives.push({ by, text });
      }
      if (isNew) { data.senses = senses; data.perspectives = perspectives; }
      else { data.sensesAll = senses; data.perspectives = perspectives; }
      // 연표 시점: 비우면 연표에서 뺀다
      const tsText = $("#f-ts", root).value.trim();
      const teText = $("#f-te", root).value.trim();
      const ts = tsText ? parseYear(tsText) : null;
      const te = teText ? parseYear(teText) : null;
      if (tsText && ts === null) { toast("시작 연도는 숫자로 넣어 주세요"); return; }
      if (teText && te === null) { toast("끝 연도는 숫자로 넣어 주세요"); return; }
      if (te !== null && ts === null) { toast("끝 연도를 쓰려면 시작 연도도 넣어 주세요"); return; }
      if (te !== null && te < ts) { toast("끝 연도는 시작 연도보다 앞설 수 없습니다"); return; }
      data.when = ts !== null ? { start: ts, end: te, label: $("#f-tl", root).value.trim() } : null;
      try {
        let saved;
        if (isNew) saved = createEntry(data, "user");
        else { updateEntry(e, data, "user", "직접 편집"); saved = e; }
        if (newImage !== undefined && (newImage || curImage)) { state.images[saved.id] = { data: newImage, at: Date.now() }; await persist.images(); }
        await persist.world();
        renderCodex();
        openEntry(saved.id);
        toast("저장했습니다");
      } catch (err) { toast(err.message); }
    };
  });

function buildGraphModel() {
  const entries = liveEntries();
  const ids = new Set(entries.map((e) => e.id));
  const old = graph.nodes;
  const nodes = new Map();
  for (const e of entries) {
    const prev = old.get(e.id);
    const saved = graph.pos[e.id];
    nodes.set(e.id, {
      id: e.id, entry: e,
      x: prev ? prev.x : saved ? saved[0] : null,
      y: prev ? prev.y : saved ? saved[1] : null,
      pinned: prev ? prev.pinned : !!saved?.[2],
      degree: 0, isNew: !prev && !saved, r: 10, el: null,
    });
  }
  const pairs = new Map();
  for (const e of entries) {
    for (const r of e.relations || []) {
      if (!ids.has(r.to) || r.to === e.id) continue;
      const [a, b] = e.id < r.to ? [e.id, r.to] : [r.to, e.id];
      const key = `${a}|${b}`;
      if (!pairs.has(key)) pairs.set(key, { a, b, rels: [], el: null, labels: [] });
      pairs.get(key).rels.push({ from: e.id, to: r.to, label: r.label });
    }
  }
  graph.nodes = nodes;
  graph.edges = [...pairs.values()];
  for (const ed of graph.edges) { nodes.get(ed.a).degree++; nodes.get(ed.b).degree++; }
  const anyPlaced = [...nodes.values()].some((n) => n.x != null);
  const spread = Math.max(80, Math.sqrt(nodes.size) * 45);
  for (const n of nodes.values()) {
    if (n.x != null) continue;
    const ang = hashNum(n.id) * Math.PI * 2;
    const near = graph.edges
      .filter((ed) => ed.a === n.id || ed.b === n.id)
      .map((ed) => nodes.get(ed.a === n.id ? ed.b : ed.a))
      .filter((m) => m.x != null);
    if (near.length) {
      n.x = near.reduce((s, m) => s + m.x, 0) / near.length + Math.cos(ang) * 60;
      n.y = near.reduce((s, m) => s + m.y, 0) / near.length + Math.sin(ang) * 60;
    } else {
      const rad = anyPlaced ? spread * 0.9 : spread * (0.3 + hashNum(n.id + "r") * 0.7);
      n.x = Math.cos(ang) * rad;
      n.y = Math.sin(ang) * rad;
    }
  }
  if (graph.selected && !nodes.has(graph.selected)) { graph.selected = null; graph.focusHops = 0; }

// 힘 기반 배치(Fruchterman-Reingold). full이면 전체를, 아니면 새로 생긴 항목만 움직인다.
function runLayout(full) {
  const ns = [...graph.nodes.values()];
  const n = ns.length;
  if (!n) return;
  const movable = ns.map((v) => !v.pinned && (full || v.isNew));
  if (!movable.some(Boolean)) return;
  const k = 110; // 선 길이 기준. 관계 이름이 들어갈 여유를 둔다.
  const iters = full ? (n > 200 ? 160 : 320) : 120;
  let temp = full ? 120 : 45;
  const index = new Map(ns.map((v, i) => [v.id, i]));
  const E = graph.edges.map((ed) => [index.get(ed.a), index.get(ed.b)]);
  const dx = new Float64Array(n);
  const dy = new Float64Array(n);
  for (let it = 0; it < iters; it++) {
    dx.fill(0); dy.fill(0);
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        let ddx = ns[i].x - ns[j].x;
        let ddy = ns[i].y - ns[j].y;
        let d2 = ddx * ddx + ddy * ddy;
        if (d2 < 0.01) { ddx = hashNum(ns[i].id + j) - 0.5; ddy = hashNum(ns[j].id + i) - 0.5; d2 = ddx * ddx + ddy * ddy + 0.01; }
        const f = (k * k) / d2;
        dx[i] += ddx * f; dy[i] += ddy * f;
        dx[j] -= ddx * f; dy[j] -= ddy * f;
      }
    }
    for (const [a, b] of E) {
      const ddx = ns[a].x - ns[b].x;
      const ddy = ns[a].y - ns[b].y;
      const f = Math.sqrt(ddx * ddx + ddy * ddy) / k;
      dx[a] -= ddx * f; dy[a] -= ddy * f;
      dx[b] += ddx * f; dy[b] += ddy * f;
    }
    for (let i = 0; i < n; i++) {
      if (!movable[i]) continue;
      dx[i] -= ns[i].x * 0.06;
      dy[i] -= ns[i].y * 0.06;
      const len = Math.sqrt(dx[i] * dx[i] + dy[i] * dy[i]) || 1;
      const step = Math.min(len, temp);
      ns[i].x += (dx[i] / len) * step;
      ns[i].y += (dy[i] / len) * step;
    }
    temp = Math.max(1, temp * (full ? 0.985 : 0.965));
  }
  for (const v of ns) v.isNew = false;
}

function visibleSets() {
  let vis = new Set();
  for (const n of graph.nodes.values()) {
    if (graph.hiddenTypes.has(n.entry.type)) continue;
    if (graph.hideIsolated && n.degree === 0) continue;
    vis.add(n.id);
  }
  if (graph.focusHops && graph.selected) {
    const keep = new Set([graph.selected]);
    let frontier = [graph.selected];
    for (let h = 0; h < graph.focusHops; h++) {
      const next = [];
      for (const id of frontier) {
        for (const ed of graph.edges) {
          const other = ed.a === id ? ed.b : ed.b === id ? ed.a : null;
          if (other && !keep.has(other)) { keep.add(other); next.push(other); }

      }
      frontier = next;
    }
    vis = new Set([...vis].filter((id) => keep.has(id)));
    vis.add(graph.selected);
  }
